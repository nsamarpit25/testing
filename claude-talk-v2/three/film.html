  const tilt = lerp(ta, tb, ek), lift = lerp(la, lb, ek), open = lerp(oa, ob, ek) * blinks(cleoBlinks, t);
  face.eyes.forEach((e) => (e.scale.y = Math.max(0.08, open)));
  face.brows.forEach((b, i) => { const s = i ? 1 : -1; b.rotation.z = -s * tilt * (eb === 'suspicious' && i ? -0.6 : 1); b.position.y = 0.188 + lift + (eb === 'suspicious' && i ? 0.02 * ek : 0); });
  face.mouth.scale.set(1 - mC * 0.15, 0.2 + mC * 0.95, 0.45);

  // Claude: bob, hop on 'proud', talk, happy eyes
  const [ca, cb, ck] = at(claudeEmo, t);
  const proudSince = cb === 'proud' ? claudeEmo.find((e) => e[1] === 'proud' && e[0] <= t)?.[0] ?? 0 : -9;
  const hopT = L.filter((l) => l.who === 'Claude').map((l) => l.start).reduce((o, s) => (t >= s && t < s + 0.4 ? s : o), null);
  const hop = hopT !== null && cb === 'proud' ? Math.sin(Math.PI * (t - hopT) / 0.4) * 0.03 : 0;
  cBody.position.y = 0.05 + 0.004 * Math.sin(t * 2.6) + mA * 0.006 + hop;
  cBody.rotation.z = lerp(ca === 'listen' ? 0.14 : 0, cb === 'listen' ? 0.14 : 0, ck) + Math.sin(t * 1.7) * 0.02;
  const puff = cb === 'proud' ? 1 + 0.05 * ease((t - proudSince) / 0.3) : 1;
  cBody.scale.set(puff, puff * (1 - hop * 1.5), puff);
  const happy = cb === 'proud' && mA < 0.35;
  cf.eyes.forEach((e) => { e.visible = !happy; e.scale.y = Math.max(0.1, blinks(claudeBlinks, t)); });
  cf.happy.forEach((h) => (h.visible = happy));
  cf.mouth.scale.set(1, 1 + mA * 2.6, 1);
  spark.rotation.z = t * 0.8 + mA * 0.5;
  sparkMat.emissiveIntensity = 1.2 + mA * 2.5; glow.intensity = 0.12 + mA * 0.35;

  // screen
  const [, scr] = at(scrEvents, t, 0.01), since = scrEvents.filter((e) => e[0] <= t).pop()[0];
  const p = scr === 'deleted' ? Math.min(4, Math.floor((t - since) / 0.22) + 1) : 0;
  drawScreen(scr, p, Math.floor(t * 2) % 2 === 0);
  screenLight.color.setHex(SCR[scr]);
  screenLight.intensity = (scr === 'fail' ? 0.6 : 0.35) + 0.8 * Math.max(0, 1 - (t - since) / 0.25) * (since > 0 ? 1 : 0);

  // captions
  let txt = '', who = '';
  for (const l of L) l.caps.forEach(([a, b, s], i) => { const nxt = L[L.indexOf(l) + 1], end = l.caps[i + 1] ? l.caps[i + 1][0] : Math.min(b + 0.2, nxt ? nxt.start - 0.12 : b + 0.6); if (t >= a - 0.04 && t < end) { txt = s; who = l.who; } });
  capEl.textContent = txt; capEl.className = who;

  renderer.render(scene, camera);
};
