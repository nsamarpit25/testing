.lbl.big { font-size: 12.5px; letter-spacing: 0.3px; color: #fff; font-weight: 500; }

.lbl.acc { font-size: 11px; letter-spacing: 0.5px; color: #000; background: var(--acc); border-radius: 6px; padding: 3px 7px; font-weight: 500; }
.lbl.warn { font-size: 11px; letter-spacing: 0.5px; color: #fff; background: var(--warn); border-radius: 6px; padding: 3px 7px; font-weight: 500; }
.lbl.out { background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.45); border-radius: 6px; padding: 3px 7px; color: #fff; font-size: 10.5px; letter-spacing: 0.6px; }
.lbl.ip { background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.35); border-radius: 5px; padding: 2px 5px; color: #ddd; font-size: 8.5px; letter-spacing: 0.4px; }
.card { position: absolute; border: 1px solid rgba(46,230,214,0.55); border-radius: 12px; background: rgba(0,0,0,0.92); font-family: Mono; box-sizing: border-box; font-size: 12.5px; }
.card .hd { font-size: 9.5px; letter-spacing: 1.6px; color: #8a8a8a; display: flex; justify-content: space-between; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 7px 9px; border-radius: 7px; margin-top: 6px; }
.term { font-size: 11.5px; line-height: 18px; white-space: pre; }
.dim { color: #8a8a8a; }
.a { color: var(--acc); }
.r { color: var(--warn); }
.btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; font-weight: 700; font-size: 13px; }
#title { position: absolute; left: 0; right: 0; top: 700px; text-align: center; }
#title .t { font-size: 54px; font-weight: 800; letter-spacing: -2px; }

<body>
<div id="stage">
  <div id="world">
    <div id="vignette"></div>
    <canvas id="bg" width="1080" height="1920"></canvas>
    <svg class="full" id="scene" width="540" height="960" viewBox="0 0 540 960">
      <defs><filter id="bloom" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>

    </svg>

    <svg width="17" height="17" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4.6" fill="none" stroke="#fff" stroke-width="2"/><circle cx="17.6" cy="6.4" r="1.3" fill="#fff"/></svg>
    <div>@HOW.ITS.ENGINEERED</div>

  <svg id="cursor" viewBox="0 0 18 24"><path d="M2 2 L2 19 L6.5 15 L9.5 22 L12.5 20.7 L9.6 14 L15.5 14 Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>
</div>

<script>
const $ = (id) => document.getElementById(id);
const ACC = '#2EE6D6', WARN = '#FF375F';
const mk = (line, text = line, dot = line) => ({ line, top: '#000', s1: '#000', s2: '#000', text, dot });
const ROLES = { def: mk('#fff'), server: mk('#fff'), proxy: mk(ACC), wall: mk(ACC), warn: mk(WARN) };

ISO.layer = $('sceneG');
const FX = $('fx');
const BG = $('bg').getContext('2d');
const TM = window.TIMINGS, WD = window.WORDS || [];
const ph = (li, pi = 0) => TM.find((e) => e.li === li && e.pi === pi);
const S = (li, pi = 0) => ph(li, pi).start, E = (li, pi = 0) => ph(li, pi).end;
const nrm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
// start time of the first spoken word `w` at/after `after` (falls back to fb)
const W = (w, after, fb) => { const x = WD.find((e) => e[1] >= after - 0.05 && nrm(e[0]).startsWith(w)); return x && x[1] < after + 4 ? x[1] : (fb ?? after); };
const END = E(12, 2) + 1.6;
window.DURATION = Math.ceil(END * 30) / 30;

const caps = makeCaptions($('caps'), TM.map((e, i) => ({
  t: e.start, dur: Math.max(0.35, e.end - e.start), text: e.show,
  end: i + 1 < TM.length ? TM[i + 1].start - 0.02 : END - 0.3,
})));
$('grain').style.backgroundImage = `url(${grainURL(256, 0.07, 11)})`;

// ---------- key times ----------
const TAP = 0.62, LAUNCH = 0.78, BELIEF = 1.55;
const NOT = S(0, 1), IMPACT = NOT - 0.04;
const MID = S(1, 0), RP = S(1, 1);
const L2 = S(2, 0), SCAN = W('hackers', S(2, 1), S(2, 1) + 0.15), WEAK = W('weak', S(2, 2), S(2, 2) + 0.4), IN = W('theyre', S(2, 2) + 0.5, E(2, 2) - 0.4);
const L3 = S(3, 0), PROXY3 = W('proxy', L3, L3 + 0.35), VANISH = W('vanish', L3, L3 + 1.4), WALL3 = W('wall', VANISH, VANISH + 1);
const PUB = S(3, 1), PUBA = W('public', PUB, PUB + 1.1);
const L4 = S(4, 0), KITCH = S(4, 1), WAITER = S(4, 2), ORDER = W('order', WAITER, WAITER + 0.9), BACK = W('brings', ORDER, ORDER + 0.45);
const L5 = S(5, 0), MORE = W('lot', L5, L5 + 1);
const L6 = S(6, 0), UNLOCK = W('unlocks', L6, L6 + 0.5), ONCE = W('once', UNLOCK, L6 + 2.5), DONT = W('servers', ONCE, ONCE + 1);
const L7 = S(7, 0), READY = W('ready', L7, L7 + 1.1), MOST = W('most', READY, READY + 0.8);
const L8 = S(8, 0), PATH = W('path', L8, L8 + 0.5), API = W('slash', PATH, PATH + 0.7), IMG = W('images', API, API + 1.3);
const L9 = S(9, 0), FLOOD = W('flood', L9, L9 + 0.45), STOP = S(9, 1);
const L10 = S(10, 0), CF = W('cloudflare', L10, L10 + 0.65), MILL = W('millions', CF, CF + 0.9);
const L11 = S(11, 0), FWD_HIDE = W('hides', L11, L11 + 0.7), L11B = S(11, 1), REV_HIDE = W('hides', L11B, L11B + 0.9);
const L12 = S(12, 0), QQ = W('which', L12, L12 + 1.4);

// ---------- helpers ----------
const life = (t, a, b, fi = 0.35, fo = 0.25) => Math.max(0, Math.min(ep(t, a, a + fi), 1 - ep(t, b - fo, b)));
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const flipV = (F) => ({ o: add3(F.o, F.v), u: F.u, v: mul3(F.v, -1) });
const circ = (p, r) => `M${p[0] - r} ${p[1]}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;
const fx = (tag, attrs, parent = FX) => el(tag, attrs, parent);
const fmt = (n) => Math.round(n).toLocaleString('en-US');
function fcircle(o, F, a, b, r, opt = {}) {
  const lu = len3(F.u), lv = len3(F.v), pts = [];
  for (let i = 0; i < 28; i++) { const q = (i / 28) * Math.PI * 2; pts.push(fp(F, a + (r * Math.cos(q)) / lu, b + (r * Math.sin(q)) / lv)); }
  push(o, path2(pts), { w: 0.9, ...opt });
}
function box3(o, x, y, z, w, d, h, opt = {}) {
  const c = Math.cos(CAM.yaw), s = Math.sin(CAM.yaw);
  const vis = (nx, ny) => (nx * c - ny * s) + (nx * s + ny * c) > 0.001;
  const F = {};
  for (const [k, oo, u, v, nx, ny] of [
    ['px', [x + w, y, z], [0, d, 0], [0, 0, h], 1, 0], ['nx', [x, y, z], [0, d, 0], [0, 0, h], -1, 0],
    ['py', [x, y + d, z], [w, 0, 0], [0, 0, h], 0, 1], ['ny', [x, y, z], [w, 0, 0], [0, 0, h], 0, -1]]) {
    if (!vis(nx, ny)) continue;
    F[k] = { o: oo, u, v };
    fpoly(o, F[k], 0, 0, 1, 1, { w: 1, face: k, ...opt });
  }
  F.top = { o: [x, y, z + h], u: [w, 0, 0], v: [0, d, 0] };
  fpoly(o, F.top, 0, 0, 1, 1, { w: 1, face: 'top', ...opt });
  return F;
}
// emit with a role's colours (def / server / proxy / wall / warn)
function emitT(o, D, op = 1, role = 'def') {
  const R = ROLES[role] || ROLES.def;
  for (const it of o.items) {
    if (it.face) it.fill = it.fill ?? R.top;
    else if (it.fill === undefined || it.fill === '#000') it.fill = R.top;
    else if (it.fill === '#fff' && it.stroke === 'none') it.fill = R.dot;
    if (it.stroke === undefined) it.stroke = R.line;
  }
  for (const tx of o.texts) if (tx.fill === undefined) tx.fill = R.text;
  emit(o, D, op);
}
function rack3(o, x, y, z, w, d, h) {
  const F = box3(o, x, y, z, w, d, h);
  if (F.py) {
    const R = F.py;
    fpoly(o, R, 0.07, 0.03, 0.86, 0.94, { fill: 'none', w: 0.6 });
    for (let k = 0; k < 10; k++) {
      const b = 0.07 + k * 0.088;
      fline(o, R, 0.1, b, 0.9, b, { w: 0.55, op: 0.8 });
      fpoly(o, R, 0.15, b + 0.02, 0.32, 0.045, { fill: 'none', w: 0.55 });
    }
  }
  if (F.px) for (let k = 0; k < 8; k++) fline(o, F.px, 0.15 + k * 0.095, 0.1, 0.15 + k * 0.095, 0.9, { w: 0.5, op: 0.6 });
  fpoly(o, F.top, 0.12, 0.14, 0.76, 0.72, { fill: 'none', w: 0.6 });
  return F;
}
function person(o, x, y, t = 0, walk = 0, hat = false) {
  const bob = walk * Math.abs(Math.sin(t * 13)) * 3;
  cylinder(o, x, y, 4 + bob, 7, 22, 0);
  push(o, circ(P(x, y, 36 + bob), 6 * CAM.scale), { fill: '#000', w: 1 });
  if (hat) cylinder(o, x, y, 41 + bob, 5, 8, 0);
}
const labels = $('labels');
function label(text, x, y, op, cls = '', extra = '') {
  if (op <= 0.01) return;
  const d = document.createElement('div');
  d.className = 'lbl ' + cls; d.innerHTML = text;
  d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.opacity = Math.min(1, op);
  if (extra) d.style.cssText += extra;
  labels.appendChild(d);
}
const lblW = (text, w, op, cls = '', extra = '') => { const p = P(...w); label(text, p[0], p[1], op, cls, extra); };
function card(a, style, inner) {
  if (a <= 0.001) return '';
  const e = ease.back(clamp(a)), o = clamp(a * 1.5);
  return `<div class="card" style="${style};opacity:${o};transform:translateY(${(1 - e) * 18}px) scale(${lerp(0.92, 1, e)});filter:blur(${(1 - clamp(a * 1.3)) * 6}px)">${inner}</div>`;
}
function ripple(t, t0, p, col, R = 34) {
  const k = prog(t, t0, t0 + 0.55);
  if (k <= 0 || k >= 1) return;
  fx('circle', { cx: p[0], cy: p[1], r: 4 + ease.out(k) * R, fill: 'none', stroke: col, 'stroke-width': 1.6 * (1 - k) + 0.3, 'stroke-opacity': 1 - k });
}
function isoRing(t, t0, w, col, R = 90, dur = 0.8) {
  const k = prog(t, t0, t0 + dur);
  if (k <= 0 || k >= 1) return;
  const r = 10 + ease.out(k) * R, pts = [];
  for (let i = 0; i <= 40; i++) { const q = (i / 40) * Math.PI * 2; pts.push(P(w[0] + r * Math.cos(q), w[1] + r * Math.sin(q), w[2] || 0)); }
  fx('path', { d: path2(pts), fill: 'none', stroke: col, 'stroke-width': 1.4, 'stroke-opacity': (1 - k) * 0.9 });
}
function shards(t, t0, p, col, n = 12, R = 1) {
  const k = prog(t, t0, t0 + 0.7);
  if (k <= 0 || k >= 1) return;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + hash(i) * 0.6, d = 6 + ease.out(k) * (26 + hash(i + 3) * 30) * R, L = 7 * (1 - k) + 2;
    const x = p[0] + Math.cos(a) * d, y = p[1] + Math.sin(a) * d + k * k * 14;
    fx('line', { x1: x, y1: y, x2: x + Math.cos(a + 1) * L, y2: y + Math.sin(a + 1) * L, stroke: col, 'stroke-width': 1.5, 'stroke-opacity': 1 - k });
  }
}
function pop(t, t0, p, text, cls = 'big', dur = 1.1) {
  const k = prog(t, t0, t0 + dur);
  if (k <= 0 || k >= 1) return;
  label(text, p[0], p[1] - ease.out(k) * 30, Math.min(ep(t, t0, t0 + 0.12), 1 - prog(k, 0.6, 1)), cls, `transform:translate(-50%,-50%) scale(${lerp(1.35, 1, ease.out(clamp(k * 4)))})`);
}

// ---------- 2D glyphs (drawn in the fx layer) ----------
function gLock(p, s, open, col, op = 1, parent = FX) {
  const g = fx('g', { transform: `translate(${p[0]} ${p[1]})`, opacity: op }, parent);
  el('rect', { x: -s * 0.55, y: -s * 0.1, width: s * 1.1, height: s * 0.85, rx: s * 0.15, fill: '#000', stroke: col, 'stroke-width': 1.5 }, g);
  el('circle', { cx: 0, cy: s * 0.3, r: s * 0.1, fill: col }, g);
  el('path', { d: `M${-s * 0.33} ${-s * 0.1}V${-s * 0.38}A${s * 0.33} ${s * 0.33} 0 0 1 ${s * 0.33} ${-s * 0.38}V${-s * 0.1 - open * s * 0.25}`, fill: 'none', stroke: col, 'stroke-width': 1.6, transform: `translate(0 ${-open * s * 0.3})`, 'stroke-linecap': 'round' }, g);
}
function gStack(p, s, col, parent = FX) {
  const g = fx('g', { transform: `translate(${p[0]} ${p[1]})` }, parent);
  for (let k = 2; k >= 0; k--) el('path', { d: `M${-s * 0.6} ${k * s * 0.22 - s * 0.1}L0 ${k * s * 0.22 - s * 0.38}L${s * 0.6} ${k * s * 0.22 - s * 0.1}L0 ${k * s * 0.22 + s * 0.18}Z`, fill: '#000', stroke: col, 'stroke-width': 1.4, 'stroke-linejoin': 'round' }, g);
}
function gFork(p, s, col, parent = FX) {
  const g = fx('g', { transform: `translate(${p[0]} ${p[1]})`, fill: 'none', stroke: col, 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent);
  el('path', { d: `M0 ${s * 0.6}V0L${-s * 0.45} ${-s * 0.45}M0 0L${s * 0.45} ${-s * 0.45}M${-s * 0.45} ${-s * 0.15}V${-s * 0.45}H${-s * 0.15}M${s * 0.45} ${-s * 0.15}V${-s * 0.45}H${s * 0.15}` }, g);
}
function gShield(p, s, col, parent = FX) {
  const g = fx('g', { transform: `translate(${p[0]} ${p[1]})`, fill: 'none', stroke: col, 'stroke-width': 1.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, parent);
  el('path', { d: `M0 ${-s * 0.6}L${s * 0.5} ${-s * 0.4}V${s * 0.05}Q${s * 0.5} ${s * 0.45} 0 ${s * 0.65}Q${-s * 0.5} ${s * 0.45} ${-s * 0.5} ${s * 0.05}V${-s * 0.4}Z` }, g);
  el('path', { d: `M${-s * 0.2} ${s * 0.02}L${-s * 0.04} ${s * 0.2}L${s * 0.24} ${-s * 0.18}` }, g);
}
function gTicket(p, s, col, parent = FX) {
  const g = fx('g', { transform: `translate(${p[0]} ${p[1]})`, fill: 'none', stroke: col, 'stroke-width': 1.3 }, parent);
  el('path', { d: `M${-s * 0.4} ${-s * 0.55}H${s * 0.4}V${s * 0.55}L${s * 0.2} ${s * 0.42}L0 ${s * 0.55}L${-s * 0.2} ${s * 0.42}L${-s * 0.4} ${s * 0.55}Z`, fill: '#000' }, g);
  for (let k = 0; k < 3; k++) el('path', { d: `M${-s * 0.22} ${-s * 0.3 + k * s * 0.22}H${s * (k === 2 ? 0.05 : 0.22)}` }, g);
}
const lockSVG = (col, open = 0) => `<svg width="12" height="13" viewBox="-7 -9 14 15" style="vertical-align:-2px;margin-left:5px"><rect x="-5.5" y="-1" width="11" height="8.5" rx="1.5" fill="none" stroke="${col}" stroke-width="1.5"/><path d="M-3.3 -1V-3.8A3.3 3.3 0 0 1 3.3 -3.8V${open ? -6 : -1}" fill="none" stroke="${col}" stroke-width="1.5" transform="translate(0 ${open ? -2 : 0})"/></svg>`;

// ---------- world layout ----------
const PH = [0, 270];                        // your phone
const PX = [0, -60];                        // the reverse proxy, set in the wall
const WALL_Y = -76;
const SVX = [-225, -135, -45, 45, 135, 225], SVY = -285;
const IMPACT_PT = [0, PX[1] + 40, 34];      // the proxy's front door
const DOOR = [0, PX[1] + 40, 30];
const ROOF = [PX[0], PX[1], 64];
const HEART = [PH[0] - 30 + 0.2 * 60, PH[1] - 58 + 0.66 * 116, 12];
const RS = [1500, -40];                     // the restaurant
const CMP = [-1500, 0];                     // forward vs reverse
const HK = [[-310, 150], [320, 110], [205, 450]];   // hackers
const WEAKI = 4;

const CROWD = [];
for (let i = 0; CROWD.length < 300; i++) {
  const x = (hash(i * 1.7 + 0.3) * 2 - 1) * 460, y = 60 + hash(i * 2.3 + 0.9) * 470;
  if (Math.abs(x) < 85 && Math.abs(y - PH[1]) < 115) continue;
  if (Math.abs(x) < 90 && y < 40) continue;
  if (HK.some((h) => Math.hypot(x - h[0], y - h[1]) < 40)) continue;

  $('world').style.filter = whip > 0.01 ? `blur(${whip * 7}px)` : 'none';
  $('world').style.opacity = 1 - 0.55 * ep(t, L12, L12 + 0.5);

  // chrome
  const ch = CH.find((c) => t >= c[0] && t < c[1]);
  $('chapter').style.opacity = ch ? life(t, ch[0], ch[1], 0.3, 0.2) : 0;
  if (ch) $('chapter').querySelector('span').textContent = ch[2];
  $('handle').style.opacity = ep(t, 0.4, 1.0) * (1 - ep(t, L12, L12 + 0.3));
  document.querySelectorAll('#bar i').forEach((n, i) => { n.style.width = prog(t, BK[i], BK[i + 1]) * 100 + '%'; });
  $('grain').style.transform = `translate(${Math.floor(hash(Math.floor(t * 24)) * 40) - 20}px, ${Math.floor(hash(Math.floor(t * 24) + 5) * 40) - 20}px)`;

  const cur = $('cursor');
  if (cp) {
    const pr = Math.max(0, ...TAPS.map((x) => window01(t, x, x + 0.18, 0.05)));
    cur.style.display = ''; cur.style.transform = `translate(${cp[0] - 3}px, ${cp[1] - 2}px) scale(${1 - 0.18 * pr})`;
  } else cur.style.display = 'none';
  ripple(t, tapComment, COMMENT_POS, ACC);
  ripple(t, tapFollow, FOLLOW_POS, ACC);

  caps.render(t);
  $('stage').style.opacity = 1 - ep(t, END - 0.35, END);
};
window.render(0);
</script>
</body>
</html>
