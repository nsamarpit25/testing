<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 29 AirTag, solid low-poly dioramas (kit.js + scenes.js). Story: your phone shows the bag in another city; the bag
     sits at a bus stop; a stranger's phone walks past and reports it. Inside the tag: no GPS/SIM/Wi-Fi, just Bluetooth
     and a coin cell. It whispers "I'm here"; a passing iPhone adds its location, locks it, sends it to Apple; your phone
     downloads and unlocks it. Only your phone has the key. Zoom out to a city of helpers; the airline story; an unknown
     tag on you gets flagged on iPhone or Android; everyone around the disc is the tracker. Beats come from voice/words.js. -->
<link rel="stylesheet" href="../_ember/fonts.css">
<link rel="stylesheet" href="lib/reel.css">
<style>
#stage { background: #0b0a09; }
#vig { background: radial-gradient(120% 82% at 50% 44%, rgba(8,6,4,0) 52%, rgba(8,6,4,0.72) 100%); }
#hud { pointer-events: none; }
/* HUD: dark glass cards with a short accent bar; the label carries the beat's colour, the value stays white */
.hc { position: absolute; left: 0; top: 0; display: none; padding: 9px 15px 10px 17px; border-radius: 10px; background: linear-gradient(180deg, rgba(36,33,31,0.93), rgba(19,17,16,0.93)); border: 1px solid rgba(255,255,255,0.075); box-shadow: 0 12px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06); white-space: nowrap; transform-origin: 0 0; }
.hc::before { content: ''; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--c); box-shadow: 0 0 8px var(--cg); }
.hc .k { font: 650 9.5px/1 Inter; letter-spacing: 1.5px; color: var(--c); text-transform: uppercase; }
.hc .v { font: 750 19px/1.05 Inter; letter-spacing: -0.3px; margin-top: 6px; color: #f5f4f3; }
.hc.big .v { font-size: 24px; }
.hc .v.dots { letter-spacing: 3px; }
.hp { position: absolute; left: 0; top: 0; display: none; font: 600 11px/1 Inter; padding: 6px 10px 6px 9px; border-radius: 20px; background: rgba(24,22,20,0.9); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 6px 16px rgba(0,0,0,0.4); color: #e6e3e0; white-space: nowrap; transform-origin: 0 0; }
.hp::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
.hp.hot { border-color: var(--cg); }
#stat { position: absolute; left: 16px; top: 120px; padding: 8px 12px 8px 10px; border-radius: 6px; background: rgba(20,18,16,0.82); border: 1px solid rgba(198,189,182,0.12); font: 700 10.5px/1 Inter; color: #e0dddb; }
#stat .r { display: flex; align-items: center; gap: 7px; height: 16px; }
#stat i { width: 7px; height: 7px; border-radius: 50%; border: 1.2px solid #6e6965; box-sizing: border-box; }
#stat i.on { border: none; }
#cap .box { left: 50%; right: auto; transform: translateX(-50%); padding: 0 10px; background: none; }
#cap .box::before, #cap .box::after { content: ''; position: absolute; width: 8px; height: 8px; border: 1.6px solid #ff6a1f; }
#cap .box::before { left: -2px; top: -4px; border-width: 1.6px 0 0 1.6px; }
#cap .box::after { right: -2px; bottom: -4px; border-width: 0 1.6px 1.6px 0; }
/* the slam sits on a soft dark band so the city never fights the letters */
.slam::before { content: ''; position: absolute; left: -20px; right: -20px; top: -40px; bottom: -36px; background: radial-gradient(60% 50% at 50% 50%, rgba(13,11,10,0.78) 0%, rgba(13,11,10,0.5) 55%, rgba(13,11,10,0) 100%); z-index: -1; }
</style>

<script>
for (let i = 0; i < 18; i++) { const m = new TH.Mesh(new TH.RingGeometry(0.9, 1, 96), new TH.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: TH.AdditiveBlending, depthWrite: false, toneMapped: false, side: TH.DoubleSide })); m.visible = false; scene.add(m); RINGS.push(m); }
// Signals speak the reference's language: crisp thin rings that open out from a device, and thin lines that draw
// themselves from one device to the next with a bright head on the tip. No wide halos, no light beams.
const RING_TX = ctex(512, 512, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.8, 'rgba(255,255,255,0.025)'); gr.addColorStop(0.985, 'rgba(255,255,255,0.06)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#ffffff'; g.lineWidth = 3.2; g.beginPath(); g.arc(w / 2, h / 2, w / 2 - 6, 0, 7); g.stroke();
});
const RING_G = new TH.PlaneGeometry(2, 2);
for (const m of RINGS) { m.geometry = RING_G; m.material.map = RING_TX; m.material.needsUpdate = true; }
function ripple(t, t0, x, y, z, col, maxR, dur = 0.9) {
  const p = prog(t, t0, t0 + dur); if (p <= 0 || p >= 1 || ringI >= RINGS.length) return;
  const m = RINGS[ringI++], r = maxR * (0.1 + 0.9 * ease.out(p));
  m.visible = true; m.position.set(x, y, z); m.scale.set(r, r, 1); m.material.color.set(col); m.material.opacity = 0.85 * Math.pow(1 - p, 1.3) * Math.min(1, p * 12);
}
// signal lines: a pool of pixel-width lines (core + faint halo) whose segments are rewritten in place each frame
const LMAX = 8, LINKS = [];
const dotSprite = () => { const sp = new TH.Sprite(new TH.SpriteMaterial({ map: TX_ORB, transparent: true, blending: TH.AdditiveBlending, depthWrite: false, depthTest: false, toneMapped: false })); sp.visible = false; sp.renderOrder = 6; scene.add(sp); return sp; };
for (let i = 0; i < 8; i++) {
  const geo = new TH.LineGeometry(); geo.setPositions(new Array(LMAX * 3).fill(0).map((_, k) => k));
  const core = new TH.Line2(geo, lineMat(O, 3.4)), halo = new TH.Line2(geo, lineMat(O, 11, { add: true, op: 0.16 }));
  core.renderOrder = 5; halo.renderOrder = 4;
  for (const l of [core, halo]) { l.frustumCulled = false; l.visible = false; scene.add(l); }
  LINKS.push({ geo, core, halo, head: dotSprite(), end: dotSprite() });
}
let linkI = 0;
function linksReset() { linkI = 0; for (const L of LINKS) L.core.visible = L.halo.visible = L.head.visible = L.end.visible = false; }
// the part of a polyline between fractions q0 and q1 of its length
function subLine(pts, q0, q1) {
  const d = [0]; for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(...[0, 1, 2].map((j) => pts[i][j] - pts[i - 1][j])));
  const L = d[d.length - 1], at_ = (u) => { let i = 1; while (i < pts.length - 1 && d[i] < u) i++; const k = (u - d[i - 1]) / Math.max(1e-6, d[i] - d[i - 1]); return [0, 1, 2].map((j) => lerp(pts[i - 1][j], pts[i][j], clamp(k))); };
  const u0 = q0 * L, u1 = q1 * L, out = [at_(u0)];
  for (let i = 1; i < pts.length - 1; i++) if (d[i] > u0 && d[i] < u1) out.push(pts[i]);
  out.push(at_(u1)); return out;
}
// link(t, pts, t0, dur, t1, col): draws on along pts over [t0, t0+dur] (eased), holds, fades out at t1. o.travel: the
// tail follows the head, so it reads as one message moving; o.a: opacity
function link(t, pts, t0, dur, t1, col, o = {}) {
  if (t < t0 || t > t1 || linkI >= LINKS.length) return null;
  const L = LINKS[linkI++], q = ease.inOut(prog(t, t0, t0 + dur)), q0 = o.travel ? ease.inOut(prog(t, t0 + dur * 0.35, t0 + dur * 1.25)) : 0;
  const a = (o.a ?? 1) * (1 - ep(t, t1 - 0.25, t1)) * (o.travel ? 1 - ep(t, t0 + dur * 1.05, t0 + dur * 1.25) : 1);
  if (q <= 0.001 || a <= 0.01) return null;
  const part = subLine(pts, q0, q).slice(0, LMAX), arr = L.geo.attributes.instanceStart.data.array;
  for (let i = 0; i < part.length - 1; i++) arr.set([...part[i], ...part[i + 1]], i * 6);
  L.geo.attributes.instanceStart.data.needsUpdate = true; L.geo.instanceCount = part.length - 1;
  for (const [l, k] of [[L.core, 1], [L.halo, 0.16]]) { l.visible = true; l.material.color.set(col); l.material.opacity = a * k; }
  const tip = part[part.length - 1], px = 1 / cam.s;
  if (q < 0.999 || o.travel) { L.head.visible = true; L.head.position.set(...tip); L.head.material.color.set(mixHex(col, '#ffffff', 0.5)); L.head.material.opacity = a; L.head.scale.set(16 * px, 16 * px, 1); }
  if (q >= 0.999 && !o.travel) { const k = ease.out(prog(t, t0 + dur, t0 + dur + 0.25)); L.end.visible = true; L.end.position.set(...tip); L.end.material.color.set(col); L.end.material.opacity = a * (0.6 + 0.4 * (1 - k)); L.end.scale.set((10 + 14 * (1 - k)) * px, (10 + 14 * (1 - k)) * px, 1); }
  return tip;
}

/* ---------------- beats */
const T = {
  airline: at('airline'), told: at('told'), safe: at('safe'), her: at('her', 2), apartment: at('apartment'),
  but: at('but'), didnt: at("didn't"), strangers: at("stranger's"), phone1: at('phone'), did: at('did'),
  an: at('an'), gps: at('gps'), sim: at('sim'), wifi: at('wi'), just: at('talks') - 0.12, bluetooth: at('bluetooth'), coin: at('coin'),
  every: at('over', 2), whispers: at('whispers'), thing: at('thing'), here: at("i'm"),
  any: at('any'), iphone: at('iphone'), hears: at('hears'), adds: at('adds'), location: at('location'), locks: at('locks'), sends: at('sends'), apple: at('apple'),
  never: at('never'), knows: at('know'),
  then: at('then'), downloads: at('downloads'), unlocks: at('unlocks'), theres: at("there's"),
  only: at('only'), key: at('key'), cant: at("can't"), stranger2: at('stranger'), whose: at('whose'),
  now: at('now'), hundreds: at('hundreds'), devices: at('devices'), thats: at("that's"), d29: at('29'), disc: at('disc'), knew: at('knew'), airline2: at('airline', 2),
  stalk: at('stalkers'), hides: at('unknown'), travels: at('travels'), warns: at('warn'), your3: at('your'), iphone2: at('iphone', 2), android: at('android'),
  so: at('so'), little: at('little'), tracking: at('know', 2), everyone: at('everyone'), last: WORDS[WORDS.length - 1][2],
};
// B: the airline story opens the reel (no line repeats later); the mechanism follows; a callback to her bag before the stalker beat
const CUT = { APT: 0, NET: T.but - 0.1, IN: T.an, SIM: T.sim - 0.16, BT: T.just, COIN: T.coin - 0.2,
  PING: T.every, PING2: T.thing - 0.34, PASS: T.any, SPH: T.adds - 0.1, DC1: T.sends + 0.4, OFF: T.never - 0.36, HOME2: T.then, YPH: T.downloads,
  KEY: T.only, DC2: at('apple', 2), WHOSE: T.stranger2 - 0.16, ZOOM: T.now, PINS: T.thats, BACK: T.knew - 0.1,
  HIDE: line(8).start - 0.2, ALERT: T.your3, BOTH: T.iphone2, LONE: T.so, ALL: T.everyone, END: T.last + 0.35 };

/* ---------------- build */
const CITYF = [350, 120, 0];   // where the city shots look
const HM = buildHome(), ST = buildStudio(), DC = buildDC(), AP = buildAirport(), CI = buildCity();
// rooftop pins for "shows up almost anywhere": spread around the frame, away from its centre
const CPINS = (() => {
  const out = [], used = [];
  for (const b of [...CI.bld].sort((p, q) => rnd(p[0] + p[1], 7) - rnd(q[0] + q[1], 7))) {
    const d = Math.hypot(b[0] - CITYF[0], b[1] - CITYF[1]);
    if (d < 900 || d > 2900 || used.some((u) => Math.hypot(u[0] - b[0], u[1] - b[1]) < 1500)) continue;
    used.push(b); out.push({ s: holo(ICO.pin, 520, O), p: [b[0], b[1], b[4]] }); if (out.length === 6) break;
  }
  return out;
})();
// the people around the bag in the last shot, each with a phone
const CROWD = [[-160, -690, 70], [520, -625, -65], [-40, -575, 0], [330, -680, 0], [-330, -610, 55]].map(([x, y, v], k) => ({ x, y, v, p: person(scene, -6000, y, v < 0 ? Math.PI : 0, { seed: 20 + k * 3, phone: true, coat: k % 2 === 0 }) }));
// passers-by in the lot whose phones hear her tag (the finale's crowd, borrowed for this shot)
// two residents crossing the courtyard on its paving (clear of the glass wings), south of the dumped bags
const NEAR = [[-200, -150], [-90, -182]].map(([dx, dy], k) => ({ p: CROWD[k].p, x: CI.aptC[0] + dx, y: CI.aptC[1] + dy }));
const DUMPL = new TH.PointLight(C('#e3ddd8'), 0, 1100, 1.4); DUMPL.position.set(CI.dumpster[0] - 160, CI.dumpster[1] - 200, 260); scene.add(DUMPL);
const HOLO = { pin: holo(ICO.pin, 46, O), lock: holo(ICO.lock, 44, AMB), key: holo(ICO.key, 58, OK), hpin: holo(ICO.pin, 190, O), dlock: [0, 1, 2, 3, 4, 5].map(() => holo(ICO.lock, 50, AMB)), wave: holo(ICO.wave, 60, O) };

/* ---------------- phone screens */
// Drawn in a 600-wide design space whatever the canvas size, in the dark iOS look: a quiet street map, a frosted
// bottom sheet with big type and round icon tiles, iOS-style notifications. One orange accent, red only for alerts.
const S6 = (g, S, x, y, fn, col) => { g.save(); g.translate(x - S / 2, y - S / 2); fn(g, S, col); g.restore(); };
const UI = { card: '#1f1d1c', tile: '#2c2a28', tx: '#f5f4f3', tx2: '#a39e99', tx3: '#6f6a66' };
const uiSpace = (g, W, H) => { const k = W / 600; g.scale(k, k); return H / k; };
function rr(g, x, y, w, h, r, fill, stroke, lw = 2) { g.beginPath(); g.roundRect(x, y, w, h, r); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function dot(g, x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = fill; g.fill(); }
function tx(g, s, x, y, font, col, al = 'left', bl = 'alphabetic') { g.font = font; g.fillStyle = col; g.textAlign = al; g.textBaseline = bl; g.fillText(s, x, y); }
// glyphs, centred on (x, y), s = size
const GL = {
  bag(g, x, y, s, col, cut) {
    g.strokeStyle = col; g.lineWidth = s * 0.09; g.beginPath(); g.roundRect(x - s * 0.17, y - s * 0.5, s * 0.34, s * 0.24, s * 0.06); g.stroke();
    rr(g, x - s * 0.46, y - s * 0.3, s * 0.92, s * 0.74, s * 0.14, col);
    if (cut) { g.fillStyle = cut; g.fillRect(x - s * 0.24, y - s * 0.3, s * 0.07, s * 0.74); g.fillRect(x + s * 0.17, y - s * 0.3, s * 0.07, s * 0.74); }
  },
  sound(g, x, y, s, col) {
    g.fillStyle = col; g.beginPath(); g.moveTo(x - s * 0.42, y - s * 0.14); g.lineTo(x - s * 0.2, y - s * 0.14); g.lineTo(x + s * 0.06, y - s * 0.38); g.lineTo(x + s * 0.06, y + s * 0.38); g.lineTo(x - s * 0.2, y + s * 0.14); g.lineTo(x - s * 0.42, y + s * 0.14); g.closePath(); g.fill();
    g.strokeStyle = col; g.lineWidth = s * 0.08; g.lineCap = 'round'; for (const r of [0.2, 0.36]) { g.beginPath(); g.arc(x + s * 0.08, y, s * r, -0.8, 0.8); g.stroke(); }
  },
  arrow(g, x, y, s, col) { g.fillStyle = col; g.beginPath(); g.moveTo(x + s * 0.42, y - s * 0.42); g.lineTo(x - s * 0.08, y + s * 0.44); g.lineTo(x - s * 0.04, y + s * 0.04); g.lineTo(x - s * 0.44, y + s * 0.0); g.closePath(); g.fill(); },
  bell(g, x, y, s, col) { g.fillStyle = col; g.beginPath(); g.moveTo(x - s * 0.36, y + s * 0.22); g.quadraticCurveTo(x - s * 0.26, y + s * 0.1, x - s * 0.26, y - s * 0.08); g.arc(x, y - s * 0.08, s * 0.26, Math.PI, 0); g.quadraticCurveTo(x + s * 0.26, y + s * 0.1, x + s * 0.36, y + s * 0.22); g.closePath(); g.fill(); dot(g, x, y + s * 0.33, s * 0.09, col); },
  check(g, x, y, s, col) { g.strokeStyle = col; g.lineWidth = s * 0.14; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(x - s * 0.3, y); g.lineTo(x - s * 0.08, y + s * 0.22); g.lineTo(x + s * 0.32, y - s * 0.24); g.stroke(); },
  findMy(g, x, y, s) { g.strokeStyle = '#fff'; g.lineWidth = s * 0.07; for (const r of [0.34, 0.2]) { g.beginPath(); g.arc(x, y, s * r, 0, 7); g.stroke(); } dot(g, x, y, s * 0.07, '#fff'); },
};
function statusBar(g, W, col = UI.tx) {
  tx(g, '9:41', 104, 68, '650 31px Inter', col, 'center');
  for (let k = 0; k < 4; k++) rr(g, W - 198 + k * 10, 70 - 10 - k * 5, 7, 10 + k * 5, 2, col);
  g.strokeStyle = col; g.lineCap = 'round'; g.lineWidth = 4.5; for (const r of [9, 17]) { g.beginPath(); g.arc(W - 132, 70, r, -Math.PI * 0.74, -Math.PI * 0.26); g.stroke(); } dot(g, W - 132, 68, 3.5, col);
  rr(g, W - 104, 47, 48, 24, 8, null, 'rgba(245,244,243,0.5)', 2.5); rr(g, W - 100, 51, 34, 16, 4, col); rr(g, W - 53, 55, 4, 8, 2, 'rgba(245,244,243,0.5)');
}
// a dark street map. z < 1 zooms out (the far view reads as a whole region)
function mapBg(g, W, H, z = 1, dim = 0) {
  g.fillStyle = '#1c1b1a'; g.fillRect(0, 0, W, H);
  g.save(); g.translate(W / 2, H * 0.34); g.rotate(-0.3); g.scale(z, z);
  const CX = 74, CY = 94, N = Math.ceil(1100 / z / CX);
  for (let i = -N; i <= N; i++) for (let j = -N; j <= N; j++) {
    const r = rnd(i * 31 + j * 7, 3);
    g.fillStyle = r < 0.08 ? '#1f241d' : r < 0.5 ? '#222120' : '#1f1e1d';
    g.fillRect(i * CX + 6, j * CY + 6, CX - 12, CY - 12);
  }
  g.lineCap = 'butt';
  for (const [w, c, m] of [[7, '#2d2b29', 1], [15, '#3a3734', 4]]) {
    g.strokeStyle = c; g.lineWidth = w; g.beginPath();
    for (let i = -N; i <= N; i++) if (i % m === 0) { g.moveTo(i * CX, -N * CY); g.lineTo(i * CX, N * CY); }
    for (let j = -N; j <= N; j++) if (j % m === 0) { g.moveTo(-N * CX, j * CY); g.lineTo(N * CX, j * CY); }
    g.stroke();
  }
  g.lineCap = 'round';
  g.strokeStyle = '#151617'; g.lineWidth = 92; g.beginPath(); g.moveTo(-1400, 620); g.bezierCurveTo(-500, 300, -100, 520, 500, 160); g.bezierCurveTo(800, -20, 1100, -60, 1500, -300); g.stroke();
  g.strokeStyle = '#4c3b2e'; g.lineWidth = 20; g.beginPath(); g.moveTo(-1300, -900); g.bezierCurveTo(-400, -500, -200, -100, 260, 1400); g.stroke();
  if (z >= 0.8) { g.fillStyle = '#74706b'; g.font = '600 21px Inter'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('STATION RD', 2 * CX, -CY * 2 + 1); g.save(); g.rotate(Math.PI / 2); g.fillText('MARKET ST', 0, -4 * CX + 1); g.restore(); }
  g.restore();
  if (dim) { g.fillStyle = `rgba(10,9,8,${dim})`; g.fillRect(0, 0, W, H); }
}
// the Find My item marker: accuracy halo, white-rimmed orange disc with the bag, a pulse ring
function bagPin(g, x, y, k = 1, ring = 0) {
  dot(g, x, y, 150 * k, hexA(O, 0.1)); g.strokeStyle = hexA(O, 0.3); g.lineWidth = 2; g.beginPath(); g.arc(x, y, 150 * k, 0, 7); g.stroke();
  if (ring > 0) { g.strokeStyle = hexA(O, 0.7 * (1 - ring)); g.lineWidth = 4; g.beginPath(); g.arc(x, y, (56 + ring * 110) * k, 0, 7); g.stroke(); }
  g.save(); g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 22; g.shadowOffsetY = 8; dot(g, x, y, 52 * k, '#fff'); g.restore();
  dot(g, x, y, 44 * k, O); GL.bag(g, x, y + 3 * k, 44 * k, '#fff', O);
}
function youDot(g, x, y) { dot(g, x, y, 42, 'rgba(255,255,255,0.1)'); g.save(); g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 12; dot(g, x, y, 19, '#fff'); g.restore(); dot(g, x, y, 13, '#8d8781'); }
function mapButtons(g, W) {
  rr(g, W - 104, 112, 72, 144, 22, 'rgba(44,42,40,0.94)'); g.fillStyle = 'rgba(255,255,255,0.08)'; g.fillRect(W - 104, 183, 72, 2);
  g.strokeStyle = UI.tx2; g.lineWidth = 3.5; g.beginPath(); g.arc(W - 68, 148, 15, 0, 7); g.stroke(); tx(g, 'i', W - 68, 149, 'italic 700 21px Inter', UI.tx2, 'center', 'middle');
  GL.arrow(g, W - 68, 220, 30, UI.tx2);
}

  const hb = [CI.herTag[0], CI.herTag[1], 90], inBack = inShot(t, CUT.BACK, CUT.HIDE), inApt = t < CUT.IN || inBack, inNet = inShot(t, CUT.NET, CUT.IN);

  NEAR.forEach((w, k) => {

  const shp = ST.str.top, inS = inShot(t, CUT.SPH, CUT.DC1);

  const pinA = window01(t, T.adds - 0.05, T.locks + 0.05, 0.2), lockA = window01(t, T.locks - 0.05, CUT.DC1 + 0.2, 0.15);
  HOLO.pin.show([shp[0], shp[1], shp[2] + 95 + 6 * Math.sin(t * 3)], inS ? pinA : 0, 0.7 + 0.3 * ease.back(prog(t, T.adds - 0.05, T.adds + 0.3)));
