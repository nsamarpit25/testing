     cells USER_ID · ITEM · TOTAL · DATE · ADDRESS) and, in front on the left, YOUR APP (an ember box). Hook: the orders
     page spins to 9 s while a flood of rows streams from the table into the app. SELECT *: every row and every column
     lights up; a million rows travel and pile up on the app; ten newest lift off green, the rest burn away. Better query:
     typed line by line while the table filters to user 42, the ten newest, then just the three columns on screen.
     Shopping list card. Ten small rows fly to the app and the page loads. EXPLAIN: a scanner reads the whole table,
     then an index lane on user_id rises and points at user 42's rows. Beats come from voice/words.json via at(). -->

<script>

/* ---------------- beats */

  l3: line(3).start, query1: at('query'), better: at('better'), exactly: at('exactly'), shows: at('shows'), your10: at('10', 3), newest2: at('newest', 2), details: at('details'), screen: at('screen'),
  like: at('like', 2), milk: at('milk'), eggs: at('eggs'), whole1: at('whole'), door: at('door'),
  l5: line(5).start, opt: at('optimization'), ten5: at('ten'), instead: at('instead'), million3: at('million', 3), less: at('less'), process: at('process'),
  l6: line(6).start, finds: at('finds'), explain: at('explain'), reads: at('reads'), whole2: at('whole', 2), few: at('few'), index: at('index'), help: at('help'),

/* ---------------- layout: Z up, rows run along +y */

const STREETS = ['12 Elm St', '4 Oak Ave', '88 Pine Rd', '9 Lake Dr', '31 Hill St', '7 Bay Rd', '50 Park Ln'];
const MON = ['Oct', 'Sep', 'Aug'];
const DATA = (r) => [
  String(MS.has(r) ? ME : USERS[Math.floor(rnd(r, 3) * USERS.length)]),
  ITEMS[Math.floor(rnd(r, 4) * ITEMS.length)],
  '$' + (6 + Math.floor(rnd(r, 6) * 140)),
  MS.has(r) ? MDATE[MINE.indexOf(r)] : MON[Math.floor(rnd(r, 7) * 3)] + ' ' + (1 + Math.floor(rnd(r, 8) * 28)),
  STREETS[Math.floor(rnd(r, 9) * STREETS.length)],

// the flood: rows streaming to the app (hook, then "a million rows travel")
const W1 = [0.3, T.l1 - 0.35], W2 = [T.million2 - 0.1, T.keeps - 0.15];
const FN = 110, FP = 0.75;                                 // flyers, seconds per flight
const PN = 120;                                            // slabs in the pile on the app
const KEEP = [4, 15, 27, 38, 50, 61, 73, 84, 96, 107];      // pile slots that are the ten newest
const fill = (t) => t < T.l1 ? 0.55 * ep(t, W1[0] + 0.5, W1[1], ease.inOut) * (1 - ep(t, T.l1 - 0.3, T.l1)) : ep(t, W2[0] + 0.5, W2[1] + 0.3, ease.inOut);
const count = (t, a, b) => Math.round(Math.exp(lerp(0, Math.log(1e6), ep(t, a, b, (x) => Math.pow(x, 0.6)))));
const PILE = [...Array(PN)].map((_, k) => {
  const r = 92 * Math.sqrt(rnd(k, 21)), a = rnd(k, 22) * Math.PI * 2;
  return { x: APX + Math.cos(a) * r * 0.95, y: APY + Math.sin(a) * r * 0.6, z: APH + 1 + (k / PN) * 46 * (1 - r / 100) + rnd(k, 23) * 4, rz: (rnd(k, 24) - 0.5) * 1.6 };
});
const KEEPAT = (j) => [APX, APY, APH + 90 + j * 7];   // the kept ten, stacked neatly above the app

/* ---------------- camera: perspective shots {t, d, p (position), l (look at), f (fov)} */
const pcam = new TH.PerspectiveCamera(44, 540 / 960, 5, 20000); pcam.up.set(0, 0, 1);
const SHOTS = [
  { t: 0, p: [-100, -1720, 960], l: [-180, -60, 0], f: 46 },
  { t: 0.01, d: 5.5, p: [-150, -1500, 820], l: [-200, -120, 0], f: 46, e: ease.out },
  { t: T.l1 - 0.3, d: 1.1, p: [0, -640, 660], l: [0, 150, 0], f: 46 },
  { t: T.send - 0.2, d: 1.2, p: [260, -950, 1250], l: [0, 1700, 0], f: 46 },
  { t: T.million2 - 0.3, d: 1.2, p: [-150, -1500, 820], l: [-200, -120, 0], f: 46 },
  { t: T.keeps - 0.25, d: 1.0, p: [-200, -1120, 620], l: [-250, -380, 80], f: 44 },
  { t: T.l3 - 0.25, d: 1.2, p: [0, -640, 700], l: [0, 190, 0], f: 46 },
  { t: T.l5 - 0.2, d: 1.2, p: [-150, -1500, 820], l: [-200, -120, 0], f: 46 },
  { t: T.l6 - 0.25, d: 1.1, p: [0, -640, 660], l: [0, 150, 0], f: 46 },
  { t: T.reads - 0.2, d: 1.0, p: [120, -1000, 1200], l: [-40, 1500, 0], f: 46 },
  { t: T.index - 0.25, d: 1.0, p: [-230, -800, 760], l: [-160, 240, 0], f: 50 },
  { t: T.ifv, d: 3, p: [-250, -860, 800], l: [-160, 280, 0], f: 50 },
];
const KICKS = [[T.nine, 0.04], [T.million1, 0.05], [T.spreadsheet, 0.03], [T.all, 0.05], [T.keeps, 0.04], [T.throws, 0.05], [T.better, 0.03], [T.newest2, 0.03], [T.details, 0.03],
  [T.ten5, 0.04], [T.explain, 0.04], [T.whole2, 0.04], [T.index, 0.05]];
const SHAKES = [[T.million1, 5, 0.3], [T.throws, 7, 0.4]];
function shoot(t) {
  let p = SHOTS[0].p.slice(), l = SHOTS[0].l.slice(), f = SHOTS[0].f;
  for (let i = 1; i < SHOTS.length; i++) {
    const k = SHOTS[i]; if (t < k.t) break;
    const q = k.d ? (k.e || ease.inOut)(prog(t, k.t, k.t + k.d)) : 1;
    p = p.map((v, j) => lerp(v, k.p[j], q)); l = l.map((v, j) => lerp(v, k.l[j], q)); f = lerp(f, k.f, q);
  }
  let kick = 0;
  for (const [t0, amp] of KICKS) { const dt = t - t0; if (dt > 0 && dt < 1.2) kick += amp * (dt < 0.05 ? dt / 0.05 : Math.exp(-(dt - 0.05) * 6)); }
  let sx = 0, sy = 0;
  for (const [t0, amp, dur] of SHAKES) { const dt = t - t0; if (dt > 0 && dt < dur) { const k = amp * (1 - dt / dur); sx += k * Math.sin(t * 91); sy += k * Math.cos(t * 67); } }
  pcam.position.set(p[0] + 6 * Math.sin(t * 0.37), p[1] + 6 * Math.cos(t * 0.29), p[2] + 4 * Math.sin(t * 0.23));
  pcam.lookAt(l[0] + sx, l[1], l[2] + sy);
  pcam.fov = f * (1 - kick); pcam.updateProjectionMatrix(); pcam.updateMatrixWorld();
  cam.f = l;
  const d = Math.hypot(p[0] - l[0], p[1] - l[1], p[2] - l[2]);
  scene.fog.near = d * 0.9; scene.fog.far = d * 3.4;
}
const _pv = new TH.Vector3();
P = function (x, y, z) { _pv.set(x, y, z).project(pcam); return [(_pv.x + 1) * 270, (1 - _pv.y) * 480, _pv.z]; };

/* ---------------- the stage: a longer floor and grid */
floor.scale.set(2.2, 2.2, 1); floor.position.set(0, 3000, -0.5);
scene.children.filter((o) => o.type === 'LineSegments').forEach((o) => scene.remove(o));
(() => {
  const pts = [], S = 56;
  for (let x = -2800; x <= 3200; x += S) pts.push(x, -2400, 0, x, 9400, 0);
  for (let y = -2400; y <= 9400; y += S) pts.push(-2800, y, 0, 3200, y, 0);
  const geo = new TH.BufferGeometry(); geo.setAttribute('position', new TH.Float32BufferAttribute(pts, 3));
  const m = new TH.LineSegments(geo, new TH.LineBasicMaterial({ color: 0x2a221c, transparent: true, opacity: 0.5, fog: true }));
  m.position.z = 0.05; scene.add(m);
})();

/* ---------------- slabs: instanced boxes with a glowing rim texture, tinted per instance */
function rimTex(dividers) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64; const g = c.getContext('2d');
  g.fillStyle = 'rgb(58,58,58)'; g.fillRect(0, 0, 256, 64);
  g.strokeStyle = '#fff'; g.lineWidth = 6; g.strokeRect(3, 3, 250, 58);
  g.fillStyle = 'rgba(255,255,255,0.45)'; for (const d of dividers) g.fillRect(d * 256 - 1.5, 10, 3, 44);
  const tx = new TH.CanvasTexture(c); tx.colorSpace = TH.SRGBColorSpace; tx.anisotropy = 8; return tx;
}
const TX_CELL = rimTex([]), TX_ROW = rimTex(CXS.slice(0, -1).map((x, c) => (x + COLS[c][1] / 2 + GAP / 2 + RW / 2) / RW));
function slabs(n, tex) {
  const geo = new TH.BoxGeometry(1, 1, 1); geo.translate(0, 0, 0.5);
  const m = new TH.InstancedMesh(geo, new TH.MeshBasicMaterial({ map: tex, toneMapped: false, fog: true }), n);
  m.instanceMatrix.setUsage(TH.DynamicDrawUsage); m.setColorAt(0, new TH.Color()); m.instanceColor.setUsage(TH.DynamicDrawUsage);
  m.frustumCulled = false; scene.add(m); return m;
}
const TBL = slabs(NR * NC, TX_CELL), FLY = slabs(FN, TX_ROW), PL = slabs(PN, TX_ROW), SEL = slabs(10 * SHOWC.length, TX_CELL), LANE = slabs(NR, TX_CELL);
const CO = { O: C(O), O2: C(O2), OK: C(OK), RED: C(RED), AMB: C(AMB), WH: C(WH), DIM: C(DIM) };
const _o = new TH.Object3D(), _c = new TH.Color(), _c2 = new TH.Color();
const tint = (a, k, b, m = 0) => (b ? _c.copy(a).lerp(b, clamp(m)) : _c.copy(a)).multiplyScalar(k);
function put(M, i, x, y, z, w, d, h, col, rz = 0) {
  _o.position.set(x, y, z); _o.rotation.set(0, 0, rz); _o.scale.set(Math.max(0.001, w), Math.max(0.001, d), Math.max(0.001, h)); _o.updateMatrix();
  M.setMatrixAt(i, _o.matrix); M.setColorAt(i, col);
}
const hide = (M, i) => put(M, i, 0, 0, -50, 0, 0, 0, _c.setRGB(0, 0, 0));
const done = (M) => { M.instanceMatrix.needsUpdate = true; M.instanceColor.needsUpdate = true; };

// the app: an ember box in front of the table
const APP = emberBox(APX, APY, APW, APD, APH, O);
const ROAD = road([[0, -30, 0], [-60, -300, 0], [APX + 40, APY + APD / 2 + 10, 0]], O2);

/* ---------------- text decals lying on top of slabs (redrawn only when the text or colour changes) */
function lbl3(w, d) {
  const W_ = 1024, H_ = Math.round(1024 * d / w), c = document.createElement('canvas'); c.width = W_; c.height = H_;
  const g = c.getContext('2d'), tex = new TH.CanvasTexture(c); tex.colorSpace = TH.SRGBColorSpace; tex.anisotropy = 8;
  const mat = new TH.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false, depthWrite: false, fog: true });
  mat.color.setScalar(0.78);
  const m = new TH.Mesh(new TH.PlaneGeometry(w, d), mat); m.renderOrder = 3; m.visible = false; scene.add(m);
  const o = { m, key: '' };
  o.set = (key, fn, x, y, z, a) => {
    m.visible = a > 0.01; if (!m.visible) return;
    if (key !== o.key) { o.key = key; g.clearRect(0, 0, W_, H_); fn(g, W_, H_); tex.needsUpdate = true; }
    m.position.set(x, y, z); mat.opacity = a;
  };
  return o;
}
const CELLCOL = { n: '#F2EEE8', d: '#5a534d', g: '#7CF29A', a: '#FFC34D' };
const cellX = (c, W_) => ((CXS[c] - COLS[c][1] / 2 + RW / 2) / RW) * W_;
const rowText = (txt, lv) => (g, W_, H_) => {
  g.textBaseline = 'middle'; g.textAlign = 'left';
  txt.forEach((s, c) => {
    g.fillStyle = CELLCOL[lv[c]]; g.font = `${c === 0 ? 800 : 700} ${Math.round(H_ * (c === 0 ? 0.5 : 0.44))}px ${c === 2 || c === 0 ? 'Mono' : 'Inter'}`;

const NL = 22;                                              // labelled rows at the front
const TLB = [...Array(NL)].map(() => lbl3(RW - 6, RD - 4));
const HEAD = lbl3(RW, 18);
const SLB = [...Array(10)].map(() => lbl3(COLS[1][1] + COLS[2][1] + COLS[3][1] + 2 * GAP - 6, RD - 4));
const LLB = [...Array(NL)].map(() => lbl3(LW - 6, RD - 4));

/* ---------------- scanner bars, beams */
const TX_BAR = (() => {
  const c = document.createElement('canvas'); c.width = 4; c.height = 64; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.4, 'rgba(255,255,255,0.3)'); gr.addColorStop(0.5, 'rgba(255,255,255,1)'); gr.addColorStop(0.6, 'rgba(255,255,255,0.3)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 64); const tx = new TH.CanvasTexture(c); tx.colorSpace = TH.SRGBColorSpace; return tx;

const BARS = [...Array(8)].map(() => {
  const m = new TH.Mesh(new TH.PlaneGeometry(1, 1), new TH.MeshBasicMaterial({ map: TX_BAR, transparent: true, blending: TH.AdditiveBlending, depthWrite: false, toneMapped: false }));
  m.visible = false; m.renderOrder = 2; scene.add(m); return m;

let barI = 0;
function bar(x, y, w, col, a) {
  if (barI >= BARS.length || a < 0.01) return; const m = BARS[barI++];
  m.visible = true; m.position.set(x, y, RH + 2); m.scale.set(w, 40, 1); m.material.color.set(col).multiplyScalar(1.4 * a);
}
function beam() {
  const mk = (w, o) => { const l = new TH.Line2(new TH.LineGeometry(), lineMat(OK, w, o)); l.renderOrder = 4; l.visible = false; scene.add(l); return l; };
  const b = { core: mk(2.6, {}), glow: mk(12, { add: true, op: 0.25 }) };
  b.set = (pts, q, col, a) => {
    const on = a > 0.01 && q > 0.002; b.core.visible = b.glow.visible = on; if (!on) return;
    const flat = sub(pts, q).flat();
    for (const l of [b.core, b.glow]) { l.geometry.dispose(); l.geometry = new TH.LineGeometry(); l.geometry.setPositions(flat); l.material.color.set(col); }
    b.core.material.opacity = a; b.glow.material.opacity = 0.3 * a;
  };

}
const BEAMS = [...Array(8)].map(beam);
const arc = (a, b, h, n = 30) => [...Array(n + 1)].map((_, i) => { const q = i / n, p = lerp3(a, b, q); p[2] += h * 4 * q * (1 - q); return p; });

/* ---------------- table state: how each row / cell looks at time t */
const SCAN0 = T.reads - 0.05, SCAN1 = T.few;
const scanY = (t) => rowY(NR) * ep(t, SCAN0, SCAN1, (x) => x * x * 0.4 + x * 0.6);
const LANE_ID = (j) => (j < 4 ? [39, 40, 40, 41][j] : j < 18 ? ME : 43 + Math.floor((j - 18) / 3));
const LANE_ROW = (j) => (j >= 4 && j < 18 ? MINE[j - 4] : -1);
// filter phases of the better query (held until EXPLAIN)
const hold = (t) => 1 - ep(t, T.l6 - 0.3, T.l6 + 0.2);
const fW = (t) => ep(t, T.your10 - 0.15, T.your10 + 0.25) * hold(t);          // WHERE user_id = 42
const fL = (t) => ep(t, T.newest2 - 0.05, T.newest2 + 0.35) * hold(t);         // ORDER BY date DESC LIMIT 10
const fC = (t) => ep(t, T.details - 0.05, T.details + 0.35) * hold(t);         // only item, total, date
const allOn = (t) => window01(t, T.send - 0.05, T.l3 - 0.2, 0.3);              // SELECT *: every row, every column
// per cell: level for the label ('n', 'd' dim, 'g' green, 'a' amber) and a brightness/colour
function cellLook(r, c, t, base) {
  const mine = MS.has(r), nw = NS.has(r), w = fW(t), l = fL(t), s = fC(t);

  const a = allOn(t); if (a > 0) { col = CO.AMB; m = 0.55 * a; k *= 1 + 0.5 * a; lv = a > 0.5 ? 'a' : 'n'; }
  if (w > 0) {
    if (!mine) { k *= lerp(1, 0.22, w); if (w > 0.5) lv = 'd'; }
    else {
      const keep = nw ? 1 : 1 - l, show = SHOWC.includes(c) ? 1 : 1 - s;
      const g = w * keep * show; col = CO.OK; m = g; k *= lerp(1, 1.9, g) * lerp(1, 0.3, (1 - keep) * w) * lerp(1, 0.3, (1 - show) * w * keep);
      lv = g > 0.5 ? 'g' : keep * show < 0.5 ? 'd' : 'n';
    }

    const a = ep(t, T.l1 - 0.2 + r * 0.03, T.l1 + 0.2 + r * 0.03);
    TLB[r].set(r + lvs.join(''), rowText(DATA(r), lvs), 0, rowY(r), RH + 0.4, a);

    COLS.forEach(([n], c) => { g.fillStyle = fC(t) > 0.5 ? (SHOWC.includes(c) ? '#7CF29A' : '#4a433d') : '#FFB070'; g.fillText(n, cellX(c, W_) + W_ * 0.012, H_ * 0.55); });
  }, 0, -PY * 1.0, 0.6, ep(t, T.spreadsheet - 0.2, T.spreadsheet + 0.3));

void main() { vec3 c = texture2D(tex, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(th, th + 0.4, l), 1.0); }`,

    const right = y > 450 ? 540 - 70 : 540 - 14;
    e.style.left = clamp(x, 14 + w / 2, right - w / 2) + 'px'; e.style.top = y + 'px';
  }
}
