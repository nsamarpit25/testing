<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Opening variant C: cream "incident form" paper with ink diagrams and stamps (from the paper pages in the reference). Hook C, first 10 s. -->
<link rel="stylesheet" href="fonts.css">
<style>
:root { --ink: #151413; --o: #E2501C; --mut: #8b857b; --paper: #ECE6DA; }
html, body { margin: 0; background: #000; }
#stage { position: relative; width: 540px; height: 960px; overflow: hidden; background: var(--paper); font-family: Inter, sans-serif; color: var(--ink); }
#grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(21,20,19,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(21,20,19,0.045) 1px, transparent 1px); background-size: 20px 20px; }
#grain { position: absolute; inset: -40px; opacity: 0.6; mix-blend-mode: multiply; pointer-events: none; }
#vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 60%, rgba(60,40,20,0.22) 100%); pointer-events: none; }
#wrap { position: absolute; inset: 0; transform-origin: 50% 50%; }
.hdr { position: absolute; left: 24px; right: 24px; top: 52px; height: 44px; background: var(--ink); color: #ECE6DA; display: flex; align-items: center; padding: 0 12px; box-sizing: border-box; gap: 12px; }
.hdr .f { font-family: Inter; font-weight: 900; font-size: 22px; letter-spacing: -0.5px; }
.hdr .s { font-family: Mono; font-size: 8px; letter-spacing: 1.4px; line-height: 11px; color: #bdb5a8; }
.mono { font-family: Mono; font-size: 8.5px; letter-spacing: 1.3px; color: var(--mut); position: absolute; }
/* caption block */
#cap { position: absolute; left: 26px; right: 26px; top: 120px; height: 150px; }
.ph { position: absolute; left: 0; right: 0; top: 0; display: none; font-weight: 800; font-size: 42px; line-height: 1.06; letter-spacing: -1.4px; }
.ph span { display: inline-block; margin-right: 10px; }
.ph span.k { font-family: Instrument; font-style: italic; font-weight: 400; color: var(--o); font-size: 50px; letter-spacing: -0.5px; }
/* form fields */
#fields { position: absolute; left: 26px; right: 26px; top: 286px; display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 0 14px; font-family: Mono; }
.fl .l { font-size: 7.5px; letter-spacing: 1.4px; color: var(--mut); }
.fl .v { position: relative; height: 26px; border-bottom: 1px solid var(--ink); font-size: 14px; font-weight: 600; display: flex; align-items: flex-end; padding-bottom: 3px; box-sizing: border-box; white-space: nowrap; }
.fl .v .old { position: relative; }
.fl .v .old:after { content: ''; position: absolute; left: -2px; right: -2px; top: 52%; height: 2px; background: var(--o); transform-origin: 0 50%; transform: scaleX(var(--k, 0)); }
.fl .v .new { color: var(--o); margin-left: 8px; font-weight: 800; }
#svg { position: absolute; left: 0; top: 0; }
.stamp { position: absolute; font-weight: 900; color: var(--o); border: 3.5px solid var(--o); border-radius: 6px; padding: 4px 12px; letter-spacing: 1px; mix-blend-mode: multiply; white-space: nowrap; display: none; }
.stamp small { display: block; font-family: Mono; font-weight: 600; font-size: 8px; letter-spacing: 1.6px; text-align: center; margin-top: 1px; }
#flash { position: absolute; inset: 0; background: var(--o); opacity: 0; mix-blend-mode: multiply; }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <div id="grid"></div>
    <div class="hdr"><div class="f">FORM SD-10</div><div class="s">SERVICE LOCATION RECORD<br>SYSTEM DESIGN · HOW.ITS.ENGINEERED</div><div style="flex:1"></div><div class="s" style="text-align:right">REV. 10<br>PAGE 1 OF 1</div></div>
    <div id="cap"></div>
    <div id="fields">
      <div class="fl"><div class="l">1. SERVICE</div><div class="v">payments</div></div>
      <div class="fl"><div class="l">2. ADDRESS</div><div class="v"><span class="old" id="ipOld">10.0.0.7</span><span class="new" id="ipNew"></span></div></div>
      <div class="fl"><div class="l">3. STATUS</div><div class="v" id="st">running</div></div>
    </div>
    <svg id="svg" width="540" height="960" viewBox="0 0 540 960"></svg>
    <div class="mono" style="left:26px;bottom:58px">FIG. 1 — A SERVICE MOVES. ITS CALLERS ARE NOT TOLD.</div>
    <div class="mono" id="tc" style="right:26px;bottom:58px">T+00.0</div>
    <div class="stamp" id="sRe" style="font-size:24px;left:44px;top:420px">RESTARTED<small>MACHINE 1 · 00:00:01</small></div>
    <div class="stamp" id="sFail" style="font-size:64px;left:112px;top:520px;border-width:5px">FAILED<small style="font-size:10px">3 OF 3 CALLS · ECONNREFUSED</small></div>
  </div>
  <div id="vig"></div>
  <div id="flash"></div>
  <div id="grain"></div>
</div>
<script src="../../../tools/lib.js"></script>
<script src="hook.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const rnd = rndH;
const SVG = $('svg');
const mk = (tag, attrs, parent = SVG) => el(tag, attrs, parent);
// layout
const M = [{ x: 30, y: 420, w: 146, h: 104 }, { x: 197, y: 420, w: 146, h: 104 }, { x: 364, y: 420, w: 146, h: 104 }];
const SV_OLD = { x: 52, y: 448, w: 100, h: 50 }, SV_NEW = { x: 386, y: 448, w: 100, h: 50 };
const CL = [{ n: 'cart', x: 40 }, { n: 'orders', x: 205 }, { n: 'login', x: 370 }].map((c) => ({ ...c, y: 690, w: 130, h: 52 }));
// hatch pattern
const defs = mk('defs', {});
const pat = mk('pattern', { id: 'h', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
mk('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: 'rgba(21,20,19,0.16)', 'stroke-width': 1 }, pat);
const patO = mk('pattern', { id: 'ho', width: 5, height: 5, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
mk('line', { x1: 0, y1: 0, x2: 0, y2: 5, stroke: 'rgba(226,80,28,0.35)', 'stroke-width': 1.2 }, patO);
const mkArrow = (id, col) => { const m = mk('marker', { id, viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs); mk('path', { d: 'M0 0 L10 5 L0 10 z', fill: col }, m); };
mkArrow('ai', '#151413'); mkArrow('ao', '#E2501C');
// a rectangle that draws itself in
function rect(r, o = {}) {
  const e = mk('rect', { x: r.x, y: r.y, width: r.w, height: r.h, fill: o.fill || 'none', stroke: o.stroke || '#151413', 'stroke-width': o.sw || 1.4, rx: o.rx || 0 });
  const L = 2 * (r.w + r.h); e.setAttribute('stroke-dasharray', o.dash || L); e._L = L; return e;
}
function text(x, y, s, o = {}) { const e = mk('text', { x, y, 'font-family': o.f || 'Mono', 'font-size': o.sz || 9, 'font-weight': o.w || 600, fill: o.fill || '#151413', 'text-anchor': o.anchor || 'start', 'letter-spacing': o.ls ?? 1 }); e.textContent = s; return e; }
const machines = M.map((m, i) => { const g0 = mk('g', {}); const r = rect(m, { fill: 'url(#h)', sw: 1.4 }); g0.appendChild(r); const tx = text(m.x + 8, m.y + m.h - 9, 'MACHINE ' + (i + 1), { sz: 8.5 }); g0.appendChild(tx); return { g: g0, r, tx }; });
// dimension line under the machines
const dim = mk('g', {});
mk('line', { x1: 30, y1: 546, x2: 510, y2: 546, stroke: '#8b857b', 'stroke-width': 0.8 }, dim);
[30, 197, 364, 510].forEach((x) => mk('line', { x1: x, y1: 541, x2: x, y2: 551, stroke: '#8b857b', 'stroke-width': 0.8 }, dim));
['10.0.0.x', '10.0.2.x', '10.0.4.x'].forEach((s, i) => dim.appendChild(text(M[i].x + M[i].w / 2, 562, s, { sz: 7.5, fill: '#8b857b', anchor: 'middle' })));
// services
const svOld = mk('g', {}); const svOldR = rect(SV_OLD, { fill: '#ECE6DA', sw: 2 }); svOld.appendChild(svOldR); svOld.appendChild(text(SV_OLD.x + SV_OLD.w / 2, SV_OLD.y + 22, 'payments', { sz: 11, w: 800, anchor: 'middle', ls: 0 })); const svOldIp = text(SV_OLD.x + SV_OLD.w / 2, SV_OLD.y + 38, '10.0.0.7', { sz: 8, anchor: 'middle', fill: '#8b857b' }); svOld.appendChild(svOldIp);
const ghost = rect(SV_OLD, { sw: 1.3, stroke: '#8b857b', dash: '4 4' }); const ghostT = text(SV_OLD.x + SV_OLD.w / 2, SV_OLD.y + 30, '10.0.0.7 · vacant', { sz: 7.5, anchor: 'middle', fill: '#8b857b' });
const svNew = mk('g', {}); const svNewR = rect(SV_NEW, { fill: 'url(#ho)', sw: 2, stroke: '#E2501C' }); svNew.appendChild(svNewR); const svNewT = text(SV_NEW.x + SV_NEW.w / 2, SV_NEW.y + 22, 'payments', { sz: 11, w: 800, anchor: 'middle', ls: 0, fill: '#E2501C' }); svNew.appendChild(svNewT); const svNewIp = text(SV_NEW.x + SV_NEW.w / 2, SV_NEW.y + 38, '', { sz: 8, anchor: 'middle', fill: '#E2501C', w: 800 }); svNew.appendChild(svNewIp);
const sameNote = mk('g', {}); mk('path', { d: 'M436 440 C 446 420, 470 410, 488 404', fill: 'none', stroke: '#151413', 'stroke-width': 1 }, sameNote); sameNote.appendChild(text(420, 398, 'same code ✓', { f: 'Instrument', sz: 17, w: 400, ls: 0 }));
// callers + arrows
const callers = CL.map((c) => { const g0 = mk('g', {}); const r = rect(c, { fill: '#ECE6DA', sw: 1.4 }); g0.appendChild(r); g0.appendChild(text(c.x + c.w / 2, c.y + 31, c.n, { sz: 12, w: 800, anchor: 'middle', ls: 0 })); return { g: g0, r }; });
const target = { x: SV_OLD.x + SV_OLD.w / 2, y: SV_OLD.y + SV_OLD.h + 4 };
const arrows = CL.map((c, i) => { const x0 = c.x + c.w / 2, y0 = c.y - 4; const mx = (x0 + target.x) / 2 + (i - 1) * 20; const d = `M${x0} ${y0} C ${x0} ${y0 - 70}, ${mx} ${target.y + 80}, ${target.x + (i - 1) * 14} ${target.y}`; const p = mk('path', { d, fill: 'none', stroke: '#151413', 'stroke-width': 1.3, 'marker-end': 'url(#ai)' }); return { p, L: p.getTotalLength ? 0 : 0 }; });
const dots = CL.map(() => mk('circle', { r: 3.4, fill: '#151413' }));
const xs = CL.map(() => { const g0 = mk('g', {}); mk('circle', { r: 11, fill: '#ECE6DA', stroke: '#E2501C', 'stroke-width': 2 }, g0); mk('path', { d: 'M-5 -5 L5 5 M5 -5 L-5 5', stroke: '#E2501C', 'stroke-width': 2.4, 'stroke-linecap': 'round' }, g0); return g0; });
// question: dashed pencil line wandering to a big ?
const qPath = mk('path', { d: 'M270 686 C 250 600, 140 640, 120 590 S 230 560, 280 600 S 420 640, 436 560', fill: 'none', stroke: '#E2501C', 'stroke-width': 1.6, 'stroke-dasharray': '5 5' });
const qMark = text(446, 560, '?', { f: 'Instrument', sz: 96, w: 400, fill: '#E2501C', ls: 0 });
const qNote = text(26, 800, 'Q. HOW DOES ANY CALLER FIND IT?  ☐ YES  ☐ NO', { sz: 9, fill: '#151413' });

/* ---------------- captions: big black text, key words in orange serif italic */
const PH = [
  { w: [0, 1, 2], k: [2], t1: 1.82 },
  { w: [3, 4], k: [4], t1: 2.82 },
  { w: [5, 6], k: [6], t1: 4.15 },
  { w: [7, 8, 9, 10, 11, 12, 13], k: [13], t1: 7.05 },
  { w: [14, 15, 16, 17, 18, 19, 20], k: [19, 20], t1: 99 },
];
PH.forEach((ph) => {
  ph.el = document.createElement('div'); ph.el.className = 'ph'; $('cap').appendChild(ph.el);
  ph.sp = ph.w.map((i) => { const s = document.createElement('span'); s.textContent = WORDS[i][0]; if (ph.k.includes(i)) s.className = 'k'; ph.el.appendChild(s); return s; });
  ph.t0 = WORDS[ph.w[0]][1] - 0.05;
});
function cap(t) {
  for (const ph of PH) {
    const on = t >= ph.t0 && t < ph.t1; ph.el.style.display = on ? 'block' : 'none'; if (!on) continue;
    const out = ep(t, ph.t1 - 0.12, ph.t1, ease.in); ph.el.style.opacity = 1 - out;
    ph.sp.forEach((s, k) => { const a = WORDS[ph.w[k]][1], p = ep(t, a - 0.04, a + 0.14, ease.back); s.style.opacity = prog(t, a - 0.04, a + 0.04); s.style.transform = `translateY(${(1 - p) * 12}px)`; });
  }
}
const vis = (e, a) => { e.style.display = a > 0.001 ? '' : 'none'; e.style.opacity = a; };
function drawIn(e, p) { e.setAttribute('stroke-dashoffset', e._L * (1 - p)); }
function stamp(e, t, a, b, rot) {
  const p = ep(t, a, a + 0.18, ease.in), o = ep(t, b - 0.2, b, ease.in);
  e.style.display = t > a && t < b ? 'block' : 'none';
  e.style.opacity = Math.min(1, p * 1.5) * (1 - o) * 0.92;
  e.style.transform = `rotate(${rot}deg) scale(${lerp(2.2, 1, p)})`;
}

window.ready = () => { $('grain').style.background = `url(${grainURL(256, 0.08, 9)})`; arrows.forEach((a) => { a.L = a.p.getTotalLength(); a.p.setAttribute('stroke-dasharray', a.L); }); qPath._L = qPath.getTotalLength(); };
window.render = function (t) {
  if (!arrows[0].L) window.ready();
  cap(t);
  $('tc').textContent = 'T+' + t.toFixed(1).padStart(4, '0');
  // machines and callers draw in at the start
  machines.forEach((m, i) => { drawIn(m.r, ep(t, 0 + i * 0.1, 0.5 + i * 0.1)); m.tx.style.opacity = prog(t, 0.3 + i * 0.1, 0.5 + i * 0.1); m.r.setAttribute('stroke', i === 0 && t > B.crash && t < B.respawn ? '#E2501C' : i === 2 && t > B.respawn ? '#E2501C' : '#151413'); });
  dim.style.opacity = prog(t, 0.4, 0.8);
  callers.forEach((c, i) => { drawIn(c.r, ep(t, 0.1 + i * 0.1, 0.6 + i * 0.1)); c.r.setAttribute('stroke', t > B.hits[i] ? '#E2501C' : '#151413'); c.r.setAttribute('stroke-width', t > B.hits[i] ? 2.2 : 1.4); });
  // old service: there, crashes, erased
  const er = ep(t, B.gone - 0.1, B.gone + 0.25);
  svOld.style.opacity = 1 - er; svOld.style.transform = `translate(${t > B.crash && t < B.gone ? 2 * Math.sin(t * 70) : 0}px, 0)`;
  drawIn(svOldR, ep(t, 0.15, 0.55));
  ghost.style.opacity = t > B.gone ? 0.9 : 0; ghostT.style.opacity = t > 3.7 ? prog(t, 3.7, 3.9) : 0;
  ghost.setAttribute('stroke', t > B.hits[0] ? '#E2501C' : '#8b857b');
  // new service draws in on machine 3
  drawIn(svNewR, ep(t, B.respawn, B.respawn + 0.4));
  svNew.style.opacity = t > B.respawn ? 1 : 0; svNewT.style.opacity = prog(t, B.respawn + 0.25, B.respawn + 0.4);
  svNewIp.textContent = t > B.newip ? ipAt(t) : '';
  svNew.style.transformOrigin = '436px 473px'; svNew.style.transform = `scale(${1 + 0.08 * Math.exp(-Math.max(0, t - B.newip) * 8) * (t > B.newip ? 1 : 0) + (t > B.find ? 0.03 * Math.sin(t * 8) : 0)})`;
  sameNote.style.opacity = window01(t, B.same, 2.9, 0.12); sameNote.style.transform = `translateY(${(1 - ep(t, B.same, B.same + 0.2)) * 6}px)`;
  // calls before the crash: dots travel to payments
  arrows.forEach((a, i) => {
    const pre = t < B.crash + 0.2, post = t > B.calls;
    const p = pre ? ep(t, 0.3 + i * 0.12, 0.8 + i * 0.12) : post ? ep(t, B.calls + i * 0.15, B.calls + i * 0.15 + 0.4) : 0;
    a.p.setAttribute('stroke-dashoffset', a.L * (1 - p));
    a.p.style.opacity = pre ? 1 - ep(t, B.crash, B.crash + 0.2) : post ? 1 - 0.6 * ep(t, 7.1, 7.5) : 0;
    const red = t > B.hits[i]; a.p.setAttribute('stroke', red ? '#E2501C' : '#151413'); a.p.setAttribute('marker-end', red ? 'url(#ao)' : 'url(#ai)');
    // traveling dot
    const cyc = pre ? ((t - 0.8 - i * 0.2) % 0.9) / 0.9 : post ? prog(t, B.hits[i] - 0.55, B.hits[i]) : -1;
    const dv = (pre && t > 0.8) || (post && t < B.hits[i] && t > B.hits[i] - 0.55);
    if (dv && a.L) { const q = a.p.getPointAtLength(a.L * clamp(cyc)); dots[i].setAttribute('cx', q.x); dots[i].setAttribute('cy', q.y); dots[i].style.opacity = 1; } else dots[i].style.opacity = 0;
    const xe = xs[i], xp = ep(t, B.hits[i], B.hits[i] + 0.2, ease.back);
    xe.style.display = t > B.hits[i] ? '' : 'none'; xe.setAttribute('transform', `translate(${target.x + (i - 1) * 14 + (i - 1) * 6} ${target.y + 18 + i * 26}) scale(${xp})`);
    xe.style.opacity = 1 - 0.5 * ep(t, 7.1, 7.5);
  });
  // fields
  const st = $('st'), sv = t < B.crash ? 'running' : t < B.respawn ? 'RESTARTED' : 'running · moved';
  if (st._v !== sv) { st._v = sv; st.textContent = sv; st.style.color = t > B.crash && t < B.respawn ? '#E2501C' : ''; }
  $('ipOld').style.setProperty('--k', ep(t, B.newip - 0.15, B.newip + 0.1));
  const nv = t > B.newip ? ipAt(t) : ''; const ne = $('ipNew'); if (ne._v !== nv) { ne._v = nv; ne.textContent = nv; }
  // stamps
  stamp($('sRe'), t, B.crash, B.respawn + 0.2, -8);
  stamp($('sFail'), t, B.failed, 7.15, -6);
  // question
  qPath.setAttribute('stroke-dasharray', `5 5`); const qp = ep(t, B.q, B.q + 1.3, ease.inOut);
  if (qPath._L) { qPath.style.strokeDasharray = `${qPath._L * qp} ${qPath._L}`; }
  qPath.style.opacity = t > B.q ? 1 : 0;
  const qa = ep(t, B.find - 0.05, B.find + 0.25, ease.back); qMark.style.opacity = prog(t, B.find - 0.05, B.find + 0.05); qMark.setAttribute('transform', `translate(470 530) scale(${qa}) translate(-470 -530)`);
  qNote.style.opacity = prog(t, 7.6, 7.9);
  // camera: gentle push + thump on stamps
  const thump = 0.035 * Math.exp(-Math.max(0, t - B.crash) * 9) * (t > B.crash ? 1 : 0) + 0.05 * Math.exp(-Math.max(0, t - B.failed) * 9) * (t > B.failed ? 1 : 0);
  const sh = (t > B.failed && t < B.failed + 0.3 ? 5 * (1 - (t - B.failed) / 0.3) : 0);
  $('wrap').style.transform = `translate(${sh * Math.sin(t * 90)}px, ${sh * Math.cos(t * 70)}px) scale(${1.0 + 0.004 * t + thump})`;
  let fl = 0; for (const [t0, a] of [[B.crash, 0.12], [B.failed, 0.16]]) { const dt = t - t0; if (dt > 0 && dt < 0.4) fl = Math.max(fl, a * Math.exp(-dt * 10)); }
  $('flash').style.opacity = fl;
};
</script>
<script src="play.js"></script>
</body>
</html>
