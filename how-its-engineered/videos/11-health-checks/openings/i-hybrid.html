<!doctype html>

<meta charset="utf-8">
<!-- Opening variant I (hybrid): F's ember line-art world and kinetic type, plus G's explanation: the caller's code sits on top
     and a live wire runs from the address written in the code to the spot in the world it points at. The service moves, the wire doesn't. Hook C, first 10 s. -->
<link rel="stylesheet" href="fonts.css">
<style>
:root { --o: #FF6A1F; --o2: #FFB070; --w: #F2EEE8; --g: #77706A; }
html, body { margin: 0; background: #000; }
#stage { position: relative; width: 540px; height: 960px; overflow: hidden; background: #0b0a09; font-family: Inter, sans-serif; color: var(--w); }
#world, .layer { position: absolute; inset: 0; }
#cv { position: absolute; inset: 0; width: 540px; height: 960px; }
#fx { position: absolute; inset: 0; overflow: visible; }
#grain { position: absolute; inset: -40px; opacity: 0.55; mix-blend-mode: screen; pointer-events: none; }
#vig { position: absolute; inset: 0; background: radial-gradient(110% 75% at 50% 45%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.7) 100%); pointer-events: none; }
#flash { position: absolute; inset: 0; opacity: 0; background: var(--o); mix-blend-mode: screen; }
/* frame with corner ticks, like a viewport */
#frame { position: absolute; left: 14px; right: 14px; top: 112px; bottom: 46px; border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; pointer-events: none; }
#frame i { position: absolute; width: 10px; height: 10px; border-color: rgba(255,255,255,0.45); border-style: solid; }
#frame i:nth-child(1) { left: 8px; top: 8px; border-width: 1px 0 0 1px; } #frame i:nth-child(2) { right: 8px; top: 8px; border-width: 1px 1px 0 0; }
#frame i:nth-child(3) { left: 8px; bottom: 8px; border-width: 0 0 1px 1px; } #frame i:nth-child(4) { right: 8px; bottom: 8px; border-width: 0 1px 1px 0; }
.meta { position: absolute; font-family: Mono; font-size: 9px; letter-spacing: 1.4px; color: var(--g); }
.meta b { color: var(--o); font-weight: 600; }
/* terminal */
#term { position: absolute; left: 30px; top: 84px; width: 300px; font-family: Mono; font-size: 10.5px; line-height: 17px; color: #bdb5ad; white-space: pre; }
#term .p { color: var(--g); } #term .e { color: var(--o); } #term .cur { display: inline-block; width: 6px; height: 12px; background: var(--o); vertical-align: -2px; }
/* annotations */
.co { position: absolute; font-family: Mono; font-size: 9.5px; white-space: nowrap; color: #d9d2ca; display: flex; align-items: center; gap: 5px; letter-spacing: 0.4px; }
.co:before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--o); }
.lbl { position: absolute; transform: translate(-50%, -50%); font-family: Mono; font-weight: 600; font-size: 10px; letter-spacing: 1px; white-space: nowrap; padding: 2px 6px; border-radius: 3px; }
/* kinetic captions */
#kc { position: absolute; left: 30px; right: 24px; top: 588px; height: 230px; }
.ph { position: absolute; left: 0; top: 0; right: 0; display: none; }
.ph .sm { font-weight: 800; font-size: 34px; letter-spacing: -1px; line-height: 1.08; }
.ph .sm span { display: inline-block; margin-right: 9px; }
.ph .bg { font-weight: 900; font-size: 104px; letter-spacing: -5px; line-height: 0.95; margin-top: 4px; white-space: nowrap; position: relative; }
.ph .bg span { display: inline-block; color: var(--o); text-shadow: 0 0 24px rgba(255,106,31,0.55), 0 0 60px rgba(255,106,31,0.25); }
.ph .bg .gh { position: absolute; left: 0; top: 0; color: transparent; -webkit-text-stroke: 1px rgba(255,176,112,0.7); text-shadow: none; }
.ph .bg span.ol { color: transparent; -webkit-text-stroke: 1.2px rgba(255,176,112,0.55); text-shadow: none; }
.odo { display: inline-flex; font-family: Mono; font-weight: 800; font-size: 74px; line-height: 92px; height: 92px; overflow: hidden; letter-spacing: -2px; color: var(--o); text-shadow: 0 0 22px rgba(255,106,31,0.6); }
.odo .col { position: relative; width: 0.6em; height: 92px; overflow: hidden; } .odo .col.dot { width: 0.36em; }
.odo .st { position: absolute; left: 0; right: 0; top: 0; } .odo .st div { height: 92px; text-align: center; }
/* code card (replaces F's terminal) */
#ed { position: absolute; left: 26px; right: 26px; top: 148px; background: rgba(12,11,10,0.94); border: 1px solid rgba(255,106,31,0.32); border-radius: 10px; box-shadow: 0 14px 34px rgba(0,0,0,0.6); overflow: hidden; }
#ed .tb { height: 26px; display: flex; align-items: center; gap: 5px; padding: 0 10px; border-bottom: 1px solid rgba(255,255,255,0.06); font: 600 10px/1 Mono; color: #9c948c; letter-spacing: 0.5px; }
#ed .tb i { width: 7px; height: 7px; border-radius: 50%; background: #2c2925; display: inline-block; }
#ed .tb .fn { margin-left: 8px; color: #d9d2ca; } #ed .tb .fn b { color: var(--o); font-weight: 600; }
#ed .tb .st { margin-left: auto; letter-spacing: 1.2px; }
#code { padding: 6px 0 8px; font: 600 13.5px/26px Mono; color: #d9d2ca; }
.ln { position: relative; height: 26px; padding-left: 36px; white-space: pre; }
.ln .n { position: absolute; left: 0; width: 22px; text-align: right; color: #3d3833; font-weight: 400; }
.ln.run { background: rgba(255,176,112,0.06); } .ln.bad { background: rgba(255,106,31,0.13); }
.c { color: #6b645e; font-weight: 400; } .k { color: #9c948c; } .s { color: var(--o2); }
#ipCode { position: relative; display: inline-block; }
#ipBox { position: absolute; left: -4px; right: -4px; top: 2px; bottom: 2px; border: 1.5px solid var(--o); border-radius: 4px; box-shadow: 0 0 12px rgba(255,106,31,0.6); opacity: 0; }
#res { margin-left: 8px; font-weight: 800; font-size: 11px; color: var(--o); }
#icur { display: inline-block; width: 8px; height: 16px; background: var(--o); vertical-align: -3px; }
#neq { position: absolute; font: 800 10.5px/1 Mono; letter-spacing: 0.4px; color: #0b0a09; background: var(--o2); border-radius: 4px; padding: 5px 7px; white-space: nowrap; opacity: 0; transform-origin: 0 50%; }
#wires { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
#lesson { position: absolute; left: 50%; top: 286px; transform: translateX(-50%); white-space: nowrap; font: 700 13px/1 Inter; color: var(--w); background: rgba(12,11,10,0.9); border: 1px solid rgba(255,106,31,0.4); border-radius: 30px; padding: 9px 15px; opacity: 0; }
#lesson b { font: 800 9.5px/1 Mono; letter-spacing: 1.4px; color: var(--o); margin-right: 8px; }
#lesson em { font-family: Instrument; font-style: italic; font-weight: 400; font-size: 17px; color: var(--o2); }
#cursor { position: absolute; left: 0; top: 0; width: 18px; height: 24px; display: none; }
</style>

<body>
<div id="stage">
  <div id="world">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <svg id="fx" width="540" height="960" viewBox="0 0 540 960"></svg>
    <div class="layer" id="lbls"></div>
  </div>
  <div id="vig"></div>
  <div class="layer" id="cards"></div>
  <div class="layer" id="kin"></div>
  <div id="frame"><i></i><i></i><i></i><i></i></div>
  <div class="meta" style="left:30px;top:126px">// 10 — <b>service discovery</b></div>
  <div class="meta" style="right:30px;top:126px">HOW.ITS.ENGINEERED</div>
  <div class="meta" id="tc" style="left:30px;bottom:60px">T+00.00s</div>
  <div class="meta" style="right:30px;bottom:60px">SYSTEM DESIGN · <b>10</b></div>
  <svg id="wires" width="540" height="960" viewBox="0 0 540 960"></svg>
  <div id="ed">
    <div class="tb"><i></i><i></i><i></i><span class="fn"><b>orders</b>/checkout.js</span><span class="st" id="edst">● LIVE</span></div>
    <div id="code">
      <div class="ln"><span class="n">1</span><span class="c">// orders calls the payments service</span></div>
      <div class="ln"><span class="n">2</span><span class="k">const PAY =</span> <span class="s">"<span id="ipCode"><span id="ipTxt">10.0.0.7</span><span id="ipBox"></span></span>:8080"</span></div>
      <div class="ln" id="l3"><span class="n">3</span><span class="k">await fetch(PAY + </span><span class="s">"/charge"</span><span class="k">)</span><span id="res"></span></div>
    </div>
  </div>
  <div id="neq">≠ it's at 10.0.4.23 now</div>
  <div id="lesson"><b>LESSON</b>addresses <em>change.</em> the code <em>doesn't.</em></div>
  <div id="kc"></div>
  <div id="flash"></div>
  <div id="grain"></div>
</div>
<script src="../../../tools/lib.js"></script>
<script src="hook.js"></script>
<script src="engine.js"></script>
<script>
const O = hex('#FF6A1F'), O2 = hex('#FFB070'), W = [242, 238, 232], GR = [119, 112, 106], INK = [14, 13, 12];
const NX = [-50, 70, 190], NY = 200, NW = 100, NDp = 64, NH = 24;
const OLD = [NX[0] - 24, NY, NH], NEW = [NX[2] + 24, NY, NH];
const CALLERS = [{ n: 'cart', x: -40, y: -40 }, { n: 'orders', x: 70, y: -60 }, { n: 'login', x: 180, y: -40 }];
const SHOTS = [
  { t: 0, d: 0, f: [-40, 180, 30], s: 2.9, a: 0.5, e: 0.5, sy: 455 },
  { t: 0.1, d: 1.6, s: 2.55, a: 0.42 },
  { t: 1.75, d: 0.55, f: [200, 190, 30], s: 2.6 },
  { t: 2.8, d: 0.35, s: 2.95 },
  { t: 4.05, d: 0.7, f: [60, 100, 30], s: 1.05, a: 0.4, e: 0.6, sy: 480 },
  { t: 5.8, d: 0.15, s: 1.13 },
  { t: 7.0, d: 2.6, f: [90, 110, 30], s: 0.98, a: 0.62, e: 0.95, sy: 460 },
];
const KICKS = [[B.crash, 0.09], [B.respawn + 0.3, 0.04], [B.newip, 0.05], [B.hits[0], 0.03], [B.hits[1], 0.03], [B.hits[2], 0.03], [B.failed, 0.08]];
const SHAKES = [[B.crash, 8, 0.5], [B.failed, 7, 0.45]];

// line-art box: near-black faces (so hidden lines vanish), coloured edges
function wbox(x, y, z, w, d, h, edge, o = {}) {
  box(x, y, z, w, d, h, o.fill || INK, { op: o.op, edge: rgba(edge, 1, o.ea ?? 0.9), lw: o.lw || 1, gl: o.glow ? [rgba(edge, 1, o.glow), 14] : null, front: o.front, side: o.side, top: o.top, dz: o.dz });
}
function machine(i, t, hot) {
  const e = mixc(GR, O, hot);
  wbox(NX[i], NY, 0, NW, NDp, NH, mixc([150, 144, 138], O, hot), { ea: 0.75, glow: hot * 0.8,
    front: (F, w, h) => { ftext(F, 8, h / 2, 'machine-' + (i + 1), 5, rgba(e, 1.4, 0.95), 'Mono', 600, 'left'); for (let k = 0; k < 5; k++) fquad(F, w - 36 + k * 6, h / 2 - 1, w - 33 + k * 6, h / 2 + 1, rgba(rnd(i * 5 + k, Math.floor(t * 6)) > 0.4 ? O : GR, 1, 0.9)); },
    side: (F, w, h) => { for (let k = 0; k < 6; k++) fquad(F, 8 + k * 9, 6, 9 + k * 9, h - 6, rgba(GR, 1, 0.6)); },
    top: (F, w, d) => { for (const u of [w / 2 - 24, w / 2 + 24]) fpath(F, [[u - 20, d / 2 - 12], [u + 20, d / 2 - 12], [u + 20, d / 2 + 12], [u - 20, d / 2 + 12], [u - 20, d / 2 - 12]], rgba(GR, 1, 0.45), 0.4); } });
}
function service(x, y, z, o = {}) {
  const c = o.col || O, op = o.op ?? 1, fl = o.fl || 0;
  if (op <= 0.01) return;
  wbox(x, y, z, 40, 24, 22, mixc(c, [255, 255, 255], fl * 0.6), { op, lw: 1.3, glow: 0.7 + fl, fill: mixc(INK, c, 0.12 + fl * 0.3),
    front: (F, w, h) => { for (let u = 4; u < w - 3; u += 5) fpath(F, [[u, 3], [u, h - 3]], rgba(c, 1, 0.45), 0.35); ftext(F, w / 2, h / 2, o.dead ? '✕' : 'payments', 4.2, rgba(c, 1.5), 'Mono', 700); },
    side: (F, w, h) => { for (let u = 4; u < w - 3; u += 5) fpath(F, [[u, 3], [u, h - 3]], rgba(c, 1, 0.4), 0.35); } });
}
function caller(i, t, failA) {
  const C = CALLERS[i], c = mixc([220, 214, 206], O, failA), bl = failA > 0.5 ? (Math.sin(t * 18 + i) > 0 ? 1 : 0.55) : 1;
  wbox(C.x, C.y, 0, 58, 36, 18, c, { op: 0.25 + 0.75 * ep(t, 3.9, 4.4), ea: 0.85 * bl, glow: failA * 0.7 * bl, lw: 1.1,
    front: (F, w, h) => ftext(F, w / 2, h / 2, C.n, 5.6, rgba(c, 1.3, bl), 'Mono', 700) });
}
const failAt = (i, t) => ep(t, B.hits[i], B.hits[i] + 0.12);

// blueprint floor: fine grid, major lines, axis ticks
function floorGrid(t) {
  add(0, 1e7, () => {
    const X0 = -400, X1 = 520, Y0 = -260, Y1 = 520;
    g.save(); g.lineWidth = 0.6;
    for (let x = X0; x <= X1; x += 20) { const maj = x % 100 === 0; g.strokeStyle = `rgba(255,240,225,${maj ? 0.09 : 0.035})`; g.beginPath(); g.moveTo(...P(x, Y0, 0)); g.lineTo(...P(x, Y1, 0)); g.stroke(); }
    for (let y = Y0; y <= Y1; y += 20) { const maj = y % 100 === 0; g.strokeStyle = `rgba(255,240,225,${maj ? 0.09 : 0.035})`; g.beginPath(); g.moveTo(...P(X0, y, 0)); g.lineTo(...P(X1, y, 0)); g.stroke(); }
    // axes
    g.strokeStyle = 'rgba(255,106,31,0.35)'; g.lineWidth = 0.9;
    g.beginPath(); g.moveTo(...P(X0, 120, 0)); g.lineTo(...P(X1, 120, 0)); g.stroke();
    g.font = '600 7px Mono'; g.fillStyle = 'rgba(200,190,180,0.45)'; g.textAlign = 'center';
    for (let x = -300; x <= 500; x += 100) { const p = P(x, 120, 0); g.fillText(String(x), p[0], p[1] + 10); g.fillRect(p[0] - 0.5, p[1] - 3, 1, 6); }
    g.restore();
  });
}
function bg(t) {
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.fillStyle = '#0b0a09'; g.fillRect(0, 0, 540, 960);
  g.save(); g.globalCompositeOperation = 'lighter';
  const heat = 0.5 + 0.8 * window01(t, B.crash, B.respawn, 0.2) + 0.7 * window01(t, B.failed, 7.2, 0.25);
  const rg = g.createRadialGradient(270, 330, 0, 270, 330, 420); rg.addColorStop(0, `rgba(255,106,31,${0.07 * heat})`); rg.addColorStop(1, 'rgba(255,106,31,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 540, 960);
  // drifting dust
  for (let i = 0; i < 50; i++) { const x = (rnd(i, 9) * 540 + t * (4 + rnd(i, 3) * 8)) % 540, y = (rnd(i, 8) * 960 - t * (3 + rnd(i, 2) * 6) + 3840) % 960; g.fillStyle = `rgba(255,200,160,${0.05 + rnd(i, 7) * 0.12})`; g.fillRect(x, y, 1.2, 1.2); }
  g.restore();
}
// orange spark shower (longer, brighter than the house sparks)
function shower(t, t0, x, y, z, n, seed, spd = 170, life = 0.9) {
  const dt = t - t0; if (dt <= 0 || dt > life) return;
  add(3, 0, () => {
    g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const th = rnd(i, seed) * Math.PI * 2, up = 0.4 + rnd(i, seed + 1) * 1.0, v = spd * (0.4 + rnd(i, seed + 2) * 0.9);
      const pos = (d) => P(x + Math.cos(th) * v * d, y + Math.sin(th) * v * d, Math.max(0, z + up * v * d - 300 * d * d));
      const a = pos(dt), b = pos(Math.max(0, dt - 0.03)), k = 1 - dt / life;
      g.strokeStyle = rgba(mixc(O, [255, 240, 200], rnd(i, seed + 3)), 1.2, k); g.lineWidth = (0.8 + 1.2 * k) * Math.min(1.6, cam.s * 0.6);
      g.beginPath(); g.moveTo(...b); g.lineTo(...a); g.stroke();
    }
    g.restore();
  });
}
function beam(pts, col, a, lw = 1.1) {
  if (a <= 0.01 || pts.length < 2) return;
  add(0, 1e6 - 3, () => {
    const q = pts.map((p) => P(p[0], p[1], 0.5));
    g.save(); g.globalCompositeOperation = 'lighter'; g.setLineDash([3 * cam.s, 4 * cam.s]); g.lineDashOffset = -t_ * 30 * cam.s;
    g.strokeStyle = rgba(col, 1, 0.8 * a); g.lineWidth = lw * cam.s; glow(rgba(col), 6);
    g.beginPath(); q.forEach((p, i) => (i ? g.lineTo(...p) : g.moveTo(...p))); g.stroke(); g.restore();
  });
}
function spark(p, a = 1, r = 3) { // a request: small hot dot with a tail
  if (a <= 0.01) return;
  add(1, D(...p) - 6, () => { const c = P(...p), R = r * cam.s * 0.6; g.save(); g.globalCompositeOperation = 'lighter'; const rg = g.createRadialGradient(c[0], c[1], 0, c[0], c[1], R * 4); rg.addColorStop(0, `rgba(255,220,180,${a})`); rg.addColorStop(0.3, `rgba(255,106,31,${0.6 * a})`); rg.addColorStop(1, 'rgba(255,106,31,0)'); g.fillStyle = rg; g.beginPath(); g.arc(c[0], c[1], R * 4, 0, Math.PI * 2); g.fill(); g.restore(); });
}

/* ---------------- code card + wires: the address in the code is wired to where it points */
const WS = $('wires');
const mkP = (o) => el('path', { fill: 'none', 'stroke-linecap': 'round', ...o }, WS);
const wGlow = mkP({ stroke: '#FF6A1F', 'stroke-width': 5, opacity: 0, style: 'filter: blur(4px)' });
const wire = mkP({ stroke: '#FF6A1F', 'stroke-width': 1.5, 'stroke-dasharray': '5 5' });
const wNew = mkP({ stroke: '#FFB070', 'stroke-width': 1.3, 'stroke-dasharray': '2 5' });
const wEnd = el('circle', { r: 3.5, fill: '#FF6A1F' }, WS), wEnd2 = el('circle', { r: 3, fill: '#FFB070' }, WS);
function offs(e) { let x = 0, y = 0; while (e && e.id !== 'stage') { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { x, y }; }
function curve(p, q) { const my = Math.min(p[1], q[1]) + Math.abs(q[1] - p[1]) * 0.55; return `M ${p[0]} ${p[1]} C ${p[0]} ${my}, ${q[0]} ${my - 30}, ${q[0]} ${q[1]}`; }
function ed(t) {
  const ein = ep(t, 0, 0.4); $('ed').style.opacity = ein; $('ed').style.transform = `translateY(${(1 - ein) * -16}px)`;
  const nh = B.hits.filter((h) => t >= h).length;
  $('l3').className = 'ln' + (t > B.calls && t < B.q ? (nh ? ' bad' : ' run') : '');
  $('res').textContent = t > B.calls && t < B.q ? (nh ? `✕ ECONNREFUSED ${nh}/3` : '⟳ calling…') : '';
  $('res').style.color = nh ? '' : '#FFB070';
  $('edst').textContent = t > B.q ? '● ?' : nh ? '● ERRORS' : t >= B.crash && t < B.respawn ? '● 503' : '● LIVE';
  $('edst').style.color = nh || (t >= B.crash && t < B.respawn) ? '#FF6A1F' : '';
  $('ed').style.borderColor = nh && t < B.failed + 0.8 ? `rgba(255,106,31,${0.4 + 0.6 * Math.exp(-(t - B.hits[nh - 1]) * 5)})` : '';
  $('ipBox').style.opacity = t > B.calls - 0.1 ? (t < B.q ? 1 : 0.5 + 0.5 * (Math.floor(t * 3) % 2)) : 0;
  if (t < B.q + 0.2) $('ipTxt').textContent = OLD_IP; else $('ipTxt').innerHTML = Math.floor(t * 2.5) % 2 ? '<span id="icur"></span>' : '?';
  // wire: from the address in the code to the old spot in the world
  const ip = $('ipCode'), o = offs(ip), from = [o.x + ip.offsetWidth / 2, o.y + 24];
  const to = P(OLD[0], OLD[1], OLD[2] + 24);
  const wa = ep(t, 0.3, 0.8) * (1 - ep(t, B.q - 0.1, B.q + 0.1)) * 1;
  const d = curve(from, to);
  [wire, wGlow].forEach((w) => w.setAttribute('d', d));
  wire.setAttribute('opacity', wa); wGlow.setAttribute('opacity', wa * (0.25 + 0.5 * Math.max(0, ...B.hits.map((h) => (t >= h ? Math.exp(-(t - h) * 5) : 0)))));
  wire.setAttribute('stroke-dashoffset', -t * 22);
  wEnd.setAttribute('cx', to[0]); wEnd.setAttribute('cy', to[1]); wEnd.setAttribute('opacity', wa * (t > B.gone ? 0.5 + 0.5 * Math.sin(t * 12) : 1));
  // second wire: where payments really is now
  const nq = $('neq'), na = ep(t, B.ipDone + 0.05, B.ipDone + 0.3, ease.back) * (1 - ep(t, B.q - 0.1, B.q + 0.15)) * 1;
  nq.style.left = (o.x + ip.offsetWidth + 50) + 'px'; nq.style.top = (o.y + 4) + 'px'; nq.style.opacity = na; nq.style.transform = `scale(${0.6 + 0.4 * na})`;
  const f2 = [o.x + ip.offsetWidth + 50 + nq.offsetWidth / 2, o.y + 24], to2 = P(NEW[0], NEW[1], NEW[2] + 24);
  wNew.setAttribute('d', curve(f2, to2)); wNew.setAttribute('opacity', na * 0.9); wNew.setAttribute('stroke-dashoffset', -t * 16);
  wEnd2.setAttribute('cx', to2[0]); wEnd2.setAttribute('cy', to2[1]); wEnd2.setAttribute('opacity', na);
  const ls = ep(t, B.q + 0.45, B.q + 0.8, ease.back); $('lesson').style.opacity = ls; $('lesson').style.transform = `translateX(-50%) translateY(${(1 - ls) * 10}px)`;
}

/* ---------------- kinetic captions: white lead-in, giant orange key word */
