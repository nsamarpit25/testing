<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 11 Health Checks, design v2: flat cartoon scenes, a new set of objects per beat (night house cut-away, mousetrap,
     frozen phone + sleeping watchdog, hospital bed + nurse, phone calls + defibrillator, shop street, Kubernetes YAML).
     The app is a little robot. Times come from voice/words.json. Old design: video-v1-diorama.html. -->
<link rel="stylesheet" href="openings/fonts.css">
<style>
html, body { margin: 0; background: #000; }
#stage { position: relative; width: 540px; height: 960px; overflow: hidden; background: #FFF1DC; font-family: Inter, sans-serif; color: #1B1530; }
#cv { position: absolute; inset: 0; width: 540px; height: 960px; }
#grain { position: absolute; inset: -40px; opacity: 0.22; mix-blend-mode: overlay; pointer-events: none; }
#flash { position: absolute; inset: 0; opacity: 0; background: #fff; pointer-events: none; }
/* captions: one plain line at the bottom, a few key words coloured */
#cap { position: absolute; left: 24px; right: 24px; top: 742px; height: 40px; pointer-events: none; }
#cap .box { display: none; position: absolute; inset: 0; justify-content: center; align-items: center; white-space: nowrap; font-weight: 800; font-size: 23px; line-height: 1; letter-spacing: -0.4px; }
#cap .w { display: inline-block; margin: 0 4px; color: #fff; -webkit-text-stroke: 4.5px #1B1530; paint-order: stroke fill; text-shadow: 0 3px 0 #1B1530; }
/* profile card (ending) */
#prof { position: absolute; left: 44px; top: 262px; width: 452px; display: none; background: #fff; border: 3px solid #1B1530; border-radius: 18px; box-shadow: 0 7px 0 #1B1530; font-family: Inter; overflow: hidden; box-sizing: border-box; }
#prof .top { display: flex; align-items: center; gap: 12px; padding: 16px 16px 12px; }
#prof .ring { width: 56px; height: 56px; border-radius: 50%; padding: 3px; box-sizing: border-box; flex: none; background: conic-gradient(#FF7A59, #FFC94A, #3DDC97, #4C7DFF, #FF7A59); }
#prof .ring div { width: 100%; height: 100%; border-radius: 50%; background: #1B1530; display: flex; align-items: center; justify-content: center; font: 800 16px/1 Mono; color: #fff; }
#fb { width: 104px; height: 38px; border-radius: 12px; background: #FF7A59; color: #1B1530; border: 3px solid #1B1530; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font: 900 14px/1 Inter; flex: none; box-shadow: 0 3px 0 #1B1530; }
#prof .tiles { display: flex; gap: 8px; padding: 0 16px 16px; }
#prof .tile { position: relative; flex: 1; height: 150px; border-radius: 12px; border: 3px solid #1B1530; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
#prof .tile .n { font: 800 34px/1 Mono; color: rgba(27,21,48,0.35); }
#prof .tile .t { font: 900 11px/1.3 Inter; letter-spacing: 0.8px; color: #1B1530; text-align: center; }
#watch { position: absolute; display: none; font: 900 12px/1 Inter; letter-spacing: 0.6px; padding: 8px 12px; border-radius: 10px; background: #FFC94A; color: #1B1530; border: 3px solid #1B1530; box-shadow: 0 3px 0 #1B1530; white-space: nowrap; }
#cursor { position: absolute; left: 0; top: 0; width: 22px; height: 28px; display: none; pointer-events: none; filter: drop-shadow(0 3px 0 rgba(27,21,48,0.5)); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div id="prof">
    <div class="top"><div class="ring"><div>{ }</div></div><div style="flex:1;min-width:0"><div style="font-weight:900;font-size:16px">@how.its.engineered</div><div style="color:#6E6890;font-size:11.5px;margin-top:3px;font-weight:600">System design, one reel at a time</div></div><div id="fb">Follow</div></div>
    <div class="tiles"><div class="tile" id="t0" style="background:#A9D4FF"><div class="n">10</div><div class="t">SERVICE<br>DISCOVERY</div></div><div class="tile" id="t1" style="background:#FFC94A"><div class="n">09</div><div class="t">KUBERNETES</div></div><div class="tile" id="t2" style="background:#BDF2CF"><div class="n">08</div><div class="t">DOCKER</div></div></div>
  </div>
  <div id="watch">▶ WATCH THIS FIRST</div>
  <div id="cap"></div>
  <svg id="cursor" viewBox="0 0 22 28"><path d="M2 2 L2 22 L7.5 17 L11 25 L14.5 23.5 L11 15.5 L18.5 15.5 Z" fill="#fff" stroke="#1B1530" stroke-width="2" stroke-linejoin="round"/></svg>
  <div id="flash"></div>
  <div id="grain"></div>
</div>
<script src="../../tools/lib.js"></script>
<script src="voice/timings.js"></script>
<script>
const DURATION = 50.6;
window.DURATION = DURATION;
const WORDS = window.WORDS;

/* ---------------- small helpers */
const $ = (id) => document.getElementById(id);
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, k = 1, a = 1) => `rgba(${Math.min(255, c[0] * k) | 0},${Math.min(255, c[1] * k) | 0},${Math.min(255, c[2] * k) | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const mixH = (a, b, k) => rgba(mixc(hex(a), hex(b), clamp(k)));
const rnd = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
const pulse = (t, t0, k = 3) => (t > t0 ? Math.exp(-(t - t0) * k) : 0);
function div(parent, cls, html, style) { const d = document.createElement('div'); if (cls) d.className = cls; if (html != null) d.innerHTML = html; if (style) d.style.cssText = style; parent.appendChild(d); return d; }
function vis(elm, a, extra = '') { elm.style.display = a > 0.001 ? '' : 'none'; elm.style.opacity = a; if (extra !== null) elm.style.transform = extra; }
const popIn = (t, a, b, d = 0.3) => { const i = ease.back(prog(t, a, a + d)), o = ep(t, b - 0.22, b, ease.in); return { a: t < a ? 0 : Math.min(1, prog(t, a, a + 0.12)) * (1 - o), s: t < a ? 0.8 : lerp(0.8, 1, i) - o * 0.06, y: (1 - Math.min(1, i)) * 12 + o * -8 }; };
// pop-in scale (overshoots), and pop-in that also leaves at b
const pin = (t, a, d = 0.35) => (t < a ? 0 : ease.back(prog(t, a, a + d)));
const win = (t, a, b, d = 0.35) => (t < a || t > b ? 0 : pin(t, a, d) * (1 - ep(t, b - 0.2, b, ease.in)));

const cv = $('cv'), g = cv.getContext('2d');
let t_ = 0;
const INK = '#1B1530', SKIN = '#FFD3B0', CORAL = '#FF7A59', MINT = '#3DDC97', RED = '#FF4D5E', YEL = '#FFC94A', BLUE = '#4C7DFF', ICE = '#A8DDFF', PURP = '#8B6CFF', SCR = '#2A2350', EYE = '#7CF2C9';

/* ---------------- beats (seconds, from voice/words.json) */
const T = {
  froze: 0.6, am: 1.22, still: 2.14, running: 2.34, not: 3.0, anyone: 3.6, and: 4.66, restarted: 5.14, before: 5.94, woke: 6.5, how: 7.34, know: 7.66,
  trap: 8.66, running2: 9.42, same: 10.14, working: 10.48, frozen: 11.38, looks: 12.18, alive: 12.5, nothing: 13.32, crashed: 13.48, nothing2: 14.3, restarts: 14.74,
  fix: 16.02, keep: 16.66, asking: 16.82, areYou: 17.64, okay: 17.94, like: 18.56, nurse: 18.86, pulse: 19.44, thats: 19.94, hc: 20.3,
  c1: 21.28, alive2: 22.02, every: 22.86, calls: 23.8, page: 24.52, three: 25.28, misses: 25.42, row: 25.94, restartsApp: 26.44,
  c2: 27.18, ready: 28.64, copy: 29.32, starting: 30.1, says: 30.68, notYet: 31.2, traffic: 31.86, skips: 32.06, untilIs: 32.92, shop: 33.6, closed: 33.94,
  so: 34.9, freeze: 35.82, threeM: 36.54, pulses: 36.9, oneR: 37.62, back: 38.68, woke2: 39.58,
  k8s: 40.66, liveness: 41.66, readiness: 42.36, probes: 42.68, few: 43.58, config: 44.14,
  newTo: 44.94, k8s2: 45.16, profile: 46.8, follow: 47.56, series: 48.34,
};
const READY3 = T.closed + 0.45;            // copy 3 finishes starting up
// when the app is frozen: [freeze, restart]
const FZ = [[T.froze, T.restarted], [25.02, T.restartsApp], [T.freeze, T.oneR]];
const iceAt = (t) => { for (const [a, r] of FZ) if (t >= a && t < r) return ep(t, a, a + 0.3); return 0; };
const fzIdx = (t) => FZ.findIndex(([a, r]) => t >= a + 0.15 && t < r);

/* ---------------- drawing kit: flat shapes with a thick ink outline */
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
function shape(fill, lw = 3, stroke = INK) { if (fill) { g.fillStyle = fill; g.fill(); } if (lw) { g.lineWidth = lw; g.strokeStyle = stroke; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); } }
function R(x, y, w, h, r, fill, lw = 3, stroke = INK, sh = 0) { if (sh) { rr(x, y + sh, w, h, r); g.fillStyle = 'rgba(27,21,48,0.25)'; g.fill(); } rr(x, y, w, h, r); shape(fill, lw, stroke); }
function C(x, y, r, fill, lw = 3, stroke = INK) { g.beginPath(); g.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); shape(fill, lw, stroke); }
function L(pts, col = INK, lw = 3) { g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(); }
function poly(pts, fill, lw = 3, stroke = INK) { g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); shape(fill, lw, stroke); }
function TX(s, x, y, size, col = INK, w = 800, align = 'center', font = 'Inter') { g.font = `${w} ${size}px ${font}`; g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = col; g.fillText(s, x, y); }
function TXo(s, x, y, size, col, w = 900, align = 'center', font = 'Inter', olw = 6) { g.font = `${w} ${size}px ${font}`; g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.lineWidth = olw; g.strokeStyle = INK; g.strokeText(s, x, y); g.fillStyle = col; g.fillText(s, x, y); }
function push(x, y, s = 1, rot = 0) { g.save(); g.translate(x, y); if (rot) g.rotate(rot); if (s !== 1) g.scale(s, s); }
const pop = () => g.restore();
const arcP = (a, b, q, h) => [lerp(a[0], b[0], q), lerp(a[1], b[1], q) - h * 4 * q * (1 - q)];

function heart(x, y, r, col, lw = 2.5) { g.beginPath(); g.moveTo(x, y + r * 0.9); g.bezierCurveTo(x - r * 1.7, y - r * 0.2, x - r * 0.6, y - r * 1.4, x, y - r * 0.45); g.bezierCurveTo(x + r * 0.6, y - r * 1.4, x + r * 1.7, y - r * 0.2, x, y + r * 0.9); g.closePath(); shape(col, lw); }
function star4(x, y, r, col = YEL) { const k = 0.3; poly([[x, y - r], [x + r * k, y - r * k], [x + r, y], [x + r * k, y + r * k], [x, y + r], [x - r * k, y + r * k], [x - r, y], [x - r * k, y - r * k]], col, 2.5); }
function check(x, y, s, col = MINT, lw = 5) { const p = [[x - 8 * s, y], [x - 2 * s, y + 6 * s], [x + 9 * s, y - 7 * s]]; L(p, INK, lw + 4); L(p, col, lw); }
function cross(x, y, s, col = RED, lw = 5) { const a = [[x - 8 * s, y - 8 * s], [x + 8 * s, y + 8 * s]], b = [[x + 8 * s, y - 8 * s], [x - 8 * s, y + 8 * s]]; L(a, INK, lw + 4); L(b, INK, lw + 4); L(a, col, lw); L(b, col, lw); }
function cog(x, y, r, n, ang, fill) { const pts = []; for (let k = 0; k < n * 4; k++) { const a = ang + (k / (n * 4)) * Math.PI * 2, q = (k % 4 === 1 || k % 4 === 2) ? r : r * 0.78; pts.push([x + Math.cos(a) * q, y + Math.sin(a) * q]); } poly(pts, fill, 3.5); C(x, y, r * 0.32, '#fff', 3.5); }

// a speech bubble whose tail tip is at (x, y)
function bubble(x, y, text, s, o = {}) {
  if (s <= 0.01) return;
  const size = o.size || 16; g.font = `${o.w || 800} ${size}px ${o.font || 'Inter'}`;
  const tw = g.measureText(text).width + size * 1.4, th = size * 2.1, ox = o.ox || 0, fill = o.fill || '#fff';
  push(x, y, s);
  const by = -th - 12;
  poly([[-8, by + th - 2], [0, 0], [8, by + th - 2]], fill, 3);
  R(ox - tw / 2, by, tw, th, th / 2, fill, 3, INK, 4);
  poly([[-5.5, by + th - 4], [0, -4], [5.5, by + th - 4]], fill, 0);
  TX(text, ox, by + th / 2 + 1, size, o.col || INK, o.w || 800, 'center', o.font || 'Inter');
  pop();
}
// a label pill centred at (x, y)
function pill(x, y, text, s, o = {}) {
  if (s <= 0.01) return;
  const size = o.size || 13, font = o.mono ? 'Mono' : 'Inter'; g.font = `800 ${size}px ${font}`;
  const dot = o.dot ? size * 1.1 : 0, w = g.measureText(text).width + size * 1.5 + dot, h = size * 2.05;
  push(x, y, s, o.rot || 0);
  R(-w / 2, -h / 2, w, h, h / 2, o.bg || '#fff', 3, INK, o.sh ?? 3);
  if (o.dot) C(-w / 2 + size * 0.95, 0, size * 0.32, o.dot, 2);
  TX(text, dot / 2, 1, size, o.col || INK, 800, 'center', font);
  pop();
}
function leader(x0, y0, x1, y1, a) { if (a <= 0.01) return; g.save(); g.globalAlpha = Math.min(1, a); g.setLineDash([5, 5]); L([[x0, y0], [x1, y1]], '#fff', 2.5); g.setLineDash([]); C(x1, y1, 4.5, '#fff', 2.5); g.restore(); }

/* ---------------- the app: a little robot with a screen for a face */
function bot(x, y, s, o = {}) {
  const ice = o.ice || 0, face = o.face || (ice > 0.5 ? 'frozen' : 'ok'), t = t_;
  push(x, y, s, o.rot || 0);
  const sq = o.sq || 0; g.scale(1 + sq * 0.1, 1 - sq * 0.1);
  const body = o.dead ? '#B9B4C9' : mixH(o.col || CORAL, '#9CCBEB', ice * 0.75);
  // feet
  R(-34, -13, 26, 14, 7, INK, 0); R(8, -13, 26, 14, 7, INK, 0);
  // arms
  push(-46, -50, 1, -0.5 - (o.armL || 0)); R(-24, -7, 28, 14, 7, body, 3); pop();
  push(46, -50, 1, 0.5 + (o.armR || 0) * -1.6); R(-4, -7, 28, 14, 7, body, 3); pop();
  // antenna: its light says "running"
  L([[0, -96], [0, -114]], INK, 4);
  const on = !o.dead && (Math.floor(t * 2.6) % 2 === 0);
  if (on && !o.noGlow) C(0, -120, 15, 'rgba(61,220,151,0.3)', 0);
  C(0, -120, 7.5, o.dead ? '#77728C' : on ? MINT : '#1F9E66', 3);
  // body + screen
  R(-50, -98, 100, 88, 26, body, 3.5, INK, 6);
  R(-38, -88, 76, 54, 16, SCR, 3);
  const ex = 15, ey = -63, blink = (((t * 0.33 + (o.seed || 0)) % 1) < 0.04) ? 0.15 : 1;
  if (face === 'ok') {
    R(-ex - 5, ey - 8 * blink, 10, 16 * blink, 5, EYE, 0); R(ex - 5, ey - 8 * blink, 10, 16 * blink, 5, EYE, 0);
    g.beginPath(); g.arc(0, -52, 7, 0.15 * Math.PI, 0.85 * Math.PI); g.strokeStyle = EYE; g.lineWidth = 3; g.lineCap = 'round'; g.stroke();
  } else if (face === 'load') {
    for (let k = 0; k < 3; k++) C(-12 + k * 12, -68, 3.6 * (0.6 + 0.4 * Math.max(0, Math.sin(t * 7 - k))), EYE, 0);
    R(-26, -50, 52, 8, 4, '#4A4380', 0); R(-26, -50, Math.max(8, 52 * clamp(o.load ?? 0.5)), 8, 4, YEL, 0);
  } else if (face === 'happy') {
    L([[-ex - 6, ey + 3], [-ex, ey - 5], [-ex + 6, ey + 3]], EYE, 3.5); L([[ex - 6, ey + 3], [ex, ey - 5], [ex + 6, ey + 3]], EYE, 3.5);
    g.beginPath(); g.moveTo(-10, -51); g.quadraticCurveTo(0, -38, 10, -51); g.closePath(); g.fillStyle = EYE; g.fill();
  } else if (face === 'frozen') {
    C(-ex, ey, 8, '#E8F6FF', 0); C(ex, ey, 8, '#E8F6FF', 0); C(-ex + 1, ey + 1, 2.6, SCR, 0); C(ex + 1, ey + 1, 2.6, SCR, 0);
    L([[-9, -47], [-4, -50], [0, -47], [4, -50], [9, -47]], '#E8F6FF', 2.5);
  } else if (face === 'dead') {
    for (const sx of [-ex, ex]) { L([[sx - 6, ey - 6], [sx + 6, ey + 6]], RED, 3.5); L([[sx + 6, ey - 6], [sx - 6, ey + 6]], RED, 3.5); }
  }
  TX(o.name || 'app', 0, -21, 12, 'rgba(27,21,48,0.55)', 900);
  // ice block
  if (ice > 0.01) {
    g.globalAlpha = ice;
    R(-66, -138, 132, 140, 18, 'rgba(178,226,255,0.55)', 3.5, '#3E86C2');
    L([[-52, -124], [-28, -124]], 'rgba(255,255,255,0.95)', 5); L([[-54, -110], [-54, -84]], 'rgba(255,255,255,0.8)', 4); L([[50, -30], [50, -12]], 'rgba(255,255,255,0.7)', 4);
    for (let k = 0; k < 7; k++) { const u = -54 + rnd(k, 3) * 108, v = -130 + rnd(k, 4) * 120, r = 3 + rnd(k, 5) * 3; L([[u - r, v], [u + r, v]], '#fff', 1.6); L([[u, v - r], [u, v + r]], '#fff', 1.6); }
    g.globalAlpha = 1;
  }
  pop();
}

/* ---------------- people */
function guy(x, y, s, o = {}) {
  push(x, y, s); if (o.flip) g.scale(-1, 1);
  const sil = o.sil, sh = sil ? '#0C0A22' : o.shirt || BLUE, skin = sil ? '#0C0A22' : SKIN, hair = sil ? '#0C0A22' : o.hair || '#3A2A20', st = sil ? '#0C0A22' : INK;
  const w = o.walk, ph = w != null ? Math.sin(w * 11) : 0, bob = w != null ? Math.abs(Math.cos(w * 11)) * 2.5 : 0;
  g.translate(0, -bob);
  L([[-7, -30], [-7 - ph * 7, 0]], st, 8); L([[7, -30], [7 + ph * 7, 0]], st, 8);
  R(-18, -70, 36, 46, 15, sh, 3, st);
  if (o.coat) L([[0, -66], [0, -28]], 'rgba(27,21,48,0.3)', 2);
  C(0, -88, 18, skin, 3, st);
  g.beginPath(); g.arc(0, -90, 18.5, Math.PI * 1.05, Math.PI * 1.95); g.closePath(); g.fillStyle = hair; g.fill(); g.lineWidth = 3; g.strokeStyle = st; g.stroke();
  if (!sil) {
    C(-6, -86, 2.4, INK, 0); C(6, -86, 2.4, INK, 0);
    g.beginPath(); g.arc(0, -79, 5, 0.15 * Math.PI, 0.85 * Math.PI); g.strokeStyle = INK; g.lineWidth = 2.5; g.stroke();
    if (o.cap) { R(-13, -116, 26, 13, 4, '#fff', 3); R(-2, -114, 4, 9, 1, RED, 0); R(-4.5, -111.5, 9, 4, 1, RED, 0); }
  } else {
    if (o.cap) R(-13, -116, 26, 13, 4, '#0C0A22', 3, '#0C0A22');
    C(-6, -86, 2.6, '#fff', 0); C(6, -86, 2.6, '#fff', 0);
  }
  // front arm (angle 0 = straight out in front)
  push(14, -62, 1, o.arm ?? 1.25); R(-5, -5.5, 30, 11, 5.5, sh, 3, st); pop();
  pop();
}

/* ---------------- effects */
function shards(t, t0, x, y, n = 16) {
  const dt = t - t0; if (dt < 0 || dt > 0.9) return;
  for (let i = 0; i < n; i++) {
    const th = rnd(i, 3) * Math.PI * 2, v = 160 + rnd(i, 4) * 240;
    push(x + Math.cos(th) * v * dt, y + Math.sin(th) * v * dt * 0.8 + 420 * dt * dt, 1 - dt / 0.9, dt * 10 * (rnd(i, 5) - 0.5));
    poly([[-9, -7], [10, -3], [-2, 10]], i % 3 ? ICE : '#E8F6FF', 2.5, '#3E86C2'); pop();
  }
}
function sparkle(t, t0, x, y, n = 7, R0 = 80) {
  const dt = t - t0; if (dt < 0 || dt > 0.8) return;
  for (let i = 0; i < n; i++) { const th = (i / n) * Math.PI * 2 + rnd(i, 7), d = R0 * (0.55 + 0.6 * ep(t, t0, t0 + 0.6)) * (0.7 + 0.5 * rnd(i, 8)); star4(x + Math.cos(th) * d, y + Math.sin(th) * d, 11 * Math.sin(Math.PI * dt / 0.8) * (0.6 + 0.6 * rnd(i, 9)), i % 2 ? YEL : '#fff'); }
}
function zap(t, t0, x0, y0, x1, y1, dur = 0.38) {
  const dt = t - t0; if (dt < 0 || dt > dur) return;
  const seed = Math.floor(t * 30), n = 9, dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len, pts = [];
  for (let i = 0; i <= n; i++) { const j = i === 0 || i === n ? 0 : (rnd(i, seed) - 0.5) * 34; pts.push([x0 + dx * i / n + nx * j, y0 + dy * i / n + ny * j]); }

    if (fw > 0.01) { L([[176, -100], [188, -100], [188, 102], [176, 102]], CORAL, 4); pill(120, 150, 'just 6 lines', fw, { bg: YEL, size: 13 }); }
    pop();
  }
}

/* ending: profile card (DOM) on a cream background, the app waves */
function sceneOutro(t) {
  g.fillStyle = '#FFF1DC'; g.fillRect(-700, -700, 1940, 2400);
  for (let i = 0; i < 26; i++) { const x = rnd(i, 31) * 540, y = ((rnd(i, 32) * 960 - t * 14 * (0.5 + rnd(i, 33))) % 960 + 960) % 960; g.save(); g.globalAlpha = 0.55; if (i % 3 === 0) heart(x, y, 7, '#FFB4A2', 2); else if (i % 3 === 1) star4(x, y, 7, '#FFE08A'); else C(x, y, 4, '#A9D4FF', 2); g.restore(); }
  const ba = pin(t, T.newTo + 0.3, 0.45);
  if (ba > 0.01) bot(112, 708, 0.8 * ba, { face: t > T.follow + 0.3 ? 'happy' : 'ok', armR: 0.7 + 0.4 * Math.sin(t * 9), sq: 0.8 * pulse(t, T.follow + 0.4, 5) });
}

/* ---------------- scene list, cameras [t, dur, x, y, zoom], transitions */
const SC = [
  { a: 0, f: sceneNight1, chip: '03:00 AM', dark: 1, cam: [[0, 0, 240, 330, 1.5], [1.6, 0.8, 255, 330, 1.18], [4.2, 0.6, 300, 330, 1.08], [5.85, 0.7, 270, 612, 1.35], [7.2, 0.8, 270, 440, 0.95]] },
  { a: 8.5, f: sceneTrap, chip: 'THE TRAP', cam: [[8.5, 0, 270, 470, 1.05], [11.1, 0.5, 270, 470, 1.0]] },
  { a: 15.85, f: sceneHospital, chip: 'THE FIX', cam: [[15.85, 0, 300, 470, 1.0], [18.8, 0.6, 290, 500, 1.12], [20.05, 0.4, 270, 440, 1.0]] },
  { a: 21.12, f: sceneAlive, chip: 'CHECK 1 · ALIVE?', cam: [[21.12, 0, 270, 470, 1.0], [25.9, 0.35, 330, 480, 1.1], [26.9, 0.5, 270, 470, 1.0]] },
  { a: 27.02, f: sceneShops, chip: 'CHECK 2 · READY?', cam: [[27.02, 0, 270, 470, 1.0], [33.3, 0.6, 400, 450, 1.3], [34.65, 0.4, 320, 460, 1.08]] },
  { a: 34.78, f: sceneNight2, chip: '03:00 AM · AGAIN', dark: 1, cam: [[34.78, 0, 290, 320, 1.2], [37.3, 0.3, 290, 330, 1.28], [38.0, 0.5, 270, 330, 1.15], [39.25, 0.7, 270, 612, 1.35]] },
  { a: 40.5, f: sceneK8s, chip: 'KUBERNETES', cam: [[40.5, 0, 270, 480, 1.0]] },
  { a: 44.85, f: sceneOutro, chip: null, cam: [[44.85, 0, 270, 480, 1.0]] },
];
const SHAKES = [[T.restarted, 7], [8.94, 6], [T.restartsApp, 7], [READY3, 3], [T.oneR, 7]];
function camAt(keys, t) {
  let c = { x: keys[0][2], y: keys[0][3], z: keys[0][4] };
  for (const [kt, d, x, y, z] of keys) { if (t < kt) break; const q = d ? ease.inOut(prog(t, kt, kt + d)) : 1; c = { x: lerp(c.x, x, q), y: lerp(c.y, y, q), z: lerp(c.z, z, q) }; }
  return c;
}
function drawScene(i, t) {
  const s = SC[i], c = camAt(s.cam, t);
  let sx = 0, sy = 0; for (const [t0, amp] of SHAKES) { const dt = t - t0; if (dt > 0 && dt < 0.45) { const k = amp * (1 - dt / 0.45); sx += Math.sin(dt * 90) * k; sy += Math.cos(dt * 77) * k; } }
  g.save(); g.translate(270 + sx, 480 + sy); g.scale(c.z, c.z); g.translate(-c.x, -c.y);
  s.f(t);
  g.restore();
}
const sceneAt = (t) => { let i = 0; for (let k = 0; k < SC.length; k++) if (t >= SC[k].a) i = k; return i; };
function chip(t) {
  const s = SC[sceneAt(t)]; if (!s.chip) return;
  const a = pin(t, s.a + 0.25, 0.35);
  g.font = '900 12px Inter'; const w = g.measureText(s.chip).width + 26;
  push(30 + w / 2, 132, a); R(-w / 2, -14, w, 28, 14, YEL, 3, INK, 3); TX(s.chip, 0, 1, 12, INK, 900); pop();
}

/* ---------------- captions: one plain line, a few key words coloured */
function hlCol(w, t) {
  let m;
  if (t < 8.4) m = { froze: '#8FD3FF', restarted: '#FFC94A', know: '#FFC94A' };
  else if (t < 15.8) m = { running: '#5BE3A6', working: '#FF6B6B', alive: '#8FD3FF', restarts: '#FF6B6B' };
  else if (t < 21.2) m = { fix: '#5BE3A6', okay: '#5BE3A6', pulse: '#FF6B6B', health: '#FFC94A', check: '#FFC94A' };
  else if (t < 27.1) m = { alive: '#FFC94A', misses: '#FF6B6B', restarts: '#FFC94A' };
  else if (t < 34.8) m = { ready: '#FFC94A', yet: '#FF6B6B', skips: '#FF6B6B', closed: '#FF6B6B' };
  else if (t < 40.5) m = { freeze: '#8FD3FF', restart: '#FFC94A', back: '#5BE3A6' };
  else if (t < 44.9) m = { kubernetes: '#8FB4FF', liveness: '#5BE3A6', readiness: '#5BE3A6' };
  else m = { kubernetes: '#8FB4FF', follow: '#FFC94A' };
  return m[w] || null;
}
const CHUNKS = [];
(() => {
  // "3", "a", ".m." -> "3 AM"
  const raw = WORDS.map(([w, a, b]) => ({ s: w.trim(), a, b }));
  const ws = [];
  for (let i = 0; i < raw.length; i++) {
    if (raw[i].s === '3' && raw[i + 1] && raw[i + 1].s.toLowerCase() === 'a' && raw[i + 2] && /^\.m\./.test(raw[i + 2].s)) {
      const rest = raw[i + 2].s.replace(/^\.m\./, ''), nx = raw[i + 3];
      ws.push({ s: '3 AM' + (rest || (nx && /^[A-Z]/.test(nx.s.trim()) ? '.' : '')), a: raw[i].a, b: raw[i + 2].b }); i += 2;
    } else ws.push(raw[i]);
  }
  // never end a line on a small linking word ("in a / row"): it moves down to the next line
  const WEAK = new Set(['a', 'an', 'the', 'are', 'on', 'one', 'in', 'it', 'and', 'at', 'is', 'your', 'of', 'to', 'for', 'not', 'these', 'that', 'was']);
  let cur = [];
  const flushC = () => {
    if (!cur.length) return;
    const carry = [];
    while (carry.length < 2 && cur.length > 2 && !/[.,?:!]$/.test(cur[cur.length - 1].s) && WEAK.has(cur[cur.length - 1].s.toLowerCase())) carry.unshift(cur.pop());
    CHUNKS.push(cur); cur = carry;
  };
  ws.forEach((w) => {
    const prev = cur[cur.length - 1];
    const len = cur.reduce((n, x) => n + x.s.length + 1, 0);
    if (prev && (/[.?:!]$/.test(prev.s) || (/,$/.test(prev.s) && cur.length >= 3) || cur.length >= (w.s.startsWith('3 AM') ? 5 : 4) || len + w.s.length > 24 || w.a - prev.b > 0.6)) flushC();
    cur.push(w);
  });
  flushC();
  // a short tail after a pause joins the line before it (unless that line ended a sentence)
  for (let i = CHUNKS.length - 1; i > 0; i--) {
    const c = CHUNKS[i], p = CHUNKS[i - 1], len = [...p, ...c].reduce((n, x) => n + x.s.length + 1, 0);
    if (c.length <= 2 && p.length + c.length <= 5 && !/[.?!]$/.test(p[p.length - 1].s) && len <= 32) { p.push(...c); CHUNKS.splice(i, 1); }
  }
})();
CHUNKS.forEach((c, ci) => {
  const box = div($('cap'), 'box'); c.box = box;
  c.els = c.map((w) => {
    const s = document.createElement('span'); s.className = 'w';
    s.textContent = w.s.replace(/[.,:;]+$/, '');
    const col = hlCol(w.s.toLowerCase().replace(/[.,?:!]/g, ''), w.a);
    if (col) s.style.color = col;
    box.appendChild(s); return s;
  });
  c.t0 = c[0].a - 0.04; c.t1 = CHUNKS[ci + 1] ? Math.min(CHUNKS[ci + 1][0].a - 0.04, c[c.length - 1].b + 0.9) : DURATION;
});
function caps(t) {
  for (const c of CHUNKS) {
    const on = t >= c.t0 && t < c.t1;
    c.box.style.display = on ? 'flex' : 'none';
    if (!on) continue;
    c.els.forEach((s, i) => { s.style.opacity = prog(t, c[i].a - 0.04, c[i].a + 0.06); });
  }
}

/* ---------------- ending: profile card + follow */
const CUR = $('cursor');
function cursorAt(x, y, a, press) { CUR.style.display = a > 0.01 ? 'block' : 'none'; CUR.style.opacity = a; CUR.style.left = x + 'px'; CUR.style.top = y + 'px'; CUR.style.transform = `scale(${1 - 0.18 * press})`; }
const TAP_T = T.profile - 0.05, TAP_F = T.follow + 0.25;
function profile(t) {
  const p = popIn(t, T.newTo - 0.1, DURATION + 1), pr = $('prof');
  vis(pr, p.a, `translateY(${p.y}px) scale(${p.s})`); pr.style.display = p.a > 0.001 ? 'block' : 'none';
  if (p.a <= 0.001) { $('watch').style.display = 'none'; cursorAt(0, 0, 0, 0); return; }
  const fb = $('fb'), done = t > TAP_F + 0.08;
  if (fb._d !== done) { fb._d = done; fb.textContent = done ? 'Following ✓' : 'Follow'; fb.style.background = done ? '#BDF2CF' : ''; fb.style.fontSize = done ? '12.5px' : ''; }
  fb.style.transform = `scale(${1 - 0.06 * window01(t, TAP_F, TAP_F + 0.16, 0.06)})`;
  const hi = ep(t, T.k8s2 - 0.1, T.k8s2 + 0.2), tk = $('t1');
  tk.style.boxShadow = hi > 0 ? `0 ${5 * hi}px 0 #1B1530` : '';
  tk.style.transform = `translateY(${-5 * hi}px) scale(${1 + 0.04 * hi + 0.06 * pulse(t, TAP_T, 6)})`;
  ['t0', 't2'].forEach((id) => { $(id).style.opacity = 1 - 0.45 * hi * (1 - ep(t, T.follow, T.follow + 0.3)); });
  const w = $('watch'), wa = window01(t, T.k8s2, DURATION + 1, 0.2) * (1 - 0.6 * ep(t, T.follow, T.follow + 0.3));
  w.style.display = wa > 0.01 ? 'block' : 'none'; w.style.opacity = wa; w.style.left = (270 - w.offsetWidth / 2) + 'px'; w.style.top = (pr.offsetTop + pr.offsetHeight + 16) + 'px';
  const k1 = ep(t, T.newTo + 0.6, T.profile - 0.1, ease.inOut), k2 = ep(t, T.follow - 0.25, TAP_F - 0.02, ease.inOut);
  const tx = 270, ty = pr.offsetTop + 150, fx_ = 44 + 452 - 16 - 52, fy = pr.offsetTop + 34;
  cursorAt(lerp(lerp(470, tx, k1), fx_, k2), lerp(lerp(780, ty, k1), fy, k2), window01(t, T.newTo + 0.5, DURATION + 1, 0.15), Math.max(window01(t, TAP_T, TAP_T + 0.16, 0.05), window01(t, TAP_F, TAP_F + 0.16, 0.06)));
}

/* ---------------- render */
window.ready = () => { $('grain').style.background = `url(${grainURL(256, 0.06, 5)})`; };
window.render = function (t) {
  t_ = t;
  g.setTransform(2, 0, 0, 2, 0, 0);
  const i = sceneAt(t), k = prog(t, SC[i].a, SC[i].a + 0.5);
  if (i > 0 && k < 1) {
    // iris wipe into the next scene
    drawScene(i - 1, t);
    const r = ease.inOut(k) * 640;
    g.save(); g.beginPath(); g.arc(270, 440, Math.max(0.1, r), 0, Math.PI * 2); g.clip(); drawScene(i, t); g.restore();
    if (r > 1) { C(270, 440, r, null, 10, INK); C(270, 440, r + 1, null, 4, YEL); }
  } else drawScene(i, t);
  chip(t);
  TX('@how.its.engineered', 510, 133, 11, SC[i].dark ? 'rgba(255,255,255,0.65)' : 'rgba(27,21,48,0.55)', 800, 'right');
  caps(t); profile(t);
  let fl = 0;
  for (const [t0, a] of [[T.restarted, 0.5], [T.restartsApp, 0.45], [T.oneR, 0.45], [8.94, 0.2]]) { const dt = t - t0; if (dt > 0 && dt < 0.4) fl = Math.max(fl, a * Math.exp(-dt * 12)); }
  $('flash').style.opacity = fl;
  // confetti on follow
  if (t > TAP_F + 0.08 && t < TAP_F + 1.7) {
    const dt = t - TAP_F - 0.08, cols = [CORAL, YEL, MINT, BLUE, PURP];
    const fbx = 44 + 452 - 16 - 52, fby = $('prof').offsetTop + 34;
    for (let j = 0; j < 70; j++) {
      const th = rnd(j, 70) * Math.PI * 2, v = 160 + rnd(j, 71) * 260;
      const x = fbx + Math.cos(th) * v * dt, y = fby + Math.sin(th) * v * dt * 0.8 + 260 * dt * dt;
      g.save(); g.globalAlpha = Math.max(0, 1 - dt / 1.5); g.translate(x, y); g.rotate(dt * 8 + j); g.fillStyle = cols[j % 5]; g.fillRect(-4, -2, 8, 4); g.restore();
    }
  }
  $('stage').style.opacity = 1 - ep(t, DURATION - 0.35, DURATION) * 0.85;
};
