<meta charset="utf-8">
<!-- 16 Retries, in the 10–15 ember line-art style.
     World: the weather tower in the centre (load meter + load history on its face) and an arc of 8 app boxes in front of it.
     Every call is an orb flying app → tower; the answer flies back green (ok), red (fail), amber (503) or grey (404).
     Scenes: hiccup + synced retry wave + DOWN · one app fails, retries, works · retry storm · cap (3 pips) · back off (1/2/4 s timeline)
     · synced vs jitter · what to retry (503 / 404 / payment + Idempotency-Key) · AWS SDK config · profile.
     Times come from voice/ref_words.json via voice/warp.js (video-vibe.html loads voice-vibe/ for the other ending). -->

<style>

.co { position: absolute; font-family: Mono; font-size: 9.5px; white-space: nowrap; color: #d9d2ca; display: flex; align-items: center; gap: 5px; letter-spacing: 0.4px; }

.card { position: absolute; left: 26px; right: 26px; top: 150px; display: none; background: rgba(12,11,10,0.94); border: 1px solid rgba(255,106,31,0.32); border-radius: 10px; box-shadow: 0 14px 34px rgba(0,0,0,0.6); overflow: hidden; }
.card .tb { height: 26px; display: flex; align-items: center; gap: 5px; padding: 0 10px; border-bottom: 1px solid rgba(255,255,255,0.06); font: 600 10px/1 Mono; color: #9c948c; letter-spacing: 0.5px; }
.card .tb i { width: 7px; height: 7px; border-radius: 50%; background: #2c2925; display: inline-block; }
.card .tb .fn { margin-left: 8px; color: #d9d2ca; } .card .tb .fn b { color: var(--o); font-weight: 600; }

.c { color: #6b645e; font-weight: 400; } .s { color: var(--o2); } .okc { color: var(--ok); } .oc { color: var(--o); } .ac { color: var(--amb); } .rc { color: var(--red); } .cyc { color: var(--cy); font-weight: 800; } .nm { color: var(--amb); }

#vibe { background: #F2EEE8; }

<script>
// scenes are timed on voice/ref_words.json (the normal take); WARP maps the current voice's clock onto it
const CAPW = window.CAPW, WARP = window.WARP, VIBE = !!window.VIBE_END;
const DURATION = CAPW[CAPW.length - 1][2] + 1.7;
window.DURATION = DURATION;
function toRef(t) {
  if (t <= WARP[0][0]) return t;
  for (let i = 1; i < WARP.length; i++) if (t <= WARP[i][0]) { const [n0, r0] = WARP[i - 1], [n1, r1] = WARP[i]; return r0 + (r1 - r0) * (t - n0) / (n1 - n0); }
  const [n, r] = WARP[WARP.length - 1]; return r + (t - n);
}
const REF_END = toRef(DURATION);
const O = hex('#FF6A1F'), O2 = hex('#FFB070'), W = [242, 238, 232], GR = [119, 112, 106], INK = [14, 13, 12], OK = hex('#7CF29A'), RED = [255, 70, 50], AMB = hex('#FFC34D'), CY = hex('#5EE6FF'), DIM = [60, 54, 48];

/* ---------------- beats (seconds, from voice/ref_words.json) */
const T = {
  hiccup: 0.94, every: 2.4, retry: 3.12, same: 3.96, now: 4.88, down: 5.52, real: 6.0,
  retrying: 7.36, smart: 8.04, most: 8.92, brief: 9.62, blip: 10.42, restart: 11.36, again: 12.6, works: 13.9,
  instantly: 15.16, again2: 15.96, each: 17.32, more: 18.46, storm: 20.06,
  fix1: 21.66, cap: 22.6, three: 23.2, stop: 24.06, error: 24.84,
  fix2: 25.62, back: 26.34, wait1: 27.24, two: 28.18, four: 28.86, eachwait: 29.14, recover: 31.46,
  but: 32.48, exactly: 33.6, onesec: 34.18, together: 35.82,
  fix3: 37.0, jitter: 37.82, random: 38.94, crowd: 39.86, spreads: 40.08,
  only: 41.46, fixitself: 42.98, timeout: 44.52, s503: 45.28, not: 46.04, s404: 46.66,
  payment: 48.72, charge: 49.32, twice: 49.76, unless: 50.58, idem: 51.64,
  aws: 53.66, backoff: 55.9, deflt: 56.58,
  haven: 57.5, idemp: 57.9, profile: 59.56, follow: 60.38,
};
const CUT = { S1: 7.1, ST: 14.45, CP: 21.45, BO: 25.4, SY: 32.25, JT: 36.85, RU: 41.2, AW: 53.3, END: 57.2 };
const ORDER = [['H', 0], ['S1', CUT.S1], ['ST', CUT.ST], ['CP', CUT.CP], ['BO', CUT.BO], ['SY', CUT.SY], ['JT', CUT.JT], ['RU', CUT.RU], ['AW', CUT.AW], ['END', CUT.END]];
function sceneOf(t) { let s = 'H'; for (const [k, a] of ORDER) if (t >= a) s = k; return s; }
const TXT = (t) => ep(t, 9.6, 10.4); // world lettering fades in only after the spoken hook

/* ---------------- world layout: tower in the middle, an arc of 8 apps in front */
const TW = [0, 70], TWW = 64, TWD = 46, TWH = 100;
const TWF = TW[1] - TWD / 2;                              // tower front face y
const NA = 8, AR = 150, AW_ = 34, AD = 24, AH = 28;
const APP = Array.from({ length: NA }, (_, i) => { const th = (200 + i * 20) * Math.PI / 180; return [Math.round(AR * Math.cos(th)), Math.round(TW[1] + AR * Math.sin(th))]; });
const FA = 3, PAY = 4, A503 = 2, A404 = 5;                // the app we follow, and the three in the rules scene
const outP = (i) => [APP[i][0], APP[i][1] + AD / 2, AH * 0.6];
const inP = (i) => [APP[i][0] * 0.22, TWF, 34 + (i % 4) * 6];
const ROAD = (i) => [[APP[i][0], APP[i][1] + AD / 2, 0], [APP[i][0] * 0.22, TWF, 0]];
const JIT = [-0.42, 0.18, -0.12, 0.37, -0.3, 0.05, 0.46, -0.22];

/* ---------------- calls: {i, t0, d (out), rd (back), res: ok|fail|503|404|none|lost, drop (q where it dies), key} */
const EV = [];
const ev = (i, t0, res, o = {}) => EV.push({ i, t0, res, d: o.d ?? 0.5, rd: o.rd ?? 0.4, drop: o.drop, key: o.key, money: o.money, lostAt: o.lostAt });
// hook: normal traffic, the hiccup, two synced retry waves, then the wave that takes it down
[[0, -0.3], [5, -0.1], [2, 0.15], [6, 0.35], [1, 0.5], [4, 0.62]].forEach(([i, t0]) => ev(i, t0, 'ok', { d: 0.5, rd: 0.4 }));
[[3, 0.7], [7, 0.9], [0, 1.15], [5, 1.4], [2, 1.65]].forEach(([i, t0]) => ev(i, t0, 'fail', { d: 0.45, rd: 0.35 }));
for (let i = 0; i < NA; i++) { ev(i, T.retry - 0.2, 'fail', { d: 0.5, rd: 0.35 }); ev(i, T.same - 0.15, 'fail', { d: 0.5, rd: 0.35 }); ev(i, T.now - 0.1, 'none', { d: 0.55 }); }
// S1: one app: attempt 1 dies on a network blip, attempt 2 works
ev(FA, 9.95, 'none', { d: 0.85, drop: 0.55 });
ev(FA, T.again, 'ok', { d: 0.6, rd: 0.6 });
[[0, 8.0], [6, 8.7], [1, 9.6], [7, 10.9], [5, 12.0], [2, 13.2]].forEach(([i, t0]) => ev(i, t0, 'ok', { d: 0.5, rd: 0.4 }));
// storm: instant retries from one app, then every app, faster and faster
[14.7, 15.12, 15.52, 15.9, 16.26, 16.58].forEach((t0) => ev(FA, t0, 'fail', { d: 0.28, rd: 0.16 }));
for (let i = 0; i < NA; i++) {
  let t0 = 16.9 + rnd(i, 5) * 0.6, k = 0;
  while (t0 < CUT.CP + 0.4) { ev(i, t0, 'fail', { d: 0.34, rd: 0.2 }); t0 += Math.max(0.07, 0.6 * Math.exp(-(t0 - 16.9) / 1.3)) * (0.7 + 0.6 * rnd(k++, i + 11)); }
}
// cap: every app makes 3 attempts and stops
const CAPS = Array.from({ length: NA }, (_, i) => (i === FA ? [22.62, 23.18, 23.5] : (() => { const s = 22.3 + rnd(i, 21) * 0.7; return [s, s + 0.48, s + 0.86]; })()));
CAPS.forEach((ts, i) => ts.forEach((t0) => ev(i, t0, 'fail', { d: 0.25, rd: 0.2 })));
const STOP = CAPS.map((ts) => ts[2] + 0.5);
// back off: fail · wait 1 · fail · wait 2 · fail · wait 4 · works
const BO = { a1: 26.3, g1: [T.wait1, 27.85], g2: [28.2, 28.75], g3: [29.1, 31.15] };
ev(FA, BO.a1, 'fail', { d: 0.3, rd: 0.25 }); ev(FA, BO.g1[1], 'fail', { d: 0.2, rd: 0.15 }); ev(FA, BO.g2[1], 'fail', { d: 0.2, rd: 0.15 }); ev(FA, BO.g3[1], 'ok', { d: 0.25, rd: 0.3 });
// synced: everyone fails at once, everyone waits exactly 1 s, everyone comes back together
const SYF = 32.55, SYR = [33.4, 35.3];
const JTR = (i) => [37.95, 39.2 + (JIT[i] + 0.5) * 1.6];
for (let i = 0; i < NA; i++) { ev(i, SYF, 'fail', { d: 0.35, rd: 0.25 }); ev(i, SYR[1], 'fail', { d: 0.5, rd: 0.25 }); ev(i, JTR(i)[1], 'ok', { d: 0.45, rd: 0.35 }); }
// rules: 503 → retry ✓ · 404 → stop · payment retried → charged twice, then with an Idempotency-Key → skipped
ev(A503, 44.55, '503', { d: 0.35, rd: 0.3 }); ev(A503, 45.75, 'ok', { d: 0.3, rd: 0.3 });
ev(A404, 46.05, '404', { d: 0.3, rd: 0.3 });
ev(PAY, 48.1, 'lost', { d: 0.4, rd: 0.4, lostAt: 0.5, money: 1 });
ev(PAY, 49.0, 'ok', { d: 0.38, rd: 0.35, money: 1 });
ev(PAY, 50.75, 'ok', { d: 0.4, rd: 0.4, money: 1, key: 1 });
// AWS + end: calm, jittered traffic
for (let i = 0; i < NA; i++) { let t0 = CUT.AW + rnd(i, 31) * 0.9; while (t0 < REF_END + 2) { ev(i, t0, 'ok', { d: 0.5, rd: 0.4 }); t0 += 0.8 + rnd(Math.floor(t0 * 10), i) * 0.7; } }
const arrT = (e) => e.t0 + e.d;
const backT = (e) => e.t0 + e.d + e.rd;

/* ---------------- tower state */
// mode: 0 ok, 1 hiccup, 2 overloaded, 3 down, 4 restarting
function towerMode(t) {
  if (t < T.hiccup) return 0;
  if (t < 2.1) return 1;
  if (t < T.retry + 0.35) return 0;
  if (t < T.down) return 2;
  if (t < CUT.S1) return 3;
  if (t > T.restart && t < 12.3) return 4;
  if (t < CUT.ST) return 0;
  if (t < 19.4) return t > 16.9 ? 2 : 0;
  if (t < 25.0) return 2;
  if (t < BO.g3[0] + 1.0) return 2;
  if (t > SYR[1] + 0.45 && t < 36.4) return 2;
  return 0;
}
// load: keyframes per stretch, plus a bump for every call that arrives in the synced/jitter scenes
const LOADK = [[0, 0.32], [0.9, 0.36], [1.3, 0.12], [2.2, 0.3], [3.4, 0.38], [3.55, 0.82], [4.3, 0.86], [4.4, 1], [5.5, 1], [5.6, 0], [7.0, 0], [7.1, 0.3], [11.3, 0.3], [11.4, 0], [12.3, 0], [12.6, 0.3], [14.4, 0.35],
  [14.5, 0.55], [16.8, 0.6], [19.4, 1], [24.0, 1], [25.3, 0.5], [26.4, 0.55], [29.1, 0.52], [31.1, 0.14], [32.2, 0.2], [32.3, 0.18], [41.1, 0.2], [41.2, 0.3], [53.2, 0.3], [53.3, 0.26]];
function load(t) {
  let L = key1(t, LOADK, (x) => x);
  if (t > CUT.SY - 0.2 && t < CUT.RU) for (const e of EV) if ((e.t0 === SYR[1] || (e.t0 > 39 && e.t0 < 41.2 && e.res === 'ok')) && t > arrT(e)) L += 0.1 * Math.exp(-(t - arrT(e)) * 5);
  return Math.min(1.08, L);
}
const loadCol = (L) => (L < 0.55 ? mixc(OK, AMB, L / 0.55) : mixc(AMB, RED, clamp((L - 0.55) / 0.35)));
function reqRate(t) { let n = 0; for (const e of EV) { const a = arrT(e); if (a <= t && a > t - 0.5) n++; } return n * 2; }

/* ---------------- camera */
const WIDE = { f: [0, -20, 30], s: 1.42, a: -0.42, e: 0.62, sy: 500 };
const SHOTS = [
  // H: on the tower as it hiccups, pull wide for the synced wave, punch in as it goes down
  { t: 0, d: 0, f: [0, TWF, 56], s: 3.4, a: -0.3, e: 0.3, sy: 460 },
  { t: 0.3, d: 1.8, f: [0, TWF - 10, 52], s: 3.0, a: -0.42, e: 0.34 },
  { t: T.every - 0.2, d: 1.2, ...WIDE, s: 1.6, sy: 480 },
  { t: T.same + 0.2, d: 1.0, ...WIDE, f: [0, -10, 34], s: 1.5 },
  { t: T.down - 0.15, d: 0.25, f: [0, TWF - 20, 50], s: 2.6, a: -0.36, e: 0.4, sy: 470 },
  { t: T.real, d: 1.0, f: [0, TWF - 20, 54], s: 2.3, a: -0.3, e: 0.38 },
  // S1: one app and the tower
  { t: CUT.S1, d: 0, f: [-12, -22, 28], s: 2.1, a: -0.5, e: 0.44, sy: 470 },
  { t: T.most, d: 1.6, f: [-14, -26, 26], s: 2.35, a: -0.58, e: 0.42 },
  { t: T.restart - 0.1, d: 0.5, f: [-4, TWF - 30, 46], s: 2.6, a: -0.5, e: 0.38, sy: 470 },
  { t: T.again - 0.2, d: 0.7, f: [-14, -26, 26], s: 2.35, a: -0.55, e: 0.42, sy: 470 },
  // ST: the one app hammering, then everyone
  { t: CUT.ST, d: 0, f: [-16, -34, 24], s: 2.6, a: -0.62, e: 0.4, sy: 470 },
  { t: T.each - 0.3, d: 1.4, ...WIDE, s: 1.5 },
  { t: T.storm - 0.15, d: 0.3, ...WIDE, f: [0, 0, 40], s: 1.75, sy: 470 },
  // CP: the app's three pips, then the quiet
  { t: CUT.CP, d: 0, f: [APP[FA][0] + 6, APP[FA][1] + 10, 22], s: 2.7, a: -0.3, e: 0.34, sy: 500 },
  { t: T.stop - 0.2, d: 1.0, ...WIDE, f: [0, -10, 30], s: 1.55, sy: 540 },
  // BO (timeline card up): the app and the tower recovering
  { t: CUT.BO, d: 0, f: [-14, -24, 32], s: 2.1, a: -0.48, e: 0.46, sy: 600 },
