<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 47 Race conditions (same kit as 44/45). A LIKES counter (post #7) at the back, two phones in front (LIKE A, LIKE B). Hook: 100
     likes burst in from a ring, most fizzle red, the counter crawls 900 → 912. One like = read → +1 → write (three orbs). Two likes
     together: both read 900, both write 901, B overwrites A. Testing: one user never overlaps; real traffic bursts again. Whiteboard
     card. Fix: one atomic step, both +1s land: 902. SQL card (SET likes = likes + 1), Redis INCR card, check-stock-then-sell under a
     lock. HUD on top: likes sent · counted · lost. Beats from voice/words.json. -->
<link rel="stylesheet" href="../_ember/fonts.css">
<link rel="stylesheet" href="../_ember/reel.css">
<style>
#cap { top: 728px !important; }

  background: rgba(14,12,11,0.95); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,0.6); }

.cd2 { position: absolute; left: 40px; right: 40px; top: 196px; opacity: 0; background: rgba(16,14,12,0.96); border: 1px solid rgba(111,195,255,0.4); border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); overflow: hidden; padding: 14px 16px 12px; }

<body>
<div id="stage">
  <div id="world">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div class="layer" id="lbls"></div>
  </div>
</div>
<script src="../../tools/lib.js"></script>
<script src="voice/words.js"></script>
<script src="../_ember/three.js"></script>
<script src="../_ember/world.js"></script>
<script src="../_ember/base.js"></script>
<script>
for (let i = 0; i < 28; i++) ORBS.push({ core: orbSprite(9), glow: orbSprite(34), trail: [0, 1, 2, 3, 4].map(() => orbSprite(10)) });
const RD = '#6FC3FF', HT = '#FF6B8B';

/* ---------------- beats */
const T = {
  hundred: at('100'), stops: at('stops'), n912: at('912'), go: at('go'),
  l1: line(1).start, read1: at('read'), add1: at('add'), write1: at('write'),
  l2: line(2).start, read2: at('read', 2), add2: at('add', 2), write2: at('write', 2),
  l3: line(3).start, race: at('race'), overlap: at('overlap'), overwrites: at('overwrites'),
  l4: line(4).start, testing: at('testing'), traffic: at('traffic'),
  l5: line(5).start, whiteboard: at('whiteboard'), whoever: at('whoever'), erases: at('erases'),
  l6: line(6).start, step: at('step'), split: at('split'),
  l7: line(7).start, atomic: at('atomic'), sql: at('sql'), single: at('single'), redis: at('redis'), increment: at('increment'),
  l8: line(8).start, checking: at('checking'), selling: at('selling'), transaction: at('transaction'), lock: at('lock'),
  ifv: line(9).start, follow: at('follow'),
};
const FLY = 0.5, land = (s) => s + FLY;
// one like (line 1): read, add, write
const R1 = T.read1 - FLY + 0.15, W1 = T.write1 - 0.1;
// two likes (line 2): both read, both write; B lands after A and overwrites it
const R2 = [T.read2 - FLY + 0.1, T.read2 - FLY + 0.22], W2 = [T.write2 - 0.15, T.write2 + 0.1];
// test: one user, two likes in a row, never overlapping
const TST = [T.testing - 0.1, T.testing + 0.9];
// fix: two atomic +1s
const FX = [T.step - 0.3, T.step + 0.05];

/* ---------------- state per time */
const BURST1 = [T.hundred + 0.1, T.n912 - 0.1], BURST2 = [T.traffic - 0.3, T.l5 - 0.2];
function countAt(t) {
  if (t < T.l1 - 0.3) return 900 + Math.floor(12 * clamp(prog(t, BURST1[0] + 0.3, BURST1[1]), 0, 1));
  if (t < T.l2 - 0.3) return t < land(W1) ? 900 : 901;
  if (t < T.l4 - 0.2) return t < land(W2[0]) ? 900 : 901;
  if (t < T.l6 - 0.2) return t < BURST2[0] ? 900 + TST.filter((s) => t >= s + 2 * FLY).length : 902 + Math.floor(7 * clamp(prog(t, BURST2[0] + 0.3, BURST2[1]), 0, 1));
  return 900 + FX.filter((s) => t >= land(s)).length;
}
function sentAt(t) {
  if (t < T.l1 - 0.3) return Math.floor(100 * clamp(prog(t, BURST1[0], BURST1[1] - 0.3), 0, 1));
  if (t < T.l2 - 0.3) return t < land(W1) ? 0 : 1;
  if (t < T.l4 - 0.2) return t < land(W2[0]) ? 0 : t < land(W2[1]) ? 1 : 2;
  if (t < T.l6 - 0.2) return t < BURST2[0] ? TST.filter((s) => t >= s + 2 * FLY).length : 2 + Math.floor(60 * clamp(prog(t, BURST2[0], BURST2[1] - 0.3), 0, 1));
  return FX.filter((s) => t >= land(s)).length;
}

/* ---------------- layout: Z up */
const RX = 0, RY = 250, RW = 330, RDp = 120, RH = 120;     // the counter
const PH = [[-200, -230], [200, -230]], PW = 150, PD = 26, PHh = 250;   // the two phones
const PC = [O2, RD], PN = ['A', 'B'];
const rowTop = [RX, RY, RH + 8], phTop = (i) => [PH[i][0], PH[i][1], PHh + 10];
const phMid = (i) => [PH[i][0], PH[i][1] + 10, PHh * 0.62];
const rowFront = (i) => [RX + (i ? 70 : -70), RY - RDp / 2, RH * 0.6];
function arc(a, b, h, n = 24) { return [...Array(n + 1)].map((_, i) => { const q = i / n; return [lerp(a[0], b[0], q), lerp(a[1], b[1], q), lerp(a[2], b[2], q) + h * 4 * q * (1 - q)]; }); }
const pathUp = (i) => arc(phMid(i), rowFront(i), 150), pathDown = (i) => arc(rowFront(i), phMid(i), 150);
const RING = [...Array(14)].map((_, k) => { const a = (-170 + k * (160 / 13)) * Math.PI / 180; return [RX + 560 * Math.cos(a), RY - 40 + 420 * Math.sin(a), 30]; });

/* ---------------- camera */
const pcam = new TH.PerspectiveCamera(42, 540 / 960, 5, 20000); pcam.up.set(0, 0, 1);
const SHOTS = [
  { t: 0, p: [0, -1240, 1060], l: [0, 50, 90], f: 42 },
  { t: 0.01, d: 5.5, p: [0, -1360, 1180], l: [0, 60, 80], f: 42, e: ease.out },
  { t: T.l1 - 0.1, d: 1.1, p: [-90, -1240, 1110], l: [-50, 60, 80], f: 42 },
  { t: T.l2 - 0.1, d: 1.1, p: [0, -1280, 1150], l: [0, 50, 80], f: 42 },
  { t: T.l4 - 0.1, d: 1.1, p: [80, -1300, 1180], l: [30, 60, 80], f: 42 },
  { t: T.l6 - 0.1, d: 1.1, p: [0, -1280, 1260], l: [0, 80, 40], f: 42 },
  { t: T.l8 - 0.2, d: 1.2, p: [0, -1320, 1300], l: [0, 100, 30], f: 42 },
];
const KICKS = [[T.n912, 0.04], [land(W1), 0.03], [land(W2[1]), 0.05], [T.overwrites, 0.03], [T.traffic, 0.04], [land(FX[1]), 0.04], [T.lock, 0.03]];
const SHAKES = [[land(W2[1]), 4, 0.35], [T.traffic, 3, 0.3]];
const _rv = new TH.Vector3();
function shoot(t) {
  let p = SHOTS[0].p.slice(), l = SHOTS[0].l.slice(), f = SHOTS[0].f;
  for (let i = 1; i < SHOTS.length; i++) {
    const k = SHOTS[i]; if (t < k.t) break;
    const q = k.d ? (k.e || ease.inOut)(prog(t, k.t, k.t + k.d)) : 1;
    p = p.map((v, j) => lerp(v, k.p[j], q)); l = l.map((v, j) => lerp(v, k.l[j], q)); f = lerp(f, k.f, q);
  }
  let kick = 0;
  for (const [t0, amp] of KICKS) { const dt = t - t0; if (dt > 0 && dt < 1.2) kick += amp * (dt < 0.05 ? dt / 0.05 : Math.exp(-(dt - 0.05) * 6)); }
  let sx = 0, sy = 0;
  for (const [t0, amp, dur] of SHAKES) { const dt = t - t0; if (dt > 0 && dt < dur) { const k = amp * (1 - dt / dur); sx += k * Math.sin(t * 91); sy += k * Math.cos(t * 67); } }
  pcam.position.set(p[0] + 6 * Math.sin(t * 0.37), p[1] + 6 * Math.cos(t * 0.29), p[2] + 4 * Math.sin(t * 0.23));
  pcam.lookAt(l[0] + sx, l[1], l[2] + sy);
  pcam.fov = f * (1 - kick); pcam.updateProjectionMatrix(); pcam.updateMatrixWorld();
  cam.f = l;
  _rv.setFromMatrixColumn(pcam.matrixWorld, 0); const n = Math.hypot(_rv.x, _rv.y) || 1; camRight = [_rv.x / n, _rv.y / n, 0];
  const d = Math.hypot(p[0] - l[0], p[1] - l[1], p[2] - l[2]);
  scene.fog.near = d * 0.9; scene.fog.far = d * 3.4;
}
const _pv = new TH.Vector3();
P = function (x, y, z) { _pv.set(x, y, z).project(pcam); return [(_pv.x + 1) * 270, (1 - _pv.y) * 480, _pv.z]; };

/* ---------------- the stage */
floor.scale.set(2.2, 2.2, 1); floor.position.set(0, 1500, -0.5);
const ROW = emberBox(RX, RY, RW, RDp, RH, O), POOLR = pool(RX, RY, 260, O);
const PHN = PH.map((p, i) => emberBox(p[0], p[1], PW, PD, PHh, PC[i], { lw: 2.2 }));
const POOLP = PH.map((p, i) => pool(p[0], p[1], 170, PC[i]));
const LINKS = PH.map((p) => road([[p[0], p[1] + 30, 0], [lerp(p[0], RX, 0.75), lerp(p[1], RY, 0.75) - 20, 0], [RX + Math.sign(p[0]) * 60, RY - RDp / 2 - 10, 0]], DIM));
const DROW = decal(RW - 24, RH - 20, 'front', 6); DROW.m.position.set(RX, RY - RDp / 2 - 0.6, RH / 2);
const DPH = PH.map((p) => { const d = decal(PW - 18, PHh - 26, 'front', 6); d.m.position.set(p[0], p[1] - PD / 2 - 0.6, PHh / 2); return d; });
const HEART = new Path2D('M50 84 L14 48 Q2 34 12 22 Q24 10 38 18 Q46 23 50 32 Q54 23 62 18 Q76 10 88 22 Q98 34 86 48 Z');
function padlock(g, x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 9; g.lineCap = 'round'; g.shadowColor = col; g.shadowBlur = 14;
  g.beginPath(); g.moveTo(-26, -6); g.lineTo(-26, -40); g.arc(0, -40, 26, Math.PI, 0); g.lineTo(26, -6); g.stroke();
  rrect(g, -42, -10, 84, 70, 12); g.fill(); g.fillStyle = '#0d0c0b'; g.beginPath(); g.arc(0, 18, 9, 0, Math.PI * 2); g.fill(); g.fillRect(-4, 18, 8, 20);
  g.restore();
}
function drawRow(n, glow, mode) {
  const key = [n, glow, mode].join('|'); if (DROW._k === key) return; DROW._k = key;
  DROW.draw((g, w, h) => {
    g.fillStyle = 'rgba(14,12,10,0.92)'; rrect(g, 0, 0, w, h, 34); g.fill();
    g.strokeStyle = glow; g.lineWidth = 8; rrect(g, 4, 4, w - 8, h - 8, 30); g.stroke();
    g.save(); g.translate(60, 140); g.scale(3.2, 3.2); g.fillStyle = HT; g.shadowColor = HT; g.shadowBlur = 10; g.fill(HEART); g.restore();
    g.textBaseline = 'middle';
    g.fillStyle = '#9c948c'; g.font = '800 64px Mono'; g.fillText('POST #7 · LIKES', 50, 90);
    g.fillStyle = glow === RED ? RED : '#F2EEE8'; g.font = '900 230px Inter'; g.fillText(String(n), 450, 300);
    if (mode === 'atomic') { g.fillStyle = OK; g.font = '900 96px Mono'; g.fillText('ATOMIC +1', 470, 470); }
    if (mode === 'lock') { padlock(g, 1480, 300, 2.0, AMB); g.fillStyle = AMB; g.font = '900 96px Mono'; g.fillText('LOCKED STEPS', 470, 470); }
  });
}
// phone screens: 'like' | 'read' | 'add' | 'write' | 'done' | 'lost' | 'over' | 'test' | 'atomic' | 'ok' | 'dim'
function drawPhone(i, st, press, v) {
  const D = DPH[i], key = st + '|' + press.toFixed(2) + '|' + v; if (D._k === key) return; D._k = key;
  D.draw((g, w, h) => {
    g.fillStyle = '#0d0c0b'; rrect(g, 0, 0, w, h, 40); g.fill();
    g.strokeStyle = PC[i]; g.globalAlpha = 0.5; g.lineWidth = 5; rrect(g, 4, 4, w - 8, h - 8, 36); g.stroke(); g.globalAlpha = 1;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#9c948c'; g.font = '800 64px Mono'; g.fillText('LIKE ' + PN[i], w / 2, 90);
    const big = (txt, col, y = 470, s = 150) => { g.fillStyle = col; g.font = `900 ${s}px Inter`; g.shadowColor = col; g.shadowBlur = 18; g.fillText(txt, w / 2, y); g.shadowBlur = 0; };
    const small = (txt, col, y = 640) => { g.fillStyle = col; g.font = '800 66px Mono'; g.fillText(txt, w / 2, y); };
    const heart = (col, fill) => { const s = 1 - 0.1 * press; g.save(); g.translate(w / 2 - 150 * s, 1000 - 150 * s); g.scale(3 * s, 3 * s); if (fill) { g.fillStyle = col; g.fill(HEART); } else { g.strokeStyle = col; g.lineWidth = 4; g.stroke(HEART); } g.restore(); };
    const steps = (k) => { ['READ', '+1', 'WRITE'].forEach((s, j) => { g.fillStyle = j < k ? OK : j === k ? AMB : '#3a332d'; g.font = '800 58px Mono'; g.fillText((j < k ? '✓ ' : '') + s, w / 2, 760 + j * 76); }); };
    if (st === 'like') { big('♡', '#F2EEE8', 420, 200); heart(HT, press > 0.2); }
    if (st === 'read') { small('READ', RD, 260); big(String(v), RD); steps(1); }
    if (st === 'add') { small('900 + 1', AMB, 260); big('901', AMB); steps(2); }
    if (st === 'write') { small('WRITING', AMB, 260); big('901', AMB); steps(2); }
    if (st === 'done') { small('WROTE', OK, 260); big('901', OK); steps(3); }
    if (st === 'lost') { small('MY +1', RED, 260); big('LOST', RED, 470, 140); small('B WROTE OVER IT', RED, 700); }
    if (st === 'over') { small('WROTE', RED, 260); big('901', RED); small('OVER A', RED, 700); }
    if (st === 'test') { small('TEST', OK, 260); big('1 USER', OK, 470, 120); small('NO OVERLAP ✓', OK, 700); }
    if (st === 'atomic') { small('ONE STEP', OK, 260); big('+1', OK, 470, 200); small('ATOMIC', OK, 700); }
    if (st === 'ok') { small('COUNTED', OK, 260); big('✓', OK, 470, 240); small(String(v), OK, 700); }
    if (st === 'dim') { big('♡', '#3a332d', 420, 200); }
  });
}
function phoneState(i, t) {
  if (t < T.l1 - 0.3) return 'like';
  if (t < T.l2 - 0.3) { if (i) return 'dim'; return t < land(R1) ? 'like' : t < T.add1 - 0.05 ? 'read' : t < W1 ? 'add' : t < land(W1) ? 'write' : 'done'; }
  if (t < T.l4 - 0.2) {
    if (t < land(R2[i])) return 'like';
    if (t < T.add2 - 0.05 + i * 0.1) return 'read';
    if (t < W2[i]) return 'add';
    if (t < land(W2[i])) return 'write';
    if (t < T.overwrites - 0.1) return 'done';
    return i ? 'over' : 'lost';
  }
  if (t < T.l6 - 0.2) return t < BURST2[0] ? (i ? 'dim' : 'test') : 'like';
  if (t < FX[i]) return 'like';
  if (t < land(FX[i])) return 'atomic';
  return 'ok';
}

/* ---------------- the world, frame by frame */
function burst(t, a, b, seed) {
  RING.forEach((p, k) => {
    const per = 0.85, s = a + ((k * 0.29 + seed) % per); if (t < s || t > b) return;
    const ph = (t - s) % per, q = ph / (per * 0.65); if (q >= 1) return;
    const hit = (k + seed * 7) % 6 === 0, path = arc(p, [RX + (p[0] - RX) * 0.12, RY + (p[1] - RY) * 0.12, RH * 0.7], 90);
    orb(path, ease.inOut(hit ? q : Math.min(q, 0.82)), hit ? OK : HT, hit ? 1 : 1 - Math.max(0, (q - 0.6) / 0.4), 0.7);
  });
}
function world(t) {
  const n = countAt(t), lost = t > land(W2[1]) && t < T.l4 - 0.2, hot = (t > BURST1[0] && t < T.l1 - 0.3) || (t > BURST2[0] && t < T.l5 - 0.1);
  const mode = t > T.lock - 0.1 && t < T.ifv ? 'lock' : t > T.l6 - 0.2 ? 'atomic' : '';
  const rc = lost ? mixHex(O, RED, 0.5 + 0.5 * Math.sin(t * 9) ** 2) : hot ? mixHex(O, HT, 0.35) : mode === 'atomic' ? mixHex(O, OK, 0.5) : mode === 'lock' ? AMB : O;
  ROW.setLook(rc, 1.1 + 0.6 * pulse(t, land(W1), 4) + 0.8 * pulse(t, land(W2[1]), 4) + 0.6 * pulse(t, land(FX[1]), 4), ep(t, 0, 0.5));
  POOLR.set(rc, 0.45 * ep(t, 0, 0.5));
  drawRow(n, lost ? RED : mode === 'atomic' ? OK : mode === 'lock' ? AMB : O, mode);
  for (let i = 0; i < 2; i++) {
    const a = ep(t, 0.1 + i * 0.1, 0.6 + i * 0.1), s = phoneState(i, t);
    let c = PC[i];
    if (s === 'lost' || s === 'over') c = mixHex(PC[i], RED, 0.6); else if (s === 'done' || s === 'ok' || s === 'test' || s === 'atomic') c = mixHex(PC[i], OK, 0.55); else if (s === 'dim') c = mixHex(PC[i], DIM, 0.6);
    PHN[i].setLook(c, (s === 'dim' ? 0.55 : 1) + 0.5 * pulse(t, T.hundred, 5), a); POOLP[i].set(c, 0.38 * a);
    const tap = (s0) => window01(t, s0, s0 + 0.2, 0.06);
    const press = Math.max(tap(T.hundred + i * 0.1), tap(R1 - 0.2) * (i ? 0 : 1), tap(R2[i] - 0.2), tap(FX[i] - 0.2));
    drawPhone(i, s, press, n);
    DROW.m.material.opacity = ep(t, 0.2, 0.7); DPH[i].m.material.opacity = a;
    LINKS[i].set(1, mixHex(PC[i], DIM, 0.5), 0.7 * ep(t, 0.4, 1.0), t);
  }
  // hook burst and the real-traffic burst: most likes fizzle, a few land
  burst(t, BURST1[0], T.l1 - 0.4, 0.1); burst(t, BURST2[0], T.l5 - 0.2, 0.4);
  // line 1: read (counter → A), write (A → counter)
  { const q = prog(t, R1, land(R1)); if (q > 0 && q < 1) orb(pathDown(0), ease.inOut(q), RD, 1, 0.8); }
  { const q = prog(t, W1, land(W1)); if (q > 0 && q < 1) orb(pathUp(0), ease.inOut(q), O2, 1, 1); if (t > land(W1) && t < land(W1) + 0.7) ripple(t, land(W1), RX, RY, RH + 4, OK, 190, 0.7); }
  // line 2: both read 900, both write 901; B's write lands second and wipes A's
  for (let i = 0; i < 2; i++) {
    const q = prog(t, R2[i], land(R2[i])); if (q > 0 && q < 1) orb(pathDown(i), ease.inOut(q), RD, 1, 0.8);
    const qw = prog(t, W2[i], land(W2[i])); if (qw > 0 && qw < 1) orb(pathUp(i), ease.inOut(qw), PC[i], 1, 1);
    if (t > land(W2[i]) && t < land(W2[i]) + 0.7) ripple(t, land(W2[i]), RX, RY, RH + 4, i ? RED : AMB, 200, 0.7);
  }
  if (t > land(W2[1]) && t < land(W2[1]) + 0.9) sparks(t, land(W2[1]), RX, RY - RDp / 2, RH * 0.7, RED, 24, 11, 210, 0.9, 240);
  // test: one user, two likes in a row (read, then write), never overlapping
  TST.forEach((s) => { const q = prog(t, s, land(s)); if (q > 0 && q < 1) orb(pathDown(0), ease.inOut(q), RD, 1, 0.8);
    const qw = prog(t, land(s), land(s) + FLY); if (qw > 0 && qw < 1) orb(pathUp(0), ease.inOut(qw), O2, 1, 1);
    if (t > s + 2 * FLY && t < s + 2 * FLY + 0.6) ripple(t, s + 2 * FLY, RX, RY, RH + 4, OK, 170, 0.6); });
  // fix: two atomic +1s, both land
  FX.forEach((s, i) => { const q = prog(t, s, land(s)); if (q > 0 && q < 1) orb(pathUp(i), ease.inOut(q), OK, 1, 1); if (t > land(s) && t < land(s) + 0.7) ripple(t, land(s), RX, RY, RH + 4, OK, 190, 0.7); });
  if (t > T.lock && t < T.lock + 0.9) sparks(t, T.lock, RX, RY, RH + 10, AMB, 18, 15, 160, 0.8, 200);
}

/* ---------------- world tags */
const tg = (key, html, style, wp, t, a, b, dy = 0) => { const e = tag(key, html, style, wp, t, a, b, dy); if (P(...wp)[2] > 1) e.style.display = 'none'; return e; };
function tags(t) {
  const big = (c) => `font-size:15px;padding:9px 13px;letter-spacing:1px;border-color:${c}`;

/* ---------------- bloom: scene → half-float target, bright pass, three blur levels, composite to the canvas */
const RT = (w, h, s = 0) => new TH.WebGLRenderTarget(w, h, { type: TH.HalfFloatType, samples: s, depthBuffer: s > 0 });
const rtMain = RT(1080, 1920, 4), BL = [[RT(540, 960), RT(540, 960)], [RT(270, 480), RT(270, 480)], [RT(135, 240), RT(135, 240)]];
const fsCam = new TH.OrthographicCamera(-1, 1, 1, -1, 0, 1), fsScene = new TH.Scene(), fsQuad = new TH.Mesh(new TH.PlaneGeometry(2, 2));
fsQuad.frustumCulled = false; fsScene.add(fsQuad);
const VS = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const shm = (fs, u) => new TH.ShaderMaterial({ uniforms: u, vertexShader: VS, fragmentShader: fs, depthTest: false, depthWrite: false });
const mBright = shm(`uniform sampler2D tex; uniform float th; varying vec2 vUv;
void main() { vec3 c = texture2D(tex, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(th, th + 0.4, l), 1.0); }`,
  { tex: { value: null }, th: { value: 0.8 } });
const mBlur = shm(`uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;
void main() {
  vec3 c = texture2D(tex, vUv).rgb * 0.2270270270;
  c += (texture2D(tex, vUv + dir * 1.3846153846).rgb + texture2D(tex, vUv - dir * 1.3846153846).rgb) * 0.3162162162;
  c += (texture2D(tex, vUv + dir * 3.2307692308).rgb + texture2D(tex, vUv - dir * 3.2307692308).rgb) * 0.0702702703;
  gl_FragColor = vec4(c, 1.0);
}`, { tex: { value: null }, dir: { value: new TH.Vector2() } });
const mComp = shm(`uniform sampler2D base, b1, b2, b3; uniform float k1, k2, k3; varying vec2 vUv;
void main() {
  vec3 c = texture2D(base, vUv).rgb + texture2D(b1, vUv).rgb * k1 + texture2D(b2, vUv).rgb * k2 + texture2D(b3, vUv).rgb * k3;
  c = c / (1.0 + max(c - 1.0, 0.0) * 0.6);
  gl_FragColor = vec4(c, 1.0);
  #include <colorspace_fragment>
}`, { base: { value: rtMain.texture }, b1: { value: BL[0][0].texture }, b2: { value: BL[1][1].texture }, b3: { value: BL[2][1].texture }, k1: { value: 0.5 }, k2: { value: 0.65 }, k3: { value: 0.8 } });
function pass(mat, dst) { fsQuad.material = mat; renderer.setRenderTarget(dst); renderer.render(fsScene, fsCam); }
function blur(src, dst, dx, dy) { mBlur.uniforms.tex.value = src.texture; mBlur.uniforms.dir.value.set(dx / src.width, dy / src.height); pass(mBlur, dst); }
function bloom() {
  mBright.uniforms.tex.value = rtMain.texture; pass(mBright, BL[0][0]);
  blur(BL[0][0], BL[0][1], 1, 0); blur(BL[0][1], BL[0][0], 0, 1);
  blur(BL[0][0], BL[1][0], 1, 0); blur(BL[1][0], BL[1][1], 0, 1);
  blur(BL[1][1], BL[2][0], 1, 0); blur(BL[2][0], BL[2][1], 0, 1);
  pass(mComp, null);
}


/* ---------------- HUD (sent · counted · lost), whiteboard card */
const stg = $('stage'), before = $('prof');
const mk = (html) => { const w = document.createElement('div'); w.innerHTML = html.trim(); const n = w.firstChild; stg.insertBefore(n, before); return n; };
const MT = mk(`<div id="mt"><div class="c"><div class="n" id="hs"></div><div class="k">LIKES SENT</div></div><div class="sep"></div><div class="c"><div class="n" id="hc"></div><div class="k">COUNTED</div></div><div class="sep"></div><div class="c"><div class="n" id="hl"></div><div class="k">LOST</div></div></div>`);

  <text x="230" y="52" text-anchor="middle" font-family="Mono" font-size="16" font-weight="800" fill="#6b645e">LIKES</text>

function clampTags() {

}
