<meta charset="utf-8">
<!-- 34 Shazam, solid low-poly dioramas (kit.js + scenes.js + shazam.js). Story: a noisy café, a speaker, your phone
     names the song in seconds. The sound becomes a map (pitch up, time across) of glowing bars; louder glows brighter;
     only the brightest point per patch survives: stars. Café noise adds and hides a few; enough survive. Pairs of stars
     become tiny codes, the codes the recording's fingerprint. A hall of millions of fingerprints; your stars slide
     along one song until they line up. 2002 in Britain: no app, dial 2580, hold the phone to the speaker, get a text.
     Twist: it knows one exact recording, not the tune, so humming finds nothing. Beats come from voice/words.js. -->

<style>

.hc::before { content: ''; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--c); box-shadow: 0 0 8px var(--cg); }
.hc .k { font: 650 9.5px/1 Inter; letter-spacing: 1.5px; color: var(--c); text-transform: uppercase; }
.hc .v { font: 750 19px/1.05 Inter; letter-spacing: -0.3px; margin-top: 6px; color: #f5f4f3; }

#cap .box::before { left: -2px; top: -4px; border-width: 1.6px 0 0 1.6px; }
#cap .box::after { right: -2px; bottom: -4px; border-width: 0 1.6px 1.6px 0; }

<script>
for (let i = 0; i < 24; i++) { const m = new TH.Mesh(new TH.RingGeometry(0.9, 1, 96), new TH.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: TH.AdditiveBlending, depthWrite: false, toneMapped: false, side: TH.DoubleSide })); m.visible = false; scene.add(m); RINGS.push(m); }
// Signals: crisp thin rings that open out from a source, and thin lines that draw themselves with a bright head.
const RING_TX = ctex(512, 512, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.8, 'rgba(255,255,255,0.025)'); gr.addColorStop(0.985, 'rgba(255,255,255,0.06)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#ffffff'; g.lineWidth = 3.2; g.beginPath(); g.arc(w / 2, h / 2, w / 2 - 6, 0, 7); g.stroke();
});
const RING_G = new TH.PlaneGeometry(2, 2);
for (const m of RINGS) { m.geometry = RING_G; m.material.map = RING_TX; m.material.needsUpdate = true; }
// o: 'v' stands the ring up facing the camera side (-y), for sound coming off a wall
function ripple(t, t0, x, y, z, col, maxR, dur = 0.9, o = {}) {
  const p = prog(t, t0, t0 + dur); if (p <= 0 || p >= 1 || ringI >= RINGS.length) return;
  const m = RINGS[ringI++], r = maxR * (0.1 + 0.9 * ease.out(p));
  m.visible = true; m.position.set(x, y, z); m.scale.set(r, r, 1); m.rotation.set(o.v ? Math.PI / 2 : 0, 0, 0); m.material.color.set(col); m.material.opacity = (o.a ?? 0.85) * Math.pow(1 - p, 1.3) * Math.min(1, p * 12);
}
const LMAX = 10, LINKS = [];
const dotSprite = () => { const sp = new TH.Sprite(new TH.SpriteMaterial({ map: TX_ORB, transparent: true, blending: TH.AdditiveBlending, depthWrite: false, depthTest: false, toneMapped: false })); sp.visible = false; sp.renderOrder = 6; scene.add(sp); return sp; };
for (let i = 0; i < 10; i++) {
  const geo = new TH.LineGeometry(); geo.setPositions(new Array(LMAX * 3).fill(0).map((_, k) => k));
  const core = new TH.Line2(geo, lineMat(O, 3.4)), halo = new TH.Line2(geo, lineMat(O, 11, { add: true, op: 0.16 }));
  core.renderOrder = 5; halo.renderOrder = 4;
  for (const l of [core, halo]) { l.frustumCulled = false; l.visible = false; scene.add(l); }
  LINKS.push({ geo, core, halo, head: dotSprite(), end: dotSprite() });
}
let linkI = 0;
function linksReset() { linkI = 0; for (const L of LINKS) L.core.visible = L.halo.visible = L.head.visible = L.end.visible = false; }
function subLine(pts, q0, q1) {
  const d = [0]; for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(...[0, 1, 2].map((j) => pts[i][j] - pts[i - 1][j])));
  const L = d[d.length - 1], at_ = (u) => { let i = 1; while (i < pts.length - 1 && d[i] < u) i++; const k = (u - d[i - 1]) / Math.max(1e-6, d[i] - d[i - 1]); return [0, 1, 2].map((j) => lerp(pts[i - 1][j], pts[i][j], clamp(k))); };
  const u0 = q0 * L, u1 = q1 * L, out = [at_(u0)];
  for (let i = 1; i < pts.length - 1; i++) if (d[i] > u0 && d[i] < u1) out.push(pts[i]);
  out.push(at_(u1)); return out;
}
// link(t, pts, t0, dur, t1, col): draws on along pts over [t0, t0+dur], holds, fades out at t1. o.travel: the tail follows
function link(t, pts, t0, dur, t1, col, o = {}) {
  if (t < t0 || t > t1 || linkI >= LINKS.length) return null;
  const L = LINKS[linkI++], q = ease.inOut(prog(t, t0, t0 + dur)), q0 = o.travel ? ease.inOut(prog(t, t0 + dur * 0.35, t0 + dur * 1.25)) : 0;
  const a = (o.a ?? 1) * (1 - ep(t, t1 - 0.25, t1)) * (o.travel ? 1 - ep(t, t0 + dur * 1.05, t0 + dur * 1.25) : 1);
  if (q <= 0.001 || a <= 0.01) return null;
  const part = subLine(pts, q0, q).slice(0, LMAX), arr = L.geo.attributes.instanceStart.data.array;
  for (let i = 0; i < part.length - 1; i++) arr.set([...part[i], ...part[i + 1]], i * 6);
  L.geo.attributes.instanceStart.data.needsUpdate = true; L.geo.instanceCount = part.length - 1;
  for (const [l, k] of [[L.core, 1], [L.halo, 0.16]]) { l.visible = true; l.material.color.set(col); l.material.opacity = a * k; }
  const tip = part[part.length - 1], px = 1 / cam.s;
  if (q < 0.999 || o.travel) { L.head.visible = true; L.head.position.set(...tip); L.head.material.color.set(mixHex(col, '#ffffff', 0.5)); L.head.material.opacity = a; L.head.scale.set(16 * px, 16 * px, 1); }
  if (q >= 0.999 && !o.travel && !o.noEnd) { const k = ease.out(prog(t, t0 + dur, t0 + dur + 0.25)); L.end.visible = true; L.end.position.set(...tip); L.end.material.color.set(col); L.end.material.opacity = a * (0.6 + 0.4 * (1 - k)); L.end.scale.set((10 + 14 * (1 - k)) * px, (10 + 14 * (1 - k)) * px, 1); }
  return tip;
}

/* ---------------- beats */
const T = {
  tiny: at('tiny'), noisy: at('noisy'), cafe: at('cafe'), shazam: at('shazam'), names: at('names'), seconds: at('seconds'), how: at('how'),
  first: at('first'), turns: at('turns'), map: at('map'), low: at('low'), high: at('high'), time: at('time'), across: at('across'),
  louder: at('louder'), glow: at('glow'), keeps: at('keeps'), brightest: at('brightest'), patch: at('patch'), they: at('they'), stars: at('stars'), night: at('night'),
  cafe2: at('cafe', 2), adds: at('adds'), extra: at('extra'), hides: at('hides'), enough: at('enough'), survives: at('survives'),
  draws: at('draws'), lines: at('lines'), pairs: at('pairs'), turning: at('turning'), codes: at('codes'), together: at('together'), fingerprint: at('fingerprint'),
  shazam3: at('shazam', 3), millions: at('millions'), looks: at('looks'), line: at('line'), yours: at('yours'),
  when: at('when'), britain: at('britain'), y2002: at('2002'), no: at('no'), app: at('app'), dialed: at('dialed'), d2580: at('2580'), held: at('held'), speaker: at('speaker'), got: at('got'), name: at('name'), text: at('text'),
  so: at('so'), isnt: at("isn't"), tune: at('tune'), its: at("it's"), exact: at('exact'), recording: at('recording'), thats: at("that's"), humming: at('humming'), wont: at("won't"), follow: at('follow'),
};
const CUT = { CAFE: 0, HERO: T.shazam - 0.12, LAB: T.first - 0.12, RELIEF: T.louder - 0.12, FRONT: T.they - 0.12, NOISE: T.cafe2 - 0.12,
  PAIRS: T.draws - 0.12, FP: T.together - 0.15, DB: T.shazam3 - 0.12, MATCH: T.looks - 0.12, PUB: T.when - 0.12, OLDPH: T.dialed - 0.15,
  HOLD: T.held - 0.1, SMS: T.got - 0.1, TWIST: T.so - 0.1, HUMC: T.thats - 0.1, END: T.follow - 0.15 };

/* ---------------- build */
const F = buildCafe(), ST = buildPhones(), LW = buildLab(), DB = buildDB(), PB = buildPub(), HM = buildHum();
PB.spk.mouth = PB.spk.mouth.map((v, j) => v + (Z.OLD[j] || 0));   // the pub speaker's mouth in world coords
const HOLO = { note: [0, 1, 2].map(() => holo(ICO.note, 60, O)), mail: holo(ICO.mail, 26, OK), mail2: holo(ICO.mail, 30, OK), x: holo(ICO.x, 120, RED), xs: [...HIDDEN].map(() => holo(ICO.x, 34, '#bdb7b1')) };
const SONG = { t: 'Orange Hours', a: 'Mira Vale' };
const LAB0 = Z.LAB, wallC = (i, j, dy = -80) => { const [x, z] = LW.cell(i, j); return [LAB0[0] + x, LAB0[1] + dy, z]; };
const DBP = (i, j, dy = 0) => { const p = DB.at(i, j); return [Z.DB[0] + p[0], Z.DB[1] + p[1] + dy, p[2]]; };

/* ---------------- phone screens */
const UI = { card: '#1f1d1c', tile: '#2c2a28', tx: '#f5f4f3', tx2: '#a39e99', tx3: '#6f6a66' };
const uiSpace = (g, W, H) => { const k = W / 600; g.scale(k, k); return H / k; };
function rr(g, x, y, w, h, r, fill, stroke, lw = 2) { g.beginPath(); g.roundRect(x, y, w, h, r); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function dot(g, x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = fill; g.fill(); }
function tx(g, s, x, y, font, col, al = 'left', bl = 'alphabetic') { g.font = font; g.fillStyle = col; g.textAlign = al; g.textBaseline = bl; g.fillText(s, x, y); }
function statusBar(g, W, col = UI.tx) {
  tx(g, '9:41', 104, 68, '650 31px Inter', col, 'center');
  for (let k = 0; k < 4; k++) rr(g, W - 198 + k * 10, 70 - 10 - k * 5, 7, 10 + k * 5, 2, col);
  g.strokeStyle = col; g.lineCap = 'round'; g.lineWidth = 4.5; for (const r of [9, 17]) { g.beginPath(); g.arc(W - 132, 70, r, -Math.PI * 0.74, -Math.PI * 0.26); g.stroke(); } dot(g, W - 132, 68, 3.5, col);
  rr(g, W - 104, 47, 48, 24, 8, null, 'rgba(245,244,243,0.5)', 2.5); rr(g, W - 100, 51, 34, 16, 4, col); rr(g, W - 53, 55, 4, 8, 2, 'rgba(245,244,243,0.5)');
}
// five rounded bars: the "listening" glyph
function waveGlyph(g, x, y, s, col, t = 0, live = 0) {
  [0.42, 0.7, 1, 0.7, 0.42].forEach((h, k) => { const hh = s * h * (1 - live * 0.45 * (0.5 + 0.5 * Math.sin(t * 11 + k * 1.7))); rr(g, x + (k - 2) * s * 0.22 - s * 0.06, y - hh / 2, s * 0.12, hh, s * 0.06, col); });
}
function albumArt(g, x, y, s) {
  const gr = g.createLinearGradient(x, y, x + s, y + s); gr.addColorStop(0, '#ffb070'); gr.addColorStop(0.55, '#ff6a1f'); gr.addColorStop(1, '#5a1d0b');
  rr(g, x, y, s, s, 26, gr);
  g.save(); g.beginPath(); g.roundRect(x, y, s, s, 26); g.clip();
  for (let k = 0; k < 6; k++) { g.strokeStyle = `rgba(255,240,226,${0.5 - k * 0.07})`; g.lineWidth = 6; g.beginPath(); g.arc(x + s * 0.3, y + s * 0.72, s * (0.18 + k * 0.13), 0, 7); g.stroke(); }
  dot(g, x + s * 0.72, y + s * 0.3, s * 0.12, '#fff3e6');
  g.restore();
}
function shazamScreen(g, W0, H0, mode, t) {
  const H = uiSpace(g, W0, H0), W = 600;
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#2a1a12'); bg.addColorStop(0.5, '#151110'); bg.addColorStop(1, '#0c0a09'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  statusBar(g, W);

    const cy_ = H * 0.42, pk = 0.5 + 0.5 * Math.sin(t * 7);
    const glo = g.createRadialGradient(W / 2, cy_, 20, W / 2, cy_, 380); glo.addColorStop(0, 'rgba(255,106,31,0.35)'); glo.addColorStop(1, 'rgba(255,106,31,0)'); g.fillStyle = glo; g.fillRect(0, 0, W, H);
    for (let k = 0; k < 3; k++) { const r = ((t * 0.9 + k / 3) % 1); g.strokeStyle = `rgba(255,140,70,${0.55 * (1 - r)})`; g.lineWidth = 4; g.beginPath(); g.arc(W / 2, cy_, 160 + r * 150, 0, 7); g.stroke(); }
    g.save(); g.shadowColor = 'rgba(255,106,31,0.7)'; g.shadowBlur = 50; dot(g, W / 2, cy_, 150 + 6 * pk, O); g.restore();
    dot(g, W / 2, cy_, 132 + 6 * pk, '#ff7a33');
    waveGlyph(g, W / 2, cy_, 150, '#fff', t, 1);
    tx(g, 'Listening for music', W / 2, H * 0.15, '750 40px Inter', UI.tx, 'center');
    tx(g, 'Hold your phone near the sound', W / 2, H * 0.15 + 46, '550 26px Inter', UI.tx2, 'center');
    // a live level meter along the bottom
    for (let k = 0; k < 26; k++) { const h = 14 + 70 * Math.abs(Math.sin(t * 9 + k * 0.8) * Math.sin(t * 3.1 + k * 0.33)); rr(g, 46 + k * 20, H * 0.76 - h / 2, 10, h, 5, k % 5 === 0 ? '#ffd2a8' : 'rgba(255,106,31,0.8)'); }
    tx(g, 'Café noise detected', W / 2, H * 0.86, '600 25px Inter', UI.tx3, 'center');
  } else {
    const s = 360, x = (W - s) / 2, y = H * 0.12, q = ease.back(clamp((t - T.seconds) / 0.35));
    g.save(); g.translate(W / 2, y + s / 2); g.scale(0.85 + 0.15 * q, 0.85 + 0.15 * q); g.translate(-W / 2, -(y + s / 2));
    g.save(); g.shadowColor = 'rgba(255,106,31,0.5)'; g.shadowBlur = 50; albumArt(g, x, y, s); g.restore(); g.restore();
    tx(g, SONG.t, W / 2, y + s + 80, '800 50px Inter', UI.tx, 'center');
    tx(g, SONG.a, W / 2, y + s + 126, '650 32px Inter', O, 'center');
    rr(g, W / 2 - 150, y + s + 160, 300, 56, 28, UI.tile); tx(g, '✓  Found in 3.1 s', W / 2, y + s + 197, '650 25px Inter', UI.tx, 'center');
    rr(g, 50, H - 230, W - 100, 92, 46, O); tx(g, 'Play full song', W / 2, H - 172, '700 31px Inter', '#fff', 'center');
    rr(g, W / 2 - 110, H - 34, 220, 10, 5, UI.tx);

// the 2002 phone: a green-grey LCD with chunky dark pixels
function lcd(g, W0, H0, mode, t) {

  for (let k = 0; k < 4; k++) g.fillRect(0, 0, 0, 0);
  g.fillStyle = ink; for (let k = 0; k < 4; k++) g.fillRect(28 + k * 16, 70 - k * 12, 10, 12 + k * 12);
  g.fillRect(W - 96, 40, 62, 30); g.fillStyle = bg; g.fillRect(W - 92, 44, 54, 22); g.fillStyle = ink; g.fillRect(W - 90, 46, 34, 18); g.fillRect(W - 34, 48, 6, 14);
  const F_ = (sz, w = 700) => `${w} ${sz}px Mono`;

    tx(g, s + (Math.floor(t * 3) % 2 && n < 4 ? '_' : ''), W - 40, 300, F_(150), ink, 'right');

  }
  if (mode === 'call') {
    tx(g, 'Calling', W / 2, 170, F_(54), ink, 'center'); tx(g, '2580', W / 2, 280, F_(110), ink, 'center');
    const s = Math.max(0, Math.floor((t - T.d2580 - 0.7) * 1)); tx(g, '00:' + String(Math.min(59, s + 3)).padStart(2, '0'), W / 2, 360, F_(44), ink, 'center');
    for (let k = 0; k < 9; k++) { const h = 10 + 40 * Math.abs(Math.sin(t * 8 + k)); g.fillRect(150 + k * 34, 430 - h, 20, h); }
  }

    if (mode === 'sms') {

      g.strokeStyle = ink; g.lineWidth = 12; g.strokeRect(190, 110, 220, 150); g.beginPath(); g.moveTo(190, 110); g.lineTo(300, 200); g.lineTo(410, 110); g.stroke();
      if (bl) g.fillRect(420, 96, 26, 26);
      tx(g, '1 message', W / 2, 340, F_(56), ink, 'center'); tx(g, 'received', W / 2, 400, F_(56), ink, 'center');
      tx(g, 'Read', W / 2, H - 34, F_(44), ink, 'center');
    } else {
      tx(g, 'From: 2580', 30, 150, F_(40, 600), ink); g.fillRect(30, 168, W - 60, 6);
      tx(g, SONG.t, 30, 250, F_(62), ink); tx(g, 'by ' + SONG.a, 30, 330, F_(54), ink);
      tx(g, 'Options', 30, H - 34, F_(44), ink); tx(g, 'Back', W - 30, H - 34, F_(44), ink, 'right');
    }
  }
}
const paintHero = (t, mode) => ST.yours.s.draw(mode + Math.floor(t * 20), (g, W, H) => shazamScreen(g, W, H, mode, t));
const paintOld = (t, mode) => ST.old.s.draw(mode + Math.floor(t * 12), (g, W, H) => lcd(g, W, H, mode, t));
const paintMini = (t, mode) => PB.mini.s.draw(mode + Math.floor(t * 6), (g, W, H) => lcd(g, W, H, mode, t));

/* ---------------- camera */
const CUTS = [];
const cut = (t, f, s, o = {}) => CUTS.push({ t, f, s, ...o });
const yp = ST.yours.top, op = ST.old.top, ZH = HM.z + HM.h / 2;
const PAIRC = (() => { let x = 0, z = 0; PAIRS.forEach(([a, b]) => { for (const k of [a, b]) { const w = wallC(PEAKS[k].i, PEAKS[k].j); x += w[0]; z += w[2]; } }); return [x / (PAIRS.length * 2), LAB0[1], z / (PAIRS.length * 2)]; })();
cut(CUT.CAFE, wz('CAFE', 90, 70, 110), 0.56, { push: 1.1, sy: 450 });
cut(CUT.HERO, [yp[0], yp[1], yp[2] + 4], 3.3, { e: 0.3, push: 1.06, sy: 440 });
cut(CUT.LAB, wz('LAB', 0, 0, Z0 + NY * CW / 2 - 40), 0.44, { a: -0.22, e: 0.14, push: 1.06, sy: 420 });
cut(CUT.RELIEF, wz('LAB', 160, 0, Z0 + NY * CW / 2), 0.62, { a: -0.62, e: 0.34, push: 1.08, sy: 430 });
cut(CUT.FRONT, wz('LAB', 0, 0, Z0 + NY * CW / 2), 0.47, { a: -0.1, e: 0.08, push: 1.06, sy: 430 });
cut(CUT.NOISE, wz('LAB', 0, 0, Z0 + NY * CW / 2), 0.47, { a: 0.08, e: 0.1, push: 1.05, sy: 430 });
