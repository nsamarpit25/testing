<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 22 WebSockets, in the ember style. World: your FRIEND's phone, a SERVER box and YOUR phone, with floor lines between them.
     Hook: the friend's message lands on your phone with no refresh. Then plain request/reply: your app asks, gets one answer,
     the line goes dark; the server holds a new message it can't send first. A WebSocket keeps your line open, so the server
     pushes the message straight down it. The catch: a crowd of phones, each with an open line, fills the server's memory;
     your line drops and reconnects. Beats come from voice/words.json via at(). Shared pieces live in ../_ember/. -->
<link rel="stylesheet" href="../_ember/fonts.css">
<link rel="stylesheet" href="../_ember/reel.css">
</head>
<body>
<div id="stage">
  <div id="world">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div class="layer" id="lbls"></div>
  </div>
</div>
<script src="../../tools/lib.js"></script>
<script src="voice/words.js"></script>
<script src="../_ember/three.js"></script>
<script src="../_ember/world.js"></script>
<script src="../_ember/base.js"></script>
<script>
for (let i = 0; i < 16; i++) ORBS.push({ core: orbSprite(9), glow: orbSprite(34), trail: [0, 1, 2, 3, 4].map(() => orbSprite(10)) });

/* ---------------- beats */
const T = {
  hit: at('hits'), send: at('send'), popped: at('popped'), instantly: at('instantly'), never: at('never'), how: at('how'), know: at('know'),
  normally: at('normally'), asks: at('asks'), answers: at('answers'), ask: at('ask'), again: at('again'),
  in_: at('in'), setup: at('setup'), only: at('only'), speaks: at('speaks'), asked: at('asked'),
  web: at('web'), keeps: at('keeps'), line: at('line'), open: at('open'), call: at('call'), nobody: at('nobody'),
  now: at('now'), either: at('either'), talk: at('talk'), when2: at('when', 2), reaches: at('reaches'), sends: at('sends'), line2e: at('line', 2, true),
  one: at('one'), catch_: at('catch'), every: at('every'), memory: at('memory'), connection: at('connection'), breaks: at('breaks'), reconnect: at('reconnect'),
  discord: at('discord'), browsers: at('browsers'), ifv: at('if', 2), follow: at('follow'),
};
const CUT = { NORM: T.normally - 0.2, WAIT: T.in_ - 0.2, WS: T.web - 0.3, PUSH: T.now - 0.2, CATCH: T.one - 0.2, TOOLS: T.discord - 0.3, END: T.ifv - 0.15 };

/* ---------------- layout */
const FR = [-175, 20], SRV = [0, 40], YOU = [175, 20];
const CROWD = [...Array(8)].map((_, i) => [-175 + i * 50, 210]);
const MID = [(SRV[0] + YOU[0]) / 2, 30, 20];
const TRIPS = [[T.asks - 0.1, T.answers + 0.5], [T.ask - 0.05, T.again + 0.7]];    // plain request/reply: the line is up only per trip
const ARRIVE1 = T.instantly - 0.25, ARRIVE2 = T.line2e - 0.1;                      // when the friend's message lands on your phone

/* ---------------- camera */
const WIDE = { f: [0, 110, 50], s: 0.95, a: -0.42, e: 0.62, sy: 490 };
const SHOTS = [
  { t: 0, d: 0, f: [0, 30, 60], s: 1.18, a: -0.38, e: 0.56, sy: 470 },
  { t: CUT.NORM, d: 1.0, f: [112, 30, 60], s: 1.42, a: -0.42, e: 0.58, sy: 490 },
  { t: CUT.WS, d: 1.0, f: [112, 30, 60], s: 1.36, a: -0.42, e: 0.58, sy: 490 },
  { t: CUT.PUSH, d: 1.0, f: [25, 30, 60], s: 1.14, a: -0.42, e: 0.6, sy: 470 },
  { t: CUT.CATCH, d: 1.0, ...WIDE },
  { t: CUT.TOOLS, d: 1.0, ...WIDE, s: 0.92, sy: 570 },
  { t: CUT.END, d: 2.0, ...WIDE, s: 0.9, sy: 550 },
];

// t2 remake: every shot re-angled (azimuth, elevation, zoom) so no frame matches the original
const REANGLE = [[0.16, -0.05, 1.05], [-0.14, 0.05, 1.04], [0.13, -0.04, 1.06], [-0.15, 0.05, 1.05], [0.14, -0.05, 1.04], [-0.12, 0.04, 1.06], [0.15, 0.05, 1.05]];
SHOTS.forEach((s, i) => { const r = REANGLE[i % REANGLE.length]; s.a += r[0]; s.e = Math.min(1.0, Math.max(0.3, s.e + r[1])); s.s *= r[2]; });

const KICKS = [[T.send, 0.03], [T.instantly, 0.04], [T.know, 0.03], [T.answers, 0.03], [T.only, 0.03], [T.web, 0.05], [T.either, 0.03],
  [T.sends, 0.04], [T.memory, 0.04], [T.breaks, 0.05], [T.reconnect, 0.04], [T.discord, 0.03], [T.browsers, 0.03]];
const SHAKES = [[T.breaks, 3, 0.3]];

/* ---------------- build the world */
const label = (g, W_, H_, txt, col, size, y = H_ / 2) => { g.fillStyle = col; g.font = `800 ${size}px Mono`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = col; g.shadowBlur = 12; g.fillText(txt, W_ / 2, y); g.shadowBlur = 0; g.textAlign = 'left'; };
const mk = (p, w, d, h, col, k = 6) => { const b = emberBox(p[0], p[1], w, d, h, col); const f = decal(w, h, 'front', k, b.g); f.m.position.set(0, -d / 2 - 0.3, h / 2); return { b, f, pl: pool(p[0], p[1], w * 1.3, col), p }; };
const fr = mk(FR, 84, 18, 140, O, 5), you = mk(YOU, 84, 18, 140, O, 5), srv = mk(SRV, 110, 66, 150, O, 4);
const CP = CROWD.map((p) => mk(p, 38, 12, 66, O, 7));
const rF = road([[FR[0] + 42, FR[1], 80], [SRV[0] - 55, SRV[1], 90]], O2), rY = road([[SRV[0] + 55, SRV[1], 90], [YOU[0] - 42, YOU[1], 80]], O2);   // cables in mid-air
const rC = CROWD.map((p) => road([[p[0], p[1] - 8, 0], [SRV[0] + (p[0] - SRV[0]) * 0.25, SRV[1] + 34, 0]], AMB));
const P_FS = [[FR[0] + 42, FR[1], 80], [SRV[0] - 55, SRV[1], 90]], P_SY = [[SRV[0] + 55, SRV[1], 90], [YOU[0] - 42, YOU[1], 80]];
const P_YS = [...P_SY].reverse();

function bubble(g, W_, txt, y, col, right) {
  g.font = '800 50px Mono'; const w = Math.min(W_ - 36, g.measureText(txt).width + 36), x = right ? W_ - 18 - w : 18;
  g.strokeStyle = col; g.lineWidth = 6; rrect(g, x, y, w, 84, 20); g.stroke();
  g.fillStyle = col; g.textBaseline = 'middle'; g.fillText(txt, x + 18, y + 44);
}
function phoneDraw(g, W_, H_, col, title, msgs, status, stCol) {
  g.strokeStyle = col + 'aa'; g.lineWidth = 6; rrect(g, 14, 14, W_ - 28, H_ - 28, 34); g.stroke();
  label(g, W_, H_, title, col, 56, 80);
  msgs.forEach((m, i) => bubble(g, W_, m[0], 150 + i * 108, m[1], m[2]));
  if (status) label(g, W_, H_, status, stCol || col, 48, H_ - 80);
}
function srvDraw(g, W_, H_, col, mem, status, stCol) {
  label(g, W_, H_, 'SERVER', col, 50, H_ * 0.12);
  for (let k = 0; k < 3; k++) { const y = H_ * 0.23 + k * H_ * 0.12; g.strokeStyle = col + '88'; g.lineWidth = 4; rrect(g, 26, y, W_ - 52, H_ * 0.08, 6); g.stroke(); }
  if (mem > 0.01) {
    const y = H_ * 0.62, w = W_ - 52, mc = mem > 0.6 ? RED : AMB;
    g.fillStyle = mc + '44'; rrect(g, 26, y, w, 38, 8); g.fill(); g.fillStyle = mc; rrect(g, 26, y, w * mem, 38, 8); g.fill();
    label(g, W_, H_, 'MEMORY', mc, 34, y + 66);
  }
  if (status) label(g, W_, H_, status, stCol || col, 40, H_ * 0.9);
}

/* ---------------- the world, frame by frame */
function world(t) {
  const thru = (pts, t0, dur, col, size = 1) => { const q = (t - t0) / dur; if (q > -0.02 && q < 1.1) orb(pts, clamp(q), col, clamp(q / 0.08) * (1 - clamp((q - 1) / 0.1)), size); };
  const q0 = ease.back(prog(t, 0.05, 0.4));
  const wsOn = t > T.web, broken = t > T.breaks && t < T.reconnect;
  const nConn = Math.round(1 + 9999 * ease.inOut(prog(t, T.every, T.memory + 0.4)));
  const mem = t > T.every ? clamp(0.15 + 0.85 * ease.inOut(prog(t, T.every, T.memory + 0.3))) : 0;

  // the friend's phone
  const fSend = [T.send, T.in_, T.reaches - 0.45];
  const fCol = fSend.some((s) => t > s - 0.1 && t < s + 0.6) ? O2 : O;
  fr.b.g.visible = q0 > 0.01; fr.b.g.scale.set(1, 1, Math.max(0.01, q0)); fr.b.setLook(fCol, 1.2 + 2 * Math.max(...fSend.map((s) => pulse(t, s))), 1);
  const fMsgs = [];
  if (t > T.send - 0.1) fMsgs.push(['hey!', O2, true]);
  if (t > T.reaches - 0.5) fMsgs.push(['on my way', O2, true]);
  fr.f.m.visible = fr.b.g.visible; fr.f.draw((g, W_, H_) => phoneDraw(g, W_, H_, fCol, 'FRIEND', fMsgs.slice(-2), t > T.send - 0.1 && t < T.send + 0.8 ? 'SENT' : '', OK)); fr.pl.set(fCol, 0.45 * q0);
  rF.set(1, O2, 0.6 * Math.max(...fSend.map((s) => window01(t, s - 0.2, s + 1.0, 0.15))), t);
  fSend.forEach((s) => thru(P_FS, s + 0.05, 0.45, O2));

  // the server
  const holding = t > T.in_ + 0.5 && t < T.sends;                                     // has your friend's message, can't send it first
  const sCol = broken ? O : mem > 0.6 && t < CUT.TOOLS ? mixHex(O, RED, 0.6) : holding && !wsOn ? mixHex(O, AMB, 0.5 + 0.5 * Math.sin(t * 8)) : O;
  srv.b.g.visible = q0 > 0.01; srv.b.g.scale.set(1, 1, Math.max(0.01, q0));
  srv.b.setLook(sCol, 1.2 + 2 * Math.max(pulse(t, T.answers), pulse(t, T.again), pulse(t, T.sends), pulse(t, T.memory)), 1);
  const sSt = holding ? (wsOn ? 'MESSAGE READY' : '1 MESSAGE WAITING') : t > T.every && t < CUT.TOOLS ? `${nConn.toLocaleString('en-US')} OPEN` : '';
  srv.f.m.visible = srv.b.g.visible; srv.f.draw((g, W_, H_) => srvDraw(g, W_, H_, sCol, mem, sSt, holding ? AMB : t > T.every ? AMB : O)); srv.pl.set(sCol, 0.5 * q0);
  if (holding && !wsOn) sparks(t, T.in_ + 0.5, SRV[0], SRV[1], 155, AMB, 8, 11, 70, 0.5);

  // your phone + the line to it
  const yCol = broken ? RED : wsOn ? mixHex(O, OK, 0.35) : O;
  you.b.g.visible = q0 > 0.01; you.b.g.scale.set(1, 1, Math.max(0.01, q0));
  you.b.setLook(yCol, 1.2 + 2 * Math.max(pulse(t, ARRIVE1), pulse(t, ARRIVE2), pulse(t, T.reconnect)), 1);
  const yMsgs = [];
  if (t > ARRIVE1 && t < CUT.NORM) yMsgs.push(['hey!', OK, false]);
  if (t > T.asks - 0.1 && t < CUT.WS) yMsgs.push(['new msgs?', O2, true]);
  if (t > T.answers && t < CUT.WS) yMsgs.push(['no', GR, false]);
  if (t > ARRIVE2) yMsgs.push(['on my way', OK, false]);
  const ySt = broken ? 'OFFLINE' : t > T.reconnect ? 'ONLINE' : t > T.never && t < CUT.NORM ? 'NO REFRESH' : '';
  you.f.m.visible = you.b.g.visible; you.f.draw((g, W_, H_) => phoneDraw(g, W_, H_, yCol, 'YOU', yMsgs.slice(-3), ySt, broken ? RED : OK)); you.pl.set(yCol, 0.5 * q0);
  // the line: up in the hook (the mystery), per trip in plain request/reply, then held open by the WebSocket
  const hookA = window01(t, 0.3, CUT.NORM + 0.2, 0.2);
  const tripA = Math.max(...TRIPS.map(([a, b]) => window01(t, a, b, 0.15)));
  const wsA = wsOn ? ep(t, T.web, T.web + 0.5) * (broken ? Math.max(0, 1 - prog(t, T.breaks, T.breaks + 0.35)) * (0.5 + 0.5 * Math.sin(t * 40)) : 1) : 0;
  const recA = t > T.reconnect ? ep(t, T.reconnect, T.reconnect + 0.5) : 1;
  rY.set(wsOn ? recA : 1, broken ? RED : wsOn ? OK : O2, Math.max(hookA * 0.7, tripA * 0.8, wsA), t);
  thru(P_SY, T.send + 0.55, 0.45, OK);                                                 // hook: it just arrives
  TRIPS.forEach(([a]) => thru(P_YS, a + 0.05, 0.45, O2));                              // ask
  thru(P_SY, T.answers - 0.05, 0.45, GR, 0.8); thru(P_SY, T.again + 0.2, 0.45, GR, 0.8); // one answer each, then hang up
  if (t > T.only && t < CUT.WS) { const q = (t - T.only) % 0.9 / 0.9; orb([[SRV[0] + 55, SRV[1], 90], [SRV[0] + 95, SRV[1] - 4, 86]], q, RED, 1 - q, 0.8); }   // tries, can't
  thru(P_YS, T.either, 0.5, OK, 0.8); thru(P_SY, T.either + 0.1, 0.5, OK, 0.8);       // either side can talk
  thru(P_SY, T.sends - 0.05, 0.5, OK);                                                 // pushed down the open line
  if (t > T.web - 0.05 && t < T.web + 0.4) ripple(t, T.web, MID[0], MID[1], 85, OK, 120, 0.7);
  ripple(t, T.breaks, YOU[0], YOU[1], 2, RED, 110, 0.8); sparks(t, T.breaks, MID[0], MID[1], 85, RED, 14, 31, 110, 0.6);
  ripple(t, T.reconnect + 0.3, YOU[0], YOU[1], 2, OK, 110, 0.8);

  // the crowd: every phone holds a line open
  CP.forEach((c, i) => {
    const qi = ease.back(prog(t, T.every - 0.1 + i * 0.06, T.every + 0.3 + i * 0.06));
    const cCol = mem > 0.6 && t < CUT.TOOLS ? mixHex(AMB, RED, 0.5) : AMB;
    c.b.g.visible = qi > 0.01; c.b.g.scale.set(1, 1, Math.max(0.01, qi)); c.b.setLook(cCol, 1 + pulse(t, T.memory + i * 0.04), 1);
    c.f.m.visible = c.b.g.visible; c.f.draw((g, W_, H_) => { g.strokeStyle = cCol + 'aa'; g.lineWidth = 6; rrect(g, 10, 10, W_ - 20, H_ - 20, 22); g.stroke(); label(g, W_, H_, '⇄', cCol, 72); });
    c.pl.set(cCol, 0.22 * qi);
    rC[i].set(ep(t, T.every + i * 0.06, T.every + 0.4 + i * 0.06), cCol, 0.55 * (t > T.every ? 1 : 0), t);
  });
}

/* ---------------- world tags */
function tags(t) {
  const F_T = [FR[0], FR[1], 175], S_T = [SRV[0], SRV[1], 190], Y_T = [YOU[0], YOU[1], 175], C_T = [CROWD[3][0] + 25, CROWD[3][1], 100];
  const big = (c) => `font-size:15px;padding:9px 13px;letter-spacing:1px;border-color:${c}`;
  tag('sent', `<span style="color:${O2}">SEND</span>`, `border-color:${O2}88`, F_T, t, T.hit, T.never);
  tag('inst', `<span style="color:${OK}">ARRIVED INSTANTLY</span>`, `border-color:${OK}88`, Y_T, t, T.instantly, T.how - 0.05);
  tag('how', `<span style="color:${AMB}">HOW DID IT KNOW?</span>`, big(AMB), Y_T, t, T.how, CUT.NORM + 0.3);
  tag('ask', `<span style="color:${O2}">① ASK</span>`, `border-color:${O2}88`, MID, t, T.asks, T.answers - 0.05, 30);
  tag('ans', `<span style="color:${WH}">② ONE ANSWER · DONE</span>`, '', MID, t, T.answers, T.ask - 0.05, 30);
  tag('again', `<span style="color:${O2}">ASK AGAIN… AND AGAIN</span>`, `border-color:${O2}88`, MID, t, T.ask, CUT.WAIT + 0.2, 30);
  tag('wait', `<span style="color:${AMB}">NEW MESSAGE WAITING</span>`, big(AMB), S_T, t, T.in_ + 0.5, CUT.WS + 0.1);
  tag('first', `<span style="color:${RED}">✕ CAN'T SEND FIRST</span>`, big(RED), MID, t, T.only, CUT.WS + 0.1, 30);
  tag('open', `<span style="color:${OK}">LINE STAYS OPEN</span>`, big(OK), MID, t, T.keeps + 0.2, CUT.PUSH + 0.2, 30);
  tag('both', `<span style="color:${OK}">⇄ EITHER SIDE TALKS</span>`, `border-color:${OK}88`, MID, t, T.either, T.reaches - 0.1, 30);
  tag('push', `<span style="color:${OK}">PUSHED · NO ASKING</span>`, big(OK), Y_T, t, T.sends + 0.3, CUT.CATCH + 0.2);
  tag('crowd', `<span style="color:${AMB}">EVERY PHONE · ONE OPEN LINE</span>`, `border-color:${AMB}88`, C_T, t, T.every + 0.2, T.memory - 0.05, 30);
  tag('mem', `<span style="color:${RED}">MEMORY FILLS UP</span>`, big(RED), S_T, t, T.memory, T.breaks - 0.1);
  tag('drop', `<span style="color:${RED}">CONNECTION DROPPED</span>`, big(RED), Y_T, t, T.breaks, T.reconnect);
  tag('rec', `<span style="color:${OK}">✓ RECONNECTED</span>`, big(OK), Y_T, t, T.reconnect + 0.1, CUT.END + 0.2);
}

/* ---------------- reel config */
const svgChat = `<svg width="46" height="46" viewBox="0 0 100 100" fill="none" stroke="#7B86F5" stroke-width="7" stroke-linejoin="round"><path d="M14 22 H86 V70 H44 L26 86 V70 H14 Z"/><circle cx="38" cy="46" r="4"/><circle cx="62" cy="46" r="4"/></svg>`;
const svgBrowser = `<svg width="46" height="46" viewBox="0 0 100 100" fill="none" stroke="#7CF29A" stroke-width="7" stroke-linejoin="round"><rect x="10" y="18" width="80" height="64" rx="8"/><path d="M10 36 H90"/><circle cx="22" cy="27" r="2"/><circle cx="32" cy="27" r="2"/></svg>`;
const REEL = {
  shots: SHOTS, kicks: KICKS, shakes: SHAKES, world, tags,
  code: [
    [T.web - 0.3, CUT.CATCH - 0.1, 'chat.js', 'your app', [[0, 'CONNECTING', AMB], [T.keeps, 'OPEN', OK]],
      [["ws = new WebSocket('wss://chat')"], ['ws.onmessage = (m) => show(m)', T.either - 0.2], ["show('on my way')", T.sends + 0.1]],
      [[T.keeps, 1, '✓ open', 'good'], [T.either, 2, 'listening', 'amb'], [T.sends, 2, '⇣ pushed', 'good'], [T.sends + 0.3, 3, '✓ shown', 'good']], 'type'],
    [T.one - 0.2, CUT.TOOLS - 0.1, 'server', 'open connections', [[0, 'OK', AMB], [T.memory, 'MEMORY HIGH', RED], [T.reconnect, 'RECONNECTED', OK]],
      [['open lines'], ['server memory', T.memory - 0.2], ['you: connection lost', T.breaks], ['you: reconnect()', T.reconnect]],
      [[T.every, 1, (t) => Math.round(1 + 9999 * ease.inOut(prog(t, T.every, T.memory + 0.4))).toLocaleString('en-US'), 'amb'], [T.memory, 2, '▲ high', 'bad'], [T.breaks, 3, '✕ dropped', 'bad'], [T.reconnect, 4, '✓ back', 'good']]],
  ],
  hl: /\b(ws|WebSocket|onmessage|show|reconnect|server)\b/g,
  tools: [
    { a: T.discord - 0.1, b: CUT.END, svg: svgChat, name: 'Discord', sub: 'LIVE UPDATES OVER WEBSOCKETS', top: 150 },
    { a: T.browsers - 0.1, b: CUT.END, svg: svgBrowser, name: 'Your browser', sub: 'WEBSOCKET API · BUILT IN', top: 262 },
  ],
  slams: [
    { a: T.web - 0.2, b: T.open + 0.3, text: 'WebSocket', sub: 'ONE LINE THAT STAYS OPEN', size: 64 },
  ],
  bad: ['catch', 'breaks'],
  good: ['instantly', 'either', 'reconnect'],
  tiles: [['⇄', 'WEB<br>SOCKETS'], ['⏰', 'CRON<br>JOBS'], ['✉', 'DEAD LETTER<br>QUEUES']],
  end: CUT.END, follow: T.follow,
  wbw: true,
  cover: { k: 'WEBSOCKETS', t: 'YOU NEVER<br>REFRESHED', at: T.know + 0.3, zoom: 0.92, dy: 30 },
  flash: (t) => 0.06 * pulse(t, T.web, 7) + 0.08 * pulse(t, T.breaks, 7),
};
</script>
<script src="../_ember/overlay.js"></script>
<script src="../_ember/play.js"></script>
</body>
</html>
