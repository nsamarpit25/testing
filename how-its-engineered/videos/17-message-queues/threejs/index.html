<!doctype html>
<html>

<title>Message Queues 3D</title>
<!-- 17 Message Queues, Three.js port of studio/scene.py (first 10 s): phone -> ORDER -> direct cable -> PAYMENT, Black Friday pile-up,
     then the glass queue lane drops in. Coordinates are written Blender-style (x right, y away, z up) and converted by V(). -->
<link rel="stylesheet" href="../../16-retries/lib/fonts.css">
<style>
html, body { margin: 0; background: #04060B; }
#stage { position: relative; width: 540px; height: 960px; overflow: hidden; background: #04060B; font-family: Inter, sans-serif; }
#gl { position: absolute; inset: 0; width: 540px; height: 960px; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%); }
#cap { position: absolute; left: 24px; right: 24px; top: 742px; height: 40px; pointer-events: none; }
#cap .box { display: none; position: absolute; inset: 0; justify-content: center; align-items: center; white-space: nowrap; font-weight: 800; font-size: 23px; line-height: 1; letter-spacing: -0.4px; }
#cap .w { display: inline-block; margin: 0 4px; color: #fff; -webkit-text-stroke: 4px #0b0a09; paint-order: stroke fill; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"

<body>
<div id="stage"><canvas id="gl"></canvas><div id="vig"></div><div id="cap"></div></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const VOICE = '../studio/voice';
const [WORDS, TIM, CAPS] = await Promise.all([`${VOICE}/words.json`, `${VOICE}/timings.json`, 'caps.json'].map((u) => fetch(u).then((r) => r.json())));
await document.fonts.load('bold 40px "DIN Alternate"').catch(() => {});
await document.fonts.ready;
const DIN = '"DIN Alternate", "DIN Condensed", "Arial Narrow", sans-serif';

const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
const W = (tok, after = 0) => { for (const [w, s] of WORDS) if (s >= after - 1e-6 && norm(w) === tok) return s; throw new Error(tok); };
const L = (li, pi = 0) => TIM.find((x) => x.li === li && x.pi === pi).start;
const DURATION = 10.6;

// ---------- keyframe tracks (Blender-like: eased segments, constant outside) ----------
const ease = (s) => s * s * (3 - 2 * s);
const lerp = (a, b, s) => (Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * s) : a + (b - a) * s);
function track(keys, step = false) {
  keys = [...keys].sort((p, q) => p[0] - q[0]);
  return (t) => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const [ta, va] = keys[i - 1], [tb, vb] = keys[i];
      if (t < tb) return step ? va : lerp(va, vb, tb > ta ? ease((t - ta) / (tb - ta)) : 1);
    }
    return keys[keys.length - 1][1];
  };
}
const TINY = 0.001;
// scale-pop in with a small overshoot, optionally out
const pop = (on, off = null, over = 1.12, p = 0.18) => track([[0, TINY], [on - 0.001, TINY], [on + p * 0.6, over], [on + p, 1], ...(off != null ? [[off - 0.12, 1], [off, TINY]] : [])]);
let seed = 11; const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
const ru = (a, b) => a + (b - a) * rnd();

// Blender (x, y, z) -> three (x, z, -y)
const V = (x, y, z) => new THREE.Vector3(x, z, -y);
const setV = (o, p) => o.position.set(p[0], p[2], -p[1]);

// ---------- renderer / scene ----------
const canvas = document.getElementById('gl');
const R = new THREE.WebGLRenderer({ canvas, antialias: true });
R.setPixelRatio(2); R.setSize(540, 960, false);
R.toneMapping = THREE.AgXToneMapping; R.toneMappingExposure = 1.05;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.VSMShadowMap;
const scene = new THREE.Scene();
scene.background = (() => {
  const c = document.createElement('canvas'); c.width = 270; c.height = 480; const g = c.getContext('2d');
  const lin = g.createLinearGradient(0, 0, 0, 480); lin.addColorStop(0, '#0A1022'); lin.addColorStop(0.3, '#070A14'); lin.addColorStop(1, '#070A14');
  g.fillStyle = lin; g.fillRect(0, 0, 270, 480);
  for (const [x, y, r, col_] of [[30, 40, 200, 'rgba(38,140,220,0.14)'], [250, 30, 210, 'rgba(120,100,255,0.13)']]) {
    const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col_); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg; g.fillRect(0, 0, 270, 480);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
scene.fog = new THREE.Fog('#070A14', 12, 30);
const pm = new THREE.PMREMGenerator(R);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.22;
RectAreaLightUniformsLib.init();

const C = { amber: '#FFB020', violet: '#8C7BFF', cyan: '#26B8FF', green: '#22D38A', red: '#FF3B4E' };
const col = (h) => new THREE.Color(h);

// ---------- helpers ----------
function rrect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
// rounded-rect slab in the XY plane, thickness along z, centred
function slab(w, h, d, r, bevel = 0.006) {
  const g = new THREE.ExtrudeGeometry(rrect(w, h, r), { depth: d - bevel * 2, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 12 });
  g.translate(0, 0, -(d - bevel * 2) / 2); return g;
}
// horizontal ring (band) of a rounded rect: outer w x d, wall thickness th, height h
function ring(w, d, r, th, h) {
  const s = rrect(w, d, r); s.holes.push(rrect(w - th * 2, d - th * 2, Math.max(0.01, r - th)));
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 16 });
  g.rotateX(-Math.PI / 2); return g;
}
const std = (o) => new THREE.MeshStandardMaterial(o);
const phys = (o) => new THREE.MeshPhysicalMaterial(o);
const GLOW = 0.55;
const emiss = (h, k = 1) => std({ color: '#111', emissive: col(h), emissiveIntensity: k * GLOW, roughness: 0.4 });
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const redraw = (...a) => { g.clearRect(0, 0, w, h); draw(g, w, h, ...a); tex.needsUpdate = true; };
  redraw(); return { tex, redraw, g };
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function mesh(geo, mat, parent, cast = true) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; (parent || scene).add(m); return m; }

// ---------- stage ----------
const grid = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#0B0F18'; g.fillRect(0, 0, w, h); g.strokeStyle = '#1C2638'; g.lineWidth = 3; g.strokeRect(0, 0, w, h); });
grid.tex.wrapS = grid.tex.wrapT = THREE.RepeatWrapping; grid.tex.repeat.set(300, 300);
const floor = mesh(new THREE.PlaneGeometry(300, 300), std({ map: grid.tex, roughness: 0.62, metalness: 0.1, color: new THREE.Color(0.7, 0.7, 0.75) }), null, false);
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, -4);

const CEN = V(0, 3.8, 0.6);
function areaL(p, color, intensity, w, h) { const l = new THREE.RectAreaLight(color, intensity, w, h); l.position.copy(p); l.lookAt(CEN); scene.add(l); return l; }
const top = new THREE.RectAreaLight('#EEF3FF', 2.6, 9, 9); top.position.copy(V(0, 3.5, 11)); top.lookAt(V(0, 3.5, 0)); scene.add(top);
areaL(V(-7, 12, 4.5), C.cyan, 2.2, 6, 6); areaL(V(7, 12, 4.5), C.violet, 2.2, 6, 6); areaL(V(6.5, -4, 3), '#9DB8FF', 0.8, 5, 5);
const key = new THREE.DirectionalLight('#FFF1E0', 1.7); key.position.copy(V(-6.5, -5.5, 7.5)); key.target.position.copy(CEN); scene.add(key, key.target);
key.castShadow = true; key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 10; key.shadow.blurSamples = 20; key.shadow.bias = -0.0002;
Object.assign(key.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 30 });
scene.add(new THREE.HemisphereLight('#AFC4FF', '#0A0E16', 0.12));

// ---------- soft contact shadows (blurred rounded-rect decals on the floor) ----------
const shadowTex = canvasTex(256, 256, (g, w, h) => { g.filter = 'blur(22px)'; rr(g, 52, 52, 152, 152, 40); g.fillStyle = 'rgba(0,0,0,0.85)'; g.fill(); });
function contact(parent, w, d, k = 1) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.7, d * 1.7), new THREE.MeshBasicMaterial({ map: shadowTex.tex, transparent: true, depthWrite: false, opacity: k }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.004; m.renderOrder = 1; parent.add(m); return m;
}

// ---------- pods ----------
const ceramic = phys({ color: '#E8EBF1', roughness: 0.34, clearcoat: 0.35, clearcoatRoughness: 0.1 });
const plinthM = std({ color: '#151B28', roughness: 0.45, metalness: 0.3 });
const glassBlk = phys({ color: '#05080F', roughness: 0.14, clearcoat: 1, clearcoatRoughness: 0.05 });
function pod(x, y, accent, label, sub, meter = false) {
  const g = new THREE.Group(); setV(g, [x, y, 0]); scene.add(g);
  const bandM = emiss(accent, 3);
  contact(g, 1.9, 1.7, 0.9);
  mesh(new RoundedBoxGeometry(1.75, 0.1, 1.55, 3, 0.04), plinthM, g).position.y = 0.05;
  mesh(new RoundedBoxGeometry(1.5, 1.4, 1.3, 7, 0.26), ceramic, g).position.y = 0.8;
  mesh(ring(1.54, 1.34, 0.3, 0.025, 0.05), bandM, g, false).position.y = 0.28;
  const hatch = mesh(slab(0.72, 0.5, 0.02, 0.1, 0.004), std({ color: '#0B0F18', roughness: 0.3 }), g, false); hatch.rotation.x = -Math.PI / 2; hatch.position.set(0, 1.505, -0.05);
  mesh(ring(0.8, 0.58, 0.13, 0.04, 0.012), bandM, g, false).position.set(0, 1.5, -0.05);
  const scr = mesh(slab(1.16, 0.64, 0.03, 0.1, 0.006), glassBlk, g, false); scr.position.set(0, 0.93, 0.655);
  const st = { load: 0.15, loadCol: C.violet, sub };
  const face = canvasTex(928, 512, (c, w, h) => {
    c.scale(2, 2); c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#FFFFFF'; c.font = `bold 78px ${DIN}`; c.fillText(label, 232, 100);
    c.fillStyle = accent; c.font = `bold 34px ${DIN}`; c.fillText(st.sub, 232, 164);
    if (meter) { rr(c, 72, 206, 320, 20, 10); c.fillStyle = '#1C2436'; c.fill(); rr(c, 72, 206, Math.max(20, 320 * st.load), 20, 10); c.fillStyle = st.loadCol; c.fill(); }
    c.setTransform(1, 0, 0, 1, 0, 0);
  });
  const fm = new THREE.MeshBasicMaterial({ map: face.tex, transparent: true, toneMapped: false, color: new THREE.Color(0.85, 0.85, 0.85) });
  const fp = mesh(new THREE.PlaneGeometry(1.16, 0.64), fm, g, false); fp.position.set(0, 0.93, 0.674);
  const led = mesh(new THREE.SphereGeometry(0.045, 16, 8), bandM, g, false); led.position.set(0.56, 1.5, 0.48);
  const pool = new THREE.PointLight(accent, 0.35, 3, 2); setV(pool, [x, y - 1.0, 0.18]); scene.add(pool);
  return { g, bandM, face, st, pool, accent };
}
const OX = 0, OY = 7;
const ORDER = pod(OX, OY, C.amber, 'ORDER', 'SERVICE');
const PAY = pod(0, 0.55, C.violet, 'PAYMENT', 'SERVICE', true);

// ---------- phone ----------
const PHONE = [-2.05, 7.0, 1.3];
const ph = new THREE.Group(); setV(ph, PHONE); ph.rotation.order = 'YXZ'; ph.rotation.set(THREE.MathUtils.degToRad(-14), THREE.MathUtils.degToRad(-12), 0); scene.add(ph);
mesh(slab(0.76, 1.48, 0.07, 0.12, 0.012), phys({ color: '#1A202D', roughness: 0.28, metalness: 0.7, clearcoat: 0.5 }), ph);
const t_buy = W('buy'), t_pay = W('payment'), t_wait = W('wait'), t_bf = L(1), t_slow = W('slows'), t_pile = W('pile'), t_crash = W('crashes');
const t_fix = L(2), t_mq = W('message', L(2)), t_drop = W('drops'), t_recv = W('received');
const phoneUI = canvasTex(760, 1480, (g, w0, h0, t = 0) => {
  g.setTransform(2, 0, 0, 2, 0, 0); const w = 380, h = 740;
  rr(g, 0, 0, w, h, 50); g.fillStyle = '#070B14'; g.fill();
  g.fillStyle = '#05070C'; rr(g, w / 2 - 50, 22, 100, 24, 12); g.fill();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const state = t < t_buy + 0.28 ? 'buy' : t < t_crash ? 'wait' : t < t_fix + 0.5 ? 'err' : t < t_recv ? 'buy2' : 'ok';
  if (state === 'buy' || state === 'buy2') {
    g.fillStyle = '#8A93A6'; g.font = `bold 34px ${DIN}`; g.fillText('CHECKOUT', w / 2, 110);
    rr(g, 40, 170, w - 80, 230, 26); g.fillStyle = '#1C2436'; g.fill();
    rr(g, w / 2 - 80, 196, 160, 104, 20); g.fillStyle = C.amber; g.fill();
    g.fillStyle = '#fff'; g.font = `bold 30px ${DIN}`; g.fillText('SNEAKERS', w / 2, 336);
    g.fillStyle = C.amber; g.font = `bold 38px ${DIN}`; g.fillText('$89', w / 2, 376);
    const tp = state === 'buy' ? t_buy : t_drop - 0.4, k = 1 - 0.12 * Math.max(0, 1 - Math.abs(t - tp) / 0.12);
    const bw = 280 * k, bh = 78 * k; rr(g, w / 2 - bw / 2, 560 - bh / 2, bw, bh, bh / 2); g.fillStyle = C.amber; g.fill();
    g.fillStyle = '#1A2130'; g.font = `bold ${34 * k}px ${DIN}`; g.fillText('BUY NOW', w / 2, 562);
  } else if (state === 'wait') {
    const a0 = t * 2 * Math.PI * 1.4;
    for (let i = 0; i < 10; i++) { const a = a0 + (i / 10) * 2 * Math.PI; g.beginPath(); g.arc(w / 2 + 62 * Math.cos(a), 300 + 62 * Math.sin(a), 6 + i * 1.2, 0, 7); g.fillStyle = i > 4 ? '#fff' : '#8A93A6'; g.fill(); }
    g.fillStyle = '#fff'; g.font = `bold 32px ${DIN}`; g.fillText('PROCESSING', w / 2, 430);
    g.fillStyle = '#8A93A6'; g.font = `bold 24px ${DIN}`; g.fillText('please wait...', w / 2, 476);
  } else if (state === 'err') {
    g.beginPath(); g.arc(w / 2, 290, 64, 0, 7); g.lineWidth = 8; g.strokeStyle = C.red; g.stroke();
    g.fillStyle = C.red; g.font = `bold 80px ${DIN}`; g.fillText('!', w / 2, 294);
    g.font = `bold 36px ${DIN}`; g.fillText('ERROR 503', w / 2, 420);
    g.fillStyle = '#8A93A6'; g.font = `bold 24px ${DIN}`; g.fillText('try again later', w / 2, 466);
  } else {
    g.beginPath(); g.arc(w / 2, 290, 64, 0, 7); g.lineWidth = 8; g.strokeStyle = C.green; g.stroke();
    g.fillStyle = C.green; g.font = `bold 48px ${DIN}`; g.fillText('OK', w / 2, 294);
    g.font = `bold 36px ${DIN}`; g.fillText('ORDER', w / 2, 410); g.fillText('RECEIVED', w / 2, 452);
    g.fillStyle = '#8A93A6'; g.font = `bold 24px ${DIN}`; g.fillText('#1042', w / 2, 500);
  }
});
const scrM = new THREE.MeshBasicMaterial({ map: phoneUI.tex, transparent: true, toneMapped: false, color: new THREE.Color(0.8, 0.8, 0.8) });
const scrP = mesh(new THREE.PlaneGeometry(0.68, 1.4), scrM, ph, false); scrP.position.z = 0.037;

// ---------- chips (status tags) ----------
function chip(text, p, h, size = 0.2) {
  const px = 120, cv = document.createElement('canvas').getContext('2d'); cv.font = `bold ${px}px ${DIN}`;
  const tw = cv.measureText(text).width, W_ = tw + px * 1.3, H_ = px * 1.75, pad = 10;
  const c = canvasTex(Math.ceil(W_ + pad * 2), Math.ceil(H_ + pad * 2), (g, w, hh) => {
    rr(g, pad, pad, W_, H_, H_ / 2); g.fillStyle = 'rgba(10,17,32,0.9)'; g.fill(); g.lineWidth = 7; g.strokeStyle = h; g.stroke();
    g.fillStyle = h; g.font = `bold ${px}px ${DIN}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, hh / 2 + px * 0.06);
  });
  const k = size / px, m = new THREE.Mesh(new THREE.PlaneGeometry((W_ + pad * 2) * k, (H_ + pad * 2) * k), new THREE.MeshBasicMaterial({ map: c.tex, transparent: true, toneMapped: false, depthWrite: false }));
  const g = new THREE.Group(); setV(g, p); g.rotation.x = THREE.MathUtils.degToRad(-18); g.add(m); scene.add(g); m.renderOrder = 5;
  return g;
}

// ---------- order tiles ----------
const paperM = phys({ color: '#F5F6F8', roughness: 0.4, clearcoat: 0.2 });
const tileGeo = new RoundedBoxGeometry(0.5, 0.06, 0.3, 3, 0.025);
let NT = 0;
function tile() {
  const n = NT++, g = new THREE.Group(); scene.add(g);
  mesh(tileGeo, paperM, g);
  const c = canvasTex(400, 240, (x, w, h) => { x.setTransform(2, 0, 0, 2, 0, 0); rr(x, 16, 14, 26, 92, 12); x.fillStyle = C.amber; x.fill(); x.fillStyle = '#1A2130'; x.font = `bold 38px ${DIN}`; x.textBaseline = 'middle'; x.fillText(`#${1000 + n}`, 66, 62); });
  const top_ = mesh(new THREE.PlaneGeometry(0.48, 0.28), new THREE.MeshBasicMaterial({ map: c.tex, transparent: true, color: new THREE.Color(0.92, 0.92, 0.92) }), g, false);
  top_.rotation.x = -Math.PI / 2; top_.position.y = 0.0305;
  return g;
}
const ANIM = [];   // per-frame updaters
function drive(o, { loc, rot, scale }) { ANIM.push((t) => { if (loc) setV(o, loc(t)); if (rot) { const r = rot(t); o.rotation.order = 'YXZ'; o.rotation.set(r[0], r[2], 0); } if (scale) o.scale.setScalar(scale(t)); }); }
const O_OUT = [OX, OY - 0.75, 0.8];
const HOVER0 = [0, 0.6, 2.05], SINK0 = [0, 0.6, 1.45];

// hook: your order goes straight to payment, you wait
const c0 = tile();
drive(c0, {
  loc: track([[0, O_OUT], [t_pay - 0.55, O_OUT], [t_pay - 0.35, [0, 6.0, 0.36]], [t_pay + 0.45, [0, 1.6, 0.36]], [t_pay + 0.75, HOVER0], [t_wait + 0.5, HOVER0], [t_wait + 0.8, SINK0]]),
  rot: track([[t_pay + 0.45, [0, 0, 0]], [t_pay + 0.75, [1.15, 0, 0]], [t_wait + 0.6, [1.15, 0, 0]], [t_wait + 0.8, [0, 0, 0]]]),
  scale: track([[0, TINY], [t_pay - 0.56, TINY], [t_pay - 0.4, 1], [t_wait + 0.7, 1], [t_wait + 0.82, TINY]]),
});
// Black Friday: a flood of orders backs up from payment toward order
for (let i = 0; i < 44; i++) {
  const c = tile(), t0 = t_bf + 0.15 + i * 0.066;
  const yrest = Math.min(1.75 + i * 0.085 + ru(-0.25, 0.25), 6.0);
  const rest = [ru(-0.75, 0.75), yrest, 0.05 + ru(0, 0.28) + (i > 25 ? 0.12 : 0)];
  const dur = 0.25 + (6.0 - rest[1]) * 0.06, tg = t_fix + 0.05 + (rest[1] - 1.7) * 0.06;
  const rr_ = [ru(-0.25, 0.25), ru(-0.25, 0.25), ru(-1.2, 1.2)];
  drive(c, {
    loc: track([[t0, O_OUT], [t0 + 0.12, [0, 6.0, 0.4]], [t0 + 0.12 + dur, [rest[0] * 0.4, rest[1] + 0.3, 0.45]], [t0 + 0.25 + dur, rest]]),
    rot: track([[t0 + 0.12 + dur, [0, 0, 0]], [t0 + 0.3 + dur, rr_]]),
    scale: track([[0, TINY], [t0 - 0.001, TINY], [t0 + 0.08, 1], [tg, 1], [tg + 0.15, TINY]]),
  });
}

// direct cable
const cable = new THREE.Group(); setV(cable, [0, 3.8, 0.25]); scene.add(cable);
const cableM = emiss(C.violet, 3);
const cyl = mesh(new THREE.CylinderGeometry(0.04, 0.04, 5, 24), cableM, cable); cyl.rotation.x = Math.PI / 2;
for (const yy of [-2.2, 0, 2.2]) { const p = mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.25, 16), plinthM, cable); p.position.set(0, -0.12, -yy); }
const cableS = track([[0, 1], [t_fix + 0.05, 1], [t_fix + 0.35, 0.001]]);
ANIM.push((t) => { cable.scale.set(1, 1, cableS(t)); });

// overload -> crash -> recover
const loadT = track([[0, 0.15], [t_pay + 0.75, 0.15], [t_pay + 1.0, 0.55], [t_wait + 0.8, 0.2], [t_bf + 0.3, 0.3], [t_slow + 0.3, 0.75], [t_crash, 1], [t_fix + 0.4, 1], [t_fix + 0.8, 0.2]]);

const ordCol = track([[0, C.amber], [t_crash, C.red], [t_fix + 0.5, C.amber]], true);

const alarm = new THREE.SpotLight(C.red, 0, 14, THREE.MathUtils.degToRad(40), 0.6, 1.5); alarm.position.copy(V(0, 3.6, 5.5)); alarm.target.position.copy(V(0, 3.6, 0)); scene.add(alarm, alarm.target);

const down = chip('APP DOWN', [0, 3.9, 2.25], C.red, 0.42); const downS = pop(t_crash, t_fix + 0.3, 1.25, 0.22);

// ---------- the queue drops in ----------

const laneTex = canvasTex(160, 640, (g, w, h) => {
  const lg = g.createLinearGradient(0, 0, w, 0); lg.addColorStop(0, '#0F4A73'); lg.addColorStop(0.5, '#1A6FA6'); lg.addColorStop(1, '#0F4A73'); g.fillStyle = lg; g.fillRect(0, 0, w, h); g.strokeStyle = '#A8E6FF'; g.lineWidth = 7; g.lineCap = 'round';
  for (let i = 0; i < 9; i++) { const y = h - (0.2 + i * 0.47) / LLEN * h; g.beginPath(); g.moveTo(w / 2 - 28, y - 16); g.lineTo(w / 2, y + 2); g.lineTo(w / 2 + 28, y - 16); g.stroke(); }
});
const laneGlowM = new THREE.MeshBasicMaterial({ map: laneTex.tex, toneMapped: false, color: new THREE.Color(0.7, 0.7, 0.7) });
const strip = mesh(new THREE.PlaneGeometry(0.82, LLEN), laneGlowM, lane, false); strip.rotation.x = -Math.PI / 2; setV(strip, [0, LC, 0.143]);

for (const sx of [-0.5, 0.5]) {

  const e = mesh(new THREE.BoxGeometry(0.04, 0.012, LLEN + 0.2), edgeM, lane, false); setV(e, [sx, LC, 0.405]);
}
const laneZ = track([[0, 6], [t_mq - 0.12, 6], [t_mq + 0.22, -0.04], [t_mq + 0.32, 0.03], [t_mq + 0.42, 0]]);
const flash = track([[0, 0.7], [t_mq + 0.1, 0.7], [t_mq + 0.2, 1.5], [t_mq + 0.7, 0.7]]);

const mq = chip('MESSAGE QUEUE', [1.55, LC + 0.2, 0.75], C.cyan, 0.19); const mqS = pop(t_mq + 0.35, null, 1.2, 0.22);
const recv = chip('ORDER RECEIVED', [0, OY - 0.3, 2.15], C.green, 0.15); const recvS = pop(t_recv, null);

// first orders land in the line
const SLOT = (i) => [0, LY0 + 0.12 + i * 0.4, 0.2];
const t_q0 = t_mq + 0.6;
[t_q0, t_q0 + 0.45, t_q0 + 0.9, t_drop - 0.05].forEach((tb, i) => {

// ---------- camera (same framing maths as the Blender scene) ----------
const cam = new THREE.PerspectiveCamera(40, 540 / 960, 0.1, 200);
function place(c, width, lens, el, az, lift) {
  const d = width * lens / 20.25, vh = width * 36 / 20.25, e = THREE.MathUtils.degToRad(el), a = THREE.MathUtils.degToRad(az);
  const g = [c[0], c[1], c[2] - lift * vh];
  return { p: [g[0] + d * Math.sin(a) * Math.cos(e), g[1] - d * Math.cos(a) * Math.cos(e), g[2] + d * Math.sin(e)], g, lens };
}
const PH = [PHONE[0] + 0.05, PHONE[1], PHONE[2] - 0.05];
const SHOTS = [
  [0.0, PH, 1.75, 50, 10, -12, 0.1, 0], [t_buy + 0.5, PH, 1.6, 50, 10, -12, 0.1, 0],
  [t_buy + 0.55, [0.1, 4.0, 0.9], 5.0, 40, 36, -2, 0.1, 1], [t_pay + 0.5, [-0.1, 3.6, 0.9], 5.2, 40, 36, -4, 0.1, 0], [t_wait - 0.12, [0.0, 3.3, 1.0], 5.0, 40, 34, -2, 0.1, 0],
  [t_wait - 0.08, PH, 1.55, 50, 10, -12, 0.1, 1], [L(1) - 0.05, PH, 1.45, 50, 10, -12, 0.1, 0],
  [L(1), [0.0, 4.0, 0.8], 6.4, 40, 40, 14, 0.12, 1], [t_pile, [0.0, 3.8, 0.8], 6.0, 40, 40, 10, 0.12, 0], [t_crash, [0.0, 3.7, 1.0], 5.8, 40, 38, 8, 0.12, 0], [t_fix - 0.06, [0.0, 3.7, 1.0], 5.6, 40, 38, 8, 0.12, 0],
  [t_fix, [0.0, 3.9, 0.6], 5.4, 40, 50, -10, 0.05, 1], [t_mq + 0.5, [0.0, 4.0, 0.6], 4.9, 40, 46, -8, 0.05, 0], [L(3) - 0.05, [0.0, 4.2, 0.6], 4.6, 40, 44, -6, 0.05, 0],
  [L(3), [-0.8, 6.3, 1.0], 3.9, 50, 24, -12, 0.06, 1], [t_recv + 0.2, [-0.9, 6.5, 1.1], 3.5, 50, 22, -12, 0.06, 0],
].map(([t, c, w, lens, el, az, lift, cut]) => ({ t, cut, ...place(c, w, lens, el, az, lift) }));
const shake = (t) => { const dt = t - t_crash; if (dt <= 0 || dt > 0.4) return [0, 0]; const a = 0.07 * (1 - dt / 0.45); return [a * Math.sin(dt * 83), a * Math.cos(dt * 71)]; };
function camAt(t) {
  let i = SHOTS.findIndex((s) => s.t > t); if (i === -1) i = SHOTS.length; const a = SHOTS[Math.max(0, i - 1)], b = SHOTS[i];
  if (!b || b.cut) return a;
  const s = ease((t - a.t) / (b.t - a.t));
  return { p: lerp(a.p, b.p, s), g: lerp(a.g, b.g, s), lens: a.lens };
}

// ---------- captions (house style, word by word) ----------

CAPS.forEach((c, ci) => {

  c.t0 = c.w[0].a - 0.04;

});
function caps(t) {

    const on = t >= c.t0 && t < c.t1; c.box.style.display = on ? 'flex' : 'none';
    if (on) c.els.forEach((s, i) => { s.style.opacity = Math.min(1, Math.max(0, (t - c.w[i].a + 0.04) / 0.1)); });
  }
}
