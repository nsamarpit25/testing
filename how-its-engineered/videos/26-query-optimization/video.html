<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 26 Query optimization, in the ember style. World: YOUR PHONE (the orders page, with a load timer) on the left and the
     DATABASE cylinder (orders table, 1,000,000 rows) on the right, joined by a road. Data comes back as small crates.
     Hook: a flood of crates piles up by the phone while the timer runs to 9 s. Replay: everyone's orders arrive, then the
     app throws almost all of them away. Better query: three green crates arrive fast and the page shows ten orders.
     Shopping-list tags, a slam, then EXPLAIN: a card with the plan and a scan sweeping the database's rows.
     Beats come from voice/words.json via at(). -->
<link rel="stylesheet" href="../_ember/fonts.css">
<link rel="stylesheet" href="../_ember/reel.css">
</head>
<body>
<div id="stage">
  <div id="world">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div class="layer" id="lbls"></div>
  </div>
</div>
<script src="../../tools/lib.js"></script>
<script src="voice/words.js"></script>
<script src="../_ember/three.js"></script>
<script src="../_ember/world.js"></script>
<script src="../_ember/base.js"></script>
<script>
/* ---------------- beats */
const T = {
  nine: at('nine'), seconds: at('seconds'), load: at('load'), problem: at('problem'), way: at('way'), much: at('much'),
  your2: at('your', 2), asks1: at('asks'), everyones: at('everyones'), detail: at('detail'), throws: at('throws'), away: at('away'),
  that1: at('that'), query1: at('query'), better: at('better'), only: at('only'), last: at('last'), ten: at('10'), details: at('details'),
  like: at('like'), shopping: at('shopping'), milk: at('milk'), whole: at('whole'), door: at('door'),
  thats: at('thats'), optimization: at('optimization'), handle: at('handle'),
  see: at('see'), explain: at('explain'), database2: at('database', 2), plans: at('plan'), ifv: at('if'), follow: at('follow'),
};
const CUT = { SLOW: T.your2 - 0.3, FAST: T.that1 - 0.3, SHOP: T.like - 0.3, OPT: T.thats - 0.3, EXPL: T.see - 0.4, END: T.ifv - 0.15 };

/* ---------------- layout */
const PH = [-205, 25], DB = [165, 40];
const P_PD = [[PH[0] + 45, PH[1], 70], [DB[0] - 62, DB[1], 70]];
const P_DP = [[DB[0] - 62, DB[1] - 10, 14], [PH[0] + 50, PH[1] - 20, 14]];
const N = 18, KEEP = 3;
const HEAP = Array.from({ length: N }, (_, k) => [PH[0] + 70 + (k % 6) * 19, PH[1] - 58 + Math.floor(k / 6) * 19, 8]);
// crate trips: [start, travel, heap slot]; hook is fast, the replay slower; the good query sends three
const TRIPS = [];
for (let k = 0; k < N; k++) TRIPS.push({ a: 0.35 + k * 0.1, d: 0.5, slot: k, run: 'hook' });
for (let k = 0; k < N; k++) TRIPS.push({ a: T.asks1 + 0.1 + k * ((T.detail - T.asks1) / N), d: 0.7, slot: k, run: 'slow' });
for (let k = 0; k < KEEP; k++) TRIPS.push({ a: T.last - 0.35 + k * 0.12, d: 0.4, slot: k, run: 'fast' });
const RUN_END = { hook: CUT.SLOW, slow: CUT.FAST, fast: CUT.EXPL + 0.3 };
const THROW = T.throws;
const FAST_DONE = T.last - 0.35 + 2 * 0.12 + 0.4;

/* ---------------- camera */
const SHOTS = [
  { t: 0, d: 0, f: [-20, 15, 50], s: 0.98, a: -0.4, e: 0.58, sy: 520 },
  { t: CUT.SLOW, d: 1.0, f: [-30, 15, 50], s: 1.0, a: -0.42, e: 0.58, sy: 520 },
  { t: CUT.FAST, d: 1.0, f: [-20, 10, 50], s: 0.98, a: -0.42, e: 0.6, sy: 520 },
  { t: CUT.SHOP, d: 1.0, f: [-15, 15, 50], s: 0.94, a: -0.42, e: 0.6, sy: 540 },
  { t: CUT.EXPL, d: 1.0, f: [15, 20, 60], s: 1.0, a: -0.42, e: 0.6, sy: 520 },
  { t: CUT.END, d: 2.0, f: [-10, 15, 50], s: 0.88, a: -0.42, e: 0.6, sy: 580 },
];
const KICKS = [[T.seconds, 0.05], [T.much, 0.04], [T.everyones, 0.04], [T.throws, 0.05], [T.query1, 0.03], [FAST_DONE, 0.05], [T.shopping, 0.03],
  [T.whole, 0.04], [T.optimization, 0.05], [T.explain, 0.05], [T.plans, 0.03]];
const SHAKES = [[T.seconds, 2, 0.2], [T.throws, 2, 0.2]];

/* ---------------- build the world */
const label = (g, W_, H_, txt, col, size, y = H_ / 2) => { g.fillStyle = col; g.font = `800 ${size}px Mono`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = col; g.shadowBlur = 12; g.fillText(txt, W_ / 2, y); g.shadowBlur = 0; g.textAlign = 'left'; };
const mk = (p, w, d, h, col, k = 5) => { const b = emberBox(p[0], p[1], w, d, h, col); const f = decal(w, h, 'front', k, b.g); f.m.position.set(0, -d / 2 - 0.3, h / 2); return { b, f, pl: pool(p[0], p[1], w * 1.3, col), p }; };
const ph = mk(PH, 90, 20, 160, O, 5);
const db = emberCyl(DB[0], DB[1], 62, 150, O, { bands: [0, 50, 100, 150] });
const dbF = decal(110, 130, 'front', 4, db.g); dbF.m.position.set(0, -63, 75);
const dbPool = pool(DB[0], DB[1], 90, O);
const crates = Array.from({ length: N }, () => emberBox(0, 0, 14, 14, 14, AMB));
const rPD = road(P_PD, O2), rDP = road(P_DP, AMB);

function phoneDraw(g, W_, H_, col, timer, tCol, rows, st, stCol) {
  g.strokeStyle = col + 'aa'; g.lineWidth = 6; rrect(g, 14, 14, W_ - 28, H_ - 28, 34); g.stroke();
  label(g, W_, H_, 'MY ORDERS', col, 44, 76);
  if (timer) label(g, W_, H_, timer, tCol, 60, 170);
  rows.forEach(([txt, c], i) => label(g, W_, H_, txt, c, 30, 260 + i * 58));
  if (st) label(g, W_, H_, st, stCol, 38, H_ - 70);
}
function dbDraw(g, W_, H_, col, sub, scan) {
  label(g, W_, H_, 'DATABASE', col, 40, 40);
  label(g, W_, H_, 'orders', col + 'cc', 34, 92);
  for (let k = 0; k < 8; k++) { const y = 130 + k * 42; const hit = scan != null && Math.abs(scan - k) < 0.8; g.strokeStyle = (hit ? AMB : col) + (hit ? 'ff' : '55'); g.lineWidth = 3; rrect(g, 34, y, W_ - 68, 30, 5); g.stroke(); if (hit) { g.fillStyle = AMB + '44'; rrect(g, 34, y, W_ - 68, 30, 5); g.fill(); } }
  label(g, W_, H_, sub || '1,000,000 rows', sub && sub.startsWith('reads') ? AMB : GR, 30, H_ - 40);
}

/* ---------------- the world, frame by frame */
function world(t) {
  const q0 = ease.back(prog(t, 0.05, 0.4));
  // crates
  const live = TRIPS.filter((r) => t >= r.a - 0.05 && t < RUN_END[r.run]);
  crates.forEach((c) => (c.g.visible = false));
  live.forEach((r) => {
    const c = crates[r.slot]; if (c.g.visible && r.run !== 'fast') return;
    const q = ease.inOut(prog(t, r.a, r.a + r.d));
    const dest = r.run === 'fast' ? [PH[0] + 80 + r.slot * 22, PH[1] - 40, 8] : HEAP[r.slot];
    const start = P_DP[0];
    const p = q < 1 ? [lerp(start[0], dest[0], q), lerp(start[1], dest[1], q), lerp(start[2], dest[2], q) + 40 * Math.sin(Math.PI * q)] : dest;
    const thrown = r.run === 'slow' && r.slot >= KEEP && t > THROW;
    const sink = thrown ? prog(t, THROW + r.slot * 0.03, THROW + 0.5 + r.slot * 0.03) : 0;
    const end = 1 - prog(t, RUN_END[r.run] - 0.35, RUN_END[r.run]);
    c.g.visible = sink < 0.99 && end > 0.01;
    c.g.position.set(p[0], p[1], p[2] - 30 * sink);
    c.g.scale.setScalar(Math.max(0.01, ease.back(prog(t, r.a - 0.05, r.a + 0.15)) * (1 - sink) * end));
    const col = r.run === 'fast' ? OK : thrown ? RED : r.run === 'slow' && t > THROW && r.slot < KEEP ? OK : AMB;
    c.setLook(col, 1.6 + (thrown ? 2 * pulse(t, THROW) : 0), 1);
  });
  // the database
  const scanning = t > T.explain - 0.1 && t < CUT.END;
  const busy = (t > 0.3 && t < CUT.SLOW - 0.4) || (t > T.asks1 && t < T.detail + 0.6);
  const dCol = busy ? mixHex(O, AMB, 0.45 + 0.3 * Math.sin(t * 7)) : t > T.last - 0.4 && t < FAST_DONE + 0.6 ? mixHex(O, OK, 0.45) : O;
  db.update(); db.setLook(dCol, 1.3 + 2 * Math.max(pulse(t, T.everyones), pulse(t, T.last), pulse(t, T.explain)), 1); dbPool.set(dCol, 0.45 * q0);
  db.g.scale.set(1, 1, Math.max(0.01, q0));
  const scan = scanning ? ((t - T.explain) * 9) % 9 : null;
  const dSub = busy ? 'sending everything' : t > T.last - 0.4 && t < FAST_DONE + 0.8 ? 'sending 10' : scanning ? (t > T.plans - 0.2 ? 'reads all rows' : 'plan…') : '';
  dbF.draw((g, W_, H_) => dbDraw(g, W_, H_, dCol, dSub, scan));
  // the phone
  let timer = '', tCol = AMB, rows = [], st = '', stCol = GR;
  if (t < CUT.SLOW) { const s = 9 * prog(t, 0.3, T.seconds + 0.2); timer = `⏳ ${s.toFixed(1)} s`; tCol = s > 8.9 ? RED : AMB; st = s > 8.9 ? 'SLOW' : 'loading…'; stCol = s > 8.9 ? RED : GR; }
  else if (t < CUT.FAST) { timer = '⏳'; rows = t > THROW ? [['show 10', OK], ['drop 999,990', RED]] : [['everyone’s', AMB], ['orders…', AMB]]; st = t > THROW ? 'WASTED' : 'loading…'; stCol = t > THROW ? RED : GR; }
  else if (t > FAST_DONE) { timer = '✓ fast'; tCol = OK; rows = [['#1042 shoes ₹1,999', OK], ['#1038 tee ₹499', OK], ['#1031 bag ₹899', OK], ['+ 7 more', GR]]; }
  const pCol = timer.startsWith('✓') ? mixHex(O, OK, 0.35) : st === 'SLOW' || st === 'WASTED' ? mixHex(O, RED, 0.4) : O;
  ph.b.g.visible = q0 > 0.01; ph.b.g.scale.set(1, 1, Math.max(0.01, q0)); ph.b.setLook(pCol, 1.2 + 2 * Math.max(pulse(t, T.seconds), pulse(t, FAST_DONE)), 1);
  ph.f.m.visible = ph.b.g.visible; ph.f.draw((g, W_, H_) => phoneDraw(g, W_, H_, pCol, timer, tCol, rows, st, stCol)); ph.pl.set(pCol, 0.5 * q0);
  // roads
  rPD.set(1, O2, 0.6 * q0, t);
  rDP.set(1, busy ? AMB : t > T.last - 0.4 && t < FAST_DONE + 0.4 ? OK : O2, (busy ? 0.85 : 0.35) * q0, t);
  ripple(t, THROW, PH[0] + 110, PH[1] - 40, 2, RED, 80, 0.6);
  ripple(t, FAST_DONE, PH[0], PH[1], 2, OK, 100, 0.7);
}

/* ---------------- world tags */
function tags(t) {
  const P_T = [PH[0] + 95, PH[1], 205], D_T = [DB[0] - 105, DB[1], 195], H_T = [PH[0] + 110, PH[1] - 40, 70];
  const big = (c) => `font-size:15px;padding:9px 13px;letter-spacing:1px;border-color:${c}`;
  tag('nine', `<span style="color:${RED}">9 SECONDS TO LOAD</span>`, big(RED), P_T, t, T.seconds, T.problem);
  tag('much', `<span style="color:${AMB}">ASKING FOR WAY TOO MUCH</span>`, big(AMB), D_T, t, T.way - 0.1, CUT.SLOW + 0.1);
  tag('all', `<span style="color:${AMB}">EVERYONE'S ORDERS · EVERY DETAIL</span>`, big(AMB), D_T, t, T.everyones - 0.1, T.throws - 0.1);
  tag('away', `<span style="color:${RED}">ALMOST ALL OF IT THROWN AWAY</span>`, big(RED), H_T, t, T.throws, CUT.FAST + 0.1);
  tag('ten', `<span style="color:${OK}">YOUR LAST 10 · ONLY WHAT'S SHOWN</span>`, big(OK), P_T, t, T.last - 0.1, CUT.SHOP + 0.1);
  tag('list', `<span style="color:${OK}">SHOPPING LIST: MILK, EGGS</span>`, big(OK), P_T, t, T.shopping - 0.1, CUT.OPT + 0.1);
  tag('shop', `<span style="color:${RED}">NOT THE WHOLE SHOP</span>`, big(RED), D_T, t, T.whole - 0.1, CUT.OPT + 0.1);
  tag('less', `<span style="color:${OK}">LESS TO SEND · LESS TO HANDLE</span>`, big(OK), P_T, t, T.handle - 0.5, CUT.EXPL + 0.1);
  tag('plan', `<span style="color:${AMB}">EXPLAIN SHOWS THE PLAN</span>`, big(AMB), D_T, t, T.plans - 0.3, CUT.END + 0.3);
}

/* ---------------- reel config */
const REEL = {
  shots: SHOTS, kicks: KICKS, shakes: SHAKES, world, tags,
  code: [
    [0.25, CUT.FAST - 0.1, 'orders.js', 'load my orders', [[0, 'LOADING', AMB], [T.seconds, 'SLOW', RED]],
      [['SELECT * FROM orders'], ['// app shows 10, drops the rest', T.throws - 0.2]],
      [[0.3, 1, (t) => `⏳ ${(9 * prog(t, 0.3, T.seconds + 0.2)).toFixed(1)} s`, 'amb'], [CUT.SLOW, 1, 'every row, every detail', 'bad'], [T.throws, 2, 'wasted', 'bad']], 'type'],
    [T.query1 - 0.3, CUT.OPT - 0.1, 'orders.js', 'a better query', [[0, 'QUERY', AMB], [FAST_DONE, 'FAST', OK]],
      [['SELECT id, item, total'], ['FROM orders WHERE user_id = 42', T.better + 0.3], ['ORDER BY created_at DESC LIMIT 10', T.last - 0.3]],
      [[T.only, 1, 'only shown details', 'good'], [T.better + 0.5, 2, 'your orders', 'good'], [T.ten, 3, 'last 10', 'good']], 'type'],
    [T.explain - 0.3, CUT.END - 0.1, 'psql', 'see the plan', [[0, 'EXPLAIN', AMB]],
      [['EXPLAIN SELECT * FROM orders'], ['→ Seq Scan on orders', T.plans - 0.4], ['   rows=1000000', T.plans - 0.1]],
      [[T.plans - 0.4, 2, 'reads every row', 'amb']], 'type'],
  ],
  hl: /\b(SELECT|FROM|WHERE|ORDER|BY|LIMIT|DESC|EXPLAIN|Seq|Scan)\b/g,
  tools: [],
  slams: [
    { a: T.optimization - 0.6, b: T.handle - 0.5, text: 'query optimization', sub: 'ASK FOR ONLY WHAT YOU NEED', size: 58 },
  ],
  bad: ['nine', 'away', 'shop'],
  good: ['ten', '10', 'optimization'],
  tiles: [['⌕', 'QUERY<br>OPTIMIZATION'], ['⚡', 'CACHING'], ['≋', 'MESSAGE<br>QUEUES']],
  end: CUT.END, follow: T.follow,
  cover: { t: 'QUERY OPTIMIZATION', at: T.throws + 0.7, zoom: 0.95, dy: 40 },
  flash: (t) => 0.07 * pulse(t, T.seconds, 7) + 0.06 * pulse(t, FAST_DONE, 7),
};
</script>
<script src="../_ember/overlay.js"></script>
<script src="../_ember/play.js"></script>
</body>
</html>
