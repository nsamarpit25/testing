     the house fuse box, the software breaker (a knife switch on the reviews road) closed → open → half-open, tools, follow.

function toRef(t) {
  if (t <= WARP[0][0]) return t;
  for (let i = 1; i < WARP.length; i++) if (t <= WARP[i][0]) { const [n0, r0] = WARP[i - 1], [n1, r1] = WARP[i]; return r0 + (r1 - r0) * (t - n0) / (n1 - n0); }

/* ---------------- drawing helpers */
function wbox(x, y, z, w, d, h, edge, o = {}) {

function seg(a, b, col, lw = 1, o = {}) {
  add(o.layer ?? 1, D((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2) + (o.dz || 0), () => {
    g.save(); if (o.glow) glow(o.glow, o.blur || 6); if (o.add) g.globalCompositeOperation = 'lighter';
    g.strokeStyle = col; g.lineWidth = lw * Math.max(0.6, Math.min(2.4, cam.s * 0.75)); g.lineCap = 'round';

}
function pline(pts, col, lw = 1, o = {}) {

  add(o.layer ?? 1, (o.depth ?? D(...m)) + (o.dz || 0), () => {
    g.save(); if (o.glow) glow(o.glow, o.blur || 6); if (o.add) g.globalCompositeOperation = 'lighter';
    g.strokeStyle = col; g.lineWidth = lw * Math.max(0.6, Math.min(2.4, cam.s * 0.75)); g.lineCap = 'round'; g.lineJoin = 'round';

}

  const dt = t - t0; if (dt <= 0 || dt > life) return;

          L('ph2', 'the rest loads ✓', [PH[0] - 20, PH[1] - 3, 40], -40, 30, T.loads, CUT.RC - 0.05, '#7CF29A');
        }
        if (sc === 'HO' || (sc === 'RC' && t > CUT.HO - 0.6)) {
          // cooldown ring on the floor around the breaker
          const cq = prog(t, CUT.HO, T.half - 0.1);
          add(0, 1e6 - 4, () => { const c = P(BK[0], BK[1], 0.5); g.save(); g.translate(c[0], c[1]); g.scale(1, se); g.strokeStyle = rgba(AMB, 1.1, 0.9); g.lineWidth = 2.4; glow(rgba(AMB), 8); g.beginPath(); g.arc(0, 0, 30 * cam.s, -Math.PI / 2, -Math.PI / 2 + cq * Math.PI * 2); g.stroke(); g.restore(); });
          L('h0', 'cooldown', [BK[0] + 26, BK[1], 2], 30, 30, T.cooldown - 0.2, T.half, '#FFC34D');
        }
      } else {
        // half-open: a few test calls; the first pass (closed again), the replay fails (open again)
        queue(0, OK);
        const pass = t < T.fail2 - 0.3, full = rd.concat([]);
        if (pass) {
          trip(rd, t, T.test - 0.1, T.through2 + 0.3, AMB, 3.6);
          trip(rd, t, T.test + 0.25, T.through2 + 0.65, AMB, 3.6);
          trip(rev(rd), t, T.work2 - 0.1, T.closed2 + 0.1, OK, 3.6);
          popText(t, T.work2, [RVX, SVY - SVD / 2, 20], '✓ OK', OK, 10, 0.9);
          if (t > T.closed2 + 0.1) flow(rd, t, 4, 0.5, W, 0.8 * ep(t, T.closed2, T.closed2 + 0.4), 6, 2.8, 5);
          L('h1', 'test calls', [RVX, BK[1] + 20, 8], 30, 40, T.test - 0.1, T.work2 - 0.1, '#FFC34D');
          L('h2', 'they work → closed', [BK[0], BK[1] + 11, 14], 30, -40, T.work2, T.fail2 - 0.4, '#7CF29A');
        } else {
          trip(rd, t, T.fail2 - 0.3, T.fail2 + 0.25, AMB, 3.6);
          trip(rev(rd), t, T.fail2 + 0.3, T.back, RED, 3.6);
          popText(t, T.fail2 + 0.2, [RVX, SVY - SVD / 2, 20], '✕ FAIL', RED, 10, 0.8);
          L('h3', 'they fail → open again', [BK[0], BK[1] - 4, 24], 30, -40, T.fail2, CUT.TL - 0.05, '#FF4632');
        }
      }
    } else if (after) {
      normal(4);
      TG('tl1', '<b>Netflix</b> · Hystrix', [-110, 150, 44], T.netflix, CUT.END, 0);
      TG('tl2', '<b>Resilience4j</b> · today', [BK[0], BK[1], 70], T.r4j - 0.1, CUT.END, 0);
    }
    if (sc === 'H') {
      L('hk1', 'reviews · loading…', [PH[0] + 10, PH[1] - 3, 44], 50, 20, T.slow, T.whole - 0.1, '#FFC34D');
    }
  }
  flush();
  g.setTransform(2, 0, 0, 2, 0, 0);
  for (const k in LB) if (!used.has(k)) { LB[k].style.display = 'none'; if (LN[k]) LN[k].style.display = 'none'; }

  /* DOM */
  let s = false;
  s = slam('slCF', t, T.cascading - 0.05, T.retrying - 0.05) || s;
  s = slam('slCB', t, T.circuit - 0.05, T.current - 0.1) || s;
  s = slam('slOP', t, T.open - 0.05, T.fail - 0.1) || s;
  s = slam('slHO', t, T.half - 0.05, T.test - 0.1) || s;
  caps(tr, s);
  card(t);
  profile(t);
  $('dim').style.opacity = sc === 'END' ? ep(t, CUT.END, CUT.END + 0.4) * 0.6 : 0;
  let fl = 0, wf = 0;
  for (const [t0, a] of [[T.down, 0.18], [CUT.SV, 0.08], [T.out, 0.12], [T.stops, 0.15], [T.cascading, 0.2], [CUT.HS, 0.12], [T.trips, 0.15], [CUT.CL, 0.12], [T.wraps + 0.35, 0.12], [T.failed, 0.1], [T.trips2, 0.22], [CUT.PH2, 0.1], [CUT.RC, 0.1], [CUT.HO, 0.1], [T.closed2, 0.12], [T.back, 0.15], [CUT.TL, 0.1], [CUT.END, 0.08]]) { const dt = t - t0; if (dt > 0 && dt < 0.5) fl = Math.max(fl, a * Math.exp(-dt * 9)); }
  for (const [t0, a] of [[T.trips2, 0.5], [T.trips, 0.35]]) { const dt = t - t0; if (dt > 0 && dt < 0.8) wf = Math.max(wf, a * Math.exp(-dt * 8)); }
  $('flash').style.opacity = fl; $('wflash').style.opacity = wf;
  if (t > TAP_F + 0.08 && t < TAP_F + 1.7) {
    g.save(); g.globalCompositeOperation = 'lighter';
    const dt = t - TAP_F - 0.08, cols = ['#FF6A1F', '#FFB070', '#F2EEE8', '#7CF29A'];
    const fbx = 44 + 452 - 16 - 52, fby = $('prof').offsetTop + 34;
    for (let i = 0; i < 70; i++) {
      const th = rnd(i, 70) * Math.PI * 2, v = 160 + rnd(i, 71) * 260;
      const x = fbx + Math.cos(th) * v * dt, y = fby + Math.sin(th) * v * dt * 0.8 + 260 * dt * dt;
      g.fillStyle = cols[i % 4]; g.globalAlpha = Math.max(0, 1 - dt / 1.5);
      g.save(); g.translate(x, y); g.rotate(dt * 8 + i); g.fillRect(-3, -1.5, 6, 3); g.restore();
    }
    g.restore(); g.globalAlpha = 1;
  }
  $('stage').style.opacity = 1 - ep(tr, DURATION - 0.35, DURATION) * 0.85;
};
</script>
