<!-- 30 Maps traffic, in the AirTag kit (kit.js + scenes.js + maps.js). Story: your phone warns of a jam 3 km ahead; there
     is no camera on that road; the cars told it, or the phones inside them. Each phone shares where it is and how fast it
     moves; Maps sees dots on every road; where many dots crawl it paints the stretch red, mixes in the usual traffic for
     this hour and routes you around. Berlin 2020: an artist pulls 99 phones in a red wagon down an empty street and Maps
     paints it red. Twist: the phones draw the map, and in a jam you are one of the dots. Beats come from voice/words.js. -->

<script>
for (let i = 0; i < 18; i++) { const m = new TH.Mesh(new TH.RingGeometry(0.9, 1, 96), new TH.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: TH.AdditiveBlending, depthWrite: false, toneMapped: false, side: TH.DoubleSide })); m.visible = false; scene.add(m); RINGS.push(m); }
// Signals speak the reference's language: crisp thin rings that open out from a device, and thin lines that draw
// themselves from one device to the next with a bright head on the tip. No wide halos, no light beams.
const RING_TX = ctex(512, 512, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.8, 'rgba(255,255,255,0.025)'); gr.addColorStop(0.985, 'rgba(255,255,255,0.06)'); gr.addColorStop(1, 'rgba(255,255,255,0)');

});
const RING_G = new TH.PlaneGeometry(2, 2);
for (const m of RINGS) { m.geometry = RING_G; m.material.map = RING_TX; m.material.needsUpdate = true; }
function ripple(t, t0, x, y, z, col, maxR, dur = 0.9) {
  const p = prog(t, t0, t0 + dur); if (p <= 0 || p >= 1 || ringI >= RINGS.length) return;
  const m = RINGS[ringI++], r = maxR * (0.1 + 0.9 * ease.out(p));

// signal lines: a pool of pixel-width lines (core + faint halo) whose segments are rewritten in place each frame
const LMAX = 8, LINKS = [];

for (let i = 0; i < 8; i++) {

  const core = new TH.Line2(geo, lineMat(O, 3.4)), halo = new TH.Line2(geo, lineMat(O, 11, { add: true, op: 0.16 }));
  core.renderOrder = 5; halo.renderOrder = 4;

let linkI = 0;
function linksReset() { linkI = 0; for (const L of LINKS) L.core.visible = L.halo.visible = L.head.visible = L.end.visible = false; }
// the part of a polyline between fractions q0 and q1 of its length
function subLine(pts, q0, q1) {

  const u0 = q0 * L, u1 = q1 * L, out = [at_(u0)];

  out.push(at_(u1)); return out;
}
// link(t, pts, t0, dur, t1, col): draws on along pts over [t0, t0+dur] (eased), holds, fades out at t1. o.travel: the
// tail follows the head, so it reads as one message moving; o.a: opacity
function link(t, pts, t0, dur, t1, col, o = {}) {

  const L = LINKS[linkI++], q = ease.inOut(prog(t, t0, t0 + dur)), q0 = o.travel ? ease.inOut(prog(t, t0 + dur * 0.35, t0 + dur * 1.25)) : 0;
  const a = (o.a ?? 1) * (1 - ep(t, t1 - 0.25, t1)) * (o.travel ? 1 - ep(t, t0 + dur * 1.05, t0 + dur * 1.25) : 1);
  if (q <= 0.001 || a <= 0.01) return null;
  const part = subLine(pts, q0, q).slice(0, LMAX), arr = L.geo.attributes.instanceStart.data.array;
  for (let i = 0; i < part.length - 1; i++) arr.set([...part[i], ...part[i + 1]], i * 6);
  L.geo.attributes.instanceStart.data.needsUpdate = true; L.geo.instanceCount = part.length - 1;
  for (const [l, k] of [[L.core, 1], [L.halo, 0.16]]) { l.visible = true; l.material.color.set(col); l.material.opacity = a * k; }
  const tip = part[part.length - 1], px = 1 / cam.s;
  if (q < 0.999 || o.travel) { L.head.visible = true; L.head.position.set(...tip); L.head.material.color.set(mixHex(col, '#ffffff', 0.5)); L.head.material.opacity = a; L.head.scale.set(16 * px, 16 * px, 1); }
  if (q >= 0.999 && !o.travel) { const k = ease.out(prog(t, t0 + dur, t0 + dur + 0.25)); L.end.visible = true; L.end.position.set(...tip); L.end.material.color.set(col); L.end.material.opacity = a * (0.6 + 0.4 * (1 - k)); L.end.scale.set((10 + 14 * (1 - k)) * px, (10 + 14 * (1 - k)) * px, 1); }

  cars: at('cars'), did: at('did'), rather: at('rather'), phones: at('phones'),
  phones2: at('phones', 2), share: at('share'), where: at('where'), how: at('how'), fast: at('fast'), moving: at('moving'),
  maps3: at('maps', 3), combines: at('combines'), dots: at('dots'), each: at('each'),
  when: at('when'), slow: at('slow'), down: at('down'), maps4: at('maps', 4), marks: at('marks'), red: at('red'),
  it: at('it', 2), usually: at('usually'), hour: at('hour'), predicts: at('predicts'), route: at('route'), can2: at('can', 2), send: at('send'), around: at('around'),
  in1: at('in'), artist: at('artist'), berlin: at('berlin'), d99: at('99'), phones3: at('phones', 3), red2: at('red', 2), wagon: at('wagon'),
  slowly: at('slowly'), empty: at('empty'), google3: at('google', 3), turned: at('turned'), red3: at('red', 3), a3: at('a', 3), made: at('made'), phones4: at('phones', 4), not: at('not'),

  when2: at('when', 2), stuck: at('stuck'), you2: at('you', 2), might: at('might'), dots3: at('dots', 3), follow: at('follow'),
};
const CUT = { ROAD: T.theres2 - 0.12, CARS: T.cars - 0.1, SHARE: T.phones2 - 0.12, DOTS: T.maps3 - 0.12, SLOW: T.when - 0.1,

/* ---------------- build */
const ST = buildStudio(), CI = buildCity(), M = buildMaps(CI);
ST.tag.g.visible = false; ST.str.g.visible = false; ST.under.visible = false;
// the AirTag story's props stay out of this reel

for (const m of CI.movers) m.g.visible = false;
CI.aptGlass.visible = false; CI.aptSolid.visible = true;
const HOLO = { cam: holo(ICO.cam, 420, RED), cam2: holo(ICO.cam, 900, RED), you: holo(ICO.phone, 170, '#ffffff') };
// your detour (route B) and the jammed main road (route A), in lane coordinates
const RB = [[-3600, -860, 8], [-1140, -860, 8], [-1140, 1140, 8], [3140, 1140, 8], [3140, -860, 8], [5600, -860, 8]];
const RA = [[-3600, -860, 8], [5600, -860, 8]];
const pathAt = (pts, u) => { for (let i = 1; i < pts.length; i++) { const L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); if (u <= L || i === pts.length - 1) { const k = clamp(u / L); return [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k), Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0])]; } u -= L; } };
// the Berlin street: the wagon and the artist walk east down the y = -3000 road, along the park (shot from the park side,
// so no tall building stands between the camera and the wagon)
const BY = -3000, WX0 = -900, WV = 55;
const wagX = (t) => WX0 + WV * (t - CUT.BER);
// the jam car the twist lands on (one of the bunched-up cars in the jam, eastbound)
const pickCar = (t) => { let best = M.cars[0], bd = 1e9; for (const c of M.cars) { if (c.w) continue; const d = Math.abs(M.carX(c, t) - 1650); if (d < bd) { bd = d; best = c; } } return best; };
const YOUCAR = pickCar(CUT.YOU + 1.4);

/* ---------------- phone screens */
// Drawn in a 600-wide design space in the dark look of 29: a quiet street map, a frosted card, one orange accent, red for traffic.
const S6 = (g, S, x, y, fn, col) => { g.save(); g.translate(x - S / 2, y - S / 2); fn(g, S, col); g.restore(); };
const UI = { card: '#1f1d1c', tile: '#2c2a28', tx: '#f5f4f3', tx2: '#a39e99', tx3: '#6f6a66' };
const uiSpace = (g, W, H) => { const k = W / 600; g.scale(k, k); return H / k; };
function rr(g, x, y, w, h, r, fill, stroke, lw = 2) { g.beginPath(); g.roundRect(x, y, w, h, r); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function dot(g, x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = fill; g.fill(); }
function tx(g, s, x, y, font, col, al = 'left', bl = 'alphabetic') { g.font = font; g.fillStyle = col; g.textAlign = al; g.textBaseline = bl; g.fillText(s, x, y); }
function statusBar(g, W, col = UI.tx) {

  for (let k = 0; k < 4; k++) rr(g, W - 198 + k * 10, 70 - 10 - k * 5, 7, 10 + k * 5, 2, col);
  g.strokeStyle = col; g.lineCap = 'round'; g.lineWidth = 4.5; for (const r of [9, 17]) { g.beginPath(); g.arc(W - 132, 70, r, -Math.PI * 0.74, -Math.PI * 0.26); g.stroke(); } dot(g, W - 132, 68, 3.5, col);
  rr(g, W - 104, 47, 48, 24, 8, null, 'rgba(245,244,243,0.5)', 2.5); rr(g, W - 100, 51, 34, 16, 4, col); rr(g, W - 53, 55, 4, 8, 2, 'rgba(245,244,243,0.5)');

// a straight-up navigation map: grid streets, your route up the middle (orange), optional red stretch ahead, moving
// traffic ticks on the side streets. off = how far the map has scrolled (the car drives up the screen)
function navMap(g, W, H, t, o = {}) {
  g.fillStyle = '#1b1a19'; g.fillRect(0, 0, W, H);
  const CX = 150, CY = 170, off = (t * 46) % CY;
  for (let i = -1; i < 6; i++) for (let j = -1; j < 10; j++) { const r = rnd(i * 13 + j * 7, 4); g.fillStyle = r < 0.1 ? '#1f241d' : r < 0.55 ? '#232120' : '#201f1e'; g.fillRect(i * CX + 12 - 75, j * CY + 12 + off, CX - 24, CY - 24); }

  else { g.fillStyle = '#fff'; g.beginPath(); g.moveTo(95, y + 44); g.lineTo(125, y + 80); g.lineTo(106, y + 80); g.lineTo(106, y + 108); g.lineTo(84, y + 108); g.lineTo(84, y + 80); g.lineTo(65, y + 80); g.closePath(); g.fill(); }

function etaSheet(g, W, H, eta, sub, subCol, extra) {

// your phone: 'nav' (hook: jam ahead) | 'usual' (typical traffic for this hour) | 'routes' (A vs B) | 'berlin' (red street, no cars)

      const hrs = ['3p', '4p', '5p', '6p', '7p', '8p', '9p'], usual = [0.32, 0.5, 0.82, 0.95, 0.7, 0.42, 0.26], now = 3, bw = 52, gx = 66, base = y + h - 92;
      hrs.forEach((s, i) => {
        const x = gx + i * 68, hh = 300 * usual[i] * ease.out(clamp(q * 1.6 - i * 0.08));
        rr(g, x, base - hh, bw, hh, 12, i === now ? O : '#46423f');
        tx(g, s, x + bw / 2, base + 40, i === now ? '700 25px Inter' : '550 25px Inter', i === now ? O : UI.tx3, 'center');
      });
