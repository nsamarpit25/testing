<!-- 25 Database indexing, v2. A perspective three.js world with bloom (own camera + post pass, replacing overlay.js's render).
     World: a TABLE (six long columns of glowing row slabs running into the fog, one slab = one user) and, on its left, the
     email INDEX lane: one slab per user, sorted A→Z, with section letters. Hook: a login is found through the index in 4 ms;
     the CREATE INDEX line is deleted, the lane burns away and every login scans rows. Table: rows are in no order; a scanner
     reads row after row, then every column at once (100M). Index: the email cells lift off the rows into the lane, then
     re-sort; arcs point back to rows. Lookup: not from the top, jump to S, narrow in three hops, arc to sam's row. Book page.
     Catch: two more index lanes, a new user has to be inserted into all three; keep email, drop the rest. Beats come from
     voice/words.json via at(). Shared pieces live in ../_ember/. -->
<link rel="stylesheet" href="../_ember/fonts.css">
<link rel="stylesheet" href="../_ember/reel.css">
<style>
#cap { top: 728px !important; }   /* subtitles below the stacks, still clear of Instagram's caption bar (ends 768 < 790) */

#ln .tb { height: 24px; display: flex; align-items: center; gap: 5px; padding: 0 10px; border-bottom: 1px solid rgba(255,255,255,0.06); font: 600 10px/1 Mono; color: #9c948c; }
#ln .tb i { width: 7px; height: 7px; border-radius: 50%; background: #2c2925; display: inline-block; }

#bk .hd { font: italic 400 36px/1 Instrument; letter-spacing: -0.5px; border-bottom: 1px solid rgba(239,230,216,0.16); padding-bottom: 10px; margin-bottom: 6px; display: flex; align-items: baseline; }

#bk .e.on .p { color: #FFB070; }

#bkP { margin-top: 10px; display: flex; align-items: center; gap: 10px; font: 800 13px/1 Mono; letter-spacing: 1.2px; color: #9c948c; }
#bkP b { background: #FF6A1F; color: #0b0a09; padding: 7px 10px; border-radius: 6px; }
.lbl { background: rgba(12,11,10,0.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

<body>
<div id="stage">
  <div id="world">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div class="layer" id="lbls"></div>
  </div>
</div>

<script src="../_ember/base.js"></script>
<script>
for (let i = 0; i < 8; i++) ORBS.push({ core: orbSprite(9), glow: orbSprite(34), trail: [0, 1, 2, 3, 4].map(() => orbSprite(10)) });

/* ---------------- beats */
const T = {
  finds: at('finds'), ms: at('milliseconds'), del: at('drop'), line1: at('index'), every1: at('logins'), seconds: at('seconds'), whats: at('whats'),
  users2: at('users', 2), table: at('table'), row1: at('row'), order: at('order'), byDef: at('without'), reads: at('scan'), finds2: at('row', 3),
  m100: at('100', 2), read: at('read'), every2: at('every'),
  that2: line(2).start, index1: at('index', 4), separate: at('separate'), column: at('column'), sorted: at('sorted'), points: at('points'),
  because: at('because'), never: at('doesnt'), jumps: at('jumps'), S: at('s'), narrows: at('narrows'), hops: at('hops'), lands: at('lands'), exact: at('exact'), row5: at('row', 5),
  like2: at('like', 2), find: at('find'), page: at('page'), skip: at('skip'),
  catch_: at('catch'), every3: at('every', 2), space: at('space'), saving: at('saving'), slower: at('slower'), each3: at('each', 3), so: at('so'), search1: at('search'), everything: at('everything'),
  dbs: line(6).start, id: at('primary'), postgres: at('postgres'), mysql: at('mysql'), search2: at('search', 2), make: at('make'), ifv: at('if'), follow: at('follow'),
};

/* ---------------- layout: Z up, rows run along +y */
const PY = 28, RD = 22, RH = 5, NR = 234;                 // row pitch, slab depth, slab height, rows per column (= lane slots)
const TX = 110, TW = 170, TC = 6, TG = 200;               // table: column 0 centre, slab width, columns, column spacing
const IX = -90, IW = 120, NX = -250, CX = -410;           // index lanes: email, name, city
const colX = (c) => TX + c * TG, rowY = (r) => r * PY;
const NEAR = ['max', 'ana', 'zoe', 'ben', 'cara', 'kim', 'abby', 'leo', 'dev', 'ivy', 'bo', 'eli', 'raj', 'fay', 'gus', 'adam'];   // table rows 0..15
const SLOT = { abby: 1, adam: 3, ana: 6, ben: 10, bo: 14, cara: 20, dev: 30, eli: 38, fay: 49, gus: 57, ivy: 78, kim: 94, leo: 101, max: 109, raj: 153, zoe: 232,
  sal: 162, sam: 163, sara: 164, sean: 165, sid: 166, sky: 167, sol: 168, sue: 169, sven: 170 };    // sorted place in the lane (9 slots per letter)
const SROW = { sal: 40, sam: 150, sara: 77, sean: 201, sid: 118, sky: 63, sol: 180, sue: 99, sven: 222 };
const NAME = {}; NEAR.forEach((n, r) => (NAME[r] = n)); for (const n in SROW) NAME[SROW[n]] = n;
const SORT = (() => {                                      // table row r → its slot in the sorted lane
  const s = new Array(NR).fill(-1), used = new Set();
  for (const r in NAME) { s[r] = SLOT[NAME[r]]; used.add(s[r]); }
  const free = [...Array(NR).keys()].filter((j) => !used.has(j)).sort((a, b) => rnd(a, 9) - rnd(b, 9));
  let k = 0; for (let r = 0; r < NR; r++) if (s[r] < 0) s[r] = free[k++];
  return s;
})();
const SHUF = [9, 3, 14, 0, 11, 6, 1, 15, 4, 12, 7, 2, 10, 13, 5, 8];   // near rows after "in no order"
const SAM = 150, SAMJ = 163, INSJ = 7;                    // sam's row, sam's lane slot, where the new user is inserted
const uid = (r) => 1000 + Math.floor(rnd(r, 5) * 9000);
const cap1 = (s) => s[0].toUpperCase() + s.slice(1);

// scan: row after row, then faster and faster
const SC0 = T.reads, SC1 = T.finds2 - 0.25;
const scanRows = (t) => Math.min(TC * NR, Math.max(0, (t - SC0) * 3.4) + 95 * Math.pow(Math.max(0, t - SC1), 2.5));   // one scanner, column after column
const rowsRead = (t) => (t < SC1 ? Math.floor(scanRows(t)) + 1
  : Math.round(Math.exp(lerp(Math.log(Math.floor(scanRows(SC1)) + 1), Math.log(1e8), ease.inOut(prog(t, SC1, T.read + 0.05))))));
const LIFT = T.index1 - 0.12;                              // email cells start lifting off the rows
const INS = T.slower + 0.3;                                // the new user is slotted into each index
const qIns = (t, k = 0) => ep(t, INS + k * 0.12, INS + 0.45 + k * 0.12, ease.inOut);

/* ---------------- camera: perspective shots {t, d, p (position), l (look at), f (fov)} */
const pcam = new TH.PerspectiveCamera(44, 540 / 960, 5, 20000); pcam.up.set(0, 0, 1);
const SHOTS = [
  { t: 0, p: [330, 3440, 560], l: [10, 4330, 0], f: 46 },
  { t: 0.01, d: 2.6, p: [250, 3600, 430], l: [10, 4330, 0], f: 46, e: ease.out },
  { t: T.every1 - 0.1, d: 2.6, p: [560, 3150, 980], l: [260, 4400, 0], f: 48 },
  { t: T.users2 - 0.3, d: 1.1, p: [84, -280, 540], l: [84, 115, 0], f: 40 },
  { t: T.finds2 - 0.3, d: 1.7, p: [640, -1000, 1500], l: [560, 1900, 0], f: 46 },
  { t: T.every2 - 0.1, d: 1.2, p: [600, -760, 1200], l: [560, 1900, 0], f: 44 },
  { t: T.that2 - 0.25, d: 1.1, p: [-15, -480, 440], l: [-25, 230, 0], f: 42 },
  { t: T.sorted - 0.2, d: 1.2, p: [-55, -430, 410], l: [-35, 260, 0], f: 42 },
  { t: T.because - 0.15, d: 0.9, p: [-90, -340, 180], l: [-90, 390, 0], f: 50 },
  { t: T.jumps - 0.04, d: 0.75, p: [-90, 4170, 220], l: [-90, 4640, 0], f: 48 },
  { t: T.narrows - 0.1, d: 0.9, p: [-40, 4350, 240], l: [-95, 4590, 0], f: 44 },
  { t: T.lands - 0.15, d: 0.9, p: [320, 3820, 600], l: [40, 4290, 0], f: 46 },
  { t: T.catch_ - 0.25, d: 1.2, p: [-190, -1250, 1350], l: [-100, 190, 0], f: 48 },   // wide enough for city lane → new user's row, clear of IG's buttons
  { t: T.each3, d: 2.6, p: [-160, -1350, 1350], l: [-85, 170, 0], f: 48 },
  { t: T.dbs - 0.25, d: 6.5, p: [420, -720, 720], l: [30, 320, 0], f: 44 },
];
const KICKS = [[T.ms, 0.04], [T.line1, 0.05], [T.seconds, 0.04], [T.order, 0.03], [T.m100, 0.04], [T.every2, 0.05], [T.index1, 0.05], [T.sorted, 0.04],
  [T.points, 0.03], [T.S, 0.04], [T.hops, 0.04], [T.lands, 0.04], [T.space, 0.03], [INS, 0.04], [T.search1, 0.04], [T.everything, 0.03], [T.postgres, 0.03], [T.mysql, 0.03]];
const SHAKES = [[T.line1, 5, 0.3], [T.every2, 8, 0.45]];
function shoot(t) {
  let p = SHOTS[0].p.slice(), l = SHOTS[0].l.slice(), f = SHOTS[0].f;
  for (let i = 1; i < SHOTS.length; i++) {
    const k = SHOTS[i]; if (t < k.t) break;
    const q = k.d ? (k.e || ease.inOut)(prog(t, k.t, k.t + k.d)) : 1;
    p = p.map((v, j) => lerp(v, k.p[j], q)); l = l.map((v, j) => lerp(v, k.l[j], q)); f = lerp(f, k.f, q);
  }
  let kick = 0;
  for (const [t0, amp] of KICKS) { const dt = t - t0; if (dt > 0 && dt < 1.2) kick += amp * (dt < 0.05 ? dt / 0.05 : Math.exp(-(dt - 0.05) * 6)); }
  let sx = 0, sy = 0;
  for (const [t0, amp, dur] of SHAKES) { const dt = t - t0; if (dt > 0 && dt < dur) { const k = amp * (1 - dt / dur); sx += k * Math.sin(t * 91); sy += k * Math.cos(t * 67); } }
  pcam.position.set(p[0] + 6 * Math.sin(t * 0.37), p[1] + 6 * Math.cos(t * 0.29), p[2] + 4 * Math.sin(t * 0.23));
  pcam.lookAt(l[0] + sx, l[1], l[2] + sy);
  pcam.fov = f * (1 - kick); pcam.updateProjectionMatrix(); pcam.updateMatrixWorld();
  cam.f = l;
  const d = Math.hypot(p[0] - l[0], p[1] - l[1], p[2] - l[2]);
  scene.fog.near = d * 0.9; scene.fog.far = d * 3.4;
}
const _pv = new TH.Vector3();
P = function (x, y, z) { _pv.set(x, y, z).project(pcam); return [(_pv.x + 1) * 270, (1 - _pv.y) * 480, _pv.z]; };

/* ---------------- the stage: a longer floor and grid */
floor.scale.set(2.2, 2.2, 1); floor.position.set(0, 3000, -0.5);
scene.children.filter((o) => o.type === 'LineSegments').forEach((o) => scene.remove(o));
(() => {
  const pts = [], S = 56;
  for (let x = -2800; x <= 3200; x += S) pts.push(x, -2000, 0, x, 8400, 0);
  for (let y = -2000; y <= 8400; y += S) pts.push(-2800, y, 0, 3200, y, 0);
  const geo = new TH.BufferGeometry(); geo.setAttribute('position', new TH.Float32BufferAttribute(pts, 3));
  const m = new TH.LineSegments(geo, new TH.LineBasicMaterial({ color: 0x2a221c, transparent: true, opacity: 0.5, fog: true }));
  m.position.z = 0.05; scene.add(m);
})();

/* ---------------- slabs: instanced boxes with a glowing rim texture, tinted per instance */
function rimTex(dividers) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64; const g = c.getContext('2d');
  g.fillStyle = 'rgb(58,58,58)'; g.fillRect(0, 0, 256, 64);
  g.strokeStyle = '#fff'; g.lineWidth = 6; g.strokeRect(3, 3, 250, 58);
  g.fillStyle = 'rgba(255,255,255,0.45)'; for (const d of dividers) g.fillRect(d * 256 - 1.5, 10, 3, 44);
  const tx = new TH.CanvasTexture(c); tx.colorSpace = TH.SRGBColorSpace; tx.anisotropy = 8; return tx;
}
const TX_ROW = rimTex([0.2, 0.7]), TX_IDX = rimTex([]);
function slabs(n, tex) {
  const geo = new TH.BoxGeometry(1, 1, 1); geo.translate(0, 0, 0.5);
  const m = new TH.InstancedMesh(geo, new TH.MeshBasicMaterial({ map: tex, toneMapped: false, fog: true }), n);
  m.instanceMatrix.setUsage(TH.DynamicDrawUsage); m.setColorAt(0, new TH.Color()); m.instanceColor.setUsage(TH.DynamicDrawUsage);
  m.frustumCulled = false; scene.add(m); return m;
}
const TBL = slabs(TC * NR + 1, TX_ROW), LE = slabs(NR + 1, TX_IDX), LN = slabs(NR + 1, TX_IDX), LC = slabs(NR + 1, TX_IDX);
const CO = { O: C(O), O2: C(O2), OK: C(OK), RED: C(RED), AMB: C(AMB), WH: C(WH), DIM: C(DIM) };
const _o = new TH.Object3D(), _c = new TH.Color(), _c2 = new TH.Color();
const tint = (a, k, b, m = 0) => (b ? _c.copy(a).lerp(b, clamp(m)) : _c.copy(a)).multiplyScalar(k);
function put(M, i, x, y, z, w, d, h, col) {
  _o.position.set(x, y, z); _o.scale.set(Math.max(0.001, w), Math.max(0.001, d), Math.max(0.001, h)); _o.updateMatrix();
  M.setMatrixAt(i, _o.matrix); M.setColorAt(i, col);
}
const hide = (M, i) => put(M, i, 0, 0, -50, 0, 0, 0, _c.setRGB(0, 0, 0));
const done = (M) => { M.instanceMatrix.needsUpdate = true; M.instanceColor.needsUpdate = true; };

/* ---------------- text decals lying on top of slabs (redrawn only when the text or colour changes) */
function lbl3(w, d) {
  const W_ = 512, H_ = Math.round(512 * d / w), c = document.createElement('canvas'); c.width = W_; c.height = H_;
  const g = c.getContext('2d'), tex = new TH.CanvasTexture(c); tex.colorSpace = TH.SRGBColorSpace; tex.anisotropy = 8;
  const mat = new TH.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false, depthWrite: false, fog: true });
  mat.color.setScalar(0.74);
  const m = new TH.Mesh(new TH.PlaneGeometry(w, d), mat); m.renderOrder = 3; m.visible = false; scene.add(m);
  const o = { m, key: '' };
  o.set = (key, fn, x, y, z, a, sx = 1) => {
    m.visible = a > 0.01; if (!m.visible) return;
    if (key !== o.key) { o.key = key; g.clearRect(0, 0, W_, H_); fn(g, W_, H_); tex.needsUpdate = true; }
    m.position.set(x, y, z); m.scale.set(sx, 1, 1); mat.opacity = a;
  };
  return o;
}
const rowText = (r, name, col) => (g, W_, H_) => {
  g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillStyle = '#9c948c'; g.font = `700 ${Math.round(H_ * 0.4)}px Mono`; g.fillText('#' + uid(r), W_ * 0.035, H_ * 0.53);
  g.fillStyle = col; g.font = `800 ${Math.round(H_ * 0.5)}px Mono`; g.fillText(name + '@mail.com', W_ * 0.225, H_ * 0.53);
  g.fillStyle = '#9c948c'; g.font = `700 ${Math.round(H_ * 0.42)}px Inter`; g.fillText(cap1(name), W_ * 0.73, H_ * 0.53);
};
const laneText = (txt, col) => (g, W_, H_) => {
  g.textBaseline = 'middle'; g.textAlign = 'center'; g.fillStyle = col; g.font = `800 ${Math.round(H_ * 0.42)}px Mono`; g.fillText(txt, W_ / 2, H_ * 0.53);
};
const TLB = {}; [...Array(16).keys(), SAM].forEach((r) => (TLB[r] = lbl3(TW - 6, RD - 3)));
const NEWLB = lbl3(TW - 6, RD - 3);
const LLB = {}; for (const r in NAME) LLB[r] = lbl3(IW - 6, RD - 3);
const INSLB = [lbl3(IW - 6, RD - 3), lbl3(IW - 6, RD - 3), lbl3(IW - 6, RD - 3)];
const HEAD = lbl3(TW, 14);

// section letters beside the email lane (drawn on the first frame, once the fonts are in)
const GLY = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((ch) => {
  const c = document.createElement('canvas'); c.width = c.height = 128; const tx = new TH.CanvasTexture(c); tx.colorSpace = TH.SRGBColorSpace;
  const s = new TH.Sprite(new TH.SpriteMaterial({ map: tx, transparent: true, depthWrite: false, toneMapped: false })); s.visible = false; scene.add(s);
  return { s, c, tx, ch };
});
let glyDrawn = false;
function drawGlyphs() {
  for (const G of GLY) { const g = G.c.getContext('2d'); g.clearRect(0, 0, 128, 128); g.fillStyle = '#fff'; g.font = '900 100px Inter'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(G.ch, 64, 70); G.tx.needsUpdate = true; }
  glyDrawn = true;
}

/* ---------------- scanner bars, beams, brackets */
const TX_BAR = (() => {
  const c = document.createElement('canvas'); c.width = 4; c.height = 64; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.4, 'rgba(255,255,255,0.3)'); gr.addColorStop(0.5, 'rgba(255,255,255,1)'); gr.addColorStop(0.6, 'rgba(255,255,255,0.3)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 64); const tx = new TH.CanvasTexture(c); tx.colorSpace = TH.SRGBColorSpace; return tx;
})();
const BARS = [...Array(30)].map(() => {
  const m = new TH.Mesh(new TH.PlaneGeometry(1, 1), new TH.MeshBasicMaterial({ map: TX_BAR, transparent: true, blending: TH.AdditiveBlending, depthWrite: false, toneMapped: false }));
  m.visible = false; m.renderOrder = 2; scene.add(m); return m;
});
let barI = 0;
function bar(x, y, w, col, a) {
  if (barI >= BARS.length || a < 0.01) return; const m = BARS[barI++];
  m.visible = true; m.position.set(x, y, RH + 2); m.scale.set(w, 34, 1); m.material.color.set(col).multiplyScalar(1.4 * a);
}
function beam() {
  const mk = (w, o) => { const l = new TH.Line2(new TH.LineGeometry(), lineMat(OK, w, o)); l.renderOrder = 4; l.visible = false; scene.add(l); return l; };
  const b = { core: mk(2.6, {}), glow: mk(12, { add: true, op: 0.25 }) };
  b.set = (pts, q, col, a) => {
    const on = a > 0.01 && q > 0.002; b.core.visible = b.glow.visible = on; if (!on) return;
    const flat = sub(pts, q).flat();
    for (const l of [b.core, b.glow]) { l.geometry.dispose(); l.geometry = new TH.LineGeometry(); l.geometry.setPositions(flat); l.material.color.set(col); }
    b.core.material.opacity = a; b.glow.material.opacity = 0.3 * a;
  };
  return b;
}
const BEAMS = [...Array(8)].map(beam), BRK = beam();
const arc = (a, b, h, n = 30) => [...Array(n + 1)].map((_, i) => { const q = i / n, p = lerp3(a, b, q); p[2] += h * 4 * q * (1 - q); return p; });
const box2 = (x0, x1, y0, y1, z) => [[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z], [x0, y0, z]];

/* ---------------- where things sit */
const qShuf = (r, t) => ep(t, T.order - 0.08 + rnd(r, 13) * 0.16, T.order + 0.42 + rnd(r, 13) * 0.16, ease.inOut);

// email lane: chip r → {x, y, z, w, a (0 = hidden), state}

// name / city lanes (the catch)
const sideRise = (t, j, k) => ep(t, T.every3 - 0.1 + k * 0.15 + j * 0.002, T.every3 + 0.35 + k * 0.15 + j * 0.002, ease.back);

/* ---------------- the world, frame by frame */
function scanState(c, t) {

  }

  for (let r = 0; r < NR; r++) {

  [[IX, 'aria@mail.com', AMB], [NX, 'Aria', RED], [CX, 'Austin', RED]].forEach(([x, txt, c], k) => tg('insT' + k, sp(c, '+ ' + txt), `border-color:${c}`, [x, rowY(INSJ), RH], t, INS + 0.25 + k * 0.12, T.so - 0.05, 30 + (k === 1 ? 26 : 0)));   // what each index has to write

  tg('drop', sp(RED, '✕ NEVER SEARCHED'), big(RED), [(NX + CX) / 2, rowY(14), 0], t, T.everything, T.dbs - 0.15, 46);
}

/* ---------------- reel config */
const svgPg = `<svg width="46" height="46" viewBox="0 0 100 100" fill="none" stroke="#6FA8DC" stroke-width="7" stroke-linejoin="round"><ellipse cx="50" cy="24" rx="32" ry="12"/><path d="M18 24 V76 C18 83 32 88 50 88 C68 88 82 83 82 76 V24 M18 50 C18 57 32 62 50 62 C68 62 82 57 82 50"/></svg>`;

const REEL = {
  shots: [], world, tags,

    { a: T.mysql - 0.1, b: T.search2 - 0.2, svg: svgMy, name: 'MySQL', sub: 'AUTO-INDEXES THE PRIMARY KEY', top: 262 },

  slams: [],

<script>
/* ---------------- bloom: scene → half-float target, bright pass, three blur levels, composite to the canvas */
const RT = (w, h, s = 0) => new TH.WebGLRenderTarget(w, h, { type: TH.HalfFloatType, samples: s, depthBuffer: s > 0 });
const rtMain = RT(1080, 1920, 4), BL = [[RT(540, 960), RT(540, 960)], [RT(270, 480), RT(270, 480)], [RT(135, 240), RT(135, 240)]];
const fsCam = new TH.OrthographicCamera(-1, 1, 1, -1, 0, 1), fsScene = new TH.Scene(), fsQuad = new TH.Mesh(new TH.PlaneGeometry(2, 2));
fsQuad.frustumCulled = false; fsScene.add(fsQuad);
const VS = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const shm = (fs, u) => new TH.ShaderMaterial({ uniforms: u, vertexShader: VS, fragmentShader: fs, depthTest: false, depthWrite: false });
const mBright = shm(`uniform sampler2D tex; uniform float th; varying vec2 vUv;
void main() { vec3 c = texture2D(tex, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(th, th + 0.4, l), 1.0); }`,
  { tex: { value: null }, th: { value: 0.8 } });
const mBlur = shm(`uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;
void main() {
  vec3 c = texture2D(tex, vUv).rgb * 0.2270270270;
  c += (texture2D(tex, vUv + dir * 1.3846153846).rgb + texture2D(tex, vUv - dir * 1.3846153846).rgb) * 0.3162162162;
  c += (texture2D(tex, vUv + dir * 3.2307692308).rgb + texture2D(tex, vUv - dir * 3.2307692308).rgb) * 0.0702702703;
  gl_FragColor = vec4(c, 1.0);
}`, { tex: { value: null }, dir: { value: new TH.Vector2() } });
const mComp = shm(`uniform sampler2D base, b1, b2, b3; uniform float k1, k2, k3; varying vec2 vUv;
void main() {
  vec3 c = texture2D(base, vUv).rgb + texture2D(b1, vUv).rgb * k1 + texture2D(b2, vUv).rgb * k2 + texture2D(b3, vUv).rgb * k3;
  c = c / (1.0 + max(c - 1.0, 0.0) * 0.6);
  gl_FragColor = vec4(c, 1.0);
  #include <colorspace_fragment>
}`, { base: { value: rtMain.texture }, b1: { value: BL[0][0].texture }, b2: { value: BL[1][1].texture }, b3: { value: BL[2][1].texture }, k1: { value: 0.5 }, k2: { value: 0.65 }, k3: { value: 0.8 } });
function pass(mat, dst) { fsQuad.material = mat; renderer.setRenderTarget(dst); renderer.render(fsScene, fsCam); }
function blur(src, dst, dx, dy) { mBlur.uniforms.tex.value = src.texture; mBlur.uniforms.dir.value.set(dx / src.width, dy / src.height); pass(mBlur, dst); }
function bloom() {
  mBright.uniforms.tex.value = rtMain.texture; pass(mBright, BL[0][0]);
  blur(BL[0][0], BL[0][1], 1, 0); blur(BL[0][1], BL[0][0], 0, 1);
  blur(BL[0][0], BL[1][0], 1, 0); blur(BL[1][0], BL[1][1], 0, 1);
  blur(BL[1][1], BL[2][0], 1, 0); blur(BL[2][0], BL[2][1], 0, 1);
  pass(mComp, null);
}

/* ---------------- hook and book cards */
const stg = $('stage'), before = $('prof');
const mk = (html) => { const w = document.createElement('div'); w.innerHTML = html.trim(); const n = w.firstChild; stg.insertBefore(n, before); return n; };
const LG = mk(`<div id="lg"><div class="h"><i></i>myapp.com</div><div class="t">Log in</div><div class="f"><span id="lgE"></span><span class="caret" id="lgC"></span></div><div class="b"><div id="lgB">Log in</div><div id="lgS"></div></div></div>`);
const LN_ = mk(`<div id="ln"><div class="tb"><i></i><i></i><i></i><b>psql</b><span id="lnS"></span></div><div class="cd"><span id="lnT"></span><div id="lnX"></div></div></div>`);
const BOOK = [['Apple', 12], ['Bread', 87], ['Cheese', 133], ['Pasta', 212], ['Rice', 298], ['Soup', 341], ['Tea', 412]], BI = 5;
const BK = mk(`<div id="bk"><div class="hd">Index<span>COOKBOOK</span></div>${BOOK.map(([w, p], i) => `<div class="e" id="bk${i}">${w}<span class="d"></span><span class="p">${p}</span></div>`).join('')}<div id="bkP">FIND <span>→</span> <b>PAGE 341</b></div></div>`);
if (/cover/.test(location.hash)) { const s = document.createElement('style'); s.textContent = '#lg, #ln, #bk { display: none !important; }'; document.head.appendChild(s); }
const DROP = 'DROP INDEX users_email_idx;';
function hookDom(t) {
  const p = popIn(t, 0.05, T.users2 - 0.15); vis(LG, p.a, `translateY(${p.y}px) scale(${p.s})`);
  if (p.a > 0.001) {
    const n = Math.floor(clamp((t - 0.3) * 15, 0, 12)); setH('lgE', 'sam@mail.com'.slice(0, n));
    $('lgC').style.opacity = n < 12 || Math.floor(t * 2.5) % 2 ? 1 : 0;
    const press = window01(t, 1.42, 1.62, 0.07) + window01(t, T.every1 - 0.08, T.every1 + 0.12, 0.07);
    $('lgB').style.transform = `scale(${1 - 0.07 * press})`;
    let s = '', c = WH;
    if (t > 1.45 && t < T.ms) { s = '·'.repeat(1 + Math.floor(t * 8) % 3); c = AMB; }
    else if (t >= T.ms && t < T.every1 - 0.05) { s = '✓ 4 ms'; c = OK; }
    else if (t >= T.every1 - 0.05) { s = '◴◷◶◵'[Math.floor(t * 6) % 4] + ' ' + Math.max(0, t - T.every1).toFixed(1) + ' s'; c = t > T.seconds - 0.05 ? RED : AMB; }
    setH('lgS', s); $('lgS').style.color = c;
    $('lgS').style.transform = `scale(${1 + 0.25 * pulse(t, T.ms, 6) + 0.2 * pulse(t, T.seconds, 6)})`;
  }
  const a1 = popIn(t, T.del - 0.15, T.every1 + 0.3), a2 = popIn(t, T.whats - 0.12, T.users2 - 0.15), on2 = a2.a > 0.001, a = on2 ? a2 : a1;
  vis(LN_, a.a, `translateY(${a.y}px) scale(${a.s})`);
  if (a.a > 0.001) {
    const n = on2 ? DROP.length : Math.floor(clamp((t - T.del + 0.1) * 40, 0, DROP.length));   // typed as the voice says it
    const ix = `<span style="color:${on2 ? AMB : '#ff8a6a'}">INDEX</span>`;
    setH('lnT', `<span style="color:${on2 ? '#8d8478' : '#f0d8cc'}">${DROP.slice(0, n).replace('INDEX', ix)}</span>`);
    $('lnT').style.opacity = on2 ? 1 : 1 - 0.35 * ep(t, T.line1 + 0.3, T.line1 + 0.6);
    $('lnX').style.width = '0px';
    setH('lnS', on2 ? '● ?' : t > T.line1 + 0.2 ? '● DROPPED' : '');
    $('lnS').style.color = on2 ? AMB : RED;
    LN_.style.borderColor = on2 ? 'rgba(255,195,77,0.5)' : t > T.line1 ? 'rgba(255,70,50,0.6)' : '';
  }
}
function bookDom(t) {
  const p = popIn(t, T.like2 - 0.05, T.catch_ - 0.15); vis(BK, p.a, `translateY(${p.y}px) scale(${p.s})`);
  if (p.a <= 0.001) return;
  const hit = t > T.find - 0.05, sk = ep(t, T.skip - 0.05, T.skip + 0.3);
  BOOK.forEach((_, i) => {
    const e = $('bk' + i); e.className = 'e' + (hit && i === BI ? ' on' : '');
    e.style.opacity = i === BI ? 1 : 1 - 0.75 * sk; e.style.filter = i === BI || sk < 0.01 ? 'none' : `blur(${2.5 * sk}px)`;
  });
  const pp = popIn(t, T.page - 0.05, T.catch_ + 1); vis($('bkP'), pp.a, `translateY(${pp.y}px)`);
}
function clampTags() {
  for (const k in LB) {
    const e = LB[k]; if (e.style.display === 'none') continue;
    const w = e.offsetWidth, x = parseFloat(e.style.left), y = clamp(parseFloat(e.style.top), 124, 668);
    const right = y > 450 ? 540 - 70 : 540 - 14;
    e.style.left = clamp(x, 14 + w / 2, right - w / 2) + 'px'; e.style.top = y + 'px';
  }
}

window.render = (t) => {
  shoot(t);
  orbsReset(); sparksReset(); ringsReset();
  REEL.world(t);
  sparksFlush(); updateEmbers(t);
  renderer.setRenderTarget(rtMain); renderer.render(scene, pcam);
  bloom();
  REEL.tags(t); clampTags();
  card(t); tools(t);
  hookDom(t); bookDom(t);
  $('dim').style.opacity = Math.max(0.55 * ep(t, REEL.end, REEL.end + 0.6), 0.5 * window01(t, T.like2 - 0.1, T.catch_ - 0.05, 0.3));
  $('flash').style.opacity = REEL.flash(t);
  caps(t);
  profile(t);
  if (t < 2.3) { const m = ep(t, 0.85, 1.35, ease.inOut); cursorAt(lerp(330, 152, m), lerp(380, 250, m), ep(t, 0.7, 0.9) * (1 - ep(t, 1.9, 2.2)), window01(t, 1.42, 1.6, 0.05)); }
};
