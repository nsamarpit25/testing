  S2: 33.10, build: 33.92, freezes: 34.82, image: 35.90, snapshot: 36.50, S3: 38.74, image2: 40.22, anywhere: 40.62, container: 41.48,
  lap: 42.24, srv: 42.82, mate: 43.46, pc: 44.12, identical: 44.48, L8: 45.48, crash2: 46.00, srv2: 46.82, exact: 47.56, tested: 48.48, node3: 49.16,
  L9: 50.82, img3: 51.00, box3: 51.56, cont3: 52.28, running: 53.28, follow: 54.50, cont4: 55.92, crashes4: 56.20, am: 56.74, who: 57.18, restarts: 57.58, sleep: 58.52 };

const cv = $('cv'), g = cv.getContext('2d');
const cam = { f: [0, 0, 0], s: 1, a: 0.9, e: 0.62, sx: 270, sy: 500 };
let ca, sa, ce, se, toCam;
function camApply() { ca = Math.cos(cam.a); sa = Math.sin(cam.a); ce = Math.cos(cam.e); se = Math.sin(cam.e); toCam = [-sa * ce, -ca * ce, se]; }
function P(x, y, z) {
  const dx = x - cam.f[0], dy = y - cam.f[1], dz = z - cam.f[2];
  const r = dx * ca - dy * sa, f = dx * sa + dy * ca;
  return [cam.sx + r * cam.s, cam.sy - (dz * ce + f * se) * cam.s];
}
const D = (x, y, z) => (x * sa + y * ca) * ce - z * se;

// world layout: laptop, server, teammate PC on one screen-horizontal row; the dock behind them
const RV = [0.622, -0.783];
const LP = [-187, 235], SV = [0, 0], PCP = [187, -235], DK = [250, 300], DKR = [DK[0] + RV[0] * 175, DK[1] + RV[1] * 175];
const LAND = { L: [LP[0] + 55, LP[1] - 4, 46], S: [0, 0, 190], P: [PCP[0] + 55, PCP[1] - 4, 46] };
const DROP = { L: T.lap, S: T.srv, P: T.pc };

const SHOTS = [
  { t: 0, d: 0, f: [-150, 225, 70], s: 1.6, a: 0.9, e: 0.6, sy: 480 },
  { t: 0.4, d: 1.9, f: [-150, 225, 75], s: 1.42 },

  { t: 20.4, d: 1.4, f: [-132, 231, 60], s: 1.15, a: 0.98, sy: 560 },
  { t: 21.85, d: 0.75, f: [DK[0], DK[1], 60], s: 1.6, a: 0.84, sy: 520 },
  { t: 25.7, d: 0.6, f: [DK[0], DK[1], 45], s: 2.0 },
  { t: 27.5, d: 0.9, f: [DK[0], DK[1], 45], s: 1.45, a: 0.9, sy: 560 },
  { t: 33.0, d: 0.9, f: [DK[0], DK[1], 45], s: 1.7, a: 0.97, sy: 540 },
  { t: 36.42, d: 0.12, s: 1.85 },
  { t: 37.0, d: 1.2, s: 1.62 },
  { t: 38.6, d: 1.3, f: [19, 18, 70], s: 0.54, a: 0.9, e: 0.62, sy: 520 },
  { t: 44.9, d: 0, f: [19, 18, 60], s: 0.68, sy: 610 },
  { t: 45.3, d: 0.8, f: [0, 0, 215], s: 1.35, sy: 560 },
  { t: 50.6, d: 0.9, f: [(DK[0] + DKR[0]) / 2, (DK[1] + DKR[1]) / 2, 45], s: 1.4, sy: 540 },
  { t: 54.3, d: 0.6, f: [0, 0, 150], s: 0.85, sy: 640 },
  { t: 55.8, d: 0.45, f: [0, 0, 215], s: 1.6, sy: 650 },
  { t: 57.1, d: 1.6, s: 1.3 },

const KICKS = [[2.6, 0.02], [T.crash, 0.07], [T.same, 0.03], [T.every, 0.03], [T.node16, 0.03], [T.never, 0.03], [T.machine, 0.08], [T.docker, 0.05], [22.6, 0.04], [T.ship, 0.03], [T.train, 0.03],
  [T.wnode, 0.02], [T.wlib, 0.02], [T.wfiles, 0.02], [T.build, 0.03], [T.snapshot, 0.05], [T.lap, 0.04], [T.srv, 0.04], [T.pc, 0.04], [T.identical, 0.05], [T.srv2, 0.03], [T.cont3, 0.03], [T.crashes4, 0.07], [T.restarts, 0.03]];
const SHAKES = [[T.crash, 8, 0.7], [T.machine, 7, 0.55], [22.6, 3, 0.3], [T.ship, 3, 0.25], [T.train, 3, 0.25], [T.lap, 3, 0.25], [T.srv, 3, 0.25], [T.pc, 3, 0.25], [T.crashes4, 7, 0.6]];
function camAt(t) {
  let cur = { ...SHOTS[0] };
  for (let i = 1; i < SHOTS.length; i++) {
    const k = SHOTS[i];
    if (t < k.t) break;
    const p = k.d ? ease.inOut(prog(t, k.t, k.t + k.d)) : 1;
    const tg = { ...cur, ...k };
    cur = { f: [0, 1, 2].map((j) => lerp(cur.f[j], tg.f[j], p)), s: lerp(cur.s, tg.s, p), a: lerp(cur.a, tg.a, p), e: lerp(cur.e, tg.e, p), sy: lerp(cur.sy, tg.sy, p) };
  }
  let kick = 0;
  for (const [t0, amp] of KICKS) { const dt = t - t0; if (dt > 0 && dt < 1.2) kick += amp * (dt < 0.05 ? dt / 0.05 : Math.exp(-(dt - 0.05) * 6)); }
  let shx = 0, shy = 0;
  for (const [t0, amp, dur] of SHAKES) { const dt = t - t0; if (dt > 0 && dt < dur) { const k = amp * (1 - dt / dur); shx += k * Math.sin(t * 91); shy += k * Math.cos(t * 67); } }
  cam.f = cur.f; cam.s = cur.s * (1 + kick); cam.a = cur.a + 0.035 * Math.sin(t * 0.21); cam.e = cur.e; cam.sx = 270 + shx; cam.sy = cur.sy + shy;
  camApply();
}

/* ------------------------------------------------------------------ draw list */
let DL = [];
const add = (layer, depth, fn) => DL.push({ layer, depth, fn });
function flush() { DL.sort((a, b) => a.layer - b.layer || b.depth - a.depth); for (const d of DL) d.fn(); DL = []; }
const LIGHT = (() => { const l = [-0.35, -0.6, 1]; const n = Math.hypot(...l); return l.map((v) => v / n); })();
function poly(pts, fill, stroke, lw = 1) {
  g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function glow(col, blur) { g.shadowColor = col; g.shadowBlur = blur * 2; }
function noGlow() { g.shadowBlur = 0; g.shadowColor = 'transparent'; }

// face frame helpers (u right, v up, units = world)
const fpt = (F, u, v) => P(F.o[0] + F.u[0] * u + F.v[0] * v, F.o[1] + F.u[1] * u + F.v[1] * v, F.o[2] + F.u[2] * u + F.v[2] * v);
function fquad(F, u0, v0, u1, v1, fill, gl) {
  if (gl) glow(gl[0], gl[1]);
  poly([fpt(F, u0, v0), fpt(F, u1, v0), fpt(F, u1, v1), fpt(F, u0, v1)], fill);
  if (gl) noGlow();
}
function ftext(F, u, v, str, size, fill, font = 'Mono', weight = 700, align = 'center', gl) {
  const p0 = fpt(F, u, v), pu = fpt(F, u + 1, v), pv = fpt(F, u, v + 1);
  g.save();
  g.setTransform(2 * (pu[0] - p0[0]), 2 * (pu[1] - p0[1]), -2 * (pv[0] - p0[0]), -2 * (pv[1] - p0[1]), 2 * p0[0], 2 * p0[1]);
  g.font = `${weight} ${size}px ${font}`; g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = fill;
  if (gl) { g.shadowColor = gl; g.shadowBlur = 14; }
  g.fillText(str, 0, 0);
  g.restore();
}
function fpath(F, pts, col, lw, gl) {
  g.save(); if (gl) glow(gl, 8);
  g.strokeStyle = col; g.lineWidth = lw * cam.s; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); pts.forEach(([u, v], i) => { const p = fpt(F, u, v); i ? g.lineTo(...p) : g.moveTo(...p); }); g.stroke();
  noGlow(); g.restore();
}
// box: x,y centre, z bottom. o: {layer, op, edge, lw, gl:[col,blur], front(F), side(F), top(F), dz}
function box(x, y, z, w, d, h, col, o = {}) {
  add(o.layer ?? 1, D(x, y, z + h / 2) + (o.dz || 0), () => drawBox(x, y, z, w, d, h, col, o));
}
function drawBox(x, y, z, w, d, h, col, o) {
  const x0 = x - w / 2, x1 = x + w / 2, y0 = y - d / 2, y1 = y + d / 2, z1 = z + h;
  const faces = [

  // ---- dock: blueprint -> layers -> frozen image

  const IZ = 14;
  if (t > 27.75 && t < T.S2 + 2) {

  TIN.forEach(([dx, c], i) => sparks(t, [T.wnode, T.wlib, T.wfiles, T.wfiles + 0.15][i] + 0.28, DK[0] + dx, DK[1], IZ + 6, c, 14, 40 + i, 90, 0.5, 2.4, 100));
  if (t > T.build - 0.05) {
    const lp = [0, 1, 2, 3].map((k) => ep(t, T.build + k * 0.2, T.build + k * 0.2 + 0.22, (x) => x));
    const fr = ep(t, T.freezes, T.freezes + 0.6);
    const gl = 0.5 + 0.6 * Math.exp(-Math.max(0, t - T.image2) * 3) * (t > T.image2 ? 1 : 0) + 0.4 * Math.exp(-Math.max(0, t - T.snapshot) * 4) * (t > T.snapshot ? 1 : 0);
    imageBox(DK[0], DK[1], IZ, { lp, frost: fr, gl, labels: t < T.freezes + 0.4, op: DOP });
    frostSparkles(t, DK[0], DK[1], IZ, fr * 0.9 * DOP);
    for (let k = 0; k < 4; k++) sparks(t, T.build + k * 0.2 + 0.22, DK[0], DK[1], IZ + k * 13, LAYC[k], 16, 50 + k, 110, 0.5, 2.4, 80);
  }

  // ---- run: copies arc from the image to every machine
  const copies = { L: LAND.L, S: LAND.S, P: LAND.P };
  for (const m of ['L', 'S', 'P']) {
    const tl = DROP[m];
    if (t < T.anywhere) continue;
    // dashed route preview
    const ra = window01(t, T.anywhere, tl + 0.2, 0.25);
    if (ra > 0.01) add(2, 1e5, () => {
      g.save(); g.setLineDash([5, 6]); g.lineDashOffset = -t * 40; g.strokeStyle = rgba(K.gr, 1, 0.6 * ra); g.lineWidth = 1.6;
      g.beginPath(); for (let k = 0; k <= 30; k++) { const pp = P(...arc([DK[0], DK[1], IZ + 52], copies[m], k / 30, 200)); k ? g.lineTo(...pp) : g.moveTo(...pp); } g.stroke(); g.setLineDash([]); g.restore();
    });

    const landed = t >= tl;
    const bounce = landed ? Math.max(0, 8 * Math.sin((t - tl) * 16) * Math.exp(-(t - tl) * 7)) : 0;
    const sc = lerp(1, 0.78, q);
    const iden = Math.exp(-Math.max(0, t - T.identical) * 4) * (t > T.identical ? 1 : 0);
    const fl = Math.max(landed ? Math.exp(-(t - tl) * 6) : 0, iden);
    const isS = m === 'S';
    const fail = isS && t > T.crashes4 ? (Math.sin(t * 18) > 0 ? 1 : 0.6) : isS && t > 45.9 && t < T.srv2 ? (Math.sin(t * 30) > 0 ? 0.8 : 0) : 0;
    const xray = isS ? window01(t, T.node3 - 0.1, 50.5, 0.3) : 0;
    container(p[0], p[1], p[2] + bounce, { sc, col: mixc(ICE, K.bl, Math.min(1, q * 1.4)), lights: landed ? 1 : 0, run: true, tiles: 1, layer: landed ? 1 : 2, flash: fl, fail, wall: 1 - 0.78 * xray, gl: 0.45, op: MOP });
    if (landed) {
      sparks(t, tl, copies[m][0], copies[m][1], copies[m][2] + 8, K.gr, 30, 60 + tl, 170, 0.7, 3, 160);
      ripple(t, tl, copies[m][0], copies[m][1], copies[m][2], K.gr, 160, 0.9, 3);

  }
  if (t > T.crashes4) { sparks(t, T.crashes4, 0, 0, 220, K.rd, 46, 71, 240, 1.0, 3.4, 220); ripple(t, T.crashes4, 0, 0, 0, K.rd, 300, 1.1, 4); }
  if (t > T.who) sparks(t, 57.6 + ((t - 57.6) % 0.9 < 0 ? 0 : Math.floor((t - 57.6) / 0.9) * 0.9), 0, 0, 225, K.rd, 10, 80 + Math.floor(t / 0.9), 120, 0.5, 2.4, 140);
  // ---- image vs container at the dock
  if (t > 51.5) {

    const p = arc([DK[0], DK[1], IZ + 52], [DKR[0], DKR[1], 0], q, 120);

  {

  kinIn(SAME, t, T.same - 0.04, T.L1 - 0.1, 1.5); echo(SAME, t, T.same, 0.5);

  if (cardAnim(DIFF, t, T.L2 - 0.05, T.L3 - 0.05) > 0) {
    DROWS.forEach(([ta, tb], i) => {

  callout('lib1', 'installed months ago…', [HOVL[1][0], HOVL[1][1], HOVL[1][2] + 40], 40, -40, window01(t, T.library + 0.05, T.forgot - 0.05, 0.15), HX.vi);
  callout('lib2', '…and forgot 🤷', [HOVL[1][0], HOVL[1][1], HOVL[1][2] + 40], 40, -40, window01(t, T.forgot, 15.1, 0.15), HX.vi);
  tag('miss', 'MISSING', `background:${HX.rd};color:#fff`, [HOVS[1][0], HOVS[1][1], HOVS[1][2] + 58], t, T.never + 0.05, T.L3);
  // the fix
  kinIn(FIXK, t, T.fix - 0.04, T.dont - 0.02, 1.25);
  {
    const p = ep(t, T.just, T.just + 0.16, ease.in), o = ep(t, 19.0, 19.25);
    vis(JUST, t < T.just ? 0 : 1 - o, `rotate(-7deg) scale(${lerp(2.3, 1, p)})`);
  }
  kinIn(DOCK, t, T.docker - 0.04, T.L4 + 0.05, 2.0); echo(DOCK, t, T.docker, 0.7);
  // container metaphor
  {
    const a = window01(t, T.same2 - 0.1, T.inside, 0.25);
    vis(STEPS, a, `translateY(${(1 - a) * 10}px)`);
    [[T.truck, 'v1'], [T.ship, 'v2'], [T.train, 'v3']].forEach(([tv, id], i) => {
      const e = $(id), on = t >= tv - 0.05;

      if (e._s !== st) { e._s = st; e.style.cssText = st; }
      e.style.transform = `scale(${1 + 0.2 * Math.exp(-Math.max(0, t - tv) * 9) * (on ? 1 : 0)})`;

  tag('samebox', '📦 SAME BOX', `background:${HX.bl};color:#fff;font-size:11px`, [DK[0], DK[1], 112], t, T.same2, T.inside);
  tag('lock', '🔒 NEVER CHANGES', `background:${HX.gr};color:#0a0d1f;font-size:11px`, [DK[0], DK[1], 104], t, T.nevr - 0.05, 27.6);
  // Dockerfile
  if (cardAnim(DF, t, 28.8, 33.0) > 0) {
    const n = DFL.filter((l) => t >= l[0]).length, el2 = $('dfl');
    const key = n + ':' + Math.floor(t * 2) % 2;
    if (el2._n !== key) {
      el2._n = key;
      el2.innerHTML = DFL.slice(0, n).map((l, i) => { const hot = t - l[0] < 0.45 && l[2] >= 0; return `<span class="ln">${i + 1}</span><span style="${hot ? 'background:rgba(250,204,21,0.16);border-radius:4px' : ''}">${l[1]}</span>`; }).join('\n') + (n < DFL.length ? `\n<span class="ln"></span><span style="color:var(--ye);opacity:${Math.floor(t * 2) % 2 ? 1 : 0.2}">▋</span>` : '');
    }
  }
  // build
  ['node:18', 'npm install', 'your files', 'CMD node app.js'].forEach((s, k) => callout('ly' + k, s, [DK[0] + 55, DK[1] - 26, IZ + k * 13 + 6.5], 46, -10 - k * 6, window01(t, T.build + k * 0.2 + 0.2, T.freezes + 0.5, 0.15), HX[['gr', 'vi', 'or', 'cy'][k]]));
  tag('frz', '❄ FROZEN', `background:${HX.cy};color:#0a0d1f;font-size:11px`, [DK[0], DK[1], IZ + 92], t, T.freezes + 0.1, T.image - 0.02);
  {
    const sub = t > T.box3 && t < T.follow ? '<div class="sub">= the box</div>' : '';
    const imgWin = t < 45.4 ? [T.image, 45.4] : [T.img3, 54.4];
    tag('img', `❄ IMAGE${sub}`, `background:${HX.cy};color:#0a0d1f;font-size:${t > 50 ? 13 : 11}px;text-align:center`, [DK[0], DK[1], IZ + 92], t, imgWin[0], imgWin[1]);
    const sub2 = t > T.running ? '<div class="sub">= the box, running</div>' : '';
    tag('ctr', `▶ CONTAINER${sub2}`, `background:${HX.gr};color:#0a0d1f;font-size:13px;text-align:center`, [DKR[0], DKR[1], 100], t, T.cont3, 54.4);
  }
  {
    const p = P(DK[0], DK[1], IZ + 26), a = window01(t, T.snapshot - 0.05, 37.4, 0.12), s = lerp(1.35, 1, ep(t, T.snapshot - 0.05, T.snapshot + 0.25, ease.outExpo));
    SHUT.style.left = p[0] + 'px'; SHUT.style.top = p[1] + 'px'; vis(SHUT, a, `translate(-50%,-50%) scale(${s * cam.s / 1.75})`);
  }
  tag('snap', '📸 SNAPSHOT', `background:#fff;color:#0a0d1f;font-size:11px`, [DK[0], DK[1], IZ + 128], t, T.snapshot, 37.6);
  // run
  kinIn(IDEN, t, T.identical - 0.04, 45.35, 1.6); echo(IDEN, t, T.identical, 0.6);
  // payoff on the server
  {
    const crashed = t < T.srv2;
    tag('srvs', crashed ? '✕ CRASHED?' : '✓ RUNS', `background:${crashed ? HX.rd : HX.gr};color:${crashed ? '#fff' : '#0a0d1f'};font-size:12px`, [0, 0, 262], t, T.crash2 - 0.1, 47.5);
    callout('tested', 'the exact box you tested', [LAND.S[0] - 30, LAND.S[1] - 20, 230], -40, -60, window01(t, T.exact - 0.05, T.node3 - 0.1, 0.2), HX.gr);
    callout('n18', 'node 18 included ✓', [LAND.S[0] + TIN[0][0] * 0.78, LAND.S[1], 200], -30, -70, window01(t, T.node3, 50.5, 0.2), HX.gr);
  }

  if (cardAnim(FOL, t, T.follow - 0.05, 55.75) > 0) {
    const fb = $('fb'), done = t > 55.05;
    if (fb._d !== done) { fb._d = done; fb.textContent = done ? 'Following ✓' : 'Follow'; fb.style.background = done ? '#262f55' : '#4F8CFF'; }
    fb.style.transform = `scale(${1 - 0.06 * window01(t, 54.95, 55.15, 0.07)})`;
  }
  if (t > T.follow) {
    const tap = window01(t, 54.95, 55.15, 0.07);
    const cx = lerp(470, 300, ep(t, 54.55, 54.9, ease.inOut)), cy = lerp(760, 548, ep(t, 54.55, 54.9, ease.inOut));

  {
    const a = ep(t, T.cont4 - 0.1, T.cont4 + 0.2, ease.outExpo);

};
// confetti on follow
const _r = window.render;
window.render = function (t) {

    const dt = t - 55.05, cols = [HX.bl, HX.cy, HX.gr, HX.vi, HX.pk, HX.ye];

    }
    g.restore(); g.globalAlpha = 1;
  }
};
