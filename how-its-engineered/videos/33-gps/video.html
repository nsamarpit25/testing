<meta charset="utf-8">
<!-- 33 GPS, solid low-poly dioramas (kit.js + scenes.js + gps.js). Story: your phone knows your street; the satellites
     have no idea you exist. The phone never sends, only listens. ~30 satellites with atomic clocks broadcast where they
     are and when each signal left; travel time at light speed = distance; one distance = a sphere, three overlap at one
     spot, a fourth fixes the phone's clock. Until May 2000 public GPS was wrong on purpose (a street away); switched off
     overnight. Twist: the satellites only say where they are; your phone works out where you are. Beats from voice/words.js. -->

<link rel="stylesheet" href="lib/reel.css">
<style>

.hc .v { font: 750 19px/1.05 Inter; letter-spacing: -0.3px; margin-top: 6px; color: #f5f4f3; font-variant-numeric: tabular-nums; }
.hc.big .v { font-size: 24px; }

.hp { position: absolute; left: 0; top: 0; display: none; font: 600 11px/1 Inter; padding: 6px 10px 6px 9px; border-radius: 20px; background: rgba(24,22,20,0.9); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 6px 16px rgba(0,0,0,0.4); color: #e6e3e0; white-space: nowrap; transform-origin: 0 0; }
.hp::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
.hp.hot { border-color: var(--cg); }

#cap .box::before, #cap .box::after { content: ''; position: absolute; width: 8px; height: 8px; border: 1.6px solid #ff6a1f; }
#cap .box::before { left: -2px; top: -4px; border-width: 1.6px 0 0 1.6px; }
#cap .box::after { right: -2px; bottom: -4px; border-width: 0 1.6px 1.6px 0; }

<script>
for (let i = 0; i < 48; i++) { const m = new TH.Mesh(new TH.RingGeometry(0.9, 1, 96), new TH.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: TH.AdditiveBlending, depthWrite: false, toneMapped: false, side: TH.DoubleSide })); m.visible = false; scene.add(m); RINGS.push(m); }
const RING_TX = ctex(512, 512, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.8, 'rgba(255,255,255,0.025)'); gr.addColorStop(0.985, 'rgba(255,255,255,0.06)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#ffffff'; g.lineWidth = 3.2; g.beginPath(); g.arc(w / 2, h / 2, w / 2 - 6, 0, 7); g.stroke();
});
const RING_G = new TH.PlaneGeometry(2, 2);
for (const m of RINGS) { m.geometry = RING_G; m.material.map = RING_TX; m.material.needsUpdate = true; m.renderOrder = 4; }
// a flat ring on the ground (z up)
function ripple(t, t0, x, y, z, col, maxR, dur = 0.9) {
  const p = prog(t, t0, t0 + dur); if (p <= 0 || p >= 1 || ringI >= RINGS.length) return;
  const m = RINGS[ringI++], r = maxR * (0.1 + 0.9 * ease.out(p));
  m.visible = true; m.quaternion.identity(); m.position.set(x, y, z); m.scale.set(r, r, 1); m.material.color.set(col); m.material.opacity = 0.85 * Math.pow(1 - p, 1.3) * Math.min(1, p * 12);
}
// a ring that faces the camera (space), radius in screen px
function rippleB(t, t0, p, col, rpx, dur = 1.2, a = 0.85) {
  const q = prog(t, t0, t0 + dur); if (q <= 0 || q >= 1 || ringI >= RINGS.length) return;
  const m = RINGS[ringI++], r = rpx / cam.s * (0.08 + 0.92 * ease.out(q));
  m.visible = true; m.quaternion.copy(camera.quaternion); m.position.set(...p); m.scale.set(r, r, 1); m.material.color.set(col); m.material.opacity = a * Math.pow(1 - q, 1.3) * Math.min(1, q * 12);
}
const LMAX = 8, LINKS = [];
const dotSprite = () => { const sp = new TH.Sprite(new TH.SpriteMaterial({ map: TX_ORB, transparent: true, blending: TH.AdditiveBlending, depthWrite: false, depthTest: false, toneMapped: false })); sp.visible = false; sp.renderOrder = 6; scene.add(sp); return sp; };
for (let i = 0; i < 8; i++) {
  const geo = new TH.LineGeometry(); geo.setPositions(new Array(LMAX * 3).fill(0).map((_, k) => k));
  const core = new TH.Line2(geo, lineMat(O, 3.4)), halo = new TH.Line2(geo, lineMat(O, 11, { add: true, op: 0.16 }));
  core.renderOrder = 5; halo.renderOrder = 4;
  for (const l of [core, halo]) { l.frustumCulled = false; l.visible = false; scene.add(l); }
  LINKS.push({ geo, core, halo, head: dotSprite(), end: dotSprite() });
}
let linkI = 0;
function linksReset() { linkI = 0; for (const L of LINKS) L.core.visible = L.halo.visible = L.head.visible = L.end.visible = false; }
function subLine(pts, q0, q1) {
  const d = [0]; for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(...[0, 1, 2].map((j) => pts[i][j] - pts[i - 1][j])));
  const L = d[d.length - 1], at_ = (u) => { let i = 1; while (i < pts.length - 1 && d[i] < u) i++; const k = (u - d[i - 1]) / Math.max(1e-6, d[i] - d[i - 1]); return [0, 1, 2].map((j) => lerp(pts[i - 1][j], pts[i][j], clamp(k))); };

  for (let i = 1; i < pts.length - 1; i++) if (d[i] > u0 && d[i] < u1) out.push(pts[i]);
  out.push(at_(u1)); return out;
}
// link(t, pts, t0, dur, t1, col): draws on along pts over [t0, t0+dur] (eased unless o.lin), holds, fades out at t1
function link(t, pts, t0, dur, t1, col, o = {}) {
  if (t < t0 || t > t1 || linkI >= LINKS.length) return null;
  const L = LINKS[linkI++], fq = o.lin ? (x) => x : ease.inOut, q = fq(prog(t, t0, t0 + dur)), q0 = o.travel ? ease.inOut(prog(t, t0 + dur * 0.35, t0 + dur * 1.25)) : 0;
  const a = (o.a ?? 1) * (1 - ep(t, t1 - 0.25, t1)) * (o.travel ? 1 - ep(t, t0 + dur * 1.05, t0 + dur * 1.25) : 1);
  if (q <= 0.001 || a <= 0.01) return null;
  const part = subLine(pts, q0, q).slice(0, LMAX), arr = L.geo.attributes.instanceStart.data.array;
  for (let i = 0; i < part.length - 1; i++) arr.set([...part[i], ...part[i + 1]], i * 6);
  L.geo.attributes.instanceStart.data.needsUpdate = true; L.geo.instanceCount = part.length - 1;
  for (const [l, k] of [[L.core, 1], [L.halo, 0.16]]) { l.visible = true; l.material.color.set(col); l.material.opacity = a * k; }
  const tip = part[part.length - 1], px = 1 / cam.s;
  if (q < 0.999 || o.travel) { L.head.visible = true; L.head.position.set(...tip); L.head.material.color.set(mixHex(col, '#ffffff', 0.5)); L.head.material.opacity = a; L.head.scale.set(16 * px, 16 * px, 1); }
  if (q >= 0.999 && !o.travel) { const k = ease.out(prog(t, t0 + dur, t0 + dur + 0.25)); L.end.visible = true; L.end.position.set(...tip); L.end.material.color.set(col); L.end.material.opacity = a * (0.6 + 0.4 * (1 - k)); L.end.scale.set((10 + 14 * (1 - k)) * px, (10 + 14 * (1 - k)) * px, 1); }
  return tip;
}

/* ---------------- beats */
const T = {
  street: at('street'), gps1: at('gps'), idea: at('idea'), exist: at('exist'),
  your2: at('your', 2), never: at('never'), sends: at('sends'), anything: at('anything'), only1: at('only'), listens: at('listens'),
  about: at('about'), n30: at('30'), orbit: at('orbit'), earth: at('earth'), carrying: at('carrying'), precise1: at('precise'), clocks: at('clocks'),
  they: at('they'), broadcasting: at('broadcasting'), where1: at('where'), when: at('when'), left: at('left'),
  signals: at('signals'), speed: at('speed'), light: at('light'), takes: at('takes'), far: at('far'), is1: at('is'),
  one2: at('one', 2), distance: at('distance'), sphere: at('sphere'), add: at('add'), sats3: at('satellites', 3), spheres: at('spheres'), overlap: at('overlap'), spot: at('spot'),
  fourth: at('fourth'), fixes: at('fixes'), clock: at('clock'), nowhere: at('nowhere'), precise2: at('precise', 2),
  until: at('until'), y2000: at('2000'), america: at('america'), wrong: at('wrong'), purpose: at('purpose'), street2: at('street', 2), really: at('really'), were: at('were'),
  then: at('then'), president: at('president'), error: at('error'), switched: at('switched'), off: at('off'), overnight: at('overnight'), road: at('road'),
  so2: at('so', 2), tracking: at('tracking'), space: at('space'), sats4: at('satellites', 4), say: at('say'), your5: at('your', 5), works: at('works'), are4: at('are', 3),
  follow: at('follow'),
};
const CUT = { HOOK: 0, PH0: at('the') - 0.04, SAT: T.gps1 - 0.08, ST1: T.your2 - 0.12, GLOBE: T.about - 0.1, CLK: T.carrying - 0.1, BC: T.they - 0.15, LIGHT: T.signals - 0.12,

/* ---------------- build */
const CI = buildCity(), SP = buildSpace(), PH = buildPhoneStudio();
// the AirTag reel's story objects stay hidden
[CI.bag.g, CI.herBag.g, CI.redTag.g, CI.stranger.root, CI.you.root, CI.hider.root].forEach((o) => { o.visible = false; });
CI.movers.forEach((m) => { m.g.visible = false; }); CI.dots.visible = false;

const YLANE = -560, youX = (t) => t < CUT.SAT ? -420 + 60 * t : t < CUT.GLOBE ? -480 + 60 * (t - CUT.ST1) : t < CUT.FIN ? -300 + 60 * (t - CUT.SA) : -460 + 60 * (t - CUT.FIN);

const HOLO = { x: holo(ICO.x, 110, RED), pin: holo(ICO.pin, 120, O), epin: holo(ICO.pin, 120, O), wpin: holo(ICO.pin, 300, RED), tpin: holo(ICO.pin, 230, O) };

/* ---------------- phone screens */
const UI = { card: '#1f1d1c', tile: '#2c2a28', tx: '#f5f4f3', tx2: '#a39e99', tx3: '#6f6a66' };
const uiSpace = (g, W, H) => { const k = W / 600; g.scale(k, k); return H / k; };
function rr(g, x, y, w, h, r, fill, stroke, lw = 2) { g.beginPath(); g.roundRect(x, y, w, h, r); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function dot(g, x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = fill; g.fill(); }
function tx(g, s, x, y, font, col, al = 'left', bl = 'alphabetic') { g.font = font; g.fillStyle = col; g.textAlign = al; g.textBaseline = bl; g.fillText(s, x, y); }
function statusBar(g, W, col = UI.tx) {
  tx(g, '9:41', 104, 68, '650 31px Inter', col, 'center');
  for (let k = 0; k < 4; k++) rr(g, W - 198 + k * 10, 70 - 10 - k * 5, 7, 10 + k * 5, 2, col);
  g.strokeStyle = col; g.lineCap = 'round'; g.lineWidth = 4.5; for (const r of [9, 17]) { g.beginPath(); g.arc(W - 132, 70, r, -Math.PI * 0.74, -Math.PI * 0.26); g.stroke(); } dot(g, W - 132, 68, 3.5, col);
  rr(g, W - 104, 47, 48, 24, 8, null, 'rgba(245,244,243,0.5)', 2.5); rr(g, W - 100, 51, 34, 16, 4, col); rr(g, W - 53, 55, 4, 8, 2, 'rgba(245,244,243,0.5)');
}
const MY = 0.36;
function mapBg(g, W, H, z = 1) {
  g.fillStyle = '#1c1b1a'; g.fillRect(0, 0, W, H);
  g.save(); g.translate(W / 2, H * MY); g.rotate(-0.3); g.scale(z, z);
  const CX = 74, CY = 94, N = Math.ceil(1100 / z / CX);
  for (let i = -N; i <= N; i++) for (let j = -N; j <= N; j++) { const r = rnd(i * 31 + j * 7, 3); g.fillStyle = r < 0.08 ? '#1f241d' : r < 0.5 ? '#222120' : '#1f1e1d'; g.fillRect(i * CX + 6, j * CY + 6, CX - 12, CY - 12); }
  g.lineCap = 'butt';
  for (const [w, c, m] of [[7, '#2d2b29', 1], [15, '#3a3734', 4]]) {

  g.strokeStyle = '#151617'; g.lineWidth = 92; g.beginPath(); g.moveTo(-1400, 620); g.bezierCurveTo(-500, 300, -100, 520, 500, 160); g.bezierCurveTo(800, -20, 1100, -60, 1500, -300); g.stroke();
  g.fillStyle = '#74706b'; g.font = '600 21px Inter'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.save(); g.rotate(Math.PI / 2); g.fillText('MARKET ST', -2 * CY, -4 * CX + 1); g.restore(); g.restore();

}
// the maps screen: your street lights up, the blue-dot-style marker in orange, accuracy halo, a frosted sheet

  statusBar(g, W);
  rr(g, 30, 100, W - 60, 74, 37, 'rgba(44,42,40,0.95)'); dot(g, 74, 137, 12, O); tx(g, 'You are here', 102, 147, '650 28px Inter', UI.tx);

    const xx = 30 + i * (tw + 20); rr(g, xx, y0 + 214, tw, 132, 28, UI.tile);

// the phone's clock: off by a millisecond (that's 300 km), until the fourth satellite fixes it
function clockScreen(g, W0, H0, t) {
  const H = uiSpace(g, W0, H0), W = 600, fx = T.clock + 0.1, fixed = t > fx;
  g.fillStyle = '#110f0e'; g.fillRect(0, 0, W, H);

  const gr = g.createRadialGradient(W / 2, cy_, 10, W / 2, cy_, 480); gr.addColorStop(0, hexA(col, 0.18)); gr.addColorStop(1, hexA(col, 0)); g.fillStyle = gr; g.fillRect(0, 0, W, H);

  const scr_ = t > fx - 0.25 && t < fx ? '.' + Array.from({ length: 6 }, (_, i) => Math.floor(rnd(Math.floor(t * 30) + i, 7) * 10)).join('') : fr;
  tx(g, scr_.slice(0, 4) + ' ' + scr_.slice(4), W / 2, cy_ + 50, '700 64px Mono', col, 'center');
  const ok = fixed ? ep(t, fx, fx + 0.3) : 1;

  tx(g, fixed ? 'Synced to GPS time ✓' : 'Off by 0.001 s', W / 2, cy_ + 162, '750 32px Inter', col, 'center');
  tx(g, fixed ? 'Error removed' : '= about 300 km of error', W / 2, cy_ + 240, '600 28px Inter', UI.tx2, 'center');
  g.globalAlpha = 1;
  rr(g, 40, H * 0.72, W - 80, 112, 30, UI.tile);
  tx(g, 'Inside your phone', 74, H * 0.72 + 46, '600 24px Inter', UI.tx2); tx(g, 'Quartz crystal', 74, H * 0.72 + 88, '750 32px Inter', UI.tx);
  tx(g, 'not atomic', W - 74, H * 0.72 + 88, '650 26px Inter', AMB, 'right');
  rr(g, W / 2 - 110, H - 34, 220, 10, 5, UI.tx);
}
function paint(t, mode) { PH.s.draw(mode + Math.floor(t * 30), (g, W, H) => (mode === 'map' ? mapScreen : clockScreen)(g, W, H, t)); }

/* ---------------- camera */
const CUTS = [];
const cut = (t, f, s, o = {}) => CUTS.push({ t, f, s, ...o });
const H1 = (t) => SP.heroAt(0, t), Q = (t, l = 0) => QAt(t, l), mid = (a, b, k = 0.5) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const youAt = (t, z = 110) => [youX(t), YLANE, z];
cut(CUT.HOOK, youAt(0.5, 150), 1.0, { push: 1.08, sy: 480 });
cut(CUT.PH0, [yp[0], yp[1], yp[2] + 2], 4.0, { e: 0.3, push: 1.08, sy: 470, cut: true });
cut(CUT.SAT, H1(CUT.SAT + 1.4), 0.42, { a: -0.62, e: 0.42, push: 1.12, sy: 440 });

const inShot = (t, a, b) => t >= a && t < b;

/* ---------------- the world, frame by frame */
const PING_P = 1.5;
