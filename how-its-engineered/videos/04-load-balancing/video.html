<body>
<div id="stage">
  <div id="world">
    <div id="vignette"></div>
    <canvas id="bg" width="1080" height="1920"></canvas>
    <svg class="full" id="scene" width="540" height="960" viewBox="0 0 540 960"></svg>

    <svg width="17" height="17" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4.6" fill="none" stroke="#fff" stroke-width="2"/><circle cx="17.6" cy="6.4" r="1.3" fill="#fff"/></svg>

  <div id="grain"></div>
  <svg id="cursor" viewBox="0 0 18 24"><path d="M2 2 L2 19 L6.5 15 L9.5 22 L12.5 20.7 L9.6 14 L15.5 14 Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>
</div>

<script>
const $ = (id) => document.getElementById(id);
ISO.layer = $('scene');
const FX = $('fx');
const BG = $('bg').getContext('2d');
const WD = window.WORDS || [];
const TM = window.TIMINGS;
const ph = (li, pi = 0) => TM.find((e) => e.li === li && e.pi === pi);
const S = (li, pi = 0) => ph(li, pi).start, E = (li, pi = 0) => ph(li, pi).end;
const nrm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
// start time of the first spoken word `w` at/after time `after` (falls back to fb)
const W = (w, after, fb) => { const x = WD.find((e) => e[1] >= after - 0.05 && nrm(e[0]).startsWith(w)); return x && x[1] < after + 4 ? x[1] : (fb ?? after); };
const END = E(11, 2) + 1.6;
window.DURATION = Math.ceil(END * 30) / 30;
const RED = '#FF453A', GREEN = '#32D74B';

const caps = makeCaptions($('caps'), TM.map((e, i) => ({
  t: e.start, dur: Math.max(0.35, e.end - e.start), text: e.show,
  end: i + 1 < TM.length ? TM[i + 1].start - 0.02 : END - 0.3,
})));
$('grain').style.backgroundImage = `url(${grainURL(256, 0.07, 11)})`;

// ---------- key times ----------
const TAP = W('play', 0.8, 1.56) - 0.04;
const WAVE = W('same', 1.8, 2.34);
const OK = S(0, 1), WHY = S(0, 2);
const L2 = S(2, 0), REQ = S(2, 1), FINE = S(2, 2), WHILE = W('while', FINE, E(2, 2) - 0.25);
const L3 = S(3, 0);
const L4 = S(4, 0), FLOOD = S(4, 1), HOT = S(4, 2), CRASH = W('crashes', S(4, 3), S(4, 3) + 0.4);
const L5 = S(5, 0), ADD = W('more', S(5, 1), S(5, 1) + 0.25), LBT = W('load', S(5, 2), S(5, 2) + 0.35);
const LAND = LBT + 0.08;
const L6 = S(6, 0), SHORT = W('shortest', S(6, 1), S(6, 1) + 0.8);
const L7 = S(7, 0);
const ONE = W('one', L7 + 0.4, L7 + 1.2), TWO = W('two', ONE, ONE + 0.55), THREE = W('three', TWO, TWO + 0.5), REP = W('repeat', THREE, THREE + 0.4);
const LC = S(7, 1), BUSY = W('busy', S(7, 2), S(7, 2) + 0.7);
const L8 = S(8, 0), DIES = W('dies', L8, L8 + 0.4), SKIP = W('skips', S(8, 1), S(8, 1) + 0.85);
const L9 = S(9, 0), ADD2 = S(9, 1), NOB = W('nobody', ADD2, ADD2 + 0.9);
const L10 = S(10, 0), THOU = S(10, 1);
const L11 = S(11, 0);

// ---------- small helpers ----------
const life = (t, a, b, fi = 0.35, fo = 0.25) => Math.max(0, Math.min(ep(t, a, a + fi), 1 - ep(t, b - fo, b)));
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const at = (A, B, k) => [lerp(A[0], B[0], k), lerp(A[1], B[1], k)];
const flipV = (F) => ({ o: add3(F.o, F.v), u: F.u, v: mul3(F.v, -1) });
function fcircle(o, F, a, b, r, opt = {}) {
  const lu = len3(F.u), lv = len3(F.v), pts = [];
  for (let i = 0; i < 28; i++) { const q = (i / 28) * Math.PI * 2; pts.push(fp(F, a + (r * Math.cos(q)) / lu, b + (r * Math.sin(q)) / lv)); }
  push(o, path2(pts), { w: 0.9, ...opt });
}
const circ = (p, r) => `M${p[0] - r} ${p[1]}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;
const recolor = (o, from, col) => { for (let k = from; k < o.items.length; k++) o.items[k].stroke = col; };
const fx = (tag, attrs, parent = FX) => el(tag, attrs, parent);
const labels = $('labels');
function label(text, x, y, op, cls = '', extra = '') {
  if (op <= 0.01) return;
  const d = document.createElement('div');
  d.className = 'lbl ' + cls; d.innerHTML = text;
  d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.opacity = Math.min(1, op);
  if (extra) d.style.cssText += extra;
  labels.appendChild(d);
}
const popScale = (t, t0, k = 0.45, d = 0.3) => `transform:translate(-50%,-50%) scale(${1 + k * (1 - ep(t, t0, t0 + d))})`;
function card(a, style, inner, cls = 'card') {
  if (a <= 0.001) return '';
  const e = ease.back(clamp(a)), o = clamp(a * 1.5);
  return `<div class="${cls}" style="${style};opacity:${o};transform:translateY(${(1 - e) * 18}px) scale(${lerp(0.92, 1, e)});filter:blur(${(1 - clamp(a * 1.3)) * 6}px)">${inner}</div>`;
}
function ripple(t, t0, p, col = '#fff', R = 34) {
  const k = prog(t, t0, t0 + 0.55);
  if (k <= 0 || k >= 1) return;
  fx('circle', { cx: p[0], cy: p[1], r: 4 + ease.out(k) * R, fill: 'none', stroke: col, 'stroke-width': 1.6 * (1 - k) + 0.3, 'stroke-opacity': 1 - k });
}
function isoRing(t, t0, w, col = '#fff', R = 90, dur = 0.8) {
  const k = prog(t, t0, t0 + dur);
  if (k <= 0 || k >= 1) return;
  const r = 10 + ease.out(k) * R, pts = [];
  for (let i = 0; i <= 40; i++) { const q = (i / 40) * Math.PI * 2; pts.push(P(w[0] + r * Math.cos(q), w[1] + r * Math.sin(q), w[2] || 0)); }
  fx('path', { d: path2(pts), fill: 'none', stroke: col, 'stroke-width': 1.4, 'stroke-opacity': (1 - k) * 0.9 });
}
function pop(t, t0, p, text, cls = 'big', dur = 1.1) {
  const k = prog(t, t0, t0 + dur);
  if (k <= 0 || k >= 1) return;
  label(text, p[0], p[1] - ease.out(k) * 34, Math.min(ep(t, t0, t0 + 0.12), 1 - prog(k, 0.6, 1)), cls, `transform:translate(-50%,-50%) scale(${lerp(1.35, 1, ease.out(clamp(k * 4)))})`);
}
function shards(t, t0, p, col = RED, n = 9, R = 1) {
  const k = prog(t, t0, t0 + 0.7);
  if (k <= 0 || k >= 1) return;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + hash(i) * 0.6, d = 6 + ease.out(k) * (26 + hash(i + 3) * 26) * R, L = 6 * (1 - k) + 2;
    const x = p[0] + Math.cos(a) * d, y = p[1] + Math.sin(a) * d + k * k * 14;
    fx('line', { x1: x, y1: y, x2: x + Math.cos(a + 1) * L, y2: y + Math.sin(a + 1) * L, stroke: col, 'stroke-width': 1.4, 'stroke-opacity': 1 - k });
  }
}
function sparkle(t, t0, p, col = '#fff', R = 30) {
  const k = prog(t, t0, t0 + 0.6);
  if (k <= 0 || k >= 1) return;
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + 0.4, d = ease.out(k) * R * (0.7 + hash(i + 11) * 0.6), s = 5 * (1 - k);
    const x = p[0] + Math.cos(a) * d, y = p[1] + Math.sin(a) * d;
    fx('path', { d: `M${x} ${y - s}L${x + s * 0.25} ${y}L${x} ${y + s}L${x - s * 0.25} ${y}ZM${x - s} ${y}L${x} ${y + s * 0.25}L${x + s} ${y}L${x} ${y - s * 0.25}Z`, fill: col, 'fill-opacity': 1 - k });
  }
}
const fmt = (n) => Math.round(n).toLocaleString('en-US');

// ---------- world layout ----------
const PH = [0, 250], LB = [0, -20], MK = [1000, -60];
const XS = [-300, -150, 0, 150, 300];
const SVP = [...XS.map((x) => [x, -210]), ...XS.map((x) => [x, -370])];
const BTN = [PH[0], PH[1] - 58 + 0.755 * 116, 12];
const LBTOP = [LB[0], LB[1], 44];
const svTop = (i, z = 140) => P(SVP[i][0], SVP[i][1], z);

// crowd: 420 viewers + 200 more that join in the surge
const CROWD = [];
for (let i = 0; CROWD.length < 620; i++) {
  const x = (hash(i * 1.7 + 0.3) * 2 - 1) * 440, y = 125 + hash(i * 2.3 + 0.9) * 360;
  if (Math.abs(x) < 82 && Math.abs(y - PH[1]) < 112) continue;
  const extra = CROWD.length >= 420, d = Math.hypot(x - PH[0], y - PH[1]), r = hash(i + 5.1);
  CROWD.push({ x, y, d, extra, s: hash(i + 9.9), press: extra ? 1e9 : r < 0.3 ? 0.25 + hash(i + 8.8) * (WAVE - 0.4) : WAVE + d * 0.0011, app: extra ? L9 + 0.1 + hash(i + 2.2) * 0.8 : -1 });
}
const crowdPick = (k) => CROWD[Math.floor(hash(k * 3.31 + 0.7) * 420)];

// ---------- objects ----------
function phoneObj(st, c = PH) {
  const [cx, cy] = c, o = Obj();
  const T = box(o, cx - 55, cy - 85, 0, 110, 170, 5);
  tileDots(o, T.top, 6, 9);
  const F = box(o, cx - 30, cy - 58, 5, 60, 116, 7), Sc = F.top;
  fpoly(o, Sc, 0.08, 0.05, 0.84, 0.9, { fill: 'none' });
  fline(o, Sc, 0.38, 0.1, 0.62, 0.1, { w: 1.2 });
  const m = st.mode, press = st.press || 0;
  if (m === 'play') {
    ftext(o, Sc, 0.5, 0.19, 'TONIGHT · 9 PM', 4.4, { weight: 600, op: 0.7, ls: 0.4 });
    ftext(o, Sc, 0.5, 0.27, 'The Finale', 8.2, { weight: 800 });
    fcircle(o, Sc, 0.5, 0.47, 13, { fill: 'none', w: 1.2 });
    push(o, path2([fp(Sc, 0.43, 0.43), fp(Sc, 0.43, 0.51), fp(Sc, 0.6, 0.47)]), { fill: '#fff', stroke: '#fff', w: 0.8 });
    fpoly(o, Sc, 0.16, 0.69, 0.68, 0.13, { fill: press > 0.02 ? '#fff' : 'none', fillOp: press, w: 1 });
    ftext(o, Sc, 0.5, 0.755, 'PLAY', 6.6, { fill: press > 0.5 ? '#000' : '#fff', weight: 800, ls: 0.6 });
  } else if (m === 'load') {
    ftext(o, Sc, 0.5, 0.27, 'The Finale', 8.2, { weight: 800, op: 0.45 });
    for (let k = 0; k < 10; k++) {
      const a = (k / 10) * Math.PI * 2, lit = ((k - st.t * 14) % 10 + 10) % 10 / 10;
      fdot(o, Sc, 0.5 + (9 * Math.cos(a)) / 60, 0.5 + (9 * Math.sin(a)) / 116, 1.15, { fillOp: 0.15 + 0.85 * lit });
    }
    ftext(o, Sc, 0.5, 0.72, 'Loading…', 5, { weight: 500, op: 0.8 });
  } else if (m === 'playing') {
    fpoly(o, Sc, 0.12, 0.16, 0.76, 0.42, { fill: '#fff', fillOp: 0.07, w: 0.9 });
    push(o, path2([fp(Sc, 0.14, 0.56), fp(Sc, 0.32, 0.37), fp(Sc, 0.45, 0.48), fp(Sc, 0.6, 0.31), fp(Sc, 0.86, 0.56)], false), { fill: 'none', w: 0.8 });
    fcircle(o, Sc, 0.72, 0.24, 3.5, { fill: 'none', w: 0.8 });
    const pr = 0.15 + ((st.t * 0.03) % 1) * 0.7;
    fline(o, Sc, 0.14, 0.67, 0.86, 0.67, { op: 0.35, w: 1.4 });
    fline(o, Sc, 0.14, 0.67, 0.14 + 0.72 * pr, 0.67, { stroke: GREEN, w: 1.7 });
    ftext(o, Sc, 0.5, 0.8, 'Playing', 6, { fill: GREEN, weight: 800 });
  } else if (m === 'error') {
    fcircle(o, Sc, 0.5, 0.36, 12, { stroke: RED, fill: 'none', w: 1.4 });
    fline(o, Sc, 0.42, 0.32, 0.58, 0.4, { stroke: RED, w: 1.6 }); fline(o, Sc, 0.58, 0.32, 0.42, 0.4, { stroke: RED, w: 1.6 });
    ftext(o, Sc, 0.5, 0.58, "Can't play", 7, { fill: RED, weight: 800 });
    ftext(o, Sc, 0.5, 0.7, 'Error 503', 5, { font: 'Mono', weight: 500, op: 0.8 });
  }
  if (F.px) { fline(o, F.px, 0.25, 0.5, 0.4, 0.5, { w: 1.1 }); fline(o, F.px, 0.5, 0.5, 0.58, 0.5, { w: 1.1 }); }
  return o;
}
// one server: platform + rack; st = {rise, load, dead, col, flash}
function serverObj(i, t, st) {
  const [cx, cy] = SVP[i], o = Obj();
  const T = box(o, cx - 42, cy - 38, 0, 84, 76, 4);
  tileDots(o, T.top, 4, 4);
  ftext(o, T.top, 0.5, 0.88, 'S' + (i + 1), 6.5, { font: 'Mono', weight: 500, op: 0.6 });
  if (st.rise < 0.02) return o;
  const h = 118 * st.rise, n0 = o.items.length;
  const F = rack(o, cx - 26, cy - 22, 4, 52, 44, h);
  if (st.col) recolor(o, n0, st.col);
  if (F.py && st.rise > 0.85) {
    if (st.dead > 0.5) {
      fline(o, F.py, 0.2, 0.3, 0.8, 0.7, { stroke: RED, w: 2 }); fline(o, F.py, 0.8, 0.3, 0.2, 0.7, { stroke: RED, w: 2 });
    } else {
      const n = Math.round(12 * clamp(st.load));
      for (let k = 0; k < 12; k++) {
        const on = k < n, tw = Math.sin(t * (6 + i) + k * 1.9) > -0.2;
        const v = Math.max(on && tw ? 0.9 : 0, st.flash * (0.5 + 0.5 * Math.sin(t * 40 + k)));
        if (v > 0.05) fdot(o, F.py, 0.8, 0.06 + k * 0.074 + 0.036, 1.7, { fill: st.flash > 0.05 ? (st.fcol || GREEN) : st.load > 0.8 ? RED : '#fff', fillOp: v });
      }
    }
  }
  return o;
}
// load balancer: box with a dial and a pointer arm on top, a door on the front
function lbObj(t, st) {
  const [cx, cy] = LB, o = Obj();
  const T = box(o, cx - 66, cy - 56, 0, 132, 112, 4);
  tileDots(o, T.top, 6, 5);
  const z = 4 + st.drop;
  const n0 = o.items.length;
  const B = box(o, cx - 45, cy - 35, z, 90, 70, 36);
  if (st.col) recolor(o, n0, st.col);
  if (B.py) {
    const D = B.py;
    fpoly(o, D, 0.06, 0.12, 0.88, 0.76, { fill: 'none', w: 0.6, op: 0.7 });
    fpoly(o, D, 0.4, 0.0, 0.2, 0.74, { fill: st.door > 0.02 ? '#fff' : 'none', fillOp: 0.85 * st.door, w: 1, stroke: st.door > 0.02 ? GREEN : '#fff' });
    for (let k = 0; k < 4; k++) fdot(o, D, 0.12 + k * 0.06, 0.62, 1.3, { fillOp: Math.sin(t * 7 + k * 2) > 0 ? 1 : 0.3 });

      g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke();

  const cp = cursorAt(t);
  if (cp) CAM.yaw += clamp((cp[0] - 270) / 270, -1, 1) * 0.04;
  const kick = Math.min(1, ...CUTS.map((c) => (t >= c && t < c + 0.45 ? lerp(0.45, 1, ep(t, c, c + 0.45)) : 1)));

  // ---- visibility ----
  const worldOp = 1 - 0.88 * window01(t, S(1, 0) - 0.1, L2 - 0.08, 0.3) - 0.45 * ep(t, L11, L11 + 0.5);
  const phoneD = Math.min(kick, prog(t, -0.6, 0.4));
  const sv2D = Math.min(kick, prog(t, L2 - 0.05, L2 + 0.9));
  const lbOn = t >= LBT - 0.35;
  const mkD = prog(t, L6 - 0.25, L6 + 0.7) * (t < L7 - 0.05 ? 1 : 0);
  const crowdOp = worldOp * (t < TAP ? 0 : ep(t, TAP, TAP + 0.6)) * (t >= L6 + 0.3 && t < L7 - 0.05 ? 0 : 1);

  // ---- background canvas ----
  const fan = [prog(t, S(1, 0) - 0.15, S(1, 1) + 0.4), prog(t, L2 - 0.4, L2 - 0.05), window01(t, S(1, 0) - 0.15, L2 - 0.05, 0.3)];
  drawBG(t, groundAt(270, 560), Math.max(0.15, worldOp), crowdOp, fan);

  // ---- wires ----
  if (sv2D > 0 && t < LBT && worldOp > 0.05) {
    const red = t > FLOOD - 0.1 && t < L5;
    el('path', { d: path2([P(0, 120, 4), P(0, lerp(120, -150, sv2D), 4)], false), stroke: red ? RED : '#fff', 'stroke-width': lerp(1.1, 2.4, red ? 1 : 0), 'stroke-dasharray': '3 6', 'stroke-dashoffset': -t * (red ? 60 : 26), 'stroke-opacity': (t > CRASH && t < L5 ? 0.2 : 0.6) * worldOp, fill: 'none' }, ISO.layer);
  }
  if (lbOn && t >= LAND) {
    const wk = ep(t, LAND + 0.05, LAND + 0.55);
    el('path', { d: path2([P(0, 120, 4), P(0, 40, 4)], false), stroke: '#fff', 'stroke-width': 1.1, 'stroke-dasharray': '3 6', 'stroke-dashoffset': -t * 30, 'stroke-opacity': 0.6 * worldOp, fill: 'none' }, ISO.layer);
    for (let i = 0; i < 10; i++) {
      const st = svState(i, t);
      if (st.rise < 0.6) continue;
      const k = i < 5 ? wk : ep(t, RISE[i] + 0.3, RISE[i] + 0.7);
      const A = [LB[0], LB[1] - 40], B = [SVP[i][0], SVP[i][1] + 38], M = at(A, B, k);
      const dead = st.dead > 0.5;
      el('path', { d: path2([P(...A, 4), P(...M, 4)], false), stroke: dead ? RED : '#fff', 'stroke-width': 1, 'stroke-dasharray': dead ? '2 7' : '3 6', 'stroke-dashoffset': dead ? 0 : -t * 26, 'stroke-opacity': (dead ? 0.7 : 0.45) * worldOp, fill: 'none' }, ISO.layer);
    }
  }

  // ---- objects (depth sorted) ----
  const objs = [];
  const add = (c, D, f, op = worldOp) => { if (D > 0 && op > 0.02) objs.push({ c, f: () => emit(f(), D, op) }); };
  let pst = { mode: 'play', press: pressAmt(t, [TAP]) };
  if (t >= TAP + 0.12 && t < OK) pst = { mode: 'load', t };
  else if (t >= OK && t < CRASH) pst = { mode: 'playing', t };
  else if (t >= CRASH && t < L5 + 0.4) pst = { mode: 'error', t };
  else if (t >= L5 + 0.4) pst = { mode: 'playing', t };
  add(PH, phoneD, () => phoneObj(pst));
  const ST = [];
  for (let i = 0; i < 10; i++) {
    const st = (ST[i] = svState(i, t));
    if (i === 2) add(SVP[i], sv2D, () => serverObj(i, t, st));
    else if (t >= RISE[i]) add(SVP[i], kick, () => serverObj(i, t, st));
  }
  if (lbOn) {
    const fall = prog(t, LBT - 0.35, LAND), drop = (1 - ease.in(fall)) * 300 + (t > LAND ? Math.sin((t - LAND) * 22) * 7 * (1 - prog(t, LAND, LAND + 0.5)) : 0);
    const ticks = ST.map((s, i) => (s.rise > 0.6 && (i !== 2 || t >= L5) ? (s.dead > 0.5 ? 2 : 1) : 0));
    const door = ep(t, L10 + 0.1, L10 + 0.6) * (1 - ep(t, L11, L11 + 0.4));
    const lbCol = window01(t, L10 + 0.1, THOU + 0.3, 0.3) > 0.5 ? GREEN : null;
    add(LB, kick, () => lbObj(t, { drop, ang: armAngle(t), ticks, door, col: lbCol, armCol: t > BUSY && t < BUSY + 0.9 ? GREEN : null }));
  }
  if (mkD > 0) {
    add([MK[0], MK[1] - 400], mkD, () => floorObj(), 1);
    [0, 1, 2, 3].forEach((j) => add([LANES[j], MK[1] - 92], mkD, () => counterObj(j), 1));
    QN.forEach((n, j) => { for (let k = 0; k < n; k++) { const x = LANES[j], y = qY(k); add([x, y], mkD, () => personObj(x, y, t + k * 0.3 + j), 1); } });
    // the new shopper walks in, gets sent to the shortest lane
    const tgt = [LANES[1], qY(1)], mid = [LANES[1] + 20, MK[1] + 175];
    const w1 = ep(t, L6 + 0.7, L6 + 1.5, ease.inOut), w2 = ep(t, SHORT - 0.15, SHORT + 0.55, ease.inOut);
    const sp = w2 > 0 ? at(mid, tgt, w2) : at(SHOP0, mid, w1);
    const walking = (w1 > 0 && w1 < 1) || (w2 > 0 && w2 < 1) ? 1 : 0;
    add(sp, mkD, () => personObj(sp[0], sp[1], t, GREEN, walking), 1);
    const MG = [MK[0] + 150, MK[1] + 120], dv = [tgt[0] - MG[0], tgt[1] - MG[1]], dl = Math.hypot(...dv);
    const pointing = ep(t, L6 + 1.4, L6 + 1.7);
    add(MG, mkD, () => personObj(MG[0], MG[1], t, '#fff', 0, pointing > 0 ? [(dv[0] / dl) * pointing, (dv[1] / dl) * pointing] : null), 1);
    var shopperP = sp, managerP = MG;
  }
  if (t >= THOU - 0.2) FIELD.forEach((f) => { const h = 100 * ease.back(prog(t, THOU - 0.1 + f.d * 0.9, THOU + 0.4 + f.d * 0.9)); if (h > 1) add([f.x, f.y], 1, () => fieldRack(f, t, h)); });
  // pile of stuck requests in front of the overloaded server
  if (t > FLOOD && t < L5) {
    const n = Math.floor(ep(t, FLOOD + 0.25, CRASH) * 21), fade = 1 - prog(t, CRASH, CRASH + 0.5);
    for (let k = 0; k < n; k++) {
      const layer = k < 8 ? 0 : k < 14 ? 1 : k < 18 ? 2 : 3, idx = layer === 0 ? k : layer === 1 ? k - 8 : layer === 2 ? k - 14 : k - 18;
      const per = [8, 6, 4, 3][layer], x = (idx - (per - 1) / 2) * 12, y = -150 + (hash(k) - 0.5) * 6, z = 4 + layer * 11;
      add([x, y], 1, () => { const o = Obj(); box(o, x - 5, y - 5, z, 10, 10, 10, { stroke: t > HOT ? RED : '#fff' }); return o; }, worldOp * fade);
    }
  }
  objs.sort((a, b) => depth(...a.c) - depth(...b.c)).forEach((o) => o.f());
  if (worldOp > 0.05) drawPackets(t, worldOp);

  // ---- world-pinned fx + labels ----
  const btnP = P(...BTN), s2 = svTop(2);
  ripple(t, TAP, btnP);
  // hook
  label('?', P(0, 300, 70)[0], P(0, 300, 70)[1], life(t, WHY, S(1, 0) + 0.05, 0.12, 0.2), 'huge', popScale(t, WHY, 0.6, 0.3) + `;font-size:${64 + 4 * Math.sin(t * 9)}px`);
  // the simple way
  const wide = window01(t, L2 + 0.45, REQ + 0.1, 0.3) * worldOp;
  const cl = P(0, 470, 0), sl = P(42, -172, 0);
  label('10,000,000 VIEWERS', cl[0], cl[1] + 16, wide);
  label('ONE SERVER', sl[0] + 16, sl[1] + 16, wide);
  for (const a of ARR[2]) if (a < FLOOD) isoRing(t, a, [0, -210, 4], '#fff', 60, 0.6);
  if (t > REQ && t < L5) loadBar(P(0, -210, 150), naiveLoad(t), life(t, REQ, CRASH + 0.2) * worldOp, naiveLoad(t) > 0.84 ? RED : '#fff');
  // failure
  label('OVERLOAD', s2[0], s2[1] - 44, life(t, FLOOD + 0.5, HOT, 0.15, 0.1), 'tag red', popScale(t, FLOOD + 0.5));
  const temp = Math.round(lerp(48, 97, ep(t, HOT - 0.1, CRASH)));
  label(`${temp}°C`, s2[0], s2[1] - 44, life(t, HOT, CRASH, 0.1, 0.05), 'tag red', popScale(t, HOT));
  heat(t, P(0, -210, 128), life(t, HOT - 0.1, CRASH + 0.1, 0.3, 0.1) * worldOp);
  smoke(t, HOT, P(0, -210, 125), life(t, HOT + 0.2, L5 + 0.25, 0.4, 0.2) * worldOp * (t > CRASH ? 1.6 : 0.7));
  shards(t, CRASH, s2, RED, 18, 1.8);
  shards(t, CRASH + 0.05, s2, '#fff', 12, 1.3);
  isoRing(t, CRASH, [0, -210, 4], RED, 160, 0.9);
  label('✕ DOWN', s2[0], s2[1] - 46, life(t, CRASH + 0.05, L5 + 0.1, 0.1), 'huge red', popScale(t, CRASH + 0.05, 0.5));
  // fix
  label('REBOOT ✓', s2[0], s2[1] - 40, life(t, L5 + 0.35, S(5, 1), 0.12, 0.2), 'tag green', popScale(t, L5 + 0.35));
  for (let i = 0; i < 5; i++) if (i !== 2) { isoRing(t, RISE[i] + 0.4, [...SVP[i], 4], '#fff', 70, 0.7); }
  label('+4 SERVERS', P(0, -210, 190)[0], P(0, -210, 190)[1], life(t, ADD + 0.5, LBT - 0.3, 0.15), 'tag', popScale(t, ADD + 0.5));
  isoRing(t, LAND, [...LB, 4], '#fff', 150, 0.9);
  const lbT = P(LB[0], LB[1], 80);
  label('LOAD BALANCER', lbT[0], lbT[1] - 8, life(t, LAND + 0.1, L6 - 0.1, 0.15), 'tag', popScale(t, LAND + 0.1));
  // supermarket
  if (mkD > 0 && shopperP) {
    const q = P(shopperP[0], shopperP[1], 58);
    label('?', q[0], q[1], life(t, L6 + 0.55, L6 + 1.5, 0.15, 0.2), 'huge green', popScale(t, L6 + 0.55));
    const m = P(managerP[0], managerP[1], 58);
    label('MANAGER', m[0], m[1] - 6, life(t, L6 + 0.3, L7 - 0.1, 0.2) * mkD, 'tag');
    QN.forEach((n, j) => {
      const p = P(LANES[j], MK[1] - 40, 64), best = j === 1 && t >= SHORT;
      const cnt = n + (j === 1 && t >= SHORT + 0.55 ? 1 : 0);
      label(best ? `${cnt} · SHORTEST` : String(cnt), p[0], p[1], mkD * ep(t, L6 + 0.2 + j * 0.08, L6 + 0.5 + j * 0.08), best ? 'tag green' : 'out', best ? popScale(t, SHORT) : '');
    });
    isoRing(t, SHORT + 0.55, [LANES[1], qY(1), 4], GREEN, 50, 0.7);
  }
  // round robin: numbers pop over servers
  for (const d of DISP) {
    if (d.text && /^\d$/.test(d.text) && d.arr < LC - 0.45) { pop(t, d.arr, svTop(d.i, 150), d.text, 'huge', 0.7); isoRing(t, d.arr, [...SVP[d.i], 4], '#fff', 60, 0.6); }
  }
  // load bars / connections / heartbeats above the row
  for (let i = 0; i < 10; i++) {
    const st = ST[i];
    if (st.rise < 0.8 || t < L5 + 0.4 || (i === 2 && t < L5 + 0.4)) continue;
    const top = svTop(i, 150);
    const lc = life(t, LC - 0.1, L8 - 0.05, 0.25, 0.2), hc = life(t, L8 - 0.1, L9, 0.25, 0.2) * (i < 5 ? 1 : 0);
    const barOp = worldOp * (1 - Math.max(lc, hc)) * (t >= L6 - 0.1 && t < L7 - 0.05 ? 0 : 1) * (t >= L10 ? 1 - ep(t, L10, L10 + 0.3) : 1);
    if (!st.dead) loadBar(top, st.load, barOp, st.load > 0.8 ? RED : t > NOB && t < L10 ? GREEN : '#fff');
    if (i < 5 && lc > 0) {
      const best = i === 1 && t >= BUSY, scan = Math.floor(prog(t, S(7, 2) + 0.05, BUSY) * 5);
      const hl = t < BUSY && t > S(7, 2) + 0.05 && scan === i;
      label(`${conn(i, t)}`, top[0], top[1] - 6, lc, best ? 'tag green' : hl ? 'tag' : 'out', best ? popScale(t, BUSY) : '');
    }
    if (hc > 0) ecg(t, [top[0], top[1] + 2], st.dead > 0.5, hc, i * 0.37);
  }
  shards(t, DIES, svTop(3, 120), RED, 14, 1.4);
  isoRing(t, DIES, [...SVP[3], 4], RED, 90, 0.8);
  label('✕', svTop(3, 200)[0], svTop(3, 200)[1], life(t, DIES, L9, 0.1), 'huge red', popScale(t, DIES, 0.6));
  label('SKIPPED', svTop(3, 165)[0], svTop(3, 165)[1] + 6, life(t, SKIP, L9, 0.1), 'tag red', popScale(t, SKIP));
  // more power
  const lbL = P(LB[0], LB[1], 90);
  label('TRAFFIC ×3 ↑', lbL[0], lbL[1], life(t, L9 + 0.15, ADD2 + 0.2, 0.15), 'tag red', popScale(t, L9 + 0.15));
  for (let j = 5; j < 10; j++) isoRing(t, RISE[j] + 0.4, [...SVP[j], 4], GREEN, 70, 0.7);
  label('+5 SERVERS', P(0, -370, 200)[0], P(0, -370, 200)[1], life(t, ADD2 + 0.45, NOB - 0.05, 0.15), 'tag green', popScale(t, ADD2 + 0.45));
  const nb = P(0, 250, 90);
  label('NOBODY NOTICES ✓', nb[0], nb[1] - 10, life(t, NOB + 0.05, L10, 0.15), 'tag green', popScale(t, NOB + 0.05));
  isoRing(t, NOB, [0, 290, 4], GREEN, 380, 1.2);
  // recap
  const lbD = P(LB[0], LB[1] + 35, 60);
  label('ONE FRONT DOOR', lbD[0], lbD[1] - 40, life(t, L10 + 0.2, THOU + 0.2, 0.15), 'tag green', popScale(t, L10 + 0.2));
  isoRing(t, L10 + 0.15, [LB[0], LB[1], 4], GREEN, 110, 0.9);

  // ---- title scene ----
  const tp = fan[2];
  if (tp > 0) {
    const word = 'Load Balancing', k = prog(t, S(1, 1) - 0.05, S(1, 1) + 0.6);
    const shown = word.split('').map((c, i) => `<span style="display:inline-block;white-space:pre;opacity:${ep(k, i / word.length * 0.7, i / word.length * 0.7 + 0.3)};transform:translateY(${(1 - ep(k, i / word.length * 0.7, i / word.length * 0.7 + 0.3, ease.back)) * 24}px);filter:blur(${(1 - ep(k, i / word.length * 0.7, i / word.length * 0.7 + 0.3)) * 8}px)">${c}</span>`).join('');
    const p2 = ep(t, S(1, 1) + 0.5, S(1, 1) + 0.8), p3 = ep(t, S(1, 1) + 0.75, S(1, 1) + 1.05, ease.back);
    const one = life(t, S(1, 0) - 0.05, S(1, 1) - 0.05, 0.2, 0.15);
    $('title').innerHTML = `<div style="position:absolute;left:0;right:0;top:-30px;font-family:Mono;font-size:14px;letter-spacing:6px;color:#a3a3a3;opacity:${one}">ONE WORD</div><div class="t" style="font-size:54px">${shown}</div><div class="ph" style="opacity:${p2}">ONE DOOR · MANY SERVERS</div><div class="chip" style="opacity:${clamp(p3)};transform:scale(${lerp(0.8, 1, p3)})">spread the traffic → nobody crashes</div>`;
    $('title').style.opacity = tp; $('title').style.display = '';
  } else $('title').style.display = 'none';

  // ---- problem: spotlight + magnifier ----
  const pr = window01(t, L3 - 0.05, L4 - 0.1, 0.3);
  if (pr > 0) {
    const k = ease.inOut(prog(t, L3, S(3, 1) + 0.6));
    const A = P(0, 300, 10), B = P(0, -210, 70), C = P(0, -210, 70);
    const m = k < 0.6 ? [lerp(A[0], B[0], k / 0.6), lerp(A[1], B[1], k / 0.6)] : [lerp(B[0], C[0], (k - 0.6) / 0.4), lerp(B[1], C[1], (k - 0.6) / 0.4)];
    $('dim').style.background = `radial-gradient(circle at ${m[0]}px ${m[1]}px, rgba(0,0,0,0) 0 46px, rgba(0,0,0,${0.78 * pr}) 120px)`;
    magnifier(m, pr);
    const q = ep(t, S(3, 1) + 0.6, S(3, 1) + 0.9, ease.back);
    if (q > 0) label('only one?', C[0], C[1] - 66, pr * q, 'tag red');
  } else $('dim').style.background = 'none';

  // ---- HTML cards ----
  $('ui').innerHTML = counterCard(t) + gaugeCard(t) + clockCard(t) + mapCard(t) + rrCard(t) + lcCard(t) + hcCard(t) + scaleCard(t) + recapCard(t) + ctaSheet(t);

  // ---- flashes, shake, roll, letterbox ----
  const red = Math.max(window01(t, CRASH, CRASH + 0.6, 0.05), window01(t, DIES, DIES + 0.4, 0.05) * 0.7);
  const green = Math.max(window01(t, OK, OK + 0.45, 0.05), window01(t, L5 + 0.35, L5 + 0.75, 0.05) * 0.6, window01(t, NOB, NOB + 0.5, 0.06), window01(t, BUSY, BUSY + 0.35, 0.05) * 0.5);
  const white = Math.max(window01(t, CRASH - 0.02, CRASH + 0.12, 0.03) * 0.6, window01(t, LAND, LAND + 0.18, 0.03) * 0.35, ...CH.map((c) => window01(t, c[0] - 0.04, c[0] + 0.14, 0.04) * 0.22));
  const fl = $('flash');
  if (white > Math.max(red, green)) { fl.style.background = 'radial-gradient(circle at 50% 40%, rgba(255,255,255,0.55), rgba(255,255,255,0.08) 70%)'; fl.style.opacity = white; }
  else { fl.style.background = red > green ? `radial-gradient(circle at 50% 55%, rgba(255,69,58,0.32), rgba(255,69,58,0.06) 70%)` : `radial-gradient(circle at 50% 55%, rgba(50,215,75,0.25), rgba(50,215,75,0.04) 70%)`; fl.style.opacity = Math.max(red, green); }
  const shk = (t0, a, d) => (t >= t0 ? a * (1 - prog(t, t0, t0 + d)) : 0);
  const sh = Math.max(shk(CRASH, 1.2, 0.6), shk(LAND, 0.6, 0.35), shk(DIES, 0.5, 0.3), t > FLOOD && t < CRASH ? 0.18 + 0.25 * prog(t, FLOOD, CRASH) : 0);
  const whip = Math.max(window01(t, L5 - 0.02, L5 + 0.32, 0.12), window01(t, L7 - 0.05, L7 + 0.28, 0.12));
  $('world').style.transform = `translate(${Math.sin(t * 63) * 7 * sh}px, ${Math.cos(t * 51) * 5 * sh}px) rotate(${Math.sin(t * 47) * 0.6 * sh + roll}deg) scale(${1 + Math.abs(roll) * 0.012})`;
  $('world').style.filter = whip > 0.01 ? `blur(${whip * 7}px)` : 'none';
  const lbh = 46 * window01(t, HOT - 0.05, L5, 0.15);
  document.querySelectorAll('#lb i').forEach((n) => (n.style.height = lbh + 'px'));

  // ---- chrome ----
  const ch = CH.find((c) => t >= c[0] && t < c[1]);
  $('chapter').style.opacity = ch ? life(t, ch[0], ch[1], 0.3, 0.2) * (Math.floor(t * 3) % 6 === 0 && t - ch[0] < 1 ? 0.4 : 1) : 0;
  if (ch) $('chapter').querySelector('span').textContent = ch[2];
  $('handle').style.opacity = ep(t, 0.4, 1.0) * (1 - ep(t, L11, L11 + 0.3));
  document.querySelectorAll('#bar i').forEach((n, i) => { n.style.width = prog(t, BK[i], BK[i + 1]) * 100 + '%'; });
  $('grain').style.transform = `translate(${Math.floor(hash(Math.floor(t * 24)) * 40) - 20}px, ${Math.floor(hash(Math.floor(t * 24) + 5) * 40) - 20}px)`;

  const cur = $('cursor');
  if (cp) {
    const pr2 = Math.max(pressAmt(t, [TAP]), pressAmt(t, tapsCTA));
    cur.style.display = ''; cur.style.transform = `translate(${cp[0] - 2}px, ${cp[1] - 2}px) scale(${1 - 0.2 * pr2})`;
  } else cur.style.display = 'none';
  tapsCTA.forEach((x, i) => ripple(t, x, i === 0 ? COMMENT_POS : FOLLOW_POS));

  caps.render(t);
  $('stage').style.opacity = 1 - ep(t, END - 0.35, END);
};
// world point on the ground (z=0) under a screen point
function groundAt(sx, sy) {
  const a = raw(1, 0, 0), b = raw(0, 1, 0), dx = (sx - CAM.ox) / CAM.scale, dy = (sy - CAM.oy) / CAM.scale;
  const det = a[0] * b[1] - a[1] * b[0];
  return [(dx * b[1] - dy * b[0]) / det, (a[0] * dy - a[1] * dx) / det];
}
window.render(0);
</script>
