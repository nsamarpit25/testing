<meta charset="utf-8">
<!-- 31 Tap to pay, solid low-poly dioramas (kit.js + scenes.js + tappay.js). Story: your card has no battery; the
     machine makes a changing magnetic field; a coil round the card's edge turns it into electricity and wakes the chip;
     the chip answers through the same field with your number and a one-time code; normally the machine asks your bank;
     London's Tube gates (2014) check the card is genuine on the spot and let the bank check later; the twist: before
     the machine takes your money, it gives your card electricity. Beats come from voice/words.js. -->
<link rel="stylesheet" href="../_ember/fonts.css">
<link rel="stylesheet" href="lib/reel.css">
<style>
#stage { background: #0b0a09; }
#vig { background: radial-gradient(120% 82% at 50% 44%, rgba(8,6,4,0) 52%, rgba(8,6,4,0.72) 100%); }
#hud { pointer-events: none; }
/* HUD: dark glass cards with a short accent bar; the label carries the beat's colour, the value stays white */
.hc { position: absolute; left: 0; top: 0; display: none; padding: 9px 15px 10px 17px; border-radius: 10px; background: linear-gradient(180deg, rgba(36,33,31,0.93), rgba(19,17,16,0.93)); border: 1px solid rgba(255,255,255,0.075); box-shadow: 0 12px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06); white-space: nowrap; transform-origin: 0 0; }
.hc::before { content: ''; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--c); box-shadow: 0 0 8px var(--cg); }
.hc .k { font: 650 9.5px/1 Inter; letter-spacing: 1.5px; color: var(--c); text-transform: uppercase; }
.hc .v { font: 750 19px/1.05 Inter; letter-spacing: -0.3px; margin-top: 6px; color: #f5f4f3; }
.hc.big .v { font-size: 24px; }
.hc .v.mono { font-family: Mono; letter-spacing: 1px; }
.hp { position: absolute; left: 0; top: 0; display: none; font: 600 11px/1 Inter; padding: 6px 10px 6px 9px; border-radius: 20px; background: rgba(24,22,20,0.9); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 6px 16px rgba(0,0,0,0.4); color: #e6e3e0; white-space: nowrap; transform-origin: 0 0; }
.hp::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
.hp.hot { border-color: var(--cg); }
#cap .box { left: 50%; right: auto; transform: translateX(-50%); padding: 0 10px; background: none; }
#cap .box::before, #cap .box::after { content: ''; position: absolute; width: 8px; height: 8px; border: 1.6px solid #ff6a1f; }
#cap .box::before { left: -2px; top: -4px; border-width: 1.6px 0 0 1.6px; }
#cap .box::after { right: -2px; bottom: -4px; border-width: 0 1.6px 1.6px 0; }

<script>
for (let i = 0; i < 18; i++) { const m = new TH.Mesh(new TH.RingGeometry(0.9, 1, 96), new TH.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: TH.AdditiveBlending, depthWrite: false, toneMapped: false, side: TH.DoubleSide })); m.visible = false; scene.add(m); RINGS.push(m); }
// Signals: crisp thin rings that open out from a device, and thin lines that draw themselves from one device to the
// next with a bright head on the tip. No wide halos, no light beams.
const RING_TX = ctex(512, 512, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.8, 'rgba(255,255,255,0.025)'); gr.addColorStop(0.985, 'rgba(255,255,255,0.06)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#ffffff'; g.lineWidth = 3.2; g.beginPath(); g.arc(w / 2, h / 2, w / 2 - 6, 0, 7); g.stroke();
});
const RING_G = new TH.PlaneGeometry(2, 2);
for (const m of RINGS) { m.geometry = RING_G; m.material.map = RING_TX; m.material.needsUpdate = true; }
function ripple(t, t0, x, y, z, col, maxR, dur = 0.9) {
  const p = prog(t, t0, t0 + dur); if (p <= 0 || p >= 1 || ringI >= RINGS.length) return;
  const m = RINGS[ringI++], r = maxR * (0.1 + 0.9 * ease.out(p));
  m.visible = true; m.position.set(x, y, z); m.scale.set(r, r, 1); m.material.color.set(col); m.material.opacity = 0.85 * Math.pow(1 - p, 1.3) * Math.min(1, p * 12);
}
// a ring placed directly (the field's rising rings)
function ringAt(x, y, z, r, col, a) {
  if (a <= 0.01 || ringI >= RINGS.length) return;
  const m = RINGS[ringI++]; m.visible = true; m.position.set(x, y, z); m.scale.set(r, r, 1); m.material.color.set(col); m.material.opacity = a;
}
// signal lines: a pool of pixel-width lines (core + faint halo) whose segments are rewritten in place each frame
const LMAX = 8, LINKS = [];
const dotSprite = () => { const sp = new TH.Sprite(new TH.SpriteMaterial({ map: TX_ORB, transparent: true, blending: TH.AdditiveBlending, depthWrite: false, depthTest: false, toneMapped: false })); sp.visible = false; sp.renderOrder = 6; scene.add(sp); return sp; };
for (let i = 0; i < 8; i++) {
  const geo = new TH.LineGeometry(); geo.setPositions(new Array(LMAX * 3).fill(0).map((_, k) => k));
  const core = new TH.Line2(geo, lineMat(O, 3.4)), halo = new TH.Line2(geo, lineMat(O, 11, { add: true, op: 0.16 }));
  core.renderOrder = 5; halo.renderOrder = 4;
  for (const l of [core, halo]) { l.frustumCulled = false; l.visible = false; scene.add(l); }
  LINKS.push({ geo, core, halo, head: dotSprite(), end: dotSprite() });
}
let linkI = 0;
function linksReset() { linkI = 0; for (const L of LINKS) L.core.visible = L.halo.visible = L.head.visible = L.end.visible = false; }
function subLine(pts, q0, q1) {
  const d = [0]; for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(...[0, 1, 2].map((j) => pts[i][j] - pts[i - 1][j])));
  const L = d[d.length - 1], at_ = (u) => { let i = 1; while (i < pts.length - 1 && d[i] < u) i++; const k = (u - d[i - 1]) / Math.max(1e-6, d[i] - d[i - 1]); return [0, 1, 2].map((j) => lerp(pts[i - 1][j], pts[i][j], clamp(k))); };
  const u0 = q0 * L, u1 = q1 * L, out = [at_(u0)];
  for (let i = 1; i < pts.length - 1; i++) if (d[i] > u0 && d[i] < u1) out.push(pts[i]);
  out.push(at_(u1)); return out;
}
// link(t, pts, t0, dur, t1, col): draws on along pts over [t0, t0+dur] (eased), holds, fades out at t1. o.travel: the
// tail follows the head, so it reads as one message moving; o.a: opacity
function link(t, pts, t0, dur, t1, col, o = {}) {
  if (t < t0 || t > t1 || linkI >= LINKS.length) return null;
  const L = LINKS[linkI++], q = ease.inOut(prog(t, t0, t0 + dur)), q0 = o.travel ? ease.inOut(prog(t, t0 + dur * 0.35, t0 + dur * 1.25)) : 0;
  const a = (o.a ?? 1) * (1 - ep(t, t1 - 0.25, t1)) * (o.travel ? 1 - ep(t, t0 + dur * 1.05, t0 + dur * 1.25) : 1);
  if (q <= 0.001 || a <= 0.01) return null;
  const part = subLine(pts, q0, q).slice(0, LMAX), arr = L.geo.attributes.instanceStart.data.array;
  for (let i = 0; i < part.length - 1; i++) arr.set([...part[i], ...part[i + 1]], i * 6);
  L.geo.attributes.instanceStart.data.needsUpdate = true; L.geo.instanceCount = part.length - 1;
  for (const [l, k] of [[L.core, 1], [L.halo, 0.16]]) { l.visible = true; l.material.color.set(col); l.material.opacity = a * k; }
  const tip = part[part.length - 1], px = 1 / cam.s;
  if (q < 0.999 || o.travel) { L.head.visible = true; L.head.position.set(...tip); L.head.material.color.set(mixHex(col, '#ffffff', 0.5)); L.head.material.opacity = a; L.head.scale.set(16 * px, 16 * px, 1); }
  if (q >= 0.999 && !o.travel) { const k = ease.out(prog(t, t0 + dur, t0 + dur + 0.25)); L.end.visible = true; L.end.position.set(...tip); L.end.material.color.set(col); L.end.material.opacity = a * (0.6 + 0.4 * (1 - k)); L.end.scale.set((10 + 14 * (1 - k)) * px, (10 + 14 * (1 - k)) * px, 1); }
  return tip;
}

/* ---------------- beats */
const T = {
  hTake: at('take'), hGive: at('give'), hPower: at('power'),
  no: at('no'), battery: at('battery'), so1: at('so'), talk: at('talk'), machine1: at('machine', 2), tap1: at('tap'),
  the2: at('the', 3), powers: at('makes'), invisible: at('invisible'), magnetic: at('magnetic'), keeps: at('keeps'), changing: at('changing'),
  hidden: at('hides'), edge: at('edge'), coil: at('coil'), wire: at('wire'),
  bring: at('bring'), close: at('close'), creates: at('creates'), elec1: at('electricity'), wake: at('wake'), chip2: at('chip', 2),
  answers: at('answers'), field3: at('field', 3), doesnt: at("doesn't"), number: at('number'), adds: at('adds'), one: at('one'), only: at('only'), payment: at('payment'),
  usually: at('usually'), sends: at('sends'), bank2: at('bank', 2), checks1: at('checks'), approves: at('approves'), declines: at('declines'), within: at('within'), seconds: at('seconds'),
  in2: at('in', 2), y2014: at('2014'), london: at('london'), tap2: at('tap', 2), bank3: at('bank', 3), tube: at('tube'),
  but: at('but'), gate: at('gate'), cant: at("can't"), wait: at('wait'), so2: at('so', 2), checks2: at('checks', 2), genuine: at('genuine'), fast: at('fast'), keep2: at('keep'), walking: at('walking'),
  bank5: at('bank', 5), later: at('later'),
  so3: at('so', 3), plastic: at('plastic'), until: at('until'), wakes: at('wakes'), elec2: at('electricity', 2),
};
T.last = WORDS[WORDS.length - 1][2];
const CUT = { CAFE: T.so1 - 0.05, FIELD: T.the2 - 0.06, COIL: T.hidden - 0.1, CLOSE: T.bring - 0.08, ANS: T.answers - 0.3, SEND: T.usually - 0.08,
  BANK: T.bank2 - 0.26, APPR: T.within - 0.36, TUBE: T.in2 - 0.14, GATE: T.but - 0.12, WALK: T.fast - 0.12, LATER: T.bank5 - 0.12, TWIST: T.so3 - 0.1, END: T.last + 0.35 };

/* ---------------- build */
const ST = buildTapStudio(), DC = buildDC(), CF = buildCafe(), TB = buildTube();
const SC = ST.scrW, CARD = ST.card;
// set the café machine right under your outstretched hand
reach(CF.you, 1); CF.you.root.updateMatrixWorld(true);
{ const cp = wpos(CF.card); CF.term.g.position.set(cp[0] - 1, cp[1] - 2, 105); CF.term.g.updateMatrixWorld(true); const v = new TH.Vector3(...CF.term.scr); CF.term.g.localToWorld(v); CF.scrW = [v.x, v.y, v.z]; }
const HOLO = { lock: holo(ICO.lock, 34, O), bolt: holo((g, S, col) => { g.fillStyle = col; g.shadowColor = col; g.shadowBlur = 10; g.beginPath(); g.moveTo(S * 0.56, S * 0.1); g.lineTo(S * 0.28, S * 0.56); g.lineTo(S * 0.48, S * 0.56); g.lineTo(S * 0.42, S * 0.9); g.lineTo(S * 0.72, S * 0.42); g.lineTo(S * 0.52, S * 0.42); g.closePath(); g.fill(); }, 44, O), bank: holo((g, S, col) => { g.strokeStyle = col; g.fillStyle = col; g.lineWidth = S * 0.05; g.shadowColor = col; g.shadowBlur = 8; g.beginPath(); g.moveTo(S * 0.18, S * 0.36); g.lineTo(S * 0.5, S * 0.16); g.lineTo(S * 0.82, S * 0.36); g.closePath(); g.fill(); for (let i = 0; i < 4; i++) g.fillRect(S * (0.24 + i * 0.15), S * 0.42, S * 0.06, S * 0.3); g.fillRect(S * 0.18, S * 0.76, S * 0.64, S * 0.06); }, 120, RED) };

/* ---------------- screens */
const S6 = (g, S, x, y, fn, col) => { g.save(); g.translate(x - S / 2, y - S / 2); fn(g, S, col); g.restore(); };
const UI = { tx: '#f5f4f3', tx2: '#a39e99', tx3: '#6f6a66' };
function rr(g, x, y, w, h, r, fill, stroke, lw = 2) { g.beginPath(); g.roundRect(x, y, w, h, r); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function dot(g, x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = fill; g.fill(); }
function tx(g, s, x, y, font, col, al = 'left', bl = 'alphabetic') { g.font = font; g.fillStyle = col; g.textAlign = al; g.textBaseline = bl; g.fillText(s, x, y); }
function check(g, x, y, s, col) { g.strokeStyle = col; g.lineWidth = s * 0.14; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(x - s * 0.3, y); g.lineTo(x - s * 0.08, y + s * 0.22); g.lineTo(x + s * 0.32, y - s * 0.24); g.stroke(); }
function waves(g, x, y, s, col) { g.strokeStyle = col; g.lineWidth = s * 0.09; g.lineCap = 'round'; for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(x - s * 0.3 + i * s * 0.16, y, s * (0.12 + i * 0.16), -0.75, 0.75); g.stroke(); } }
// the machine's screen in a 600-wide design space: the four contactless lights along the top, then the step it is on
// mode 'pay' | 'read' | 'send' | 'ok'; lights = how many of the four are lit
function termScreen(g, W0, H0, mode, lights, t) {
  const k = W0 / 600; g.scale(k, k); const W = 600, H = H0 / k;
  g.fillStyle = '#0d0c0b'; g.fillRect(0, 0, W, H);
  const gr = g.createRadialGradient(W / 2, H * 0.55, 10, W / 2, H * 0.55, 420); gr.addColorStop(0, 'rgba(255,106,31,0.12)'); gr.addColorStop(1, 'rgba(255,106,31,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 4; i++) { const x = 168 + i * 88, on = i < lights; if (on) { g.save(); g.shadowColor = O; g.shadowBlur = 24; dot(g, x, 56, 17, O); g.restore(); } else dot(g, x, 56, 17, '#2a2725'); }
  if (mode === 'pay') {
    tx(g, '£4.20', W / 2, 220, '800 128px Inter', UI.tx, 'center');
    waves(g, W / 2 - 10, 360, 150, O);
    tx(g, 'Hold card here', W / 2, 500, '650 44px Inter', UI.tx2, 'center');
  }
  if (mode === 'read') {
    tx(g, '£4.20', W / 2, 200, '800 104px Inter', UI.tx, 'center');
    const p = (t * 1.6) % 1; g.strokeStyle = '#2a2725'; g.lineWidth = 16; g.beginPath(); g.arc(W / 2, 340, 66, 0, 7); g.stroke();
    g.strokeStyle = O; g.lineCap = 'round'; g.beginPath(); g.arc(W / 2, 340, 66, p * 6.28, p * 6.28 + 1.9); g.stroke();
    tx(g, 'Reading card', W / 2, 500, '650 44px Inter', UI.tx2, 'center');
  }
  if (mode === 'send') {
    tx(g, '£4.20', W / 2, 200, '800 104px Inter', UI.tx, 'center');
    for (let i = 0; i < 3; i++) dot(g, W / 2 - 60 + i * 60, 340, 16, (Math.floor(t * 5) % 3) === i ? O : '#3a3633');
    tx(g, 'Asking your bank', W / 2, 500, '650 44px Inter', UI.tx2, 'center');
  }
  if (mode === 'ok') {
    g.save(); g.shadowColor = O; g.shadowBlur = 30; dot(g, W / 2, 250, 112, O); g.restore();
    check(g, W / 2, 250, 160, '#fff');
    tx(g, 'Approved', W / 2, 450, '800 72px Inter', UI.tx, 'center');
    tx(g, '£4.20', W / 2, 520, '650 44px Inter', UI.tx2, 'center');
  }

function paintTerm(TM, t, mode, lights) { const key = mode + lights + (mode === 'read' || mode === 'send' ? Math.floor(t * 20) : ''); TM.s.draw(key, (g, W, H) => termScreen(g, W, H, mode, lights, t)); }

/* ---------------- camera */
const CUTS = [];
const cut = (t, f, s, o = {}) => CUTS.push({ t, f, s, ...o });
const SCz = (dz, dx = 0, dy = 0) => [SC[0] + dx, SC[1] + dy, SC[2] + dz];
// the hero commuter at the gate: walks in slowly, taps, is checked, the paddles open, walks on at full pace
const HX0 = -190, HV0 = 45, HT1 = T.genuine + 0.35;
function heroX(t) {
  if (t < CUT.GATE - 0.3) return -9000;
  const t0 = CUT.GATE, xr = -98, tr = t0 + (xr - HX0) / HV0;   // walks up to the reader, holds the card there until it's checked
  if (t < tr) return HX0 + HV0 * (t - t0);
  if (t < HT1) return xr + 8 * ep(t, tr, HT1);
  const d = t - HT1, ramp = 0.5; // then off at full pace, 0 → 140 cm/s
  return xr + 8 + 140 * (d < ramp ? d * d / (2 * ramp) : ramp / 2 + (d - ramp));

cut(0, SCz(42, 0, -4), 2.15, { push: 1.1, a: -0.34, e: 0.52, sy: 430 });
cut(CUT.CAFE, [CF.scrW[0] - 30, CF.scrW[1] + 10, 95], 1.55, { push: 1.1, a: -0.34, e: 0.5, sy: 440 });
cut(CUT.FIELD, SCz(46), 1.55, { a: -0.34, e: 0.36, push: 1.08, sy: 470 });
cut(CUT.COIL, SCz(72, 0, 0), 4.0, { a: -0.22, e: 0.5, push: 1.06, sy: 440 });
cut(CUT.CLOSE, SCz(40), 2.3, { a: -0.34, e: 0.42, push: 1.06, sy: 450 });
cut(CUT.ANS, SCz(22, -12, 0), 3.0, { a: -0.27, e: 0.5, sy: 450, keys: [{ t: T.adds - 0.25, d: 0.7, f: SCz(24, -16, 4), s: 3.7 }] });
cut(CUT.SEND, SCz(150), 1.05, { a: -0.34, e: 0.42, push: 1.05, sy: 520 });
cut(CUT.BANK, [DC.hotTop[0], DC.hotTop[1], 120], 0.95, { push: 1.06, sy: 440 });
cut(CUT.APPR, SCz(0, 0, 0), 4.6, { a: -0.22, e: 1.0, push: 1.04, sy: 420 });
cut(CUT.TUBE, wz('TUBE', 20, 0, 70), 0.95, { a: -0.82, e: 0.5, push: 1.06, sy: 520 });
cut(CUT.GATE, wz('TUBE', -90, -30, 95), 2.1, { a: -0.75, e: 0.44, push: 1.05, sy: 450 });
cut(CUT.WALK, wz('TUBE', heroX(CUT.WALK) + 30, 0, 95), 1.6, { a: -0.8, e: 0.42, pan: [heroX(CUT.LATER) - heroX(CUT.WALK) - 20, 0, 0], sy: 450 });
cut(CUT.LATER, wz('TUBE', 40, 0, 230), 0.72, { a: -0.82, e: 0.42, push: 1.05, sy: 520 });
cut(CUT.TWIST, SCz(34), 1.9, { a: -0.34, e: 0.46, push: 1.22, sy: 440 });
const SHOTS = [];
CUTS.forEach((c, i) => {
  const nx = CUTS[i + 1] ? CUTS[i + 1].t : DURATION + 1, k = { t: c.t, d: 0, f: c.f, s: c.s, a: c.a ?? -0.7, e: c.e ?? 0.6, sy: c.sy ?? 450 };
  const pv = CUTS[i - 1], near = pv && Math.hypot(c.f[0] - pv.f[0], c.f[1] - pv.f[1]) < 1500 && !c.cut;
  if (near) { k.d = Math.min(0.55, (nx - c.t) * 0.4); k.ez = ease.inOut; k.g = true; }
  SHOTS.push(k);
  if (c.keys) c.keys.forEach((q) => SHOTS.push(q));
  else if (c.to) SHOTS.push({ t: c.t + 0.001, d: c.dur, ez: c.ez, ...c.to });
  else SHOTS.push({ t: c.t + 0.001, d: nx - c.t, ez: (x) => x, f: c.pan ? c.f.map((v, j) => v + c.pan[j]) : c.f, s: c.s * (c.push || 1), a: k.a + (c.da || 0), e: k.e, sy: k.sy });
});
const inShot = (t, a, b) => t >= a && t < b;

/* ---------------- the world, frame by frame */
const PING_P = 1.5;
const glowAt = (t, s) => Math.exp(-Math.pow((t - s - 0.1) / 0.2, 2));
function pings(t, t0, t1, p, col, R, dur = 1.8, period = PING_P) {
  if (t < t0 || t > t1 + dur) return 0;
  let hit = 0;
  for (let s = t0 + Math.floor((t - t0) / period) * period; s >= t0 && s > t - dur; s -= period) { if (s <= t1) { ripple(t, s, p[0], p[1], p[2], col, R, dur); hit = Math.max(hit, glowAt(t, s)); } }
  return hit;
}
// the card's state through the studio shots: height over the screen, tilt, explode, see-through, coil power, chip
function cardState(t) {
  const s = { h: 70, tilt: 0.32, rz: 0.06 * Math.sin(t * 0.9), e: 0, see: 0, p: 0, awake: 0, on: false };
  if (t < CUT.CAFE) { s.on = true; s.h = 64 - 6 * ep(t, 0, CUT.CAFE); s.tilt = 0.34; }
  else if (inShot(t, CUT.COIL, CUT.CLOSE)) { s.on = true; s.h = 72; s.tilt = 0.24; s.e = ep(t, T.edge - 0.35, T.edge + 0.35, ease.inOut); s.p = 0.45 * pulse(t, T.coil, 1.6) + 0.12 * ep(t, T.coil - 0.2, T.coil + 0.3); }
