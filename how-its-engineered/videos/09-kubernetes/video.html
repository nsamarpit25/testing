<script>
const DURATION = 53.6;
window.DURATION = DURATION;
const $ = (id) => document.getElementById(id);
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, k = 1, a = 1) => `rgba(${Math.min(255, c[0] * k) | 0},${Math.min(255, c[1] * k) | 0},${Math.min(255, c[2] * k) | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const HX = { cy: '#22D3EE', vi: '#A78BFA', or: '#FF8A3D', gr: '#4ADE80', rd: '#FF3B5C', ye: '#FACC15', pk: '#F472B6', bl: '#4F8CFF', sl: '#8A9BC4' };
const K = {}; for (const k in HX) K[k] = hex(HX[k]);
const SLATE = hex('#252D4F'), DARK = hex('#161C36'), STEEL = hex('#39446E'), ICE = [196, 236, 255];
// deterministic random
const rnd = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };

const T = { crashed: 0.74, am: 1.92, woke: 2.90, already: 3.70, back: 4.00, nobody: 4.68,
  L2: 6.06, crashed2: 7.28, stays: 7.96, dead: 8.36, restart: 9.26, hand: 9.92, traffic: 10.74, doubles: 10.94, more: 11.78, copies: 11.96, hand2: 12.78,
  fix: 13.90, tell: 14.64, robot: 15.08, want: 15.74, k8s: 16.46,
  L4: 17.84, set: 19.18, n21: 19.42, keeps: 20.64,
  J1: 22.24, heal: 22.96, keep: 23.52, three: 23.70, running: 24.36, crashes: 25.04, newone: 25.88, seconds: 26.66,
  J2: 27.60, scale: 28.32, spikes: 29.24, adds: 30.02, drops: 31.20, removes: 31.90,
  J3: 32.94, update: 33.76, newv: 34.52, swaps: 35.32, onet: 36.02, time: 36.64, nodown: 37.24,
  L8: 38.50, crash3: 39.28, fixed: 40.02, woke2: 40.76,
  L9: 41.94, box: 42.64, k8s2: 43.28, fleet: 44.24, google: 45.06, every: 45.88, offers: 46.64,
  L10: 47.66, docker3: 48.78, profile: 49.80, follow: 50.52, series: 51.34 };
/* ------------------------------------------------------------------ camera */
const cv = $('cv'), g = cv.getContext('2d');
const cam = { f: [0, 0, 0], s: 1, a: 0.9, e: 0.62, sx: 270, sy: 500 };
let ca, sa, ce, se, toCam;
function camApply() { ca = Math.cos(cam.a); sa = Math.sin(cam.a); ce = Math.cos(cam.e); se = Math.sin(cam.e); toCam = [-sa * ce, -ca * ce, se]; }
function P(x, y, z) {
  const dx = x - cam.f[0], dy = y - cam.f[1], dz = z - cam.f[2];
  const r = dx * ca - dy * sa, f = dx * sa + dy * ca;
  return [cam.sx + r * cam.s, cam.sy - (dz * ce + f * se) * cam.s];
}
const D = (x, y, z) => (x * sa + y * ca) * ce - z * se;


// world layout: the control box (Kubernetes) at the front, three nodes (servers) at the back, two container slots per node
const NX = [-50, 70, 190], NY = 200, NW = 100, NDp = 64, NH = 24;
const CP = [10, -30];
const SLOT = [0, 1, 2, 3, 4, 5].map((k) => [NX[k % 3] + (k < 3 ? -24 : 24), NY, NH]);
const SRC = [340, 40, 40];
// pod lives per slot. a: lands, crash: goes red then dead, revive: restarted by hand, end: leaves (lift = lifted out, else removed dead)
const LIVES = [
  [{ a: 12.0, ver: 1, end: 35.32, lift: 1, hand: 1 }, { a: 35.6, ver: 2 }],
  [{ a: -1, ver: 1, crash: 0.95, end: 2.45 }, { a: 2.55, ver: 1, crash: 7.4, revive: 9.86, end: 36.02, lift: 1 }, { a: 36.3, ver: 2, crash: 39.3, end: 39.55 }, { a: 39.6, ver: 2 }],
  [{ a: 12.45, ver: 1, crash: 25.1, end: 25.82, hand: 1 }, { a: 25.9, ver: 1, end: 36.64, lift: 1 }, { a: 36.92, ver: 2 }],
  [{ a: 30.02, ver: 1, end: 31.9, lift: 1 }],
  [{ a: 30.2, ver: 1, end: 32.05, lift: 1 }],
  [{ a: 30.38, ver: 1, end: 32.2, lift: 1 }],
];

const SHOTS = [
  { t: 0, d: 0, f: [70, 200, 30], s: 2.6, a: 0.4, e: 0.56, sy: 500 },
  { t: 0.2, d: 2.2, f: [70, 200, 30], s: 2.4, a: 0.36 },
  { t: 2.4, d: 1.2, s: 2.05 },
  { t: 5.7, d: 0.9, f: [70, 190, 30], s: 1.75, a: 0.35, e: 0.6, sy: 470 },
  { t: 7.2, d: 0.4, f: [70, 200, 30], s: 2.1 },
  { t: 10.6, d: 0.7, f: [70, 195, 30], s: 1.45 },
  { t: 13.8, d: 0.9, f: [60, 100, 40], s: 1.12, sy: 450 },
  { t: 16.4, d: 1.0, s: 1.02, a: 0.4 },
  { t: 17.8, d: 0.8, f: [60, 110, 40], s: 0.95, sy: 680 },
  { t: 22.1, d: 0.8, f: [70, 110, 40], s: 1.25, a: 0.35, sy: 450 },
  { t: 25.0, d: 0.35, f: [170, 185, 30], s: 1.7, sy: 420 },
  { t: 26.4, d: 0.7, f: [90, 140, 35], s: 1.3, sy: 440 },
  { t: 27.5, d: 0.8, f: [120, 150, 35], s: 1.3, a: 0.4, sy: 440 },
  { t: 29.2, d: 0.25, s: 1.45 },
  { t: 30.0, d: 0.5, s: 1.3 },
  { t: 32.85, d: 0.9, f: [70, 160, 35], s: 1.45, a: 0.45, sy: 430 },
  { t: 37.1, d: 0.8, f: [70, 150, 35], s: 1.3, sy: 440 },
  { t: 38.4, d: 0.6, f: [70, 170, 30], s: 1.8, a: 0.38, sy: 420 },
  { t: 40.6, d: 0.8, f: [70, 150, 35], s: 1.45, sy: 440 },
  { t: 41.8, d: 1.0, f: [60, 120, 40], s: 0.95, a: 0.36, sy: 545 },
  { t: 47.5, d: 0.8, s: 0.82, sy: 600 },
];
const KICKS = [[0.95, 0.07], [T.already, 0.04], [7.4, 0.05], [T.hand, 0.03], [T.doubles, 0.03], [14.7, 0.04], [T.k8s, 0.05], [25.1, 0.05], [26.2, 0.03],
  [T.spikes, 0.04], [T.adds, 0.03], [35.6, 0.02], [36.3, 0.02], [36.92, 0.02], [39.3, 0.05], [T.fixed, 0.03], [T.k8s2, 0.03], [50.7, 0.02]];
const SHAKES = [[0.95, 7, 0.5], [7.4, 4, 0.4], [25.1, 4, 0.35], [T.spikes, 3, 0.3], [39.3, 5, 0.4]];
function camAt(t) {
  let cur = { ...SHOTS[0] };
  for (let i = 1; i < SHOTS.length; i++) {
    const k = SHOTS[i];
    if (t < k.t) break;
    const p = k.d ? ease.inOut(prog(t, k.t, k.t + k.d)) : 1;
    const tg = { ...cur, ...k };
    cur = { f: [0, 1, 2].map((j) => lerp(cur.f[j], tg.f[j], p)), s: lerp(cur.s, tg.s, p), a: lerp(cur.a, tg.a, p), e: lerp(cur.e, tg.e, p), sy: lerp(cur.sy, tg.sy, p) };
  }
  let kick = 0;
  for (const [t0, amp] of KICKS) { const dt = t - t0; if (dt > 0 && dt < 1.2) kick += amp * (dt < 0.05 ? dt / 0.05 : Math.exp(-(dt - 0.05) * 6)); }
  let shx = 0, shy = 0;
  for (const [t0, amp, dur] of SHAKES) { const dt = t - t0; if (dt > 0 && dt < dur) { const k = amp * (1 - dt / dur); shx += k * Math.sin(t * 91); shy += k * Math.cos(t * 67); } }
  cam.f = cur.f; cam.s = cur.s * (1 + kick); cam.a = cur.a + 0.035 * Math.sin(t * 0.21); cam.e = cur.e; cam.sx = 270 + shx; cam.sy = cur.sy + shy;
  camApply();
}

/* ------------------------------------------------------------------ draw list */
let DL = [];
const add = (layer, depth, fn) => DL.push({ layer, depth, fn });
function flush() { DL.sort((a, b) => a.layer - b.layer || b.depth - a.depth); for (const d of DL) d.fn(); DL = []; }
const LIGHT = (() => { const l = [-0.35, -0.6, 1]; const n = Math.hypot(...l); return l.map((v) => v / n); })();
function poly(pts, fill, stroke, lw = 1) {
  g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function glow(col, blur) { g.shadowColor = col; g.shadowBlur = blur * 2; }
function noGlow() { g.shadowBlur = 0; g.shadowColor = 'transparent'; }

// face frame helpers (u right, v up, units = world)
const fpt = (F, u, v) => P(F.o[0] + F.u[0] * u + F.v[0] * v, F.o[1] + F.u[1] * u + F.v[1] * v, F.o[2] + F.u[2] * u + F.v[2] * v);
function fquad(F, u0, v0, u1, v1, fill, gl) {
  if (gl) glow(gl[0], gl[1]);
  poly([fpt(F, u0, v0), fpt(F, u1, v0), fpt(F, u1, v1), fpt(F, u0, v1)], fill);
  if (gl) noGlow();
}
function ftext(F, u, v, str, size, fill, font = 'Mono', weight = 700, align = 'center', gl) {
  const p0 = fpt(F, u, v), pu = fpt(F, u + 1, v), pv = fpt(F, u, v + 1);
  g.save();
  g.setTransform(2 * (pu[0] - p0[0]), 2 * (pu[1] - p0[1]), -2 * (pv[0] - p0[0]), -2 * (pv[1] - p0[1]), 2 * p0[0], 2 * p0[1]);
  g.font = `${weight} ${size}px ${font}`; g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = fill;
  if (gl) { g.shadowColor = gl; g.shadowBlur = 14; }
  g.fillText(str, 0, 0);
  g.restore();
}
function fpath(F, pts, col, lw, gl) {
  g.save(); if (gl) glow(gl, 8);
  g.strokeStyle = col; g.lineWidth = lw * cam.s; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); pts.forEach(([u, v], i) => { const p = fpt(F, u, v); i ? g.lineTo(...p) : g.moveTo(...p); }); g.stroke();
  noGlow(); g.restore();
}
// box: x,y centre, z bottom. o: {layer, op, edge, lw, gl:[col,blur], front(F), side(F), top(F), dz}
function box(x, y, z, w, d, h, col, o = {}) {
  add(o.layer ?? 1, D(x, y, z + h / 2) + (o.dz || 0), () => drawBox(x, y, z, w, d, h, col, o));
}
function drawBox(x, y, z, w, d, h, col, o) {
  const x0 = x - w / 2, x1 = x + w / 2, y0 = y - d / 2, y1 = y + d / 2, z1 = z + h;
  const faces = [
    { n: [0, -1, 0], p: [[x0, y0, z], [x1, y0, z], [x1, y0, z1], [x0, y0, z1]], F: { o: [x0, y0, z], u: [1, 0, 0], v: [0, 0, 1] }, cb: o.front, nm: 'front' },
    { n: [0, 1, 0], p: [[x1, y1, z], [x0, y1, z], [x0, y1, z1], [x1, y1, z1]] },
    { n: [-1, 0, 0], p: [[x0, y1, z], [x0, y0, z], [x0, y0, z1], [x0, y1, z1]], F: { o: [x0, y1, z], u: [0, -1, 0], v: [0, 0, 1] }, cb: o.side, nm: 'side' },
    { n: [1, 0, 0], p: [[x1, y0, z], [x1, y1, z], [x1, y1, z1], [x1, y0, z1]] },
    { n: [0, 0, 1], p: [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], F: { o: [x0, y0, z1], u: [1, 0, 0], v: [0, 1, 0] }, cb: o.top, nm: 'top' },
  ];
  const op = o.op ?? 1;
  if (op <= 0.002) return;
  g.globalAlpha = op;
  if (o.gl) glow(o.gl[0], o.gl[1]);
  for (const f of faces) {
    const vis = f.n[0] * toCam[0] + f.n[1] * toCam[1] + f.n[2] * toCam[2];
    if (vis <= 0) continue;
    const lam = Math.max(0, f.n[0] * LIGHT[0] + f.n[1] * LIGHT[1] + f.n[2] * LIGHT[2]);
    const k = 0.42 + 0.72 * lam;
    const pts = f.p.map((q) => P(...q));
    poly(pts, rgba(col, k, 1));
    if (o.edge) { g.save(); noGlow(); poly(pts, null, o.edge, o.lw || 0.8); g.restore(); if (o.gl) glow(o.gl[0], o.gl[1]); }
  }
  noGlow();
  for (const f of faces) {

  g.restore();
}

/* ------------------------------------------------------------------ render */
window.ready = () => { $('grain').style.background = `url(${grainURL(256, 0.07, 3)})`; };
const clockTxt = (m) => { const h = Math.floor(m / 60), mm = Math.floor(m % 60); return [(h % 12 || 12) + ':' + String(mm).padStart(2, '0'), m >= 360 ? '☀️' : '🌙']; };
const CRASHES = [[0.95, 1], [7.4, 1], [25.1, 2], [39.3, 1]];
window.render = function (t) {
  t_ = t;
  camAt(t);
  drawBG(t);
  g.setTransform(2, 0, 0, 2, 0, 0);
  floor();

  // ---- users on the right, sending requests
  const ua = t < 10.3 ? 0.45 : 1;
  [[350, 20], [372, 52], [330, 62]].forEach(([x, y], i) => person(x, y, K.bl, 0.4 + 0.6 * pulse(t, T.spikes + i * 0.05, 3), { op: ua, jump: t > T.spikes && t < 30.6 ? 3 * Math.abs(Math.sin(t * 12 + i)) : 0 }));
  pool(350, 45, 110, K.bl, 0.25 * ua);

  // ---- nodes
  const pods = podsAt(t);
  for (let i = 0; i < 3; i++) {
    const lit = 0.3 + 0.8 * pulse(t, T.k8s + i * 0.12, 3) + 0.5 * pulse(t, T.three + i * 0.33, 4);
    node(i, t, { lit });
  }
  // empty slots waiting for a copy
  [[0, 11.6, 12.0], [2, 11.6, 12.45], [3, 29.6, 30.02], [4, 29.6, 30.2], [5, 29.6, 30.38]].forEach(([k, a, b]) => {
    const al = window01(t, a, b + 0.3, 0.15);
    wireBox(SLOT[k][0], SLOT[k][1], NH, 40, 24, 22, k < 3 ? K.or : K.gr, al * (0.6 + 0.4 * Math.sin(t * 14)));
  });
  // ---- pods
  for (const p of pods) {
    let fl = p.fl;
    if (p.k < 3) fl += 0.8 * pulse(t, [T.three, T.copies ?? 24.02, T.running][p.k], 5);
    pod(p.x, p.y, p.z, { col: p.col, op: p.op, fl: Math.min(1, fl), dead: p.st === 'dead', ver: p.L.ver, hot: p.hot });
    if (p.L.a >= 0) ripple(t, p.L.a + 0.3, p.x, p.y, NH, p.L.ver === 2 ? K.vi : K.cy, 50, 0.6, 2);
  }
  for (const [t0, k] of CRASHES) {
    sparks(t, t0, SLOT[k][0], SLOT[k][1], NH + 18, K.rd, 26, 11 + k, 120, 0.7, 2.6, 220);
    ripple(t, t0, SLOT[k][0], SLOT[k][1], NH, K.rd, 70, 0.7, 2.5);
  }
  if (t > 9.86) { sparks(t, 9.86, SLOT[1][0], SLOT[1][1], NH + 14, K.cy, 18, 21, 100, 0.6, 2.4, 200); }

  // ---- requests
  traffic(t, 0.5, -1, 0.9, 1, K.bl, 0.8);
  traffic(t, 0.45, 5.0, 10.9, 2, K.bl, 0.75);
  traffic(t, 0.2, 10.9, 13.7, 3, K.or, 0.85);
  traffic(t, 0.42, 22.0, T.spikes, 4, K.bl, 0.8);
  traffic(t, 0.11, T.spikes, 31.1, 5, K.or, 0.9);
  traffic(t, 0.4, 31.1, 38.4, 6, K.bl, 0.8);
  traffic(t, 0.7, 38.4, 41.8, 7, K.bl, 0.6);
  traffic(t, 0.5, 41.8, DURATION, 8, K.bl, 0.6);

  // ---- Kubernetes control box
  const rise = t > 14.7 ? ep(t, 14.7, 15.25, ease.back) : 0;
  const slotsUp = new Set(pods.filter((p) => p.st === 'run' && (p.z <= NH + 2 || p.leaving)).map((p) => p.k));
  const ver = t > T.newv ? 2 : 0;
  control(t, Math.min(1.08, rise), { want: WANT(t), have: slotsUp.size, ver, fl: pulse(t, T.k8s, 3) + pulse(t, 26.2, 4) + pulse(t, 39.9, 4) });
  if (rise > 0) {
    const la = ep(t, T.k8s, T.k8s + 0.6);
    for (let i = 0; i < 3; i++) roadLine(sub([[CP[0], CP[1] + 22, 0], [NX[i], NY - NDp / 2, 0]], la), K.cy, 0.75 * la);
  }
  sparks(t, 14.95, CP[0], CP[1], 10, K.cy, 36, 3, 180, 0.8, 3, 200);
  ripple(t, 14.95, CP[0], CP[1], 0, K.cy, 240, 1.0, 3);
  ripple(t, T.k8s, CP[0], CP[1], 0, K.cy, 380, 1.2, 3);

  flush();
  g.setTransform(2, 0, 0, 2, 0, 0);

  /* ---------------- DOM layer */
  hud(t); sec(t); caps(t);
  const nf = nightAt(t);
  const dimA = Math.max(window01(t, 13.85, 14.62, 0.15) * 0.6, window01(t, T.k8s - 0.06, 17.75, 0.2) * 0.35, window01(t, 17.8, 21.9, 0.25) * 0.55,
    window01(t, 41.9, 47.5, 0.3) * 0.3, window01(t, 47.5, DURATION + 1, 0.3) * 0.45, nf * 0.2);
  $('dim').style.opacity = dimA;
  let fl = 0, fc = '#fff';
  for (const [t0, c, a] of [[0.95, HX.rd, 0.45], [2.85, HX.gr, 0.2], [7.4, HX.rd, 0.3], [9.9, HX.cy, 0.2], [T.k8s, HX.cy, 0.25], [25.1, HX.rd, 0.3], [26.2, HX.gr, 0.2],
    [30.02, HX.or, 0.15], [35.6, HX.vi, 0.12], [39.3, HX.rd, 0.3], [39.9, HX.gr, 0.2], [50.7, HX.bl, 0.2]]) {
    const dt = t - t0; if (dt > 0 && dt < 0.5) { const v = a * Math.exp(-dt * 9); if (v > fl) { fl = v; fc = c; } }
  }
  $('flash').style.opacity = fl; $('flash').style.background = fc;
  $('stage').style.opacity = 1 - ep(t, DURATION - 0.35, DURATION) * 0.85;

  // world tags (one at a time)
  const TS = (c, fg = '#0a0d1f') => `background:${c};color:${fg};font-size:11px`;
  const above = (k, z = 70) => [SLOT[k][0], SLOT[k][1], z];
  tag('dead', '💀 STAYS DEAD', TS(HX.rd, '#fff'), above(1), t, T.stays - 0.05, 9.7);
  tag('hand1', '👆 BY HAND', TS(HX.or), above(1), t, 9.9, 10.65);
  tag('x2', '📈 TRAFFIC ×2', TS(HX.or), [350, 40, 70], t, T.doubles, 11.7);
  tag('hand2', '😩 BY HAND, AGAIN', TS(HX.or), [NX[1], NY, 90], t, 12.6, 13.75);
  tag('want', '🗣 “KEEP 3 RUNNING”', TS(HX.cy), [CP[0], CP[1], 110], t, T.want - 0.1, 16.35);
  tag('secs', '⏱ BACK IN SECONDS', TS(HX.gr), above(2), t, 26.2, 27.45);
  tag('spike', '📈 SPIKE', TS(HX.or), [350, 40, 70], t, T.spikes, 30.0);
  tag('add3', '+3 COPIES', TS(HX.gr), [NX[1], NY, 92], t, 30.4, 31.15);
  tag('rm3', '−3 COPIES', TS(HX.cy), [NX[1], NY, 92], t, T.removes, 32.75);
  tag('v2', '✨ NEW: v2', TS(HX.vi, '#fff'), [NX[1], NY, 92], t, T.newv, 35.3);
  tag('up', '✓ ALWAYS UP', TS(HX.gr), [NX[1], NY, 92], t, T.nodown - 0.05, 38.35);

  // the WANT / HAVE readout above the Kubernetes box
  {
    const w = WANT(t), h = slotsUp.size, hc = h === w ? HX.gr : h < w ? HX.rd : HX.or;
    const win = t < 20 ? [16.45, 17.75] : t < 38.45 ? [22.2, 38.4] : [38.6, 41.75];
    tag('wh', `WANT <b style="font-size:15px;color:${HX.cy}">${w}</b>${ver ? ' <span style="color:' + HX.vi + '">v2</span>' : ''} <span style="opacity:.4">·</span> HAVE <b style="font-size:15px;color:${hc}">${h}</b>`,
      `background:rgba(9,13,32,0.92);color:#cfd6f5;border:1px solid ${h === w ? 'rgba(34,211,238,0.6)' : hc};font-size:11px;padding:4px 9px`, [CP[0], CP[1], 92], t, win[0], win[1]);
  }
  // hook + payoff: the clock
  {
    const a = Math.max(window01(t, -1, 5.6, 0.25), window01(t, T.L8 + 0.05, 41.6, 0.25));
    const m = t < 20 ? lerp(180, 450, ep(t, 2.4, 3.6, ease.inOut)) : lerp(180, 450, ep(t, 40.1, 40.8, ease.inOut));
    const [tm, ic] = clockTxt(m);
    const q = CLOCK.querySelector('.tm'), ie = CLOCK.querySelector('.ic');
    if (q._v !== tm) { q._v = tm; q.textContent = tm; }
    if (ie._v !== ic) { ie._v = ic; ie.textContent = ic; }
    const spin = t < 20 ? window01(t, 2.4, 3.6, 0.1) : window01(t, 40.1, 40.8, 0.1);
    vis(CLOCK, a, `translateY(${(1 - Math.min(1, a * 1.2)) * -8}px) scale(${1 + 0.06 * spin})`);
    CLOCK.style.borderColor = m >= 360 ? 'rgba(250,204,21,0.6)' : 'rgba(79,140,255,0.5)';
  }
  kinIn(CRASHK, t, 0.9, 2.35, 2.2); echo(CRASHK, t, 0.95, 0.6); glitch(CRASHK, t, true, 50);
  kinIn(BACKK, t, T.already - 0.06, 5.6, 1.8); echo(BACKK, t, T.already, 0.6);
  // the fix
  kinIn(FIXK, t, 13.86, 14.62, 1.25);
  kinIn(K8SK, t, T.k8s - 0.04, 17.75, 2.0); echo(K8SK, t, T.k8s, 0.7);
  // thermostat
  if (cardAnim(THERMO, t, 17.86, 21.95) > 0) {
    const n = Math.round(lerp(18, 21, ep(t, 19.6, T.keeps, ease.inOut))), ok = t > T.keeps;
    const e = $('thn'); if (e._v !== n) { e._v = n; e.textContent = n + '°'; }
    $('thn').style.color = ok ? HX.gr : '#fff';
    $('thd').style.background = `conic-gradient(${ok ? HX.gr : HX.ye} 0deg, ${ok ? HX.gr : HX.ye} ${200 + 60 * prog(n, 18, 21)}deg, #26305a 0deg)`;
    const sa = ep(t, T.set - 0.05, T.set + 0.2, ease.back); $('ths').style.opacity = clamp(sa); $('ths').style.transform = `scale(${0.6 + 0.4 * sa})`;
    const k = $('thk'), st = ok ? '✓ HOLDING' : t > 19.5 ? 'HEATING…' : '';
    if (k._v !== st) { k._v = st; k.textContent = st; k.style.color = ok ? HX.gr : HX.or; }
    const ma = ep(t, 20.9, 21.2); $('thm').style.opacity = ma; $('thm').style.transform = `translateY(${(1 - ma) * 6}px)`;
  }
  // payoff
  cardAnim(NOTIF, t, 40.85, 41.75);
  // definition
  if (cardAnim(DEF, t, T.L9 + 0.1, 47.45) > 0) {
    [[T.L9 + 0.1, 'd0'], [T.k8s2 - 0.1, 'd1']].forEach(([ta, id]) => { const a = ep(t, ta, ta + 0.25); $(id).style.opacity = 0.15 + 0.85 * a; $(id).style.transform = `translateX(${(1 - a) * 10}px)`; });
  }
  {
    const a = window01(t, T.google - 0.15, 47.45, 0.25), b = window01(t, T.every - 0.15, 47.45, 0.25);
    vis(GOOG, a, `translateY(${(1 - a) * 10}px)`); vis(TOOLS, b, `translateY(${(1 - b) * 10}px)`);
    [[T.google, 'k0', HX.ye], [T.every, 'k1', HX.or], [T.every + 0.18, 'k2', HX.gr], [T.every + 0.36, 'k3', HX.bl]].forEach(([tv, id, c]) => {
      const e = $(id), on = t >= tv - 0.05, st = on ? `border-color:${c};color:#0a0d1f;background:${c}` : '';
      if (e._s !== st) { e._s = st; e.style.cssText = st; }
      e.style.transform = `scale(${1 + 0.2 * pulse(t, tv, 9) * (on ? 1 : 0)})`;
    });
  }
  // profile: Docker reel first, then follow
  const TAP = 50.62, DONE = 50.7;
  if (cardAnim(PROF, t, T.L10 - 0.05, DURATION + 1) > 0) {
    const fb = $('fb'), done = t > DONE;
    if (fb._d !== done) { fb._d = done; fb.textContent = done ? 'Following ✓' : 'Follow'; fb.style.background = done ? '#262f55' : '#4F8CFF'; fb.style.fontSize = done ? '12.5px' : '14px'; }
    fb.style.transform = `scale(${1 - 0.06 * window01(t, TAP, TAP + 0.16, 0.06)})`;
    const hi = ep(t, T.docker3 - 0.1, T.docker3 + 0.2), t0 = $('t0');
    t0.style.borderColor = hi > 0 ? `rgba(79,140,255,${hi})` : 'transparent';
    t0.style.boxShadow = hi > 0 ? `0 0 ${24 * hi}px rgba(79,140,255,${0.7 * hi})` : '';
    t0.style.transform = `scale(${1 + 0.05 * hi + 0.06 * pulse(t, T.profile, 6)})`;
    ['t1', 't2'].forEach((id) => { $(id).style.opacity = 1 - 0.45 * hi * (1 - ep(t, T.follow, T.follow + 0.3)); });
  }
  {
    const a = window01(t, T.docker3, DURATION + 1, 0.2) * (1 - 0.6 * ep(t, T.follow, T.follow + 0.3));
    vis(WATCH, a, `translateY(${(1 - Math.min(1, a * 1.3)) * 8}px)`);
  }
  if (t > T.L10 + 0.2) {
    // cursor: Docker tile, then the Follow button
    const k1 = ep(t, 48.4, 49.0, ease.inOut), k2 = ep(t, 50.15, 50.58, ease.inOut);
    const cx = lerp(lerp(470, 156, k1), 428, k2), cy = lerp(lerp(780, 334, k1), 250, k2);
    const press = Math.max(window01(t, T.profile - 0.05, T.profile + 0.12, 0.05), window01(t, TAP, TAP + 0.16, 0.06));
    cursorAt(cx, cy, window01(t, 48.3, DURATION + 1, 0.15), press);
  } else if (t > 9.2 && t < 10.3) {
    // revive the dead pod by hand
    const b = P(SLOT[1][0], SLOT[1][1], NH + 22), k = ep(t, 9.2, 9.7, ease.inOut);
    cursorAt(lerp(b[0] + 110, b[0] - 4, k), lerp(b[1] + 150, b[1] - 4, k), window01(t, 9.2, 10.3, 0.12), window01(t, 9.72, 9.9, 0.05));
  } else if (t > 11.5 && t < 13.0) {
    // drop two more copies by hand
    const b0 = P(SLOT[0][0], SLOT[0][1], NH + 22), b2 = P(SLOT[2][0], SLOT[2][1], NH + 22);
    const k0 = ep(t, 11.5, 11.9, ease.inOut), k2 = ep(t, 12.05, 12.38, ease.inOut);
    const x = lerp(lerp(b0[0] + 90, b0[0] - 4, k0), b2[0] - 4, k2), y = lerp(lerp(b0[1] + 150, b0[1] - 4, k0), b2[1] - 4, k2);
    cursorAt(x, y, window01(t, 11.5, 13.0, 0.12), Math.max(window01(t, 11.9, 12.06, 0.05), window01(t, 12.38, 12.52, 0.05)));
  } else cursorAt(0, 0, 0, 0);
};
// confetti on follow
const _r = window.render;
window.render = function (t) {
  _r(t);
  if (t > 50.7 && t < 52.3) {
    g.setTransform(2, 0, 0, 2, 0, 0); g.save(); g.globalCompositeOperation = 'lighter';
    const dt = t - 50.7, cols = [HX.bl, HX.cy, HX.gr, HX.vi, HX.pk, HX.ye];
    for (let i = 0; i < 70; i++) {
      const th = rnd(i, 70) * Math.PI * 2, v = 160 + rnd(i, 71) * 260;
      const x = 424 + Math.cos(th) * v * dt, y = 244 + Math.sin(th) * v * dt * 0.8 + 260 * dt * dt;
      g.fillStyle = cols[i % 6]; g.globalAlpha = Math.max(0, 1 - dt / 1.45);
      g.save(); g.translate(x, y); g.rotate(dt * 8 + i); g.fillRect(-3, -1.5, 6, 3); g.restore();
    }
    g.restore(); g.globalAlpha = 1;
  }
};
