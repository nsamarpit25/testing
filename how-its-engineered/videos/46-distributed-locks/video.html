<meta charset="utf-8">
<!-- 46 Distributed locks (same kit as 44/45). Three SERVER boxes in front, a CUSTOMER INBOX (later "STORAGE") and a REDIS lock box at
     the back. Hook: a midnight billing job runs on all three servers, the inbox fills with 3 invoices. Local locks can't see each other.
     Redis appears; three claims race, server 2 lands first, the others bounce; server 2 sends one invoice, 1 and 3 skip. Talking-stick
     card. Server 2 crashes, the lock's 30 s timer runs out and frees it, server 1 takes it. SET ... NX PX code card, etcd/ZooKeeper card.
     Fencing: server 1 freezes holding token 33, the timer runs out, server 3 takes token 34 and writes; server 1 wakes and writes with 33,
     storage rejects it. HUD on top: invoices · lock holder · timer. Beats from voice/words.json. -->

<style>

<body>
<div id="stage">

<script src="../_ember/base.js"></script>
<script>
for (let i = 0; i < 24; i++) ORBS.push({ core: orbSprite(9), glow: orbSprite(34), trail: [0, 1, 2, 3, 4].map(() => orbSprite(10)) });
const RD = '#6FC3FF', PU = '#C9A0FF';

/* ---------------- beats */
const T = {
  midnight: at('midnight'), three: at('three'), servers: at('servers'), every: at('every'), invoices: at('invoices'),
  l1: line(1).start, regular: at('regular'), memory: at('memory'), cant: at('cant'),
  l2: line(2).start, distributed: at('distributed'), shared: at('shared'), redis: at('redis'),
  l3: line(3).start, race: at('race'), first: at('first'),
  l4: line(4).start, wins: at('wins'), sends: at('sends'), invoices2: at('invoices', 2), taken: at('taken'), skip: at('skip'),
  l5: line(5).start, talking: at('talking'), speak: at('speak'),
  l6: line(6).start, crashes: at('crashes'), timer: at('timer'), frees: at('frees'),
  l7: line(7).start, set: at('set'), free: at('free'), starts: at('starts'), etcd: at('zookeeper') - 0.55,
  l8: line(8).start, frozen: at('frozen'), ran: at('ran', 2), charge: at('charge'), fencing: at('fencing'), higher: at('higher'), rejects: at('rejects'),
  ifv: line(9).start, follow: at('follow'),
};
const FLY = 0.55, land = (s) => s + FLY;
// trips
const HOOK = [0, 1, 2].map((i) => T.every - 0.35 + i * 0.22);                       // each server sends invoices (hook)
const RACE = [T.race + 0.25, T.first - FLY, T.race + 0.55];                          // claims: server 2 lands on "first"
RACE[0] = Math.max(RACE[0], RACE[1] + 0.12); RACE[2] = Math.max(RACE[2], RACE[1] + 0.24);
const SEND2 = T.sends - 0.15;                                                         // server 2 → inbox
const CRASH = T.crashes, TSTART = T.timer, TFREE = T.frees;                         // the 30 s timer runs (fast) from "timer" to "frees"
const TAKE1 = TFREE + 0.35;                                                           // server 1 takes the freed lock
const FROZE = T.frozen, RUNOUT = T.ran + 0.1, TAKE3 = RUNOUT + 0.25, W3 = TAKE3 + FLY + 0.25, WAKE = T.charge - 0.4;
const W1 = T.rejects - FLY;                                                           // server 1's stale write bounces on "rejects"

/* ---------------- state per time */
const invAt = (t) => t < T.l2 - 0.3 ? HOOK.filter((s) => t >= land(s)).length : t < land(SEND2) ? 0 : 1;
const holderAt = (t) => t < land(RACE[1]) ? '' : t < TFREE ? '2' : t < land(TAKE1) ? '' : t < RUNOUT ? '1' : t < land(TAKE3) ? '' : '3';
const timerAt = (t) => (t >= TSTART && t < TFREE) ? Math.ceil(30 * (1 - prog(t, TSTART, TFREE))) : (t >= FROZE && t < RUNOUT) ? Math.max(1, Math.ceil(30 * (1 - prog(t, FROZE, RUNOUT)) * 0.4)) : (holderAt(t) ? 30 : 0);
const tokenAt = (t) => t < T.l8 - 0.2 ? 0 : t < land(TAKE3) ? 33 : 34;
const storeAt = (t) => t < T.l8 - 0.2 ? 0 : t < land(W3) ? 33 : 34;

/* ---------------- layout: Z up */
const BX = [-230, 230], BY = 340, BW = 300, BD = 110, BH = 110;     // inbox (0) and redis (1) at the back
const SX = [-290, 0, 290], SY = -210, SW = 150, SD = 60, SH = 230;    // three servers
const SC = [O2, RD, PU];
const bTop = (k) => [BX[k], BY, BH + 8], sTop = (i) => [SX[i], SY, SH + 10];
const sMid = (i) => [SX[i], SY + 20, SH * 0.62];
const bFront = (k, i) => [BX[k] + (i - 1) * 60, BY - BD / 2, BH * 0.6];
function arc(a, b, h, n = 24) { return [...Array(n + 1)].map((_, i) => { const q = i / n; return [lerp(a[0], b[0], q), lerp(a[1], b[1], q), lerp(a[2], b[2], q) + h * 4 * q * (1 - q)]; }); }
const up = (i, k) => arc(sMid(i), bFront(k, i), 160), down = (i, k) => arc(bFront(k, i), sMid(i), 160);

/* ---------------- camera */
const pcam = new TH.PerspectiveCamera(42, 540 / 960, 5, 20000); pcam.up.set(0, 0, 1);
const SHOTS = [
  { t: 0, p: [0, -1450, 1220], l: [0, 70, 90], f: 42 },
  { t: 0.01, d: 6, p: [0, -1600, 1340], l: [0, 70, 80], f: 42, e: ease.out },
  { t: T.l2 - 0.1, d: 1.2, p: [0, -1560, 1300], l: [0, 110, 80], f: 42 },
  { t: T.l4 - 0.1, d: 1.2, p: [-40, -1600, 1340], l: [-30, 80, 80], f: 42 },
  { t: T.l6 - 0.1, d: 1.2, p: [30, -1480, 1220], l: [30, 110, 80], f: 42 },
  { t: T.l8 - 0.2, d: 1.2, p: [0, -1660, 1400], l: [0, 80, 60], f: 42 },
];
const KICKS = [[land(HOOK[2]), 0.04], [T.cant, 0.03], [T.redis, 0.03], [land(RACE[1]), 0.05], [land(SEND2), 0.03], [CRASH, 0.05], [TFREE, 0.04], [T.rejects, 0.05]];
const SHAKES = [[land(HOOK[2]), 4, 0.35], [CRASH, 6, 0.45], [T.rejects, 4, 0.35]];
const _rv = new TH.Vector3();
function shoot(t) {
  let p = SHOTS[0].p.slice(), l = SHOTS[0].l.slice(), f = SHOTS[0].f;
  for (let i = 1; i < SHOTS.length; i++) {
    const k = SHOTS[i]; if (t < k.t) break;
    const q = k.d ? (k.e || ease.inOut)(prog(t, k.t, k.t + k.d)) : 1;
    p = p.map((v, j) => lerp(v, k.p[j], q)); l = l.map((v, j) => lerp(v, k.l[j], q)); f = lerp(f, k.f, q);
  }
  let kick = 0;
  for (const [t0, amp] of KICKS) { const dt = t - t0; if (dt > 0 && dt < 1.2) kick += amp * (dt < 0.05 ? dt / 0.05 : Math.exp(-(dt - 0.05) * 6)); }
  let sx = 0, sy = 0;
  for (const [t0, amp, dur] of SHAKES) { const dt = t - t0; if (dt > 0 && dt < dur) { const k = amp * (1 - dt / dur); sx += k * Math.sin(t * 91); sy += k * Math.cos(t * 67); } }
  pcam.position.set(p[0] + 6 * Math.sin(t * 0.37), p[1] + 6 * Math.cos(t * 0.29), p[2] + 4 * Math.sin(t * 0.23));
  pcam.lookAt(l[0] + sx, l[1], l[2] + sy);
  pcam.fov = f * (1 - kick); pcam.updateProjectionMatrix(); pcam.updateMatrixWorld();
  cam.f = l;
  _rv.setFromMatrixColumn(pcam.matrixWorld, 0); const n = Math.hypot(_rv.x, _rv.y) || 1; camRight = [_rv.x / n, _rv.y / n, 0];
  const d = Math.hypot(p[0] - l[0], p[1] - l[1], p[2] - l[2]);
  scene.fog.near = d * 0.9; scene.fog.far = d * 3.4;
}
const _pv = new TH.Vector3();
P = function (x, y, z) { _pv.set(x, y, z).project(pcam); return [(_pv.x + 1) * 270, (1 - _pv.y) * 480, _pv.z]; };

/* ---------------- the stage */
floor.scale.set(2.4, 2.4, 1); floor.position.set(0, 1500, -0.5);
const BOX = BX.map((x, k) => emberBox(x, BY, BW, BD, BH, k ? AMB : O)), POOLB = BX.map((x, k) => pool(x, BY, 240, k ? AMB : O));
const SRV = SX.map((x, i) => emberBox(x, SY, SW, SD, SH, SC[i], { lw: 2.2 })), POOLS = SX.map((x, i) => pool(x, SY, 160, SC[i]));
const ROADS = [0, 1].map((k) => SX.map((x) => road([[x, SY + 40, 0], [lerp(x, BX[k], 0.6), lerp(SY, BY, 0.6), 0], [BX[k] + (x / 290) * 60, BY - BD / 2 - 10, 0]], DIM)));
const DB = BX.map((x) => { const d = decal(BW - 24, BH - 20, 'front', 6); d.m.position.set(x, BY - BD / 2 - 0.6, BH / 2); return d; });
const DS = SX.map((x) => { const d = decal(SW - 18, SH - 26, 'front', 6); d.m.position.set(x, SY - SD / 2 - 0.6, SH / 2); return d; });
function padlock(g, x, y, s, col, open) {
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 9; g.lineCap = 'round'; g.shadowColor = col; g.shadowBlur = 14;
  g.beginPath(); if (open) { g.moveTo(-26, -6); g.lineTo(-26, -46); g.arc(4, -46, 30, Math.PI, 0); g.lineTo(34, -40); } else { g.moveTo(-26, -6); g.lineTo(-26, -40); g.arc(0, -40, 26, Math.PI, 0); g.lineTo(26, -6); } g.stroke();
  rrect(g, -42, -10, 84, 70, 12); g.fill(); g.fillStyle = '#0d0c0b'; g.beginPath(); g.arc(0, 18, 9, 0, Math.PI * 2); g.fill(); g.fillRect(-4, 18, 8, 20);
  g.restore();
}
function drawInbox(t) {
  const st = t >= T.l8 - 0.2, n = invAt(t), tok = storeAt(t), rej = t > T.rejects - 0.05 && t < T.ifv;
  const key = [st, n, tok, rej].join('|'); if (DB[0]._k === key) return; DB[0]._k = key;
  DB[0].draw((g, w, h) => {
    g.fillStyle = 'rgba(14,12,10,0.92)'; rrect(g, 0, 0, w, h, 34); g.fill();
    g.strokeStyle = st ? (rej ? RED : O) : n > 1 ? RED : O; g.lineWidth = 8; rrect(g, 4, 4, w - 8, h - 8, 30); g.stroke();
    g.textBaseline = 'middle'; g.fillStyle = '#9c948c'; g.font = '800 62px Mono'; g.fillText(st ? 'STORAGE' : 'CUSTOMER INBOX', 46, 84);
    if (!st) {
      for (let k = 0; k < 3; k++) { const on = k < n; g.globalAlpha = on ? 1 : 0.18; g.strokeStyle = n > 1 ? RED : OK; g.lineWidth = 9; rrect(g, 60 + k * 230, 190, 190, 260, 16); g.stroke();
        g.fillStyle = n > 1 ? RED : OK; for (let r = 0; r < 4; r++) g.fillRect(90 + k * 230, 250 + r * 48, 130 - (r % 2) * 40, 14); }
      g.globalAlpha = 1; g.fillStyle = n > 1 ? RED : n ? OK : '#F2EEE8'; g.font = '900 150px Inter'; g.fillText(n + (n === 1 ? ' INVOICE' : ' INVOICES'), 760, 320);
    } else {
      g.fillStyle = '#F2EEE8'; g.font = '900 120px Inter'; g.fillText('LAST TOKEN', 60, 300); g.fillStyle = tok === 34 ? OK : O2; g.font = '900 170px Mono'; g.fillText(String(tok), 1020, 300);
      if (rej) { g.fillStyle = RED; g.font = '900 100px Mono'; g.fillText('33 → REJECTED', 60, 460); }
    }
  });
}
function drawRedis(t) {
  const hd = holderAt(t), tm = timerAt(t), tok = tokenAt(t), freeing = t >= TFREE - 0.05 && t < land(TAKE1) || t >= RUNOUT - 0.05 && t < land(TAKE3);
  const key = [hd, tm, tok, freeing].join('|'); if (DB[1]._k === key) return; DB[1]._k = key;
  const col = hd === '1' ? O2 : hd === '2' ? RD : hd === '3' ? PU : AMB;
  DB[1].draw((g, w, h) => {
    g.fillStyle = 'rgba(14,12,10,0.92)'; rrect(g, 0, 0, w, h, 34); g.fill();
    g.strokeStyle = col; g.lineWidth = 8; rrect(g, 4, 4, w - 8, h - 8, 30); g.stroke();
    g.textBaseline = 'middle'; g.fillStyle = '#9c948c'; g.font = '800 62px Mono'; g.fillText('REDIS · invoice:lock', 46, 84);
    padlock(g, 170, 330, 2.2, col, !hd);
    g.fillStyle = col; g.font = '900 120px Inter'; g.fillText(hd ? 'SERVER ' + hd : freeing ? 'FREE' : 'NOBODY', 330, 280);
    if (hd && tm) { g.fillStyle = tm <= 5 ? RED : '#F2EEE8'; g.font = '800 92px Mono'; g.fillText('⏱ ' + tm + ' s', 330, 430); }
    if (tok) { g.fillStyle = tok === 34 ? OK : O2; g.font = '800 92px Mono'; g.fillText('TOKEN ' + tok, 930, 430); }
  });
}
// server screens: 'idle' | 'send' | 'local' | 'claim' | 'win' | 'bounce' | 'skip' | 'crash' | 'held' | 'frozen' | 'stale' | 'rej'
function drawServer(i, st, tok) {
  const D = DS[i], key = st + '|' + tok; if (D._k === key) return; D._k = key;
  D.draw((g, w, h) => {
    g.fillStyle = '#0d0c0b'; rrect(g, 0, 0, w, h, 40); g.fill();
    g.strokeStyle = SC[i]; g.globalAlpha = 0.5; g.lineWidth = 5; rrect(g, 4, 4, w - 8, h - 8, 36); g.stroke(); g.globalAlpha = 1;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#9c948c'; g.font = '800 70px Mono'; g.fillText('SERVER ' + (i + 1), w / 2, 90);
    for (let r = 0; r < 3; r++) { g.strokeStyle = '#3a332d'; g.lineWidth = 6; rrect(g, 90, 160 + r * 70, w - 180, 46, 10); g.stroke(); g.fillStyle = r === 0 ? SC[i] : '#3a332d'; g.beginPath(); g.arc(130, 183 + r * 70, 10, 0, Math.PI * 2); g.fill(); }
    const big = (txt, col, y = 620, s = 150) => { g.fillStyle = col; g.font = `900 ${s}px Inter`; g.shadowColor = col; g.shadowBlur = 18; g.fillText(txt, w / 2, y); g.shadowBlur = 0; };
    const small = (txt, col, y = 790) => { g.fillStyle = col; g.font = '800 64px Mono'; g.fillText(txt, w / 2, y); };
    if (st === 'idle') { big('00:00', '#F2EEE8', 620, 130); small('BILLING JOB', '#9c948c'); }
    if (st === 'send') { big('✉ ✉', RED, 620, 130); small('SENDING…', RED); }
    if (st === 'local') { big('🔒', SC[i], 610, 170); small('MY LOCK ✓', SC[i]); }
    if (st === 'claim') { big('🔒?', AMB, 610, 150); small('CLAIMING…', AMB); }
    if (st === 'win') { big('🔒', OK, 610, 170); small('GOT IT · SENDS', OK); }
    if (st === 'bounce') { big('✕', RED, 600, 220); small('TAKEN', RED); }
    if (st === 'skip') { big('SKIP', '#9c948c', 620, 130); small('NOT MY TURN', '#9c948c'); }
    if (st === 'crash') { big('✕', RED, 600, 240); small('CRASHED', RED); }
    if (st === 'held') { big('🔒', OK, 610, 170); small(tok ? 'TOKEN ' + tok : 'GOT IT', OK); }
    if (st === 'frozen') { big('❄', RD, 610, 200); small('FROZEN · TOKEN 33', RD); }
    if (st === 'stale') { big('🔒?', AMB, 610, 150); small('STILL IN CHARGE?', AMB); }
    if (st === 'rej') { big('✕', RED, 600, 220); small('33 REJECTED', RED); }
  });
}
function serverState(i, t) {
  if (t < HOOK[i]) return 'idle';
  if (t < T.l1) return 'send';
  if (t < T.l2) return t > T.regular + i * 0.12 ? 'local' : 'send';
  if (t < RACE[i] - 0.1) return 'idle';
  if (i === 1) {
    if (t < land(RACE[1])) return 'claim';
    if (t < CRASH) return 'win';
    return t < T.l8 - 0.2 ? 'crash' : 'idle';
  }
  if (t < land(RACE[i])) return 'claim';
  if (t < T.skip - 0.1) return 'bounce';
  if (t < T.l6 - 0.1) return 'skip';
  if (i === 0) {
    if (t < TAKE1) return 'skip';
    if (t < T.l8 - 0.2) return 'held';
    if (t < FROZE) return 'held';
    if (t < WAKE) return 'frozen';
    if (t < T.rejects) return 'stale';
    return 'rej';
  }
  if (t < TAKE3) return 'skip';
  return 'held';
}

/* ---------------- the world, frame by frame */
function world(t) {
  const n = invAt(t), hd = holderAt(t), rA = ep(t, T.shared - 0.4, T.shared + 0.3);
  const ic = t >= T.l8 - 0.2 ? (t > T.rejects - 0.05 && t < T.ifv ? RED : O) : n > 1 ? mixHex(O, RED, 0.6 + 0.4 * Math.sin(t * 8) ** 2) : n ? mixHex(O, OK, 0.5) : O;
  BOX[0].setLook(ic, 1.1 + 0.8 * pulse(t, land(HOOK[2]), 4) + 0.6 * pulse(t, land(SEND2), 4), ep(t, 0, 0.5)); POOLB[0].set(ic, 0.42 * ep(t, 0, 0.5));
  const rc = hd === '1' ? O2 : hd === '2' ? RD : hd === '3' ? PU : AMB;
  BOX[1].setLook(rc, 1.1 + 0.9 * pulse(t, land(RACE[1]), 4) + 0.7 * pulse(t, TFREE, 4) + 0.7 * pulse(t, RUNOUT, 4), rA); POOLB[1].set(rc, 0.42 * rA);
  drawInbox(t); drawRedis(t);
  DB[0].m.material.opacity = ep(t, 0.2, 0.7); DB[1].m.material.opacity = rA;
  for (let i = 0; i < 3; i++) {
    const a = ep(t, 0.1 + i * 0.1, 0.6 + i * 0.1), s = serverState(i, t);
    let c = SC[i];
    if (s === 'send' || s === 'crash' || s === 'rej' || s === 'bounce') c = mixHex(SC[i], RED, s === 'crash' ? 0.6 + 0.4 * Math.sin(t * 13) ** 2 : 0.55);
    else if (s === 'win' || s === 'held') c = mixHex(SC[i], OK, 0.5); else if (s === 'skip') c = mixHex(SC[i], DIM, 0.5); else if (s === 'frozen') c = mixHex(SC[i], '#BFE6FF', 0.7);
    SRV[i].setLook(c, (s === 'skip' ? 0.6 : 1) + 0.6 * pulse(t, T.three + i * 0.2, 5), s === 'crash' ? a * (0.55 + 0.45 * Math.abs(Math.sin(t * 9))) : a); POOLS[i].set(c, 0.36 * a);
    drawServer(i, s, s === 'held' ? (i === 0 ? (t >= T.l8 - 0.2 ? 33 : 0) : 34) : 0); DS[i].m.material.opacity = a;
    ROADS[0][i].set(1, mixHex(SC[i], DIM, 0.5), 0.6 * ep(t, 0.4, 1.0), t);
    ROADS[1][i].set(1, mixHex(SC[i], DIM, 0.5), 0.6 * rA, t);
  }
  // hook: every server sends invoices
  HOOK.forEach((s, i) => { const q = prog(t, s, land(s)); if (q > 0 && q < 1) orb(up(i, 0), ease.inOut(q), RED, 1, 1); if (t > land(s) && t < land(s) + 0.7) ripple(t, land(s), BX[0], BY, BH + 4, RED, 170, 0.7); });
  if (t > land(HOOK[2]) && t < land(HOOK[2]) + 0.9) sparks(t, land(HOOK[2]), BX[0], BY - BD / 2, BH * 0.7, RED, 22, 3, 200, 0.8, 240);
  // the race: server 2 lands, 1 and 3 bounce
  RACE.forEach((s, i) => {
    const q = prog(t, s, land(s));
    if (i === 1) { if (q > 0 && q < 1) orb(up(i, 1), ease.inOut(q), RD, 1, 1); if (t > land(s) && t < land(s) + 0.8) { ripple(t, land(s), BX[1], BY, BH + 4, OK, 210, 0.8); sparks(t, land(s), BX[1], BY, BH + 10, OK, 18, 9, 150, 0.7, 190); } return; }
    if (q > 0 && q < 1) orb(up(i, 1), ease.inOut(Math.min(q, 0.93)), SC[i], 1, 1);
    const qb = prog(t, land(s), land(s) + 0.5); if (qb > 0 && qb < 1) orb(down(i, 1), ease.out(qb) * 0.45, RED, 1 - qb, 1);
  });
  { const q = prog(t, SEND2, land(SEND2)); if (q > 0 && q < 1) orb(up(1, 0), ease.inOut(q), OK, 1, 1); if (t > land(SEND2) && t < land(SEND2) + 0.7) ripple(t, land(SEND2), BX[0], BY, BH + 4, OK, 190, 0.7); }
  // crash, timer, freed, server 1 takes over

/* ---------------- bloom: scene → half-float target, bright pass, three blur levels, composite to the canvas */
const RT = (w, h, s = 0) => new TH.WebGLRenderTarget(w, h, { type: TH.HalfFloatType, samples: s, depthBuffer: s > 0 });
const rtMain = RT(1080, 1920, 4), BL = [[RT(540, 960), RT(540, 960)], [RT(270, 480), RT(270, 480)], [RT(135, 240), RT(135, 240)]];
const fsCam = new TH.OrthographicCamera(-1, 1, 1, -1, 0, 1), fsScene = new TH.Scene(), fsQuad = new TH.Mesh(new TH.PlaneGeometry(2, 2));
fsQuad.frustumCulled = false; fsScene.add(fsQuad);
const VS = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const shm = (fs, u) => new TH.ShaderMaterial({ uniforms: u, vertexShader: VS, fragmentShader: fs, depthTest: false, depthWrite: false });
const mBright = shm(`uniform sampler2D tex; uniform float th; varying vec2 vUv;
void main() { vec3 c = texture2D(tex, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(th, th + 0.4, l), 1.0); }`,
  { tex: { value: null }, th: { value: 0.8 } });
const mBlur = shm(`uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;
void main() {
  vec3 c = texture2D(tex, vUv).rgb * 0.2270270270;
  c += (texture2D(tex, vUv + dir * 1.3846153846).rgb + texture2D(tex, vUv - dir * 1.3846153846).rgb) * 0.3162162162;
  c += (texture2D(tex, vUv + dir * 3.2307692308).rgb + texture2D(tex, vUv - dir * 3.2307692308).rgb) * 0.0702702703;
  gl_FragColor = vec4(c, 1.0);
}`, { tex: { value: null }, dir: { value: new TH.Vector2() } });
const mComp = shm(`uniform sampler2D base, b1, b2, b3; uniform float k1, k2, k3; varying vec2 vUv;
void main() {
  vec3 c = texture2D(base, vUv).rgb + texture2D(b1, vUv).rgb * k1 + texture2D(b2, vUv).rgb * k2 + texture2D(b3, vUv).rgb * k3;
  c = c / (1.0 + max(c - 1.0, 0.0) * 0.6);
  gl_FragColor = vec4(c, 1.0);
  #include <colorspace_fragment>
}`, { base: { value: rtMain.texture }, b1: { value: BL[0][0].texture }, b2: { value: BL[1][1].texture }, b3: { value: BL[2][1].texture }, k1: { value: 0.5 }, k2: { value: 0.65 }, k3: { value: 0.8 } });
function pass(mat, dst) { fsQuad.material = mat; renderer.setRenderTarget(dst); renderer.render(fsScene, fsCam); }
function blur(src, dst, dx, dy) { mBlur.uniforms.tex.value = src.texture; mBlur.uniforms.dir.value.set(dx / src.width, dy / src.height); pass(mBlur, dst); }

  blur(BL[1][1], BL[2][0], 1, 0); blur(BL[2][0], BL[2][1], 0, 1);

}
