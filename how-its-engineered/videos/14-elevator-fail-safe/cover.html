  pline([[tip + 16, -5, 8.7], [tip + 16, 5, 8.7]], rgba(O, 1, 0.6), 0.8);
  // arrow: sideways in
  if (k < 0.98) seg([tip + 26, -6, 5], [tip + 20, -6, 5], rgba(O2, 1, 0.8), 1);
  // same wedge, turned upright against a rail
  const L = 6.9 * ep(t, T.doorstop - 0.25, T.door - 0.1, ease.inOut);
  section({ o: [1050, -4, 6], u: [1, 0, 0], v: [0, 0, 1] }, 1.7, L, 0, 1, false, t);
}

/* ---------------- overlays */
const CHIPS = [
  [10.05, 11.4, '1854 · OTIS', O], [T.lock, 26.55, 'ROPE LOCKED', YE], [T.stopped, 29.8, 'LEVER ↑', O], [T.wedges, 31.9, 'WEDGE ↑', O],
  [32.1, 34.14, 'SAME WEDGE PRINCIPLE', O2], [36.9, 37.45, 'HELD', GN], [T.y1945, 40.75, '1945', O], [T.empire, 42.6, 'EMPIRE STATE BUILDING', O],
  [T.car6, 44.5, 'CAR 6', O], [T.govrope, 46.15, 'GOVERNOR ROPE CUT', RD], [T.nothing, 48.38, 'NOT TRIGGERED', RD], [57.1, 57.6, 'HELD', GN],
];
function chip(t) {
  const e = $('chip'); let cur = null;
  for (const c of CHIPS) if (t >= c[0] && t < c[1]) cur = c;
  if (!cur) { e.style.display = 'none'; return; }
  const p = popIn(t, cur[0], cur[1], 0.25);
  if (e._k !== cur[2]) { e._k = cur[2]; e.textContent = cur[2]; e.style.borderColor = rgba(cur[3], 1, 0.7); e.style.color = rgba(cur[3], 1.15); e.style.boxShadow = `0 10px 30px rgba(0,0,0,0.6), 0 0 18px ${rgba(cur[3], 1, 0.25)}`; }
  vis(e, p.a, `translate(-50%, ${p.y}px) scale(${p.s})`); e.style.display = p.a > 0.001 ? 'block' : 'none';
}
function gauge(t) {
  const a = window01(t, 23.3, 25.7, 0.2); if (a <= 0.01) return;
  const v = clamp(Math.abs(carV(t)) / 110), cx = 270, cy = 200, R = 50;
  g.save(); g.globalAlpha = a; g.lineCap = 'round';
  g.fillStyle = 'rgba(10,11,13,0.9)'; g.beginPath(); g.roundRect(cx - 76, cy - 72, 152, 94, 12); g.fill();
  g.strokeStyle = rgba(O, 1, 0.4); g.lineWidth = 1; g.stroke();
  g.lineWidth = 7; g.strokeStyle = 'rgba(255,255,255,0.12)'; g.beginPath(); g.arc(cx, cy, R, Math.PI, Math.PI * 1.7); g.stroke();
  g.strokeStyle = rgba(YE, 1, 0.9); g.beginPath(); g.arc(cx, cy, R, Math.PI * 1.7, Math.PI * 2); g.stroke();
  const an = Math.PI + Math.PI * v, col = v > 0.7 ? YE : O;
  glow(rgba(col), 10); g.strokeStyle = rgba(col, 1.1); g.lineWidth = 3; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(an) * (R - 8), cy + Math.sin(an) * (R - 8)); g.stroke(); noGlow();
  g.fillStyle = rgba(col, 1.1); g.beginPath(); g.arc(cx, cy, 4, 0, Math.PI * 2); g.fill();
  g.font = '800 11px Mono'; g.textAlign = 'center'; g.fillStyle = v > 0.7 ? rgba(YE, 1.1) : '#b9b0a6'; g.fillText(v > 0.7 ? 'TOO FAST' : 'SPEED', cx, cy + 14);
  g.restore();
}
function counter(t) {
  const e = $('ctr'), a = window01(t, T.fell, 50.75, 0.15);
  e.style.display = a > 0.01 ? 'block' : 'none'; e.style.opacity = a;
  const n = Math.round(75 * ep(t, T.fell, 50.7, ease.inOut));
  $('ctrn').textContent = String(n).padStart(2, '0');
}
function bcard(t) {
  const e = $('bcard'), a = window01(t, T.betty - 0.05, 52.55, 0.25);
  e.style.display = a > 0.01 ? 'block' : 'none'; e.style.opacity = a;
  const html = t < T.survived ? '<div class="k">OPERATOR</div>Betty Lou Oliver' : '<div class="k">OPERATOR</div>Betty Lou Oliver<br><i>survived.</i>';
  if (e._h !== html) { e._h = html; e.innerHTML = html; }
  e.style.transform = `translateY(${(1 - ep(t, T.betty - 0.05, T.betty + 0.4, ease.out)) * 10}px)`;
}
const TAP = 58.4;
function endCard(t) {
  const e = $('endc'), p = popIn(t, T.follow2 - 0.05, DURATION + 1, 0.3);
  vis(e, p.a, `translateY(${p.y}px) scale(${p.s})`); e.style.display = p.a > 0.001 ? 'block' : 'none';
  const fb = $('fb'), done = t > TAP;
  if (fb._d !== done) { fb._d = done; fb.textContent = done ? 'Following ✓' : 'Follow'; fb.style.background = done ? '#2a2521' : ''; fb.style.color = done ? '#F2EEE8' : ''; }
  fb.style.transform = `scale(${1 - 0.08 * window01(t, TAP - 0.08, TAP + 0.1, 0.06)})`;

/* ---------------- captions: one plain line, a few key words coloured; nothing before 10 s */
const HL = { spring: '#FFB070', catches: '#FF852E', straightened: '#FF852E', teeth: '#FF852E', fired: '#FF852E', brake: '#FF852E', 'fail-safe': '#66E3A0',
  thin: '#FF852E', governor: '#FFD050', fast: '#FFD050', lock: '#FFD050', lever: '#FF852E', wedges: '#FF852E', doorstop: '#FFB070', friction: '#FF852E',
  cut: '#FF4545', bomber: '#FF4545', nothing: '#FF4545', triggered: '#FF4545', fell: '#FF4545', survived: '#66E3A0', sensor: '#FFD050', electronics: '#FFD050', follow: '#FF852E' };
const CAP_FROM = 10.0;
const CHUNKS = [];
(() => {
  const ws = CAPW.map(([s, a, b]) => ({ s, a, b }));
  const WEAK = new Set(['a', 'an', 'the', 'are', 'on', 'in', 'it', 'and', 'at', 'is', 'of', 'to', 'for', 'with', 'by', 'its', 'has', 'that', 'so', 'but']);
  let cur = [];
  const flushC = () => {
    if (!cur.length) return;
    const carry = [];
    while (carry.length < 2 && cur.length >= 2 && !/[.,?:!]$/.test(cur[cur.length - 1].s) && WEAK.has(cur[cur.length - 1].s.toLowerCase())) carry.unshift(cur.pop());
    CHUNKS.push(cur); cur = carry;
  };
  ws.forEach((w) => {
    const prev = cur[cur.length - 1];
    const len = cur.reduce((n, x) => n + x.s.length + 1, 0);
    if (prev && (/[.?:!]$/.test(prev.s) || (/,$/.test(prev.s) && cur.length >= 3) || cur.length >= 4 || len + w.s.length > 24 || w.a - prev.b > 0.6)) flushC();
    cur.push(w);
  });
  flushC();
  for (let i = CHUNKS.length - 1; i > 0; i--) {
    const c = CHUNKS[i], p = CHUNKS[i - 1], len = [...p, ...c].reduce((n, x) => n + x.s.length + 1, 0);
    if (c.length <= 2 && p.length + c.length <= 5 && !/[.?!]$/.test(p[p.length - 1].s) && len <= 30) { p.push(...c); CHUNKS.splice(i, 1); }
  }
})();
CHUNKS.forEach((c, ci) => {
  const bx = div($('cap'), 'box'); c.box = bx;
  c.els = c.map((w) => {
    const s = document.createElement('span'); s.className = 'w';
    s.textContent = w.s.replace(/[.,:;]+$/, '');
    const col = HL[w.s.toLowerCase().replace(/[.,?:!]/g, '')];
    if (col) s.style.color = col;
    bx.appendChild(s); return s;
  });
  c.t0 = c[0].a - 0.04; c.t1 = CHUNKS[ci + 1] ? Math.min(CHUNKS[ci + 1][0].a - 0.04, c[c.length - 1].b + 0.9) : DURATION;
});
function caps(t) {
  for (const c of CHUNKS) {
    const on = t >= CAP_FROM && t >= c.t0 && t < c.t1;
    c.box.style.display = on ? 'flex' : 'none';
    if (!on) continue;
    c.els.forEach((s, i) => { s.style.opacity = t < CAP_FROM + 0.05 ? 1 : prog(t, c[i].a - 0.04, c[i].a + 0.06); });
  }
}
function slam(id, t, a, b) {
  const e = $(id), on = t > a && t < b;
  e.style.display = on ? 'block' : 'none';
  if (!on) return;
  const i = ease.outExpo(prog(t, a, a + 0.16)), o = ep(t, b - 0.25, b, ease.in);
  e.style.opacity = Math.min(1, prog(t, a, a + 0.06)) * (1 - o);
  e.style.transform = `scale(${lerp(1.18, 1, i)}) translateY(${o * -10}px)`;
  const ec = (t - a) < 0.12 ? 5 : 0;
  e.querySelector('.t').style.textShadow = ec ? `${ec}px 0 rgba(255,133,46,0.55), ${-ec}px 0 rgba(102,227,160,0.55)` : 'none';
}

/* ---------------- background */
function bg(t) {
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.fillStyle = '#080A0D'; g.fillRect(0, 0, 540, 960);
  g.save(); g.globalCompositeOperation = 'lighter';
  const rg = g.createRadialGradient(270, 420, 0, 270, 420, 460); rg.addColorStop(0, 'rgba(255,133,46,0.06)'); rg.addColorStop(1, 'rgba(255,133,46,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 540, 960);
  const vz = Math.abs(carV(t)) * 0.4;
  for (let i = 0; i < 50; i++) { const x = (rnd(i, 9) * 540 + t * (3 + rnd(i, 3) * 6)) % 540, y = (rnd(i, 8) * 960 - t * (3 + rnd(i, 2) * 6) - carZ(t) * 0.25 * (0.4 + rnd(i, 4)) + 96000) % 960; g.fillStyle = `rgba(255,200,160,${0.04 + rnd(i, 7) * 0.1})`; g.fillRect(x, y, 1.2, 1.2 + Math.min(14, vz * 0.05)); }
  g.restore();
}

/* ---------------- render */
window.ready = async () => { $('grain').style.background = `url(${grainURL(256, 0.06, 5)})`; await Promise.all([...document.fonts].map((f) => f.load().catch(() => {}))); };
window.render = function (tr) {
  const t = toRef(tr);
  t_ = t;
  camAt2(t);
  bg(t);
  g.setTransform(2, 0, 0, 2, 0, 0);
  const used = new Set();
  const Lc = (k, txt, wp, dx, dy, a, b, col = '#FF852E') => { used.add(k); callout(k, txt, wp, dx, dy, window01(t, a, b, 0.15), col); };
  const E = eraOf(t), z0 = carZ(t);

  if (t >= DS[0] && t < DS[1]) {
    doorstop(t);
  } else {
    const h = E === 1 ? ep(t, 4.6, 5.8) : E === 2 ? 1 - ep(t, 18.84, 19.7) : 0, m = 1 - h;
    const secOp = clamp((-cam.a - 1.05) / 0.25);
    const inB = E === 3;
    // shaft
    rails(z0, m, 'steel'); rails(z0, h, 'wood');
    shaftMarks(z0, inB ? 0.8 : m, inB ? 40 : 180, inB ? O : ST);
    if (inB) building(t, clamp((2.4 - cam.s) / 0.8));
    // car
    const pan = E === 0 ? 0.85 : E === 1 ? 0.5 * (1 - h) : E === 2 ? 0.45 + 0.4 * (1 - m) * 0 : E === 3 ? 0.85 : 0.6;
    car(z0, { pan: pan * m });
    otis(t, z0, h);
    housings(z0, t, m);
    section({ o: [48, 0, z0], u: [0, 1, 0], v: [0, 0, 1] }, 1, lift(t), squeeze(t), secOp * m, held(t), t);
    // governor + lever
    const gop = E === 4 ? 1 - ep(t, T.remove, T.remove + 0.7) : 1;
    const go = { swing: E === 2 ? ep(t, T.weights, T.outward, ease.out) : E === 0 ? ep(t, 2.2, 2.5) : 0, grip: E === 2 ? ep(t, T.lock, T.lock + 0.12) : E === 0 ? ep(t, 2.5, 2.6) : 0, shift: E === 4 ? 40 * ep(t, T.remove, T.remove + 0.7, ease.in) : 0 };
    if (E === 2 && t > T.cut) Object.assign(go, { cutT: T.cut, cutZ: carZ(T.cut) + 150 });
    if (E === 3 && t > T.govrope) Object.assign(go, { cutT: T.govrope, cutZ: 150, fall: t > 48.6 });
    governor(t, z0, m * gop, go);
    lever(t, z0, m * (E === 4 ? 0 : 1), 'gov');
    if (E === 4) { lever(t, z0, ep(t, T.sensor, T.sensor + 0.3), 'elec'); electronic(t, z0, 1); }
    // lifting ropes
    if (E === 0) liftRopes(t, z0, 1, T.snap, 155, true);
    else if (E === 3) { liftRopes(t, z0, 1, T.cut2, 145, false); debris(t, z0, 1); }
    else liftRopes(t, z0, m, null);
    // callouts
    if (E === 1) Lc('catch', 'CATCH', [33, 0, z0 + 86], 46, -70, T.catches2, T.rails2 + 0.3);
    if (E === 2) {
      Lc('grope', 'GOVERNOR ROPE', [GX - GR, GY, z0 + 110], 50, -50, T.thin, 20.8);
      Lc('gov', 'GOVERNOR', [GX - GR, GY, GTOP + 4], -70, -70, T.wheel, 23.0);
    }
    if (E === 3) Lc('car6', 'CAR 6', [-30, -30, z0 + 80], -60, -50, T.car6, 44.5, '#FFB070');
    if (E === 4) Lc('sens', 'SPEED SENSOR', [37, -12, z0 + 54], 60, -60, T.sensor, 55.4, '#FFD050');
  }
  flush();
  for (const k in LB) if (!used.has(k)) { LB[k].style.display = 'none'; if (LN[k]) LN[k].style.display = 'none'; }
  gauge(t);
  chip(t); counter(t); bcard(t); endCard(t);
  caps(tr); // CAPW is on the current voice's clock
  slam('slFS', t, T.failsafe - 0.02, 18.8);
  $('dim').style.opacity = t > 50.3 && t < T.newer ? 0.86 * ep(t, 50.3, 51.0) : 0;
  let fl = 0;
  for (const [t0, a] of [[T.snap, 0.14], [T.grabs, 0.2], [12.0, 0.15], [T.failsafe, 0.1], [T.lock, 0.1], [30.8, 0.1], [T.cut, 0.12], [T.hit, 0.18], [T.cut2, 0.14], [T.fell, 0.14], [T.newer, 0.08], [56.6, 0.12]]) { const dt = t - t0; if (dt > 0 && dt < 0.5) fl = Math.max(fl, a * Math.exp(-dt * 9)); }
  $('flash').style.opacity = fl;
  $('stage').style.opacity = 1 - ep(tr, DURATION - 0.35, DURATION) * 0.85;
};
