<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 03 Idempotency, remade in the 21 ember style. World: your phone (the app, PAY $50) at the front left, the payment
     server in the middle with a running "charged" total, and a key store at the back right that appears with the fix.
     Story: a reply gets lost, the retry charges again ($100); then with a unique number per payment, the server saves
     number + result, sees the retry's number and sends back the saved answer ($50 stays $50). Elevator analogy = the
     same tap repeated. Beats come from voice/words.json via at(). Shared pieces live in ../_ember/. -->
<link rel="stylesheet" href="../_ember/fonts.css">
<link rel="stylesheet" href="../_ember/reel.css">
</head>
<body>
<div id="stage">
  <div id="world">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div class="layer" id="lbls"></div>
  </div>
</div>
<script src="../../tools/lib.js"></script>
<script src="voice/words.js"></script>
<script src="../_ember/three.js"></script>
<script src="../_ember/world.js"></script>
<script src="../_ember/base.js"></script>
<script>
for (let i = 0; i < 12; i++) ORBS.push({ core: orbSprite(9), glow: orbSprite(34), trail: [0, 1, 2, 3, 4].map(() => orbSprite(10)) });

/* ---------------- beats */
const T = {
  sends: at('tapped'), twice: at('twice'), double: at('charged'), heres: at("here's"),
  charges: at('charges'), lost: at('lost'), tries: at('tries'), charge2: at('charge'), again2: at('again', 2),
  fix: at('fix'), once: at('once'), labels: at('labels'), unique: at('unique'), same3: at('same', 3), every: at('every'),
  server2: at('server', 2), saves: at('saves'), result: at('result'), seen: at('seen'), before: at('before'),
  sends3: at('sends', 2), saved: at('saved'), no: at('no'),
  like: at('like'), pressing: at('pressing'), elevator: at('elevator'), already: at('already'), still: at('still'), asking: at('asking'), pickup: at('pickup'),
  stripe: at('stripe'), duplicate: at('duplicate'), ifv: at('if'), follow: at('follow'),
};
const CUT = { DANGER: T.heres - 0.2, FIX: T.fix - 0.2, KEY: T.labels - 0.3, SAVE: T.server2 - 0.45, SEEN: T.seen - 0.35, ELEV: T.like - 0.2, TOOLS: T.stripe - 0.3, END: T.ifv - 0.15 };

/* ---------------- layout */
const PH = [-120, -150], SRV = [20, 40], KS = [175, 195];
const MID = [(PH[0] + SRV[0]) / 2 - 10, (PH[1] + SRV[1]) / 2, 40];
const KEY = 'a7f3';

/* ---------------- camera */
const WIDE = { f: [20, 0, 30], s: 0.84, a: -0.42, e: 0.62, sy: 620 };
const SHOTS = [
  { t: 0, d: 0, f: [-80, -60, 40], s: 1.1, a: -0.38, e: 0.52, sy: 580 },
  { t: CUT.DANGER, d: 1.0, f: [-60, -40, 30], s: 0.98, a: -0.42, e: 0.58, sy: 620 },
  { t: CUT.FIX, d: 1.0, ...WIDE },
  { t: CUT.KEY, d: 1.0, f: [-70, -70, 30], s: 1.0, a: -0.42, e: 0.58, sy: 620 },
  { t: CUT.SAVE, d: 1.0, f: [25, 30, 30], s: 0.8, a: -0.42, e: 0.58, sy: 620 },
  { t: CUT.SEEN, d: 1.0, ...WIDE },
  { t: CUT.ELEV, d: 0.9, f: [-230, 120, 60], s: 1.25, a: -0.42, e: 0.58, sy: 520 },
  { t: CUT.TOOLS, d: 1.0, ...WIDE, s: 0.8, sy: 600 },
  { t: CUT.END, d: 2.0, ...WIDE, s: 0.78, sy: 620 },
];
const KICKS = [[T.twice, 0.03], [T.double, 0.04], [T.charges, 0.04], [T.lost, 0.05], [T.charge2, 0.06], [T.fix, 0.04], [T.unique, 0.03],
  [T.saves, 0.03], [T.seen, 0.03], [T.saved, 0.04], [T.no, 0.05], [T.elevator, 0.03], [T.pickup, 0.03], [T.stripe, 0.03]];
const SHAKES = [[T.charge2, 3, 0.3]];

/* ---------------- money: what the server has charged so far. The fix starts the story over at $0. */
const CHARGES_A = [T.charges + 0.05, T.charge2];
const C_KEYED = T.server2;
const charged = (t) => (t < T.fix ? 50 * CHARGES_A.filter((c) => c <= t).length : t >= C_KEYED ? 50 : 0);
const TAPS = [T.pressing, T.elevator, T.already, T.still, T.asking];
const EL = [-270, 150];

/* ---------------- build the world */
const srv = emberBox(SRV[0], SRV[1], 130, 70, 96, O);
const srvF = decal(130, 96, 'front', 5, srv.g); srvF.m.position.set(0, -35.3, 48);
const poolS = pool(SRV[0], SRV[1], 170, O);
const ph = emberBox(PH[0], PH[1], 68, 14, 122, O);
const phF = decal(64, 116, 'front', 6, ph.g); phF.m.position.set(0, -7.3, 61);
const poolP = pool(PH[0], PH[1], 110, O);
const ks = emberBox(KS[0], KS[1], 130, 60, 72, AMB);
const ksF = decal(130, 72, 'front', 5, ks.g); ksF.m.position.set(0, -30.3, 36);
const poolK = pool(KS[0], KS[1], 140, AMB);
const P_IN = [PH[0] + 26, PH[1] + 8, 60], S_IN = [SRV[0] - 30, SRV[1] - 36, 45], S_OUT = [SRV[0] + 50, SRV[1] + 10, 45], K_IN = [KS[0] - 50, KS[1] - 30, 40];
const rPS = road([[P_IN[0], P_IN[1], 0], [S_IN[0], S_IN[1], 0]], O);
const rSK = road([[S_OUT[0], S_OUT[1], 0], [K_IN[0], K_IN[1], 0]], AMB);

/* ---------------- canvas faces */
const label = (g, W_, H_, txt, col, size, y = H_ / 2) => { g.fillStyle = col; g.font = `800 ${size}px Mono`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = col; g.shadowBlur = 12; g.fillText(txt, W_ / 2, y); g.shadowBlur = 0; g.textAlign = 'left'; };
function srvDraw(g, W_, H_, col, t) {
  label(g, W_, H_, 'PAYMENTS', col, 52, H_ * 0.2);
  label(g, W_, H_, 'CHARGED', col + 'aa', 34, H_ * 0.45);
  const c = charged(t), cc = c > 50 ? RED : c === 50 && t > T.fix ? OK : col;
  label(g, W_, H_, `$${c}`, cc, 120, H_ * 0.72);
}
function phoneDraw(g, W_, H_, col, t, tapA) {
  g.strokeStyle = col; g.lineWidth = 6; rrect(g, 14, 14, W_ - 28, H_ - 28, 26); g.stroke();
  // weak Wi-Fi: 1 of 3 arcs lit
  for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(W_ / 2, H_ * 0.2, 16 + k * 18, Math.PI * 1.25, Math.PI * 1.75); g.strokeStyle = k === 0 ? AMB : col + '33'; g.lineWidth = 7; g.stroke(); }
  g.fillStyle = mixHex('#1a1410', col, 0.25 + 0.75 * tapA); rrect(g, 44, H_ * 0.42, W_ - 88, 92, 18); g.fill();
  g.strokeStyle = col; g.lineWidth = 5; rrect(g, 44, H_ * 0.42, W_ - 88, 92, 18); g.stroke();
  label(g, W_, H_, 'PAY $50', tapA > 0.5 ? '#140d08' : col, 40, H_ * 0.42 + 46);
  if (t > T.unique) label(g, W_, H_, `#${KEY}`, AMB, 40, H_ * 0.8);
}
function ksDraw(g, W_, H_, col, t) {
  label(g, W_, H_, 'SAVED NUMBERS', col, 30, H_ * 0.2);
  g.strokeStyle = col + '66'; g.lineWidth = 3; g.beginPath(); g.moveTo(40, H_ * 0.34); g.lineTo(W_ - 40, H_ * 0.34); g.stroke();
  if (t > T.saves + 0.35) {
    const hot = pulse(t, T.seen + 0.3, 3);
    g.fillStyle = mixHex('#1a1410', AMB, 0.15 + 0.6 * hot); rrect(g, 34, H_ * 0.44, W_ - 68, 90, 14); g.fill();
    label(g, W_, H_, `#${KEY} → $50 OK`, hot > 0.2 ? '#fff' : col, 44, H_ * 0.44 + 45);
  } else label(g, W_, H_, '—', col + '66', 50, H_ * 0.6);
}

/* ---------------- the world, frame by frame */
function world(t) {
  const thru = (pts, t0, dur, col, size = 1) => { const q = (t - t0) / dur; if (q > -0.02 && q < 1.1) orb(pts, clamp(q), col, clamp(q / 0.08) * (1 - clamp((q - 1) / 0.1)), size); };
  const req = (t0, col) => thru([P_IN, S_IN], t0, 0.45, col, 0.9);
  const reply = (t0, col) => thru([S_IN, P_IN], t0, 0.45, col, 0.9);
  const lostReply = (t0) => { thru([S_IN, MID], t0, 0.35, O2, 0.9); sparks(t, t0 + 0.35, MID[0], MID[1], MID[2], RED, 18, 60 + Math.round(t0), 120, 0.6); ripple(t, t0 + 0.35, MID[0], MID[1], 2, RED, 70, 0.6); };
  // server
  const sq = ease.back(prog(t, 0.05, 0.4));
  const c = charged(t), bad = c > 50 && t < T.fix;
  const sCol = bad ? mixHex(O, RED, 0.5 + 0.5 * Math.sin(t * 12)) : t > T.no - 0.1 && t < CUT.END ? mixHex(O, OK, 0.6) : O;
  srv.g.visible = sq > 0.01; srv.g.scale.set(1, 1, Math.max(0.01, sq));
  srv.setLook(sCol, 1.2 + 2 * pulse(t, T.charges + 0.05) + 3 * pulse(t, T.charge2) + 2 * pulse(t, C_KEYED) + 2 * pulse(t, T.no), 1);
  srvF.m.visible = srv.g.visible; srvF.draw((g, W_, H_) => srvDraw(g, W_, H_, sCol, t));
  poolS.set(sCol, 0.5 * sq);
  ripple(t, T.charge2, SRV[0], SRV[1], 2, RED, 140, 0.8);
  ripple(t, T.no, SRV[0], SRV[1], 2, OK, 140, 0.8);
  // phone
  const pq = ease.back(prog(t, 0.15, 0.5));
  const taps = [T.sends, T.twice, T.charges - 0.5, T.tries, C_KEYED - 0.5, T.seen - 0.45, ...TAPS];
  const tapA = Math.max(0, ...taps.map((x) => pulse(t, x - 0.05, 6)));
  ph.g.visible = pq > 0.01; ph.g.scale.set(1, 1, Math.max(0.01, pq)); ph.setLook(O, 1.2 + tapA, 1);
  phF.m.visible = ph.g.visible; phF.draw((g, W_, H_) => phoneDraw(g, W_, H_, O, t, tapA));
  poolP.set(O, 0.4 * pq);
  rPS.set(ep(t, 0.3, 0.7), O, 0.5, t);
  // hook: the same payment goes out twice
  req(T.sends, O2); req(T.twice, O2);
  sparks(t, T.double, S_IN[0], S_IN[1], S_IN[2], RED, 10, 5, 80, 0.5);
  // the danger: charge, reply lost, retry, second charge
  req(T.charges - 0.5, O2);
  lostReply(T.lost - 0.35);
  req(T.tries, RED);
  sparks(t, T.charge2, SRV[0], SRV[1] - 30, 70, RED, 26, 9, 170, 0.7);
  // the fix: key store rises, keyed request, save, lost reply, retry with the same number, saved answer
  const kq = ease.back(prog(t, T.saves - 0.6, T.saves - 0.2));
  ks.g.visible = kq > 0.01; ks.g.scale.set(1, 1, Math.max(0.01, kq)); ks.setLook(AMB, 1.2 + 2 * pulse(t, T.saves + 0.35) + 2 * pulse(t, T.seen + 0.3), 1);
  ksF.m.visible = ks.g.visible; ksF.draw((g, W_, H_) => ksDraw(g, W_, H_, AMB, t));
  poolK.set(AMB, 0.45 * kq);
  rSK.set(ep(t, T.saves - 0.4, T.saves), AMB, 0.55, t);
  req(C_KEYED - 0.5, AMB);
  thru([S_OUT, K_IN], T.saves, 0.35, AMB, 0.8);
  lostReply(T.result - 0.15);
  req(T.seen - 0.45, AMB);
  thru([S_OUT, K_IN], T.seen + 0.05, 0.3, AMB, 0.8);
  thru([K_IN, S_OUT], T.seen + 0.4, 0.3, OK, 0.8);
  reply(T.sends3, OK);
  ripple(t, T.sends3 + 0.45, PH[0], PH[1], 2, OK, 90, 0.7);
  // elevator: the same tap again and again, the same answer back each time
  elWorld(t);
}

function elDraw(g, W_, H_, col, t) {
  const lit = t > T.pressing, flash = Math.max(...TAPS.map((p) => pulse(t, p, 8)));
  label(g, W_, H_, 'ELEVATOR', col, 34, H_ * 0.12);
  const cx = W_ / 2, cy = H_ * 0.5, r = W_ * 0.28;
  g.lineWidth = 8; g.strokeStyle = col; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
  if (lit) { g.fillStyle = col; g.shadowColor = col; g.shadowBlur = 30 + 40 * flash; g.beginPath(); g.arc(cx, cy, r * (0.78 + 0.08 * flash), 0, Math.PI * 2); g.fill(); g.shadowBlur = 0; }
  g.fillStyle = lit ? '#1a1208' : col; g.beginPath(); g.moveTo(cx, cy - r * 0.45); g.lineTo(cx + r * 0.42, cy + r * 0.3); g.lineTo(cx - r * 0.42, cy + r * 0.3); g.closePath(); g.fill();
  label(g, W_, H_, lit ? 'LIT' : '', col, 34, H_ * 0.86);
}
const elv = emberBox(EL[0], EL[1], 100, 36, 150, AMB);
const elF = decal(100, 150, 'front', 5, elv.g); elF.m.position.set(0, -18.3, 75);
const elP = pool(EL[0], EL[1], 120, AMB);
function elWorld(t) {
  const q = ease.back(prog(t, T.like - 0.15, T.like + 0.25)) * (1 - prog(t, CUT.TOOLS, CUT.TOOLS + 0.4));
  elv.g.visible = q > 0.01; elv.g.scale.set(1, 1, Math.max(0.01, q));
  elv.setLook(AMB, 1.2 + 2.5 * Math.max(...TAPS.map((p) => pulse(t, p))), 1);
  elF.m.visible = elv.g.visible; elF.draw((g, W_, H_) => elDraw(g, W_, H_, AMB, t)); elP.set(AMB, 0.5 * q);
  TAPS.forEach((p) => ripple(t, p, EL[0], EL[1], 2, AMB, 100, 0.5));
}

/* ---------------- world tags */
function tags(t) {
  const P_T = [PH[0], PH[1], 150], S_T = [SRV[0], SRV[1], 135], K_T = [KS[0] - 45, KS[1], 100];
  tag('time', '<b>BAD WI-FI</b>', '', P_T, t, 0.2, CUT.DANGER + 0.2);
  tag('two', `<span style="color:${AMB}">SAME PAYMENT · SENT TWICE</span>`, `border-color:${AMB}88`, P_T, t, T.twice + 0.2, CUT.DANGER + 0.2, 34);
  tag('dbl', `<span style="color:${RED}">DOUBLE CHARGE?</span>`, `border-color:${RED}88`, S_T, t, T.double, CUT.DANGER + 0.2);
  tag('chg1', `<span style="color:${O2}">CHARGED $50</span>`, `border-color:${O}88`, S_T, t, T.charges + 0.05, T.charge2 - 0.05);
  tag('lost', `<span style="color:${RED}">✗ REPLY LOST</span>`, `border-color:${RED}88`, [MID[0], MID[1], 70], t, T.lost, T.tries - 0.05);
  tag('retry', `<span style="color:${AMB}">NO REPLY → TRIES AGAIN</span>`, `border-color:${AMB}88`, P_T, t, T.tries, CUT.FIX + 0.2);
  tag('chg2', `<span style="color:${RED}">CHARGED TWICE · $100</span>`, `font-size:15px;padding:9px 13px;letter-spacing:1px;border-color:${RED}`, S_T, t, T.charge2, CUT.FIX + 0.2);
  tag('key', `<span style="color:${AMB}">UNIQUE NUMBER · #${KEY}</span>`, `font-size:15px;padding:9px 13px;letter-spacing:1px;border-color:${AMB}`, P_T, t, T.unique, CUT.SAVE + 0.2);
  tag('same', `<span style="color:${O2}">SAME NUMBER ON EVERY TRY</span>`, `font-size:15px;padding:9px 13px;letter-spacing:1px;border-color:${O}`, P_T, t, T.same3, CUT.SAVE + 0.2, 40);
  tag('chg3', `<span style="color:${OK}">CHARGED $50 ✓</span>`, `font-size:15px;padding:9px 13px;letter-spacing:1px;border-color:${OK}`, S_T, t, C_KEYED, T.saves + 0.3);
  tag('sv', `<span style="color:${AMB}">SAVED: #${KEY} + RESULT</span>`, `font-size:15px;padding:9px 13px;letter-spacing:1px;border-color:${AMB}`, K_T, t, T.saves + 0.35, T.seen - 0.1);
  tag('lost2', `<span style="color:${RED}">✗ REPLY LOST AGAIN</span>`, `font-size:15px;padding:9px 13px;letter-spacing:1px;border-color:${RED}`, [MID[0] - 40, MID[1] - 40, 50], t, T.result + 0.2, T.sends3);
  tag('seen', `<span style="color:${AMB}">#${KEY}? SEEN IT BEFORE</span>`, `font-size:15px;padding:9px 13px;letter-spacing:1px;border-color:${AMB}`, S_T, t, T.before, T.no - 0.05);
  tag('ans', `<span style="color:${OK}">SAVED ANSWER · 200 OK</span>`, `font-size:15px;padding:9px 13px;letter-spacing:1px;border-color:${OK}`, [MID[0] + 20, MID[1], 90], t, T.saved, CUT.ELEV + 0.2);
  tag('no2', `<span style="color:${OK}">NO SECOND CHARGE · $50</span>`, `font-size:15px;padding:9px 13px;letter-spacing:1px;border-color:${OK}`, S_T, t, T.no, CUT.ELEV + 0.3);
  tag('lit', `<span style="color:${AMB}">ALREADY LIT · SAME PICKUP</span>`, `font-size:15px;padding:9px 13px;letter-spacing:1px;border-color:${AMB}`, [EL[0], EL[1], 175], t, T.already, CUT.TOOLS + 0.2);
}

/* ---------------- reel config */
const svgST = `<svg width="46" height="46" viewBox="0 0 100 100" fill="none" stroke="#9D97FF" stroke-width="7" stroke-linecap="round"><rect x="12" y="12" width="76" height="76" rx="18"/><path d="M64 37 Q60 29 50 29 Q37 29 37 39 Q37 48 50 50 Q63 52 63 61 Q63 71 50 71 Q39 71 36 63"/></svg>`;
const REEL = {
  shots: SHOTS, kicks: KICKS, shakes: SHAKES, world, tags,
  code: [
    [CUT.DANGER + 0.1, T.fix - 0.25, 'payment', 'no number', [[0, 'SENDING', AMB], [T.charge2, 'CHARGED TWICE', RED]],
      [['POST /charge   amount=50'], ['← 200 OK', T.lost - 0.35], ['POST /charge   amount=50', T.tries - 0.05], ['total charged   $100', T.charge2]],
      [[T.charges + 0.05, 1, '✓ charged', 'run'], [T.lost, 2, '✗ lost', 'bad'], [T.charge2 - 0.1, 3, '✗ again', 'bad'], [T.again2, 4, '✗', 'bad']]],
    [T.labels - 0.15, T.like - 0.25, 'payment', `number #${KEY}`, [[0, 'WITH A NUMBER', AMB], [T.no, 'ONCE', OK]],
      [[`POST /charge   key=${KEY}`], [`saved  ${KEY} → $50 OK`, T.saves + 0.2], [`POST /charge   key=${KEY}`, T.seen - 0.45], ['← saved answer', T.sends3], ['total charged   $50', T.no - 0.05]],
      [[C_KEYED, 1, '✓ charged', 'good'], [T.saves + 0.35, 2, 'saved', 'amb'], [T.before, 3, 'seen it', 'amb'], [T.saved, 4, '✓ same', 'good'], [T.no, 5, '✓ once', 'good']]],
  ],
  hl: /\b(POST|key|saved|total)\b/g,
  tools: [
    { a: T.stripe - 0.1, b: CUT.END, svg: svgST, name: 'Stripe', sub: 'IDEMPOTENCY-KEY ON PAYMENT REQUESTS', top: 150 },
  ],
  slams: [
    { a: T.fix - 0.1, b: T.labels - 0.25, text: 'idempotency', sub: 'TWICE = SAME EFFECT AS ONCE', size: 62 },
  ],
  bad: ['charged', 'lost', 'again', 'double'],
  good: ['second', 'saved', 'pickup'],
  tiles: [['#', 'IDEM-<br>POTENCY'], ['⏱', 'RATE<br>LIMITING'], ['♥', 'HEALTH<br>CHECKS']],
  end: CUT.END, follow: T.follow,
  cover: { t: 'IDEMPOTENCY', at: T.charge2 + 0.4, zoom: 1, dy: 40 },
  flash: (t) => 0.1 * pulse(t, T.charge2, 7) + 0.05 * pulse(t, T.lost, 7),
};
</script>
<script src="../_ember/overlay.js"></script>
<script src="../_ember/play.js"></script>
</body>
</html>
