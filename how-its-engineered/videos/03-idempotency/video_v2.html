<style>

#chapter b { display: inline-block; width: 6px; height: 6px; background: #fff; border-radius: 1px; }

.lbl.tag.red { background: #FF453A; color: #000; }

.card .hd { font-size: 9.5px; letter-spacing: 1.6px; color: #8a8a8a; display: flex; justify-content: space-between; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 7px 9px; border-radius: 7px; margin-top: 6px; }

</style>

<body>
<div id="stage">
  <div id="world">
    <div id="vignette"></div>
    <svg class="full" id="scene" width="540" height="960" viewBox="0 0 540 960"></svg>
    <svg class="full" id="fx" width="540" height="960" viewBox="0 0 540 960"></svg>
    <div id="labels"></div>
  </div>
  <div id="dim"></div>
  <div id="ui"></div>
  <div id="title"></div>
  <div id="flash"></div>
  <div id="chapter"><b></b><span></span></div>
  <div id="handle">
    <svg width="17" height="17" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4.6" fill="none" stroke="#fff" stroke-width="2"/><circle cx="17.6" cy="6.4" r="1.3" fill="#fff"/></svg>
    <div>@HOW.ITS.ENGINEERED</div>
  </div>
  <div id="bar"><div><i></i></div><div><i></i></div><div><i></i></div><div><i></i></div></div>
  <div id="caps"></div>
  <div id="grain"></div>
  <svg id="cursor" viewBox="0 0 18 24"><path d="M2 2 L2 19 L6.5 15 L9.5 22 L12.5 20.7 L9.6 14 L15.5 14 Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>
</div>
<script src="../../tools/lib.js"></script>
<script src="../../tools/iso.js"></script>
<script src="voice_puck/timings.js"></script>
<script>
const $ = (id) => document.getElementById(id);
ISO.layer = $('scene');
const FX = $('fx');
const TM = window.TIMINGS;
const ph = (li, pi = 0) => TM.find((e) => e.li === li && e.pi === pi);
const S = (li, pi = 0) => ph(li, pi).start, E = (li, pi = 0) => ph(li, pi).end;
const END = E(9, 2) + 1.6;
window.DURATION = Math.ceil(END * 30) / 30;
const RED = '#FF453A', GREEN = '#32D74B';

const caps = makeCaptions($('caps'), TM.map((e, i) => ({
  t: e.start, dur: Math.max(0.35, e.end - e.start), text: e.show,
  end: i + 1 < TM.length ? TM[i + 1].start - 0.02 : END - 0.3,
})));
$('grain').style.backgroundImage = `url(${grainURL(256, 0.07, 11)})`;

// ---------- small helpers ----------
const life = (t, a, b, fi = 0.35, fo = 0.25) => Math.max(0, Math.min(ep(t, a, a + fi), 1 - ep(t, b - fo, b)));
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const at = (A, B, k) => [lerp(A[0], B[0], k), lerp(A[1], B[1], k)];
const flipV = (F) => ({ o: add3(F.o, F.v), u: F.u, v: mul3(F.v, -1) });
function fcircle(o, F, a, b, r, opt = {}) {
  const lu = len3(F.u), lv = len3(F.v), pts = [];
  for (let i = 0; i < 28; i++) { const q = (i / 28) * Math.PI * 2; pts.push(fp(F, a + (r * Math.cos(q)) / lu, b + (r * Math.sin(q)) / lv)); }
  push(o, path2(pts), { w: 0.9, ...opt });
}
function scramble(str, p, seed = 1) {
  const H = '0123456789ABCDEF'; let out = '';
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (c === '-' || c === ' ' || c === ':') { out += c; continue; }
    const settle = (i / str.length) * 0.75;
    if (p >= settle + 0.25) out += c;
    else out += H[Math.floor(hash(i * 7.3 + Math.floor(p * 40) * 3.1 + seed) * 16)];
  }
  return out;
}
const fx = (tag, attrs) => el(tag, attrs, FX);
const labels = $('labels');
function label(text, x, y, op, cls = '', extra = '') {
  if (op <= 0.01) return;
  const d = document.createElement('div');
  d.className = 'lbl ' + cls; d.innerHTML = text;
  d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.opacity = Math.min(1, op);
  if (extra) d.style.cssText += extra;
  labels.appendChild(d);
}
// card with pop-in (back ease + blur) and fade-out
function card(a, style, inner, cls = 'card') {
  if (a <= 0.001) return '';
  const e = ease.back(clamp(a)), o = clamp(a * 1.5);
  return `<div class="${cls}" style="${style};opacity:${o};transform:translateY(${(1 - e) * 18}px) scale(${lerp(0.92, 1, e)});filter:blur(${(1 - clamp(a * 1.3)) * 6}px)">${inner}</div>`;
}
// ripple ring at screen point
function ripple(t, t0, p, col = '#fff', R = 34) {
  const k = prog(t, t0, t0 + 0.55);
  if (k <= 0 || k >= 1) return;
  fx('circle', { cx: p[0], cy: p[1], r: 4 + ease.out(k) * R, fill: 'none', stroke: col, 'stroke-width': 1.6 * (1 - k) + 0.3, 'stroke-opacity': 1 - k });
}
// iso ground ring at world point
function isoRing(t, t0, w, col = '#fff', R = 90, dur = 0.8) {
  const k = prog(t, t0, t0 + dur);
  if (k <= 0 || k >= 1) return;
  const r = 10 + ease.out(k) * R, pts = [];
  for (let i = 0; i <= 40; i++) { const q = (i / 40) * Math.PI * 2; pts.push(P(w[0] + r * Math.cos(q), w[1] + r * Math.sin(q), w[2] || 0)); }
  fx('path', { d: path2(pts), fill: 'none', stroke: col, 'stroke-width': 1.4, 'stroke-opacity': (1 - k) * 0.9 });
}
// floating text that rises and fades
function pop(t, t0, p, text, cls = 'big', dur = 1.1) {
  const k = prog(t, t0, t0 + dur);
  if (k <= 0 || k >= 1) return;
  label(text, p[0], p[1] - ease.out(k) * 34, Math.min(ep(t, t0, t0 + 0.12), 1 - prog(k, 0.6, 1)), cls, `transform:translate(-50%,-50%) scale(${lerp(1.35, 1, ease.out(clamp(k * 4)))})`);
}
function shards(t, t0, p, col = RED) {
  const k = prog(t, t0, t0 + 0.7);
  if (k <= 0 || k >= 1) return;
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2 + hash(i) * 0.6, d = 6 + ease.out(k) * (26 + hash(i + 3) * 26), L = 6 * (1 - k) + 2;
    const x = p[0] + Math.cos(a) * d, y = p[1] + Math.sin(a) * d + k * k * 14;
    fx('line', { x1: x, y1: y, x2: x + Math.cos(a + 1) * L, y2: y + Math.sin(a + 1) * L, stroke: col, 'stroke-width': 1.4, 'stroke-opacity': 1 - k });
  }
}

// ---------- world ----------
const PH = [0, 170], SV = [0, -170], EL = [560, -60];
const BTN = [PH[0], PH[1] - 58 + 0.745 * 116, 12];
const EBTN = [EL[0] - 85 + 0.76 * 170, EL[1] - 26, 5 + 0.46 * 178];
const SVTOP = [SV[0], SV[1], 140];

function phoneObj(st) {
  const [cx, cy] = PH, o = Obj();
  const T = box(o, cx - 55, cy - 85, 0, 110, 170, 5);
  tileDots(o, T.top, 6, 9);
  const F = box(o, cx - 30, cy - 58, 5, 60, 116, 7), Sc = F.top;
  fpoly(o, Sc, 0.08, 0.05, 0.84, 0.9, { fill: 'none' });
  fline(o, Sc, 0.38, 0.1, 0.62, 0.1, { w: 1.2 });
  ftext(o, Sc, 0.5, 0.2, 'Coffee Shop', 5.5, { weight: 500, op: 0.7 });
  const m = st.mode || 'pay', press = st.press || 0;
  if (m === 'pay') {
    ftext(o, Sc, 0.5, 0.33, '$50.00', 13, { weight: 800 });
    if (st.id) ftext(o, Sc, 0.5, 0.47, st.id, 4.4, { font: 'Mono', weight: 500, fill: GREEN });
    else { fline(o, Sc, 0.22, 0.46, 0.78, 0.46, { op: 0.5 }); fline(o, Sc, 0.22, 0.53, 0.62, 0.53, { op: 0.5 }); }
    fpoly(o, Sc, 0.16, 0.68, 0.68, 0.13, { fill: press > 0.02 ? '#fff' : 'none', fillOp: press, w: 1 });
    ftext(o, Sc, 0.5, 0.745, 'PAY $50', 6.6, { fill: press > 0.5 ? '#000' : '#fff', weight: 800, ls: 0.4 });
  } else if (m === 'spin') {
    ftext(o, Sc, 0.5, 0.33, '$50.00', 13, { weight: 800, op: 0.45 });
    for (let k = 0; k < 10; k++) {
      const a = (k / 10) * Math.PI * 2, lit = ((k - st.t * 14) % 10 + 10) % 10 / 10;
      fdot(o, Sc, 0.5 + (9 * Math.cos(a)) / 60, 0.58 + (9 * Math.sin(a)) / 116, 1.15, { fillOp: 0.15 + 0.85 * lit });
    }
    ftext(o, Sc, 0.5, 0.78, st.slow ? 'Waiting for network…' : 'Processing…', 4.6, { weight: 500, op: 0.8 });
  } else if (m === 'timeout') {
    ftext(o, Sc, 0.5, 0.33, '$50.00', 13, { weight: 800, op: 0.4 });
    ftext(o, Sc, 0.5, 0.5, 'Request timed out', 5, { weight: 700, fill: RED });
    fpoly(o, Sc, 0.16, 0.68, 0.68, 0.13, { fill: press > 0.02 ? '#fff' : 'none', fillOp: press, w: 1 });
    ftext(o, Sc, 0.5, 0.745, 'TRY AGAIN', 6.2, { fill: press > 0.5 ? '#000' : '#fff', weight: 800, ls: 0.4 });
  } else if (m === 'done') {
    fcircle(o, Sc, 0.5, 0.42, 11, { stroke: GREEN, fill: 'none', w: 1.4 });
    fline(o, Sc, 0.42, 0.43, 0.48, 0.47, { stroke: GREEN, w: 1.6 });
    fline(o, Sc, 0.48, 0.47, 0.6, 0.37, { stroke: GREEN, w: 1.6 });
    ftext(o, Sc, 0.5, 0.64, 'Paid · $50.00', 6, { weight: 800, fill: GREEN });
    ftext(o, Sc, 0.5, 0.76, st.note || 'charged once', 4.6, { weight: 500, op: 0.75 });
  }
  if (F.px) { fline(o, F.px, 0.25, 0.5, 0.4, 0.5, { w: 1.1 }); fline(o, F.px, 0.5, 0.5, 0.58, 0.5, { w: 1.1 }); }
  return o;
}
function serverObj(t, flash = 0, col = '#fff') {
  const [cx, cy] = SV, o = Obj();
  const T = box(o, cx - 80, cy - 72, 0, 160, 144, 5);
  tileDots(o, T.top, 8, 7);
  const racks = [rack(o, cx - 68, cy - 60, 5, 58, 52, 132), rack(o, cx - 6, cy - 60, 5, 58, 52, 132)];
  racks.forEach((F, s) => {
    if (!F.py) return;
    for (let k = 0; k < 12; k++) {
      const blink = Math.sin(t * (5 + s) + k * 1.9 + s * 2.3) > 0.35 ? 1 : 0;
      const v = Math.max(blink * 0.5, flash * (0.5 + 0.5 * Math.sin(t * 40 + k)));
      if (v > 0.05) fdot(o, F.py, 0.8, 0.06 + k * 0.074 + 0.036, 1.7, { fill: flash > 0.05 ? col : '#fff', fillOp: v });
    }
  });
  return o;
}
function elevatorObj(open, lit, flash, floor) {
  const [cx, cy] = EL, o = Obj();
  const T = box(o, cx - 95, cy - 50, 0, 190, 110, 5);
  tileDots(o, T.top, 9, 5);
  const F = box(o, cx - 85, cy - 42, 5, 170, 16, 178);
  const W = F.py, Wd = flipV(W);
  fpoly(o, W, 0.1, 0, 0.54, 0.82, { fill: 'none', w: 1 });
  if (open > 0.01) {
    const half = 0.25 * open;
    fpoly(o, W, 0.37 - half, 0.005, 2 * half, 0.8, { fill: '#fff', fillOp: 0.22 * open, stroke: 'none' });
    for (let k = 1; k < 6; k++) fline(o, W, 0.37 - half + (2 * half * k) / 6, 0.02, 0.37 - half + (2 * half * k) / 6, 0.78, { op: 0.25 * open, w: 0.5 });
  }
  const dw = 0.25 * (1 - open);
  if (dw > 0.004) {
    fpoly(o, W, 0.12, 0.005, dw, 0.8, { fill: '#000', w: 0.9 });
    fpoly(o, W, 0.62 - dw, 0.005, dw, 0.8, { fill: '#000', w: 0.9 });
    fline(o, W, 0.12 + dw * 0.5, 0.25, 0.12 + dw * 0.5, 0.55, { op: 0.4, w: 0.5 });
    fline(o, W, 0.62 - dw * 0.5, 0.25, 0.62 - dw * 0.5, 0.55, { op: 0.4, w: 0.5 });
  }
  fpoly(o, W, 0.29, 0.86, 0.16, 0.08, { fill: 'none', w: 0.8 });
  ftext(o, Wd, 0.37, 0.1, floor, 9, { weight: 700, fill: open > 0.05 ? GREEN : '#fff' });
  fpoly(o, W, 0.72, 0.36, 0.08, 0.2, { fill: 'none', w: 0.8 });
  fcircle(o, W, 0.76, 0.46, 4.6, { fill: lit ? '#fff' : '#000', fillOp: lit ? lerp(0.55, 1, flash) : 1, w: 1 });
  if (F.px) for (let k = 0; k < 6; k++) fline(o, F.px, 0.3, 0.15 + k * 0.13, 0.7, 0.15 + k * 0.13, { op: 0.5, w: 0.5 });
  fpoly(o, F.top, 0.05, 0.2, 0.9, 0.6, { fill: 'none', w: 0.5, op: 0.6 });
  return o;
}

// ---------- packets: [t0, dur, dir(+1 phone→server), label, kind] ----------
const FL = [];
const fly = (t0, dur, dir, text, kind = 'w') => FL.push({ t0, dur, dir, text, kind });
// simple way
fly(S(2, 1) + 0.25, 1.2, 1, 'charge $50');
fly(S(2, 3) + 0.1, 0.55, 1, ''); fly(S(2, 3) + 0.45, 0.55, 1, ''); fly(S(2, 3) + 0.8, 0.55, 1, '');
// failure
fly(S(4, 0) + 0.15, E(4, 0) - S(4, 0) + 0.25, 1, 'charge $50', 'slow');
fly(S(4, 1) + 0.05, 1.25, -1, 'OK', 'lost');
fly(S(4, 2) + 0.3, 1.5, 1, 'charge $50 · retry');
// fix
fly(S(5, 2) + 0.05, 0.95, 1, 'charge $50 · 7F3A');
fly(S(6, 0) + 0.0, 0.85, 1, 'retry · 7F3A', 'w');
fly(S(6, 3) + 0.1, 1.1, -1, 'same answer ✓', 'g');
// recap
for (let i = 0; i < 6; i++) fly(S(8, 0) + 0.1 + i * 0.24, 0.7, 1, i === 0 ? 'POST /pay · 7F3A' : '');
fly(S(8, 1) + 0.05, 0.9, -1, 'charged once ✓', 'g');
const arrivals = FL.filter((f) => f.dir === 1).map((f) => f.t0 + f.dur);

function drawPackets(t, vis) {
  for (const f of FL) {
    const k = prog(t, f.t0, f.t0 + f.dur);
    if (k <= 0 || k >= 1 && f.kind !== 'lost') continue;
    let kk = f.kind === 'slow' ? k * (0.85 + 0.15 * Math.sin(k * 20)) : ease.inOut(k), op = vis;
    if (f.kind === 'lost') { kk = ease.out(clamp(k * 1.7)) * 0.5; op *= 1 - prog(k, 0.5, 0.62); }
    const a0 = f.dir > 0 ? 0.2 : 0.8, a1 = f.dir > 0 ? 0.8 : 0.2;
    const col = f.kind === 'g' ? GREEN : f.kind === 'lost' && k > 0.35 ? RED : null;
    // motion trail
    if (f.kind !== 'slow') for (let g = 3; g >= 1; g--) {
      const kg = clamp(kk - g * 0.035); if (kg <= 0) continue;
      const q = at(PH, SV, lerp(a0, a1, kg)), o = Obj();
      const Fb = box(o, q[0] - 6, q[1] - 6, 7, 12, 12, 12, col ? { stroke: col } : {});
      emit(o, 1, op * (0.32 - g * 0.09));
    }
    if (op > 0.01) {
      const q = at(PH, SV, lerp(a0, a1, kk)), o = Obj();
      const Fb = box(o, q[0] - 6, q[1] - 6, 7, 12, 12, 12, col ? { stroke: col } : {});
      fpoly(o, Fb.top, 0.25, 0.25, 0.5, 0.5, { fill: col || '#fff', stroke: 'none' });
      emit(o, 1, op);
      if (f.text) { const lp = P(q[0], q[1], 36); label(f.text, lp[0], lp[1], op * ep(t, f.t0, f.t0 + 0.2), 'big' + (f.kind === 'g' ? ' green' : '')); }
    }
    if (f.kind === 'lost') {
      const q = at(PH, SV, 0.5), sp = P(q[0], q[1], 13);
      shards(t, f.t0 + f.dur * 0.5, sp);
    }
  }
}

// ---------- camera: [t, focus, scale, yaw, pitch°, screenY] ----------
const cut = 0.002;
const K = [
  [0, [0, 172, 12], 2.1, -0.38, 54, 600],
  [S(1, 0) - 0.05, [0, 176, 12], 2.45, -0.12, 46, 600],
  [S(2, 0) - 0.1, [0, 130, 20], 1.6, 0.3, 40, 610],
  [S(2, 0) - 0.1 + cut, [0, 0, 40], 0.84, -0.1, 35, 610],
  [S(2, 1) - 0.05, [0, 0, 40], 0.9, 0.0, 35, 610],
  [E(2, 1), [0, -60, 50], 1.05, 0.12, 30, 610],
  [S(2, 2) + 0.15, [0, -170, 72], 1.5, 0.34, 17, 590],
  [S(2, 3) - 0.1, [0, -170, 72], 1.58, 0.4, 15, 590],
  [S(2, 3) + 0.45, [0, 0, 30], 0.84, -0.1, 42, 615],

      <div style="flex:1;font-size:14px;color:${typed || posted ? '#fff' : '#8a8a8a'}">${posted ? 'Add a comment…' : typed || 'Add a comment…'}${!posted && typed && blink ? '<span style="display:inline-block;width:2px;height:16px;background:#fff;vertical-align:-3px;margin-left:1px"></span>' : ''}</div>
      <div class="btn" style="height:32px;padding:0 14px;border-radius:16px;${typed.length === txt.length && !posted ? 'background:#fff;color:#000' : 'color:#8a8a8a'}">Post</div>
    </div></div>`;
}

// ---------- chapters ----------
const CH = [[S(2, 0), S(3, 0), '01  THE SIMPLE WAY'], [S(3, 0), S(5, 0), '02  THE PROBLEM'], [S(5, 0), S(7, 0), '03  THE FIX'], [S(7, 0), S(8, 0), '04  IN REAL LIFE'], [S(8, 0), S(9, 0), '05  RECAP']];

window.render = function (t) {
  ISO.layer.textContent = ''; FX.textContent = ''; labels.textContent = '';
  camera(t);
  const cp = cursorAt(t);
  if (cp) CAM.yaw += clamp((cp[0] - 270) / 270, -1, 1) * 0.05;
  // after a hard cut everything re-draws quickly (reference style)
  const kick = Math.min(1, ...CUTS.map((c) => (t >= c && t < c + 0.45 ? lerp(0.45, 1, ep(t, c, c + 0.45)) : 1)));

  // ---- visibility of objects ----
  const L7 = S(7, 0), L8 = S(8, 0);
  const phoneD = Math.min(kick, prog(t, -0.25, 0.7));
  const servD = Math.min(kick, prog(t, S(2, 0) - 0.05, S(2, 0) + 1.0));
  const elevD = prog(t, L7 + 0.3, L7 + 1.5) * (1 - prog(t, L8 + 0.1, L8 + 0.7));
  const worldOp = 1 - 0.85 * window01(t, S(1, 0) - 0.1, S(2, 0) - 0.08, 0.3) - 0.7 * ep(t, S(9, 0), S(9, 0) + 0.5);

  // ---- phone state ----
  const pressHook = pressAmt(t, tapsHook), pressAgain = pressAmt(t, tapAgain);
  let pst = { mode: 'pay', press: pressHook, t };
  if (t >= 1.05 && t < 2.1) pst = { mode: 'spin', t };
  else if (t >= 2.1 && t < S(2, 0)) pst = { mode: 'done', t, note: 'charged once' };
  else if (t >= S(2, 1) + 0.25 && t < S(2, 2) + 0.4) pst = { mode: 'spin', t };
  else if (t >= S(2, 2) + 0.4 && t < S(3, 0)) pst = { mode: 'done', t, note: 'charged $50' };
  else if (t >= S(4, 0) + 0.15 && t < S(4, 1) + 1.0) pst = { mode: 'spin', t, slow: true };
  else if (t >= S(4, 1) + 1.0 && t < S(4, 2) + 0.3) pst = { mode: 'timeout', t };
  else if (t >= S(4, 2) + 0.3 && t < S(4, 3) + 0.2) pst = { mode: 'spin', t, slow: true };
  else if (t >= S(4, 3) + 0.2 && t < S(4, 4) + 0.2) pst = { mode: 'timeout', press: pressAgain, t };
  else if (t >= S(4, 4) + 0.2 && t < S(5, 0)) pst = { mode: 'spin', t };
  else if (t >= S(5, 1) + 0.3 && t < S(5, 2) + 0.05) pst = { mode: 'pay', t, id: scramble('ID 7F3A-91C2', prog(t, S(5, 1) + 0.35, S(5, 1) + 1.3), 5) };
  else if (t >= S(5, 2) + 0.05 && t < S(6, 3) + 1.2) pst = { mode: 'spin', t };
  else if (t >= S(6, 3) + 1.2 && t < L7 + 0.5) pst = { mode: 'done', t, note: 'same answer' };
  else if (t >= L8) pst = { mode: 'done', t, note: 'charged once' };

  // server flashes on each arrival
  let sflash = 0, scol = '#fff';
  for (const v of arrivals) sflash = Math.max(sflash, 1 - prog(t, v, v + 0.45) - (t < v ? 1 : 0));
  if (t > S(6, 0) && t < S(7, 0)) scol = GREEN;
  if (t > S(4, 0) && t < S(5, 0)) scol = RED;

  // ---- wire ----
  const pathK = Math.min(prog(t, S(2, 0) + 0.4, S(2, 0) + 1.1), phoneD, servD);
  if (pathK > 0 && worldOp > 0.05) {
    const slow = window01(t, S(4, 0), S(5, 0), 0.3);
    const a = at(PH, SV, 0.25), b = at(PH, SV, lerp(0.25, 0.75, pathK));
    const jit = slow > 0 ? (q) => [q[0] + Math.sin(t * 30) * 2 * slow, q[1]] : (q) => q;
    el('path', { d: path2([P(...jit(a), 5), P(...jit(b), 5)], false), stroke: slow > 0.5 ? RED : '#fff', 'stroke-width': 1.1, 'stroke-dasharray': '3 6', 'stroke-dashoffset': -t * lerp(26, 5, slow), 'stroke-opacity': 0.65 * worldOp, fill: 'none' }, ISO.layer);
  }
  // ---- objects (depth sorted) ----
  const objs = [];
  if (servD > 0) objs.push({ c: SV, f: () => emit(serverObj(t, sflash, scol), servD, worldOp) });
  if (phoneD > 0) objs.push({ c: PH, f: () => emit(phoneObj(pst), phoneD, worldOp) });
  if (elevD > 0) {
    const lit = t >= tapsElev[0] && t < S(7, 2) + 1.4;
    const open = ep(t, S(7, 2) + 0.3, S(7, 2) + 1.2, ease.inOut);
    const fl = Math.round(lerp(5, 1, ep(t, tapsElev[0] + 0.1, S(7, 2) + 0.25, ease.inOut)));
    objs.push({ c: EL, f: () => emit(elevatorObj(open, lit, pressAmt(t, tapsElev), lit || open > 0 ? String(fl) : '·'), elevD) });
  }
  objs.sort((a, b) => depth(...a.c) - depth(...b.c)).forEach((o) => o.f());
  if (worldOp > 0.05) drawPackets(t, worldOp);

  // ---- world-pinned fx + labels ----
  const btnP = P(...BTN), svTop = P(...SVTOP);
  tapsHook.concat(tapAgain).forEach((x) => ripple(t, x, btnP));
  tapsElev.forEach((x) => ripple(t, x, P(...EBTN), '#fff', 26));
  const nHook = tapsHook.filter((x) => t >= x).length;
  label(`×${nHook}`, btnP[0] + 52, btnP[1] - 30, (nHook > 0 ? 1 : 0) * (1 - ep(t, S(0, 1), S(0, 1) + 0.3)), 'huge', `transform:translate(-50%,-50%) scale(${1 + 0.4 * (1 - ep(t, tapsHook[nHook - 1] || 0, (tapsHook[nHook - 1] || 0) + 0.25))})`);
  // server hits
  for (const v of arrivals) {
    if (v < S(3, 0)) { pop(t, v, svTop, '−$50', 'big'); isoRing(t, v, [SV[0], SV[1], 5]); }
    else if (v < S(5, 0)) { pop(t, v, svTop, '−$50', 'big red'); isoRing(t, v, [SV[0], SV[1], 5], RED); }
    else if (v < S(6, 0)) { pop(t, v, svTop, '−$50 · saved 7F3A', 'big'); isoRing(t, v, [SV[0], SV[1], 5]); }
    else if (v < S(7, 0)) { isoRing(t, v, [SV[0], SV[1], 5], GREEN); }
    else { pop(t, v, svTop, 'seen ✓', 'big green', 0.7); isoRing(t, v, [SV[0], SV[1], 5], GREEN, 70, 0.5); }
  }
  isoRing(t, S(6, 2), [SV[0], SV[1], 5], GREEN, 130, 1.0);
  isoRing(t, S(6, 4), [PH[0], PH[1], 5], GREEN, 110, 1.0);
  // labels under objects in wide shots
  const wide = window01(t, S(2, 0) + 0.6, S(2, 2), 0.3);
  const yp = P(PH[0] + 55, PH[1] + 85, 0), sp = P(SV[0] + 80, SV[1] + 72, 0);
  label('YOUR APP', yp[0], yp[1] + 14, wide * worldOp);
  label('PAYMENT SERVER', sp[0] - 6, sp[1] + 14, wide * worldOp);
  // failure overlays
  const ws = P(PH[0] - 40, PH[1] - 40, 70);
  const bars = Math.max(1, 3 - Math.floor(prog(t, S(4, 0) + 0.2, S(4, 0) + 1.0) * 3));
  wifi(t, ws, bars, bars === 1 ? RED : '#fff', life(t, S(4, 0) - 0.05, S(4, 2), 0.25));
  const mid = P(...at(PH, SV, 0.5), 0);
  label('SLOW NETWORK', mid[0] - 92, mid[1] + 6, life(t, S(4, 0) + 0.4, S(4, 2) + 0.2), 'red');
  const lostP = P(...at(PH, SV, 0.5), 40);
  label('✕ REPLY LOST', lostP[0], lostP[1] - 10, life(t, S(4, 1) + 0.7, S(4, 2) + 0.3), 'tag red');
  retryIcon(t, P(PH[0] + 40, PH[1] - 40, 60), life(t, S(4, 2) + 0.05, S(4, 3) + 0.1, 0.2));
  label('OR', btnP[0] - 70, btnP[1] - 40, life(t, S(4, 3) + 0.1, S(4, 4), 0.2), 'tag');
  // hook ×2 → done
  label('1 charge ✓', btnP[0], btnP[1] + 46, life(t, 2.2, S(1, 0)), 'tag green');
  // fix: id tag on phone
  label('ID 7F3A-91C2', btnP[0], btnP[1] - 64, life(t, S(5, 2) - 0.2, S(6, 0)), 'tag green');
  // check: question bubble over server
  label('seen this ID?', svTop[0], svTop[1] - 34, life(t, S(6, 1), S(6, 2) + 0.1, 0.2), 'tag');
  label('YES ✓', svTop[0], svTop[1] - 34, life(t, S(6, 2), S(6, 3) + 0.4, 0.12), 'huge green', `transform:translate(-50%,-50%) scale(${1 + 0.5 * (1 - ep(t, S(6, 2), S(6, 2) + 0.3))})`);
  label('NO SECOND CHARGE', P(...SVTOP)[0], P(...SVTOP)[1] - 34, life(t, S(6, 4), S(7, 0) + 0.1), 'tag green');
  // elevator
  const eb = P(...EBTN), nE = tapsElev.filter((x) => t >= x).length;
  const lastE = tapsElev[nE - 1] || 0;
  label(`×${nE}`, eb[0] + 44, eb[1] - 18, (nE > 0 ? 1 : 0) * (1 - ep(t, S(7, 2) + 0.4, S(7, 2) + 0.7)), 'huge', `transform:translate(-50%,-50%) scale(${1 + 0.45 * (1 - ep(t, lastE, lastE + 0.2))})`);
  const door = P(EL[0] - 85 + 0.37 * 170, EL[1] - 26, 0);
  label('DING · ARRIVES ONCE', door[0], door[1] + 26, life(t, S(7, 2) + 1.0, L8 + 0.3), 'tag green');
  if (elevD > 0) isoRing(t, S(7, 2) + 1.0, [EL[0] - 85 + 0.37 * 170, EL[1] - 10, 5], GREEN, 90, 1.0);

  // ---- title scene ----
  const tp = window01(t, S(1, 0) - 0.15, S(2, 0) - 0.05, 0.3);
  torus(t, prog(t, S(1, 0) - 0.15, S(1, 1) + 0.2), prog(t, S(2, 0) - 0.4, S(2, 0) - 0.05), tp);
  if (tp > 0) {
    const word = 'Idempotency', k = prog(t, S(1, 1) - 0.05, S(1, 1) + 0.6);
    const shown = word.split('').map((c, i) => `<span style="display:inline-block;opacity:${ep(k, i / word.length * 0.7, i / word.length * 0.7 + 0.3)};transform:translateY(${(1 - ep(k, i / word.length * 0.7, i / word.length * 0.7 + 0.3, ease.back)) * 24}px);filter:blur(${(1 - ep(k, i / word.length * 0.7, i / word.length * 0.7 + 0.3)) * 8}px)">${c}</span>`).join('');
    const p2 = ep(t, S(1, 1) + 0.5, S(1, 1) + 0.8), p3 = ep(t, S(1, 1) + 0.75, S(1, 1) + 1.05, ease.back);
    $('title').innerHTML = `<div class="t">${shown}</div><div class="ph" style="opacity:${p2}">eye · dem · POH · ten · see</div><div class="chip" style="opacity:${clamp(p3)};transform:scale(${lerp(0.8, 1, p3)})">same request → same result</div>`;
    $('title').style.opacity = tp; $('title').style.display = '';
  } else $('title').style.display = 'none';

  // ---- problem: spotlight + magnifier ----
  const pr = window01(t, S(3, 0) - 0.05, S(4, 0) - 0.1, 0.3);
  if (pr > 0) {
    const k = ease.inOut(prog(t, S(3, 0), S(3, 1) + 0.6));
    const A = P(PH[0], PH[1], 20), B = P(SV[0], SV[1], 60), C = P(...at(PH, SV, 0.5), 10);
    const m = k < 0.6 ? [lerp(A[0], B[0], k / 0.6), lerp(A[1], B[1], k / 0.6)] : [lerp(B[0], C[0], (k - 0.6) / 0.4), lerp(B[1], C[1], (k - 0.6) / 0.4)];
    $('dim').style.background = `radial-gradient(circle at ${m[0]}px ${m[1]}px, rgba(0,0,0,0) 0 46px, rgba(0,0,0,${0.78 * pr}) 120px)`;
    magnifier(m, pr);
    const q = ep(t, S(3, 1) + 0.6, S(3, 1) + 0.9, ease.back);
    if (q > 0) label('?', C[0], C[1] - 4, pr * q, 'huge red', `font-size:${44 + 6 * Math.sin(t * 9)}px`);
  } else $('dim').style.background = 'none';

  // ---- HTML cards ----
  $('ui').innerHTML = notifCard(t) + codeCard(t) + chargesCounter(t) + requestsCard(t) + bankCard(t) + idCard(t) + receiptCard(t) + ledgerCard(t) + resultCard(t) + ctaSheet(t);

  // ---- flashes + shake ----
  const red = window01(t, S(4, 5), S(4, 5) + 0.5, 0.06), green = Math.max(window01(t, S(6, 2), S(6, 2) + 0.4, 0.05), window01(t, S(6, 4), S(6, 4) + 0.5, 0.06));
  $('flash').style.background = red > green ? `radial-gradient(circle at 50% 55%, rgba(255,69,58,0.32), rgba(255,69,58,0.06) 70%)` : `radial-gradient(circle at 50% 55%, rgba(50,215,75,0.25), rgba(50,215,75,0.04) 70%)`;
  $('flash').style.opacity = Math.max(red, green);
  const sh = (1 - prog(t, S(4, 5), S(4, 5) + 0.45)) * (t >= S(4, 5) ? 1 : 0) + 0.5 * (1 - prog(t, S(6, 2), S(6, 2) + 0.25)) * (t >= S(6, 2) ? 1 : 0);
  const whip = window01(t, S(5, 0) - 0.02, S(5, 0) + 0.32, 0.12);
  $('world').style.transform = `translate(${Math.sin(t * 63) * 7 * sh}px, ${Math.cos(t * 51) * 5 * sh}px) rotate(${Math.sin(t * 47) * 0.6 * sh}deg)`;
  $('world').style.filter = whip > 0.01 ? `blur(${whip * 7}px)` : 'none';

  // ---- chrome ----
  const ch = CH.find((c) => t >= c[0] && t < c[1]);
  $('chapter').style.opacity = ch ? life(t, ch[0], ch[1], 0.3, 0.2) * (Math.floor(t * 3) % 6 === 0 && t - ch[0] < 1 ? 0.4 : 1) : 0;
  if (ch) $('chapter').querySelector('span').textContent = ch[2];
  $('handle').style.opacity = ep(t, 0.4, 1.0) * (1 - ep(t, S(9, 0), S(9, 0) + 0.3)) * (1 - window01(t, S(5, 1), S(6, 0), 0.25)) * (1 - window01(t, S(0, 1), S(1, 0), 0.2));
  const Bk = [0, S(3, 0), S(5, 0), S(8, 0), END];
  document.querySelectorAll('#bar i').forEach((n, i) => { n.style.width = prog(t, Bk[i], Bk[i + 1]) * 100 + '%'; });
  $('grain').style.transform = `translate(${Math.floor(hash(Math.floor(t * 24)) * 40) - 20}px, ${Math.floor(hash(Math.floor(t * 24) + 5) * 40) - 20}px)`;

  // cursor
  const cur = $('cursor');
  if (cp) {
    const pr2 = Math.max(pressHook, pressAgain, pressAmt(t, tapsElev), pressAmt(t, tapsCTA));
    cur.style.display = ''; cur.style.transform = `translate(${cp[0] - 2}px, ${cp[1] - 2}px) scale(${1 - 0.2 * pr2})`;
  } else cur.style.display = 'none';
  tapsCTA.forEach((x, i) => ripple(t, x, i === 0 ? IN_POS : i === 1 ? POST_POS : FOLLOW_POS));

  caps.render(t);
  $('stage').style.opacity = 1 - ep(t, END - 0.35, END);
};
window.render(0);
</script>
</body>
</html>
