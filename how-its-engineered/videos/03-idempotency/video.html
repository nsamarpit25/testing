<script>
const $ = (id) => document.getElementById(id);
ISO.layer = $('scene');
const FX = $('fx');
const BG = $('bg').getContext('2d');
const WD = window.WORDS || [];
// v2 script has 11 lines; the approved one-take (v1) has 10 — remap v1 onto the v2 layout
const V2 = window.TIMINGS.some((e) => e.li === 10);
const TM = (() => {
  const T = window.TIMINGS;
  if (V2) return T;
  const o = (li, pi) => T.find((e) => e.li === li && e.pi === pi);
  const merge = (a, b, li, pi) => ({ li, pi, start: a.start, end: b.end, show: a.show + ' ' + b.show });

const RED = '#FF453A', GREEN = '#32D74B';

const SPOKEN = TM.filter((e) => !e.virtual);

// ---------- small helpers ----------
const life = (t, a, b, fi = 0.35, fo = 0.25) => Math.max(0, Math.min(ep(t, a, a + fi), 1 - ep(t, b - fo, b)));

// front half of a horizontal ring (for glowing bands on cylinders)
function frontArc(cx, cy, z, r) {

const fx = (tag, attrs, parent = FX) => el(tag, attrs, parent);
const labels = $('labels');

  d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.opacity = Math.min(1, op);

const popScale = (t, t0, k = 0.45, d = 0.3) => `transform:translate(-50%,-50%) scale(${1 + k * (1 - ep(t, t0, t0 + d))})`;

function ripple(t, t0, p, col = '#fff', R = 34) {

  fx('circle', { cx: p[0], cy: p[1], r: 4 + ease.out(k) * R, fill: 'none', stroke: col, 'stroke-width': 1.6 * (1 - k) + 0.3, 'stroke-opacity': 1 - k });

  for (let i = 0; i <= 40; i++) { const q = (i / 40) * Math.PI * 2; pts.push(P(w[0] + r * Math.cos(q), w[1] + r * Math.sin(q), w[2] || 0)); }

// sparkle burst (4-point stars)
function sparkle(t, t0, p, col = '#fff', R = 30) {
  const k = prog(t, t0, t0 + 0.6);

// ---------- world layout ----------
const PH = [0, 170], SV = [0, -170], CS = [112, 132], VT = [-122, -214], DB = [132, -268], TW = [-178, 26];
const CLOUD = [0, 0, 175], EL = [640, -60], ST = [-660, -150];

const EBTN = [EL[0] - 85 + 0.76 * 170, EL[1] - 26, 5 + 0.46 * 178];

function phoneObj(st, c = PH) {
  const [cx, cy] = c, o = Obj();
  const T = box(o, cx - 55, cy - 85, 0, 110, 170, 5);

    ftext(o, Sc, 0.5, 0.33, '$50.00', 13, { weight: 800 });

    fpoly(o, Sc, 0.16, 0.68, 0.68, 0.13, { fill: press > 0.02 ? '#fff' : 'none', fillOp: press, w: 1 });

    ftext(o, Sc, 0.5, 0.33, '$50.00', 13, { weight: 800, op: 0.45 });

      fdot(o, Sc, 0.5 + (9 * Math.cos(a)) / 60, 0.58 + (9 * Math.sin(a)) / 116, 1.15, { fillOp: 0.15 + 0.85 * lit });

    ftext(o, Sc, 0.5, 0.78, st.slow ? 'Waiting for network…' : 'Processing…', 4.6, { weight: 500, op: 0.8 });
  } else if (m === 'timeout') {
    ftext(o, Sc, 0.5, 0.33, '$50.00', 13, { weight: 800, op: 0.4 });
    ftext(o, Sc, 0.5, 0.5, 'Request timed out', 5, { weight: 700, fill: RED });
    fpoly(o, Sc, 0.16, 0.68, 0.68, 0.13, { fill: press > 0.02 ? '#fff' : 'none', fillOp: press, w: 1 });
    ftext(o, Sc, 0.5, 0.745, 'TRY AGAIN', 6.2, { fill: press > 0.5 ? '#000' : '#fff', weight: 800, ls: 0.4 });
  } else if (m === 'done') {
    fcircle(o, Sc, 0.5, 0.42, 11, { stroke: GREEN, fill: 'none', w: 1.4 });
    fline(o, Sc, 0.42, 0.43, 0.48, 0.47, { stroke: GREEN, w: 1.6 });
    fline(o, Sc, 0.48, 0.47, 0.6, 0.37, { stroke: GREEN, w: 1.6 });
    ftext(o, Sc, 0.5, 0.64, 'Paid · $50.00', 6, { weight: 800, fill: GREEN });

  tileDots(o, T.top, 8, 7);

  if (col) o.items.slice(-2).forEach((it) => (it.stroke = col));
  if (glyph) ftext(o, { o: [x - 15, y - 15, z + 5], u: [30, 0, 0], v: [0, 30, 0] }, 0.5, 0.5, '$', 13, { weight: 800, fill: col || '#fff' });

  const T = box(o, CS[0] - 26, CS[1] - 26, 0, 52, 52, 3);
  for (let i = 0; i < n; i++) coin(o, CS[0], CS[1], 3 + i * 6 + (i === n - 1 ? lift : 0), i === n - 1);

  const F = box(o, cx - 32, cy - 32, 0, 64, 64, 58);

    if (!F[k]) continue;
    fpoly(o, F[k], 0.08, 0.1, 0.84, 0.8, { fill: 'none', w: 0.7 });

    fcircle(o, F[k], 0.5, 0.5, 4, { fill: 'none', w: 0.9 });

  // ---- flashes, shake, roll, letterbox ----
  const red = window01(t, S(4, 5), S(4, 5) + 0.5, 0.06), green = Math.max(window01(t, YES, YES + 0.4, 0.05), window01(t, S(6, 3), S(6, 3) + 0.5, 0.06), window01(t, S(9, 1), S(9, 1) + 0.45, 0.05));
  const white = Math.max(bolt * 0.3, ...CH.map((c) => window01(t, c[0] - 0.04, c[0] + 0.14, 0.04) * 0.22));
  const fl = $('flash');
  if (white > Math.max(red, green)) { fl.style.background = 'radial-gradient(circle at 50% 30%, rgba(255,255,255,0.55), rgba(255,255,255,0.08) 70%)'; fl.style.opacity = white; }
  else { fl.style.background = red > green ? `radial-gradient(circle at 50% 55%, rgba(255,69,58,0.32), rgba(255,69,58,0.06) 70%)` : `radial-gradient(circle at 50% 55%, rgba(50,215,75,0.25), rgba(50,215,75,0.04) 70%)`; fl.style.opacity = Math.max(red, green); }
  const shk = (t0, a, d) => (t >= t0 ? a * (1 - prog(t, t0, t0 + d)) : 0);
  const sh = Math.max(shk(S(4, 5), 1, 0.45), shk(YES, 0.5, 0.25), shk(LOST, 0.8, 0.35), shk(S(2, 2) + 0.15, 0.25, 0.2));
  const whip = Math.max(window01(t, S(5, 0) - 0.02, S(5, 0) + 0.32, 0.12), window01(t, S(8, 0) - 0.05, S(8, 0) + 0.3, 0.12));
  $('world').style.transform = `translate(${Math.sin(t * 63) * 7 * sh}px, ${Math.cos(t * 51) * 5 * sh}px) rotate(${Math.sin(t * 47) * 0.6 * sh + roll}deg) scale(${1 + Math.abs(roll) * 0.012})`;
  $('world').style.filter = whip > 0.01 ? `blur(${whip * 7}px)` : 'none';
  const lbh = 46 * window01(t, S(4, 5) - 0.05, S(5, 0), 0.15);
  document.querySelectorAll('#lb i').forEach((n) => (n.style.height = lbh + 'px'));

  // ---- chrome ----
  const ch = CH.find((c) => t >= c[0] && t < c[1]);
  $('chapter').style.opacity = ch ? life(t, ch[0], ch[1], 0.3, 0.2) * (Math.floor(t * 3) % 6 === 0 && t - ch[0] < 1 ? 0.4 : 1) : 0;
  if (ch) $('chapter').querySelector('span').textContent = ch[2];
  $('handle').style.opacity = ep(t, 0.4, 1.0) * (1 - ep(t, S(10, 0), S(10, 0) + 0.3)) * (1 - window01(t, S(5, 1), S(6, 0), 0.25)) * (1 - window01(t, S(0, 1), S(1, 0), 0.2)) * (1 - window01(t, S(6, 0), S(6, 3), 0.2));
  document.querySelectorAll('#bar i').forEach((n, i) => { n.style.width = prog(t, BK[i], BK[i + 1]) * 100 + '%'; });
  $('grain').style.transform = `translate(${Math.floor(hash(Math.floor(t * 24)) * 40) - 20}px, ${Math.floor(hash(Math.floor(t * 24) + 5) * 40) - 20}px)`;

  const cur = $('cursor');
  if (cp) {
    const pr2 = Math.max(pressHook, pressAgain, pressAmt(t, tapsElev), pressAmt(t, tapsCTA));
    cur.style.display = ''; cur.style.transform = `translate(${cp[0] - 2}px, ${cp[1] - 2}px) scale(${1 - 0.2 * pr2})`;
  } else cur.style.display = 'none';
  tapsCTA.forEach((x, i) => ripple(t, x, i === 0 ? IN_POS : i === 1 ? POST_POS : FOLLOW_POS));

  caps.render(t);
  $('stage').style.opacity = 1 - ep(t, END - 0.35, END);
};
// world point on the ground (z=0) under a screen point
function groundAt(sx, sy) {
  const a = raw(1, 0, 0), b = raw(0, 1, 0), dx = (sx - CAM.ox) / CAM.scale, dy = (sy - CAM.oy) / CAM.scale;
  const det = a[0] * b[1] - a[1] * b[0];
  return [(dx * b[1] - dy * b[0]) / det, (a[0] * dy - a[1] * dx) / det];
}
window.render(0);
