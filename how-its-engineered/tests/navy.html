<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url(../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: Serif; src: url(../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2) format('woff2'); font-style: italic; }
@font-face { font-family: Mono; src: url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: Mono; src: url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
html, body { margin: 0; background: #000; }
#stage { position: relative; width: 540px; height: 960px; overflow: hidden; font-family: Inter, sans-serif; }
.layer { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
/* header */
.hdr { position: absolute; top: 34px; left: 32px; right: 32px; display: flex; justify-content: space-between; font-family: Mono; font-size: 10px; letter-spacing: 1.2px; }
/* captions */
.caps { position: absolute; left: 32px; right: 40px; top: 74px; }
.cap { position: absolute; left: 0; right: 0; }
.cap-line { font-size: 30px; line-height: 35px; font-weight: 500; letter-spacing: -0.6px; }
.w { display: inline-block; margin-right: 8px; }

/* ---------- paper ---------- */
#paper { background: #F2EEE6; color: #161616; }
#paper .hdr { color: #8b867c; }
#paper .hdr b { color: #E5484D; font-weight: 500; }
#paper .em { font-family: Serif; font-style: italic; font-weight: 400; color: #E5484D; font-size: 1.14em; letter-spacing: 0; }
#grain { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: 0.9; }
.pcard { position: absolute; background: #fff; border: 1.5px solid #1b1b1b; border-radius: 16px; box-shadow: 0 10px 0 -2px rgba(0,0,0,0.06), 0 18px 34px rgba(60,40,20,0.12); overflow: hidden; }
.pbar { height: 36px; background: #E5484D; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; display: flex; align-items: center; padding: 0 14px; gap: 8px; }
.ticket { position: absolute; background: #fff; border: 1.5px solid #1b1b1b; border-radius: 9px; font-family: Mono; font-size: 10.5px; padding: 6px 9px; box-shadow: 0 6px 14px rgba(0,0,0,0.1); white-space: nowrap; }
.stamp { position: absolute; border: 2.5px solid #E5484D; color: #E5484D; border-radius: 50%; width: 74px; height: 74px; display: flex; align-items: center; justify-content: center; font-family: Mono; font-weight: 500; font-size: 13px; letter-spacing: 0.5px; background: rgba(255,255,255,0.4); }
.stamp::before { content: ''; position: absolute; inset: 4px; border: 1px solid #E5484D; border-radius: 50%; }

/* ---------- navy ---------- */
#navy { background: #070B1A; color: #fff; }
#navy .hdr { color: #6c7391; }
#navy .hdr b { color: #fff; font-weight: 500; }
#navy .key { color: #6E9BFF; }
.blob { position: absolute; border-radius: 50%; filter: blur(60px); }
.gcard { position: absolute; background: linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.03)); border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08); backdrop-filter: blur(14px); }
.row { position: absolute; left: 16px; right: 16px; height: 48px; border-radius: 11px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; padding: 0 10px; gap: 12px; font-size: 15px; font-weight: 600; }
.ico { width: 28px; height: 28px; border-radius: 8px; }
.chip { margin-left: auto; font-family: Mono; font-size: 10.5px; font-weight: 500; padding: 3px 8px; border-radius: 99px; }
.lbl { font-family: Mono; font-size: 9.5px; letter-spacing: 1.4px; color: #7d84a3; }
.big { font-weight: 800; letter-spacing: -1px; }
.ava { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
#char { position: absolute; width: 330px; height: 440px; right: -34px; bottom: -64px; overflow: visible; }
</style>
</head>

      <div style="position:absolute; left:16px; top:34px; font-size:38px" class="big"><span id="nms">800</span><span style="font-size:18px; color:#7d84a3; letter-spacing:0"> ms</span></div>
      <div style="position:absolute; left:16px; right:16px; top:92px; height:6px; border-radius:3px; background:rgba(255,255,255,0.08); overflow:hidden"><div id="nbarfill" style="height:100%; width:100%"></div></div>

        <ellipse cx="185" cy="186" rx="12" ry="7.5" fill="#F7A898" opacity="0.5"/>
        <!-- hair front -->
        <circle cx="150" cy="60" r="27" fill="url(#hair)"/>
        <path d="M84 150 Q78 78 150 74 Q222 78 216 150 Q206 112 176 100 Q160 120 124 110 Q100 122 84 150 Z" fill="url(#hair)"/>

          <g id="eyeR"><ellipse cx="175" cy="155" rx="13" ry="15.5" fill="#fff"/><circle cx="174" cy="157" r="9.5" fill="#4A3226"/><circle cx="174" cy="157" r="5" fill="#140c08"/><circle cx="177.5" cy="152.5" r="3.2" fill="#fff"/><path d="M161 147 Q175 136 189 147" fill="none" stroke="#2A1C15" stroke-width="2.6" stroke-linecap="round"/></g>

<script src="../tools/lib.js"></script>
<script>
window.DURATION = 20;
const $ = (id) => document.getElementById(id);
$('grain').style.backgroundImage = `url(${grainURL(256, 0.09, 11)})`;

const pcaps = makeCaptions($('pcaps'), [
  { t: 0.3, end: 3.55, text: 'Every time you open an app, it asks the _database._', gaps: [] },
  { t: 3.6, end: 6.45, text: 'Every. Single. _Time._', gaps: [0.6, 0.6, 0.6] },
], 0.26);
const ncaps = makeCaptions($('ncaps'), [
  { t: 6.9, end: 10.4, text: 'So you keep a *copy* right next to you.' },
  { t: 10.6, end: 13.9, text: 'Second time? *5 ms.* Instant.' , gaps: [0.26, 0.4, 0.3, 0.3, 0.3] },
  { t: 14.1, end: 17.4, text: 'But what if the data *changes?*' },
  { t: 17.6, end: 20.5, text: 'Speed or *freshness?* Comment below.' },
], 0.26);
const allWords = [...pcaps.wordTimes, ...ncaps.wordTimes];

// paper tickets + stamps
const TK = [3.6, 4.2, 4.8, 5.4];
TK.forEach((_, i) => {
  const d = document.createElement('div'); d.className = 'ticket'; d.id = 'tk' + i; d.textContent = 'GET /feed'; $('tickets').appendChild(d);
  const s = document.createElement('div'); s.className = 'stamp'; s.id = 'st' + i; s.textContent = '800 ms'; $('stamps').appendChild(s);
});
const stampPos = [[352, 316, -14], [400, 348, 9], [338, 370, 4], [396, 296, -6]];

function mouthPath(o, smile) {
  // o: 0..1 openness
  if (o < 0.06) return `<path d="M138 ${199 - smile} Q150 ${206 + smile * 2} 162 ${199 - smile}" fill="none" stroke="#9C3B45" stroke-width="3.4" stroke-linecap="round"/>`;
  const rx = 7 + 5 * o, ry = 3 + 10 * o, cy = 201 + ry * 0.35;
  return `<ellipse cx="150" cy="${cy}" rx="${rx}" ry="${ry}" fill="#7E2534"/><ellipse cx="150" cy="${cy + ry * 0.5}" rx="${rx * 0.62}" ry="${ry * 0.38}" fill="#E06A72"/><path d="M${150 - rx * 0.7} ${cy - ry * 0.72} Q150 ${cy - ry * 0.95} ${150 + rx * 0.7} ${cy - ry * 0.72}" stroke="#fff" stroke-width="${1 + o * 2.2}" fill="none" opacity="0.9"/>`;
}

window.render = function (t) {
  // ---- navy reveal (circle wipe from presenter) ----
  const wipe = ep(t, 6.35, 6.95, ease.inOut);
  $('navy').style.clipPath = `circle(${wipe * 1150}px at 430px 760px)`;
  $('paper').style.display = wipe >= 1 ? 'none' : '';

  // ---- paper ----
  if (wipe < 1) {
    pcaps.render(t);
    const ph = ep(t, 0.2, 0.7, ease.back), db = ep(t, 1.9, 2.4, ease.back);
    $('pphone').style.transform = `translateY(${(1 - ph) * 30}px) rotate(${(1 - ph) * -4 - 1.5}deg)`; $('pphone').style.opacity = clamp(ph * 2);
    $('pdb').style.transform = `translateY(${(1 - db) * 30}px) rotate(${(1 - db) * 4 + 1.2}deg)`; $('pdb').style.opacity = clamp(db * 2);
    const ln = ep(t, 2.2, 2.9);
    $('pline').innerHTML = ln > 0 ? `<path d="M160 344 L ${160 + 156 * ln} 344" stroke="#1b1b1b" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/>` : '';
    let n = 0;
    TK.forEach((t0, i) => {
      const k = prog(t, t0, t0 + 0.5), tk = $('tk' + i), st = $('st' + i);
      const x = lerp(150, 300, ease.inOut(k)), y = 328 + Math.sin(k * Math.PI) * -30 + i * 2;
      tk.style.display = k > 0 && k < 1 ? '' : 'none';
      tk.style.left = x + 'px'; tk.style.top = y + 'px'; tk.style.transform = `rotate(${Math.sin(k * 6) * 4}deg)`;
      const s = ep(t, t0 + 0.5, t0 + 0.68, ease.back);
      st.style.display = s > 0 ? '' : 'none';
      const [sx, sy, sr] = stampPos[i];
      st.style.left = sx + 'px'; st.style.top = sy + 'px';
      st.style.transform = `rotate(${sr}deg) scale(${lerp(1.8, 1, s)})`; st.style.opacity = clamp(s * 1.5);
      if (t >= t0 + 0.5) n++;
    });
    $('pcount').textContent = n;
    const w = ep(t, 0.8, 1.3, ease.back);
    $('pwidget').style.opacity = clamp(w * 2); $('pwidget').style.transform = `translateY(${(1 - w) * 24}px) rotate(-1deg)`;
    const ms = Math.round(800 * ep(t, 1.2, 3.4, (x) => x));
    $('pms').textContent = ms; $('pbarfill').style.width = (ms / 8) + '%';
  }

  // ---- navy ----
  if (wipe > 0) {
    ncaps.render(t);
    $('b1').style.transform = `translate(${-60 + Math.sin(t * 0.4) * 40}px, ${180 + Math.cos(t * 0.3) * 30}px)`;
    $('b2').style.transform = `translate(${260 + Math.cos(t * 0.35) * 40}px, ${420 + Math.sin(t * 0.5) * 40}px)`;
    $('b3').style.transform = `translate(${120 + Math.sin(t * 0.6) * 60}px, ${650 + Math.cos(t * 0.45) * 30}px)`;

    const seg = t < 14.0 ? 0 : t < 17.5 ? 1 : 2;
    $('nlabel').textContent = ['// 02 — the trick', '// 03 — the catch', '// 04 — your turn'][seg];
    const hits = (t >= 11.2) + (t >= 11.7) + (t >= 12.2) + (t >= 14.6) + (t >= 15.0);
    $('ncount').textContent = hits;

    // cache card
    const cIn = ep(t, 7.4, 7.95, ease.back), cOut = ep(t, 13.9, 14.3, ease.in);
    $('ncache').style.opacity = clamp(cIn * 2) * (1 - cOut);
    $('ncache').style.transform = `translateY(${(1 - cIn) * 26 - cOut * 14}px) scale(${lerp(0.96, 1, cIn)})`;
    $('ncache').style.display = cOut >= 1 ? 'none' : '';
    for (let i = 0; i < 3; i++) {
      const r = $('r' + i), chip = r.querySelector('.chip');
      const saved = ep(t, 8.2 + i * 0.35, 8.5 + i * 0.35, ease.back);
      r.style.opacity = clamp(saved * 2); r.style.transform = `translateX(${(1 - saved) * -14}px)`;
      const hit = t >= 11.2 + i * 0.5;
      chip.textContent = hit ? 'HIT · 5 ms' : 'saved';
      chip.style.background = hit ? 'rgba(61,220,132,0.16)' : 'rgba(110,155,255,0.14)';
      chip.style.color = hit ? '#3DDC84' : '#8FB0FF';
      const flash = window01(t, 11.2 + i * 0.5, 11.75 + i * 0.5, 0.15);
      r.style.background = `rgba(61,220,132,${0.04 + flash * 0.14})`;
      r.style.borderColor = `rgba(61,220,132,${0.06 + flash * 0.5})`;
    }
    const st = ep(t, 11.0, 11.4, ease.back);
    $('nstat').style.opacity = clamp(st * 2); $('nstat').style.transform = `scale(${lerp(0.6, 1, st)})`;
    const dbv = ep(t, 7.0, 7.5);
    $('ndb').style.opacity = dbv * 0.75 * (1 - ep(t, 17.3, 17.6));

    // catch cards
    const k1 = ep(t, 14.3, 14.8, ease.back), k2 = ep(t, 14.7, 15.2, ease.back), kOut = ep(t, 17.3, 17.6, ease.in);
    $('catch').style.display = t > 14.2 && kOut < 1 ? '' : 'none';
    $('cdb').style.opacity = clamp(k1 * 2) * (1 - kOut); $('cdb').style.transform = `translateY(${(1 - k1) * 24}px)`;
    const shake = t > 15.6 && t < 16.4 ? Math.sin(t * 60) * 4 * (1 - prog(t, 15.6, 16.4)) : 0;
    $('ccache').style.opacity = clamp(k2 * 2) * (1 - kOut);
    $('ccache').style.transform = `translateY(${(1 - k2) * 24}px) translateX(${shake}px)`;
    const red = window01(t, 15.6, 17.4, 0.2);
    $('ccache').style.borderColor = `rgba(255,90,96,${0.12 + red * 0.6})`;
    $('ccache').style.boxShadow = `0 20px 50px rgba(0,0,0,0.45), 0 0 ${30 * red}px rgba(255,90,96,${0.35 * red})`;

    // comment box
    const cm = ep(t, 17.7, 18.2, ease.back);
    $('ncomment').style.display = cm > 0 ? '' : 'none';
    $('ncomment').style.opacity = clamp(cm * 2); $('ncomment').style.transform = `translateY(${(1 - cm) * 20}px)`;
    const txt = 'freshness, always';
    const typed = txt.slice(0, Math.floor(prog(t, 18.4, 19.4) * txt.length));
    $('ctext').innerHTML = typed + (Math.floor(t * 2.4) % 2 === 0 || typed.length < txt.length ? '<span style="display:inline-block;width:2px;height:18px;background:#6E9BFF;vertical-align:-3px;margin-left:2px"></span>' : '');
    $('cpost').style.background = typed.length === txt.length ? '#2E6BFF' : 'rgba(255,255,255,0.1)';

    // widget
    const ms = Math.round(lerp(800, 5, ep(t, 11.0, 11.6)));
    $('nms').textContent = ms; $('nms').style.color = ms > 100 ? '#FF5A60' : '#3DDC84';
    $('nbarfill').style.width = Math.max(1.5, ms / 8) + '%';
    $('nbarfill').style.background = ms > 100 ? '#FF5A60' : '#3DDC84';
  }

  // ---- presenter ----
  const surprised = window01(t, 15.3, 17.3, 0.25);
  const pointing = Math.max(window01(t, 1.6, 3.4, 0.4), window01(t, 7.3, 9.6, 0.4), window01(t, 11.0, 13.6, 0.4), window01(t, 17.9, 20.5, 0.4));
  const armAng = lerp(-8, -32, pointing) + Math.sin(t * 1.3) * 2 + surprised * 14;
  const armLift = lerp(170, 0, Math.max(pointing, surprised * 0.9));
  $('arm').setAttribute('transform', `translate(70 ${292 + armLift}) rotate(${armAng})`);
  $('body').setAttribute('transform', `translate(0 ${Math.sin(t * 2.1) * 2.2 - surprised * 6})`);
  const tilt = Math.sin(t * 0.9) * 2.5 + surprised * -4 + pointing * -2;
  $('head').setAttribute('transform', `rotate(${tilt} 150 210)`);
  // brows: raised when surprised / on key words
  const keyLift = Math.max(window01(t, 2.6, 3.4, 0.2), window01(t, 5.2, 6.2, 0.25), window01(t, 11.4, 12.4, 0.2));
  const lift = 3 + surprised * 9 + keyLift * 5;
  $('brows').setAttribute('transform', `translate(0 ${-lift})`);
  // blink
  const blinks = [2.1, 5.0, 8.7, 12.9, 15.0, 19.0];
  let open = 1; for (const b of blinks) { const p = prog(t, b, b + 0.16); if (p > 0 && p < 1) open = Math.min(open, Math.abs(p - 0.5) * 2); }
  const eyeScale = lerp(0.08, 1, open) * (1 + surprised * 0.1);
  $('eyes').setAttribute('transform', `translate(0 155) scale(1 ${eyeScale}) translate(0 -155)`);
  // mouth
  const talk = mouthOpen(t, allWords, 0.22);
  const o = Math.max(talk * 0.75, surprised * 0.85);
  $('mouth').innerHTML = mouthPath(o, 2 + pointing * 2);

  $('stage').style.opacity = 1 - ep(t, 19.65, 20);
};
window.render(0);
</script>
</body>
</html>
